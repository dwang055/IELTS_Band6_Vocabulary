基于事实的", "quote_en": "A news report should be factual and accurate.", "quote_zh": "新闻报道应该基于事实且准确。", "ex_en": "The book is a factual account of the war.", "ex_zh": "这本书是对这场战争的纪实叙述。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1111", "unit": "Unit 19"}, {"word": "informative", "pron": "ɪnˈfɔːmətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "giving useful information", "def_zh": "信息丰富的", "quote_en": "The documentary was informative and easy to follow.", "quote_zh": "这部纪录片信息丰富，易于理解。", "ex_en": "I found the lecture very informative.", "ex_zh": "我发现这场讲座信息量很大。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1112", "unit": "Unit 19"}, {"word": "intrusive", "pron": "ɪnˈtruːsɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "disturbing someone's privacy", "def_zh": "侵扰的；打扰的", "quote_en": "Constant press attention can be intrusive.", "quote_zh": "媒体的持续关注可能令人感到被侵扰。", "ex_en": "I find intrusive questions very rude.", "ex_zh": "我觉得侵犯隐私的问题很不礼貌。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1113", "unit": "Unit 19"}, {"word": "investigative", "pron": "ɪnˈvestɪɡətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "trying to find out the truth about something", "def_zh": "调查性的", "quote_en": "Investigative journalism has exposed many scandals.", "quote_zh": "调查性新闻已经揭露了许多丑闻。", "ex_en": "She is an investigative reporter for a national paper.", "ex_zh": "她是一家全国性报纸的调查记者。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1114", "unit": "Unit 19"}, {"word": "mainstream", "pron": "ˈmeɪnstriːm", "part_of_speech": "adj.", "pos": "adj.", "def_en": "accepted by most people; typical", "def_zh": "主流的", "quote_en": "Mainstream newspapers usually avoid extreme opinions.", "quote_zh": "主流报纸通常避免极端观点。", "ex_en": "I prefer music that isn't mainstream.", "ex_zh": "我喜欢不属于主流的音乐。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1115", "unit": "Unit 19"}, {"word": "online", "pron": "ˌɒnˈlaɪn", "part_of_speech": "adj.", "pos": "adj.", "def_en": "connected to the internet", "def_zh": "在线的；网上的", "quote_en": "Online news can be updated every minute.", "quote_zh": "网络新闻可以每分钟更新。", "ex_en": "I do most of my shopping online.", "ex_zh": "我大部分购物都在网上进行。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1116", "unit": "Unit 19"}, {"word": "realistic", "pron": "ˌrɪəˈlɪstɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "showing things as they are in real life", "def_zh": "现实的；逼真的", "quote_en": "The film gives a realistic picture of life in a hospital.", "quote_zh": "这部电影真实地展现了医院生活。", "ex_en": "Be realistic about what you can achieve.", "ex_zh": "对你能实现的目标要现实一点。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1117", "unit": "Unit 19"}, {"word": "sensationalist", "pron": "senˈseɪʃənəlɪst", "part_of_speech": "adj.", "pos": "adj.", "def_en": "trying to shock or excite people", "def_zh": "耸人听闻的", "quote_en": "Sensationalist headlines can spread fear.", "quote_zh": "耸人听闻的标题可能传播恐惧。", "ex_en": "I don't like sensationalist news.", "ex_zh": "我不喜欢耸人听闻的新闻。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1118", "unit": "Unit 19"}, {"word": "superficial", "pron": "ˌsuːpəˈfɪʃl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not deep or thorough", "def_zh": "肤浅的；表面的", "quote_en": "Much online content is superficial and lacks detail.", "quote_zh": "许多网络内容肤浅，缺乏细节。", "ex_en": "He has only a superficial understanding of the issue.", "ex_zh": "他对这个问题只有肤浅的理解。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1119", "unit": "Unit 19"}, {"word": "unbiased", "pron": "ʌnˈbaɪəst", "part_of_speech": "adj.", "pos": "adj.", "def_en": "fair and not favouring any side", "def_zh": "公正的；无偏见的", "quote_en": "Readers want unbiased information about the election.", "quote_zh": "读者想要有关选举的公正信息。", "ex_en": "The judge gave an unbiased decision.", "ex_zh": "法官做出了公正的裁决。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1120", "unit": "Unit 19"}, {"word": "well-informed", "pron": "ˌwel ɪnˈfɔːmd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "knowing a lot about a subject", "def_zh": "消息灵通的；见多识广的", "quote_en": "Well-informed citizens make better voting decisions.", "quote_zh": "消息灵通的公民能做出更好的投票决定。", "ex_en": "My uncle is well-informed about world affairs.", "ex_zh": "我叔叔对世界局势了解得很多。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1121", "unit": "Unit 19"}, {"word": "broadcast", "pron": "ˈbrɔːdkɑːst", "part_of_speech": "v.", "pos": "v.", "def_en": "to send out a programme on television or radio", "def_zh": "广播；播送", "quote_en": "The channel will broadcast the match live on Saturday.", "quote_zh": "该频道将在周六直播这场比赛。", "ex_en": "The radio station will broadcast news every hour.", "ex_zh": "这家电台将每小时播送新闻。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1122", "unit": "Unit 19"}, {"word": "censor", "pron": "ˈsensə", "part_of_speech": "v.", "pos": "v.", "def_en": "to remove parts of a text or film that are considered unsuitable", "def_zh": "审查；删改", "quote_en": "Some governments censor information on the internet.", "quote_zh": "一些政府审查互联网上的信息。", "ex_en": "The government may censor the film before its release.", "ex_zh": "政府可能会在这部电影上映前对其进行审查。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1123", "unit": "Unit 19"}, {"word": "control", "pron": "kənˈtrəʊl", "part_of_speech": "v.", "pos": "v.", "def_en": "to have power over something", "def_zh": "控制", "quote_en": "Some governments try to control the media.", "quote_zh": "一些政府试图控制媒体。", "ex_en": "I can't control my temper sometimes.", "ex_zh": "我有时无法控制自己的脾气。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1124", "unit": "Unit 19"}, {"word": "exploit", "pron": "ɪkˈsplɔɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to use something unfairly for your own benefit", "def_zh": "利用；剥削", "quote_en": "Some companies exploit young people's fears to sell products.", "quote_zh": "有些公司利用年轻人的恐惧来推销产品。", "ex_en": "It's wrong to exploit workers by paying them too little.", "ex_zh": "给工人太少的工资来剥削他们是不对的。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1125", "unit": "Unit 19"}, {"word": "expose", "pron": "ɪkˈspəʊz", "part_of_speech": "v.", "pos": "v.", "def_en": "to reveal something hidden or secret", "def_zh": "揭露；暴露", "quote_en": "The journalist exposed corruption in the government.", "quote_zh": "这位记者揭露了政府中的腐败。", "ex_en": "The article will expose the truth about the company.", "ex_zh": "这篇文章将揭露这家公司的真相。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1126", "unit": "Unit 19"}, {"word": "inform", "pron": "ɪnˈfɔːm", "part_of_speech": "v.", "pos": "v.", "def_en": "to give someone information", "def_zh": "通知；告知", "quote_en": "The media inform the public about important events.", "quote_zh": "媒体向公众通报重要事件。", "ex_en": "Please inform me if the plan changes.", "ex_zh": "如果计划有变，请通知我。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1127", "unit": "Unit 19"}, {"word": "intrude", "pron": "ɪnˈtruːd", "part_of_speech": "v.", "pos": "v.", "def_en": "to enter a place or situation where you are not wanted", "def_zh": "打扰；侵入", "quote_en": "Reporters should not intrude on people's private grief.", "quote_zh": "记者不应该打扰人们私人的悲痛。", "ex_en": "I'm sorry to intrude, but may I ask a question?", "ex_zh": "抱歉打扰一下，我可以问个问题吗？", "chapter": "Unit 19 · The Media · 媒体", "id": "w1128", "unit": "Unit 19"}, {"word": "invade", "pron": "ɪnˈveɪd", "part_of_speech": "v.", "pos": "v.", "def_en": "to enter a place without permission; to disturb privacy", "def_zh": "侵犯；入侵", "quote_en": "Paparazzi often invade the privacy of famous people.", "quote_zh": "狗仔队常常侵犯名人的隐私。", "ex_en": "The enemy planned to invade the town at night.", "ex_zh": "敌军计划在夜里入侵小镇。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1129", "unit": "Unit 19"}, {"word": "investigate", "pron": "ɪnˈvestɪɡeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to try to find out the facts about something", "def_zh": "调查", "quote_en": "The newspaper will investigate the claims of fraud.", "quote_zh": "报纸将调查这些欺诈指控。", "ex_en": "The police need to investigate the accident.", "ex_zh": "警方需要调查这起事故。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1130", "unit": "Unit 19"}, {"word": "publicise", "pron": "ˈpʌblɪsaɪz", "part_of_speech": "v.", "pos": "v.", "def_en": "to tell the public about something", "def_zh": "宣传；公布", "quote_en": "The company will publicise its new product on social media.", "quote_zh": "公司将在社交媒体上宣传其新产品。", "ex_en": "We want to publicise the concert on the radio.", "ex_zh": "我们想在电台上宣传这场音乐会。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1131", "unit": "Unit 19"}, {"word": "publish", "pron": "ˈpʌblɪʃ", "part_of_speech": "v.", "pos": "v.", "def_en": "to print and distribute a book, article or other text", "def_zh": "出版；发表", "quote_en": "The newspaper will publish the results of the survey on Monday.", "quote_zh": "报纸将在周一发表这项调查的结果。", "ex_en": "I hope to publish a novel one day.", "ex_zh": "我希望有一天能出版一部小说。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1132", "unit": "Unit 19"}, {"word": "report", "pron": "rɪˈpɔːt", "part_of_speech": "v.", "pos": "v.", "def_en": "to give information about an event", "def_zh": "报道；汇报", "quote_en": "Journalists must report the facts accurately.", "quote_zh": "记者必须准确报道事实。", "ex_en": "The newspaper will report a fire in the city centre.", "ex_zh": "报纸将报道市中心发生的一场火灾。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1133", "unit": "Unit 19"}, {"word": "verify", "pron": "ˈverɪfaɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to check that something is true", "def_zh": "核实；证实", "quote_en": "Journalists should verify information before they publish it.", "quote_zh": "记者在发表信息前应该先核实。", "ex_en": "Please verify your email address.", "ex_zh": "请核实你的电子邮箱地址。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1134", "unit": "Unit 19"}, {"word": "actor", "pron": "ˈæktə", "part_of_speech": "n.", "pos": "n.", "def_en": "a man or woman who performs in plays or films", "def_zh": "演员", "quote_en": "A good actor can make the audience feel strong emotions.", "quote_zh": "优秀的演员能让观众产生强烈的情感。", "ex_en": "My uncle was a well-known actor in the 1990s.", "ex_zh": "我叔叔在上世纪九十年代是一位著名的演员。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1135", "unit": "Unit 20"}, {"word": "actress", "pron": "ˈæktrəs", "part_of_speech": "n.", "pos": "n.", "def_en": "a woman who performs in plays or films", "def_zh": "女演员", "quote_en": "The actress won an award for her role in the film.", "quote_zh": "这位女演员因在电影中的角色而获奖。", "ex_en": "My favourite actress is starring in a new drama.", "ex_zh": "我最喜欢的女演员正在主演一部新剧。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1136", "unit": "Unit 20"}, {"word": "aesthetics", "pron": "iːsˈθetɪks", "part_of_speech": "n.", "pos": "n.", "def_en": "the study of beauty, especially in art", "def_zh": "美学；审美", "quote_en": "The aesthetics of traditional Chinese painting are very different from Western art.", "quote_zh": "中国传统绘画的美学与西方艺术大不相同。", "ex_en": "I studied aesthetics as part of my art course.", "ex_zh": "我在艺术课程中学过美学。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1137", "unit": "Unit 20"}, {"word": "appreciation", "pron": "əˌpriːʃiˈeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "understanding and enjoyment of the value of something", "def_zh": "欣赏；感激", "quote_en": "Art classes develop children's appreciation of beauty.", "quote_zh": "艺术课培养孩子对美的欣赏能力。", "ex_en": "I have a deep appreciation for classical music.", "ex_zh": "我对古典音乐有深深的欣赏。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1138", "unit": "Unit 20"}, {"word": "arts", "pron": "ɑːts", "part_of_speech": "n.", "pos": "n.", "def_en": "painting, music, literature and other creative activities", "def_zh": "艺术", "quote_en": "Funding for the arts has been reduced in many schools.", "quote_zh": "许多学校对艺术的资金投入减少了。", "ex_en": "I'm studying the arts at university.", "ex_zh": "我在大学学习艺术。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1139", "unit": "Unit 20"}, {"word": "artist", "pron": "ˈɑːtɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who creates paintings, drawings or other art", "def_zh": "艺术家；画家", "quote_en": "Each artist brings a unique vision to their work.", "quote_zh": "每位艺术家都为作品带来独特的视角。", "ex_en": "My sister wants to be an artist.", "ex_zh": "我姐姐想成为一名艺术家。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1140", "unit": "Unit 20"}, {"word": "attention", "pron": "əˈtenʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "interest and notice given to something", "def_zh": "关注；注意", "quote_en": "A powerful performance holds the audience's attention.", "quote_zh": "精彩的表演能抓住观众的注意力。", "ex_en": "Please pay attention to the teacher.", "ex_zh": "请注意听老师讲课。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1141", "unit": "Unit 20"}, {"word": "audience", "pron": "ˈɔːdiəns", "part_of_speech": "n.", "pos": "n.", "def_en": "the people who watch or listen to a performance", "def_zh": "观众；听众", "quote_en": "The audience applauded for several minutes.", "quote_zh": "观众鼓掌持续了好几分钟。", "ex_en": "There was a large audience at the concert.", "ex_zh": "音乐会上观众很多。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1142", "unit": "Unit 20"}, {"word": "awe", "pron": "ɔː", "part_of_speech": "n.", "pos": "n.", "def_en": "a feeling of respect and wonder", "def_zh": "敬畏；惊叹", "quote_en": "Visitors stand in awe in front of the ancient temple.", "quote_zh": "游客们在这座古老的寺庙前敬畏地站立。", "ex_en": "I looked at the mountains with awe.", "ex_zh": "我怀着敬畏的心情望着群山。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1143", "unit": "Unit 20"}, {"word": "ballerina", "pron": "ˌbæləˈriːnə", "part_of_speech": "n.", "pos": "n.", "def_en": "a female ballet dancer", "def_zh": "芭蕾舞女演员", "quote_en": "The ballerina performed beautifully on stage.", "quote_zh": "这位芭蕾舞演员在舞台上表演得很精彩。", "ex_en": "My cousin dreams of becoming a ballerina.", "ex_zh": "我表妹梦想成为一名芭蕾舞演员。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1144", "unit": "Unit 20"}, {"word": "ballet", "pron": "ˈbæleɪ", "part_of_speech": "n.", "pos": "n.", "def_en": "a type of dance performed on stage with graceful movements", "def_zh": "芭蕾舞", "quote_en": "Ballet requires years of discipline and training.", "quote_zh": "芭蕾舞需要多年的自律和训练。", "ex_en": "I went to see a ballet at the theatre last night.", "ex_zh": "我昨晚去剧院看了一场芭蕾舞。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1145", "unit": "Unit 20"}, {"word": "carving", "pron": "ˈkɑːvɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "an object made by cutting wood or stone", "def_zh": "雕刻；雕刻品", "quote_en": "The temple is famous for its detailed stone carving.", "quote_zh": "这座寺庙以精致的石雕闻名。", "ex_en": "He bought a wooden carving as a souvenir.", "ex_zh": "他买了一件木雕作为纪念品。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1146", "unit": "Unit 20"}, {"word": "concert", "pron": "ˈkɒnsət", "part_of_speech": "n.", "pos": "n.", "def_en": "a musical performance", "def_zh": "音乐会", "quote_en": "A live concert is a very different experience from listening to a recording.", "quote_zh": "现场音乐会与听录音的体验截然不同。", "ex_en": "I bought tickets to a concert next Saturday.", "ex_zh": "我买了下周六一场音乐会的票。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1147", "unit": "Unit 20"}, {"word": "crafts", "pron": "krɑːfts", "part_of_speech": "n.", "pos": "n.", "def_en": "activities such as pottery or weaving that make things by hand", "def_zh": "手工艺", "quote_en": "Traditional crafts are an important part of cultural heritage.", "quote_zh": "传统手工艺是文化遗产的重要组成部分。", "ex_en": "I take a class in arts and crafts after school.", "ex_zh": "我放学后上手工艺课。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1148", "unit": "Unit 20"}, {"word": "creation", "pron": "kriˈeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the act of making something new; something made", "def_zh": "创作；作品", "quote_en": "The creation of a mural involves a lot of planning.", "quote_zh": "创作一幅壁画需要大量规划。", "ex_en": "This painting is her finest creation.", "ex_zh": "这幅画是她最好的作品。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1149", "unit": "Unit 20"}, {"word": "emotion", "pron": "ɪˈməʊʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a strong feeling such as joy, anger or sadness", "def_zh": "情感；情绪", "quote_en": "Music can express emotion more powerfully than words.", "quote_zh": "音乐比语言更能有力地表达情感。", "ex_en": "He couldn't hide his emotion when he heard the news.", "ex_zh": "听到这个消息时，他无法掩饰自己的情绪。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1150", "unit": "Unit 20"}, {"word": "exhibition", "pron": "ˌeksɪˈbɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a public display of art or other objects", "def_zh": "展览", "quote_en": "The exhibition attracted thousands of visitors in its first week.", "quote_zh": "这场展览在第一周吸引了数千名参观者。", "ex_en": "I went to an art exhibition at the weekend.", "ex_zh": "我周末去看了一场艺术展。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1151", "unit": "Unit 20"}, {"word": "expression", "pron": "ɪkˈspreʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the act of showing feelings or ideas", "def_zh": "表达；表现", "quote_en": "Dance is a powerful form of expression.", "quote_zh": "舞蹈是一种有力的表达形式。", "ex_en": "I saw an expression of surprise on her face.", "ex_zh": "我看到她脸上露出惊讶的表情。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1152", "unit": "Unit 20"}, {"word": "festival", "pron": "ˈfestɪvl", "part_of_speech": "n.", "pos": "n.", "def_en": "an event with music, art or performances", "def_zh": "节日；艺术节", "quote_en": "The annual arts festival celebrates local culture.", "quote_zh": "一年一度的艺术节庆祝当地文化。", "ex_en": "We went to a film festival last summer.", "ex_zh": "我们去年夏天去了一个电影节。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1153", "unit": "Unit 20"}, {"word": "gallery", "pron": "ˈɡæləri", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where works of art are shown", "def_zh": "画廊；美术馆", "quote_en": "The national gallery has a large collection of modern art.", "quote_zh": "国家美术馆拥有大量现代艺术藏品。", "ex_en": "I spent the afternoon at the art gallery.", "ex_zh": "我下午在美术馆里度过。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1154", "unit": "Unit 20"}, {"word": "image", "pron": "ˈɪmɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a picture or a mental idea of something", "def_zh": "图像；形象", "quote_en": "A single image can express a complex idea.", "quote_zh": "一幅图像可以表达一个复杂的想法。", "ex_en": "The company wants to improve its public image.", "ex_zh": "这家公司想改善其公众形象。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1155", "unit": "Unit 20"}, {"word": "inspiration", "pron": "ˌɪnspəˈreɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "something that gives you new ideas or enthusiasm", "def_zh": "灵感；鼓舞", "quote_en": "Nature is a great source of inspiration for many artists.", "quote_zh": "大自然是许多艺术家灵感的巨大来源。", "ex_en": "My teacher was an inspiration to me.", "ex_zh": "我的老师给了我很大的鼓舞。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1156", "unit": "Unit 20"}, {"word": "intimacy", "pron": "ˈɪntɪməsi", "part_of_speech": "n.", "pos": "n.", "def_en": "a close, warm feeling between people", "def_zh": "亲密；亲切", "quote_en": "A small theatre creates a sense of intimacy between actors and audience.", "quote_zh": "小剧场营造了演员与观众之间的亲密感。", "ex_en": "I enjoy the intimacy of a small concert.", "ex_zh": "我喜欢小型音乐会的亲密氛围。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1157", "unit": "Unit 20"}, {"word": "literature", "pron": "ˈlɪtrətʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "written works such as novels, poems and plays", "def_zh": "文学", "quote_en": "Literature helps us understand other people's experiences.", "quote_zh": "文学帮助我们理解他人的经历。", "ex_en": "I'm studying English literature at college.", "ex_zh": "我在学院学习英国文学。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1158", "unit": "Unit 20"}, {"word": "mood", "pron": "muːd", "part_of_speech": "n.", "pos": "n.", "def_en": "the way you feel at a particular time", "def_zh": "心情；情绪", "quote_en": "Music can change your mood within a few minutes.", "quote_zh": "音乐可以在几分钟内改变你的心情。", "ex_en": "I'm in a good mood today.", "ex_zh": "我今天心情很好。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1159", "unit": "Unit 20"}, {"word": "musician", "pron": "mjuˈzɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who plays or writes music", "def_zh": "音乐家；乐手", "quote_en": "A professional musician practises for several hours every day.", "quote_zh": "专业音乐家每天要练习几个小时。", "ex_en": "My brother is a talented musician.", "ex_zh": "我弟弟是一位有天赋的音乐家。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1160", "unit": "Unit 20"}, {"word": "opera", "pron": "ˈɒprə", "part_of_speech": "n.", "pos": "n.", "def_en": "a play in which the words are sung", "def_zh": "歌剧", "quote_en": "Opera combines music, drama and visual art.", "quote_zh": "歌剧融合了音乐、戏剧和视觉艺术。", "ex_en": "I'd love to see an opera in Sydney.", "ex_zh": "我很想去悉尼看一场歌剧。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1161", "unit": "Unit 20"}, {"word": "orchestra", "pron": "ˈɔːkɪstrə", "part_of_speech": "n.", "pos": "n.", "def_en": "a large group of musicians who play together", "def_zh": "管弦乐队", "quote_en": "The orchestra performed a symphony by Beethoven.", "quote_zh": "管弦乐队演奏了贝多芬的一首交响曲。", "ex_en": "I play the violin in the school orchestra.", "ex_zh": "我在学校管弦乐队拉小提琴。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1162", "unit": "Unit 20"}, {"word": "painting", "pron": "ˈpeɪntɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "a picture made with paint; the activity of painting", "def_zh": "绘画；画作", "quote_en": "The painting hangs in the national museum.", "quote_zh": "这幅画挂在国家博物馆里。", "ex_en": "I find painting very relaxing.", "ex_zh": "我觉得画画很放松。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1163", "unit": "Unit 20"}, {"word": "performance", "pron": "pəˈfɔːməns", "part_of_speech": "n.", "pos": "n.", "def_en": "an act of presenting a play, music or other entertainment", "def_zh": "表演；演出", "quote_en": "The performance received excellent reviews.", "quote_zh": "这场演出获得了极佳的评价。", "ex_en": "I was nervous before my first performance.", "ex_zh": "我在第一次演出前很紧张。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1164", "unit": "Unit 20"}, {"word": "the performing arts", "pron": "ðə pəˈfɔːmɪŋ ɑːts", "part_of_speech": "n.", "pos": "n.", "def_en": "arts such as drama, music and dance performed for an audience", "def_zh": "表演艺术", "quote_en": "Students interested in the performing arts can join the drama club.", "quote_zh": "对表演艺术感兴趣的学生可以加入戏剧社。", "ex_en": "My sister studies the performing arts in college.", "ex_zh": "我姐姐在大学学表演艺术。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1165", "unit": "Unit 20"}, {"word": "play", "pron": "pleɪ", "part_of_speech": "n.", "pos": "n.", "def_en": "a piece of writing performed in a theatre", "def_zh": "戏剧；话剧", "quote_en": "The school will stage a play by Shakespeare.", "quote_zh": "学校将上演一部莎士比亚的戏剧。", "ex_en": "We saw a funny play last night.", "ex_zh": "我们昨晚看了一部有趣的话剧。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1166", "unit": "Unit 20"}, {"word": "portrait", "pron": "ˈpɔːtreɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "a painting or photograph of a person", "def_zh": "肖像画；肖像", "quote_en": "The portrait of the queen hangs in the main hall.", "quote_zh": "女王的肖像挂在大厅里。", "ex_en": "She painted a portrait of her grandmother.", "ex_zh": "她画了一幅她奶奶的肖像。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1167", "unit": "Unit 20"}, {"word": "response", "pron": "rɪˈspɒns", "part_of_speech": "n.", "pos": "n.", "def_en": "a reaction to something", "def_zh": "反应；回应", "quote_en": "The audience's response to the film was very positive.", "quote_zh": "观众对这部电影的反应非常积极。", "ex_en": "I haven't had a response to my email yet.", "ex_zh": "我的邮件还没有收到回复。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1168", "unit": "Unit 20"}, {"word": "sculptor", "pron": "ˈskʌlptə", "part_of_speech": "n.", "pos": "n.", "def_en": "an artist who makes figures from stone, wood or metal", "def_zh": "雕塑家", "quote_en": "The sculptor worked on the statue for three years.", "quote_zh": "这位雕塑家花了三年时间制作这座雕像。", "ex_en": "My uncle is a famous sculptor.", "ex_zh": "我叔叔是一位著名的雕塑家。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1169", "unit": "Unit 20"}, {"word": "sculpture", "pron": "ˈskʌlptʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "a figure made from stone, wood or metal", "def_zh": "雕塑", "quote_en": "The park has a large sculpture of a horse.", "quote_zh": "公园里有一座巨大的马雕塑。", "ex_en": "I like to visit the sculpture garden on Sundays.", "ex_zh": "我喜欢周日去参观雕塑公园。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1170", "unit": "Unit 20"}, {"word": "sensation", "pron": "senˈseɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a physical feeling; a state of great excitement", "def_zh": "感觉；轰动", "quote_en": "Walking barefoot on sand gives a pleasant sensation.", "quote_zh": "赤脚走在沙滩上给人愉悦的感觉。", "ex_en": "The film caused a sensation around the world.", "ex_zh": "这部电影在全世界引起了轰动。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1171", "unit": "Unit 20"}, {"word": "stimulus", "pron": "ˈstɪmjələs", "part_of_speech": "n.", "pos": "n.", "def_en": "something that encourages activity or development", "def_zh": "刺激；激励", "quote_en": "Art can be a stimulus for creative thinking.", "quote_zh": "艺术可以成为激发创造性思维的刺激因素。", "ex_en": "A deadline is a good stimulus to work faster.", "ex_zh": "截止日期是加快工作的良好动力。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1172", "unit": "Unit 20"}, {"word": "style", "pron": "staɪl", "part_of_speech": "n.", "pos": "n.", "def_en": "the particular way in which something is done or designed", "def_zh": "风格", "quote_en": "Each artist has their own style of painting.", "quote_zh": "每位艺术家都有自己的绘画风格。", "ex_en": "I like her style of writing.", "ex_zh": "我喜欢她的写作风格。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1173", "unit": "Unit 20"}, {"word": "taste", "pron": "teɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "your ability to judge what is beautiful or good", "def_zh": "品味；鉴赏力", "quote_en": "Tastes in music change from generation to generation.", "quote_zh": "音乐品味一代一代地变化。", "ex_en": "She has excellent taste in clothes.", "ex_zh": "她在穿着上很有品味。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1174", "unit": "Unit 20"}, {"word": "theatre", "pron": "ˈθɪətə", "part_of_speech": "n.", "pos": "n.", "def_en": "a building where plays are performed", "def_zh": "剧院；戏剧", "quote_en": "Going to the theatre can be expensive.", "quote_zh": "去剧院看戏可能很贵。", "ex_en": "There is a new theatre in the city centre.", "ex_zh": "市中心新开了一家剧院。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1175", "unit": "Unit 20"}, {"word": "theme", "pron": "θiːm", "part_of_speech": "n.", "pos": "n.", "def_en": "the main idea or subject of a piece of art or writing", "def_zh": "主题", "quote_en": "The theme of the exhibition is nature and the environment.", "quote_zh": "这场展览的主题是自然与环境。", "ex_en": "The main theme of the novel is friendship.", "ex_zh": "这部小说的主要主题是友谊。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1176", "unit": "Unit 20"}, {"word": "venue", "pron": "ˈvenjuː", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where an event happens", "def_zh": "场地；举办地点", "quote_en": "The stadium is a popular venue for rock concerts.", "quote_zh": "这座体育场是摇滚音乐会的热门场地。", "ex_en": "What's the venue for the party?", "ex_zh": "聚会的地点在哪里？", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1177", "unit": "Unit 20"}, {"word": "version", "pron": "ˈvɜːʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a particular form of something", "def_zh": "版本", "quote_en": "The film is a modern version of an old fairy tale.", "quote_zh": "这部电影是一个古老童话的现代版本。", "ex_en": "I prefer the original version of the song.", "ex_zh": "我更喜欢这首歌的原版。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1178", "unit": "Unit 20"}, {"word": "works", "pron": "wɜːks", "part_of_speech": "n.", "pos": "n.", "def_en": "pieces of art, music or writing created by someone", "def_zh": "作品", "quote_en": "The gallery displays works by local artists.", "quote_zh": "画廊展出当地艺术家的作品。", "ex_en": "I've read all the works of Charles Dickens.", "ex_zh": "我读过查尔斯·狄更斯的所有作品。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1179", "unit": "Unit 20"}, {"word": "writer", "pron": "ˈraɪtə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who writes books, articles or stories", "def_zh": "作家", "quote_en": "A good writer can make readers feel what the characters feel.", "quote_zh": "优秀的作家能让读者感受到人物的感受。", "ex_en": "My dream is to become a writer.", "ex_zh": "我的梦想是成为一名作家。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1180", "unit": "Unit 20"}, {"word": "accomplished", "pron": "əˈkʌmplɪʃt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very skilled", "def_zh": "技艺精湛的；有成就的", "quote_en": "The accomplished pianist played to a full hall.", "quote_zh": "这位技艺精湛的钢琴家在座无虚席的大厅里演奏。", "ex_en": "She is an accomplished painter.", "ex_zh": "她是一位技艺精湛的画家。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1181", "unit": "Unit 20"}, {"word": "aesthetic", "pron": "iːsˈθetɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to beauty", "def_zh": "美学的；审美的", "quote_en": "The building has great aesthetic value.", "quote_zh": "这座建筑具有很高的美学价值。", "ex_en": "I like the aesthetic of this room.", "ex_zh": "我喜欢这个房间的美感。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1182", "unit": "Unit 20"}, {"word": "awe-inspiring", "pron": "ˈɔː ɪnˌspaɪərɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "causing feelings of wonder and respect", "def_zh": "令人敬畏的", "quote_en": "The cathedral is an awe-inspiring example of Gothic architecture.", "quote_zh": "这座大教堂是哥特式建筑中令人敬畏的典范。", "ex_en": "The view from the summit was awe-inspiring.", "ex_zh": "山顶的景色令人叹为观止。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1183", "unit": "Unit 20"}, {"word": "brightly coloured", "pron": "ˌbraɪtli ˈkʌləd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having strong, vivid colours", "def_zh": "色彩鲜艳的", "quote_en": "Children's books often have brightly coloured pictures.", "quote_zh": "儿童读物通常有色彩鲜艳的插图。", "ex_en": "She wore a brightly coloured dress.", "ex_zh": "她穿了一条色彩鲜艳的连衣裙。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1184", "unit": "Unit 20"}, {"word": "classical", "pron": "ˈklæsɪkl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "traditional in style; relating to ancient Greece and Rome", "def_zh": "古典的", "quote_en": "Classical music can help students concentrate while studying.", "quote_zh": "古典音乐可以帮助学生在学习时集中注意力。", "ex_en": "I enjoy classical ballet.", "ex_zh": "我喜欢古典芭蕾。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1185", "unit": "Unit 20"}, {"word": "creative", "pron": "kriˈeɪtɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "good at producing new ideas", "def_zh": "有创造力的", "quote_en": "Creative people often see problems from a different angle.", "quote_zh": "有创造力的人常常从不同角度看问题。", "ex_en": "I'm not very creative, but I enjoy drawing.", "ex_zh": "我不太有创造力，但我喜欢画画。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1186", "unit": "Unit 20"}, {"word": "cultural", "pron": "ˈkʌltʃərəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the arts, customs and way of life of a society", "def_zh": "文化的", "quote_en": "The city is an important cultural centre with many museums.", "quote_zh": "这座城市是重要的文化中心，有许多博物馆。", "ex_en": "I enjoy cultural events such as concerts.", "ex_zh": "我喜欢音乐会之类的文化活动。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1187", "unit": "Unit 20"}, {"word": "distracting", "pron": "dɪˈstræktɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "taking your attention away from something", "def_zh": "分散注意力的", "quote_en": "A distracting noise can make it hard to enjoy a performance.", "quote_zh": "令人分心的噪音可能让人很难欣赏表演。", "ex_en": "Social media is very distracting when I study.", "ex_zh": "我学习时，社交媒体非常分散注意力。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1188", "unit": "Unit 20"}, {"word": "eclectic", "pron": "ɪˈklektɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "including a wide variety of styles or sources", "def_zh": "兼收并蓄的；折中的", "quote_en": "The gallery has an eclectic collection of art from many cultures.", "quote_zh": "这家画廊收藏了来自多种文化的兼收并蓄的艺术品。", "ex_en": "I have an eclectic taste in music.", "ex_zh": "我的音乐品味很广泛。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1189", "unit": "Unit 20"}, {"word": "electric", "pron": "ɪˈlektrɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "using or producing electricity; very exciting", "def_zh": "电的；令人激动的", "quote_en": "The singer gave an electric performance that thrilled the crowd.", "quote_zh": "这位歌手的表演激动人心，让人群兴奋不已。", "ex_en": "He plays the electric guitar in a band.", "ex_zh": "他在乐队里弹电吉他。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1190", "unit": "Unit 20"}, {"word": "emotional", "pron": "ɪˈməʊʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to feelings; causing strong feelings", "def_zh": "情感的；感人的", "quote_en": "The film was so emotional that many people cried.", "quote_zh": "这部电影非常感人，许多人都哭了。", "ex_en": "I felt emotional when I said goodbye.", "ex_zh": "道别时我感到很动情。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1191", "unit": "Unit 20"}, {"word": "fundamental", "pron": "ˌfʌndəˈmentl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "basic and very important", "def_zh": "基本的；根本的", "quote_en": "Creativity is fundamental to all forms of art.", "quote_zh": "创造力是所有艺术形式的根本。", "ex_en": "There is a fundamental difference between the two styles.", "ex_zh": "这两种风格之间有根本性的区别。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1192", "unit": "Unit 20"}, {"word": "imaginative", "pron": "ɪˈmædʒɪnətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having or showing new and original ideas", "def_zh": "富有想象力的", "quote_en": "The artist's imaginative designs amazed the audience.", "quote_zh": "这位艺术家富有想象力的设计让观众惊叹。", "ex_en": "She is an imaginative storyteller.", "ex_zh": "她是一位富有想象力的讲故事的人。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1193", "unit": "Unit 20"}, {"word": "influential", "pron": "ˌɪnfluˈenʃl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having a strong effect on people", "def_zh": "有影响力的", "quote_en": "Picasso was one of the most influential artists of the twentieth century.", "quote_zh": "毕加索是二十世纪最有影响力的艺术家之一。", "ex_en": "She is an influential figure in modern fashion.", "ex_zh": "她是现代时尚界一位有影响力的人物。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1194", "unit": "Unit 20"}, {"word": "inspirational", "pron": "ˌɪnspəˈreɪʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "giving ideas or encouragement", "def_zh": "鼓舞人心的", "quote_en": "The artist gave an inspirational talk to students.", "quote_zh": "这位艺术家给学生们做了一次鼓舞人心的演讲。", "ex_en": "I read an inspirational story about a young musician.", "ex_zh": "我读了一个关于年轻音乐家的励志故事。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1195", "unit": "Unit 20"}, {"word": "interactive", "pron": "ˌɪntərˈæktɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "involving communication or activity between people or with a computer", "def_zh": "互动的", "quote_en": "Interactive exhibitions allow visitors to take part in the art.", "quote_zh": "互动展览让参观者参与到艺术之中。", "ex_en": "The museum has an interactive map.", "ex_zh": "这个博物馆有一幅互动地图。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1196", "unit": "Unit 20"}, {"word": "literary", "pron": "ˈlɪtərəri", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to literature", "def_zh": "文学的", "quote_en": "The festival celebrates the great literary works of the country.", "quote_zh": "这个节日庆祝该国伟大的文学作品。", "ex_en": "She won a literary prize for her first novel.", "ex_zh": "她凭借第一部小说获得了文学奖。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1197", "unit": "Unit 20"}, {"word": "live", "pron": "laɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "performed or broadcast at the time it happens", "def_zh": "现场的；直播的", "quote_en": "Live music creates a special atmosphere in a restaurant.", "quote_zh": "现场音乐为餐厅营造了特别的氛围。", "ex_en": "We watched a live broadcast of the match.", "ex_zh": "我们观看了这场比赛的直播。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1198", "unit": "Unit 20"}, {"word": "magical", "pron": "ˈmædʒɪkl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very special and exciting, as if by magic", "def_zh": "神奇的；魔幻的", "quote_en": "The children were amazed by the magical performance.", "quote_zh": "孩子们被这场神奇的表演惊呆了。", "ex_en": "It was a magical evening under the stars.", "ex_zh": "那是一个繁星下的美妙夜晚。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1199", "unit": "Unit 20"}, {"word": "novel", "pron": "ˈnɒvl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "new and different from anything before", "def_zh": "新颖的", "quote_en": "The artist used a novel approach, mixing paint with sand.", "quote_zh": "这位艺术家采用了一种新颖的方法，把颜料和沙子混在一起。", "ex_en": "That's a novel idea for a birthday present.", "ex_zh": "这是一个新颖的生日礼物点子。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1200", "unit": "Unit 20"}, {"word": "passionate", "pron": "ˈpæʃənət", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having very strong feelings or beliefs", "def_zh": "热情的；充满激情的", "quote_en": "She is passionate about teaching children to paint.", "quote_zh": "她热衷于教孩子们画画。", "ex_en": "I'm passionate about music.", "ex_zh": "我对音乐充满热情。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1201", "unit": "Unit 20"}, {"word": "popular", "pron": "ˈpɒpjələ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "liked by many people", "def_zh": "受欢迎的", "quote_en": "Pop music is popular among teenagers.", "quote_zh": "流行音乐在青少年中很受欢迎。", "ex_en": "The cafe is popular with students.", "ex_zh": "这家咖啡馆很受学生欢迎。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1202", "unit": "Unit 20"}, {"word": "prominent", "pron": "ˈprɒmɪnənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "important and well known", "def_zh": "著名的；突出的", "quote_en": "A prominent artist opened the exhibition.", "quote_zh": "一位著名的艺术家为展览揭幕。", "ex_en": "He is a prominent member of the community.", "ex_zh": "他是社区中的一位知名人士。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1203", "unit": "Unit 20"}, {"word": "relaxing", "pron": "rɪˈlæksɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "helping you feel calm and rested", "def_zh": "令人放松的", "quote_en": "Listening to relaxing music can reduce stress.", "quote_zh": "听令人放松的音乐可以减轻压力。", "ex_en": "I find gardening very relaxing.", "ex_zh": "我觉得园艺让人很放松。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1204", "unit": "Unit 20"}, {"word": "stimulating", "pron": "ˈstɪmjəleɪtɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "interesting and encouraging new ideas", "def_zh": "有启发性的；刺激的", "quote_en": "The art class was stimulating and full of new ideas.", "quote_zh": "这堂艺术课很有启发性，充满新点子。", "ex_en": "I had a stimulating conversation with my teacher.", "ex_zh": "我和老师进行了一次很有启发的谈话。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1205", "unit": "Unit 20"}, {"word": "viral", "pron": "ˈvaɪrəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "spreading quickly on the internet", "def_zh": "病毒式传播的", "quote_en": "A viral video of the street dancer reached millions of viewers.", "quote_zh": "这段街头舞者的视频在网上疯传，吸引了数百万观众。", "ex_en": "My cat's video went viral last week.", "ex_zh": "我的猫的视频上周在网上走红了。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1206", "unit": "Unit 20"}, {"word": "visual", "pron": "ˈvɪʒuəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to seeing", "def_zh": "视觉的", "quote_en": "Visual arts include painting, photography and sculpture.", "quote_zh": "视觉艺术包括绘画、摄影和雕塑。", "ex_en": "I'm a visual learner, so I like diagrams.", "ex_zh": "我是视觉型学习者，所以喜欢图表。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1207", "unit": "Unit 20"}, {"word": "vivid", "pron": "ˈvɪvɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very bright or clear and detailed", "def_zh": "生动的；鲜明的", "quote_en": "The painter used vivid colours to show the energy of the city.", "quote_zh": "画家用鲜艳的色彩来表现这座城市的活力。", "ex_en": "I have vivid memories of my childhood.", "ex_zh": "我对童年有鲜明的记忆。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1208", "unit": "Unit 20"}, {"word": "artistic", "pron": "ɑːˈtɪstɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to art; good at art", "def_zh": "艺术的；有艺术天赋的", "quote_en": "She comes from an artistic family of painters and musicians.", "quote_zh": "她来自一个由画家和音乐家组成的艺术家庭。", "ex_en": "I'm not very artistic, but I enjoy photography.", "ex_zh": "我没什么艺术天赋，但我喜欢摄影。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1209", "unit": "Unit 20"}, {"word": "appreciate", "pron": "əˈpriːʃieɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to understand the value of something; to be grateful", "def_zh": "欣赏；感激", "quote_en": "It takes time to appreciate abstract art.", "quote_zh": "欣赏抽象艺术需要时间。", "ex_en": "I really appreciate your help.", "ex_zh": "我真的很感谢你的帮助。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1210", "unit": "Unit 20"}, {"word": "create", "pron": "kriˈeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to make something new", "def_zh": "创造；创作", "quote_en": "Artists create works that reflect the society they live in.", "quote_zh": "艺术家创作出反映其所处社会的作品。", "ex_en": "I want to create a website for my business.", "ex_zh": "我想为我的生意创建一个网站。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1211", "unit": "Unit 20"}, {"word": "depict", "pron": "dɪˈpɪkt", "part_of_speech": "v.", "pos": "v.", "def_en": "to show or describe in a picture or words", "def_zh": "描绘；描写", "quote_en": "The mural depicts scenes from the city's history.", "quote_zh": "这幅壁画描绘了这座城市历史上的场景。", "ex_en": "The novel tries to depict life in a small village.", "ex_zh": "这部小说试图描写小村庄的生活。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1212", "unit": "Unit 20"}, {"word": "enrich", "pron": "ɪnˈrɪtʃ", "part_of_speech": "v.", "pos": "v.", "def_en": "to improve the quality or value of something", "def_zh": "丰富；使充实", "quote_en": "Learning to play an instrument can enrich a child's life.", "quote_zh": "学习演奏乐器可以丰富孩子的生活。", "ex_en": "Travel can enrich your understanding of the world.", "ex_zh": "旅行可以丰富你对世界的理解。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1213", "unit": "Unit 20"}, {"word": "escape", "pron": "ɪˈskeɪp", "part_of_speech": "v.", "pos": "v.", "def_en": "to get away from something unpleasant", "def_zh": "逃避；逃离", "quote_en": "Many people read novels to escape from everyday stress.", "quote_zh": "许多人读小说来逃避日常压力。", "ex_en": "I like to escape to the countryside on weekends.", "ex_zh": "我喜欢周末逃往乡下。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1214", "unit": "Unit 20"}, {"word": "imagine", "pron": "ɪˈmædʒɪn", "part_of_speech": "v.", "pos": "v.", "def_en": "to form a picture of something in your mind", "def_zh": "想象", "quote_en": "Good writers help readers imagine places they have never visited.", "quote_zh": "优秀的作家帮助读者想象他们从未去过的地方。", "ex_en": "Imagine living on a desert island.", "ex_zh": "想象一下住在荒岛上。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1215", "unit": "Unit 20"}, {"word": "influence", "pron": "ˈɪnfluəns", "part_of_speech": "v.", "pos": "v.", "def_en": "to have an effect on someone or something", "def_zh": "影响", "quote_en": "Ancient art continues to influence modern designers.", "quote_zh": "古代艺术继续影响着现代设计师。", "ex_en": "My parents tried to influence my choice of career.", "ex_zh": "我的父母试图影响我的职业选择。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1216", "unit": "Unit 20"}, {"word": "inspire", "pron": "ɪnˈspaɪə", "part_of_speech": "v.", "pos": "v.", "def_en": "to give someone ideas or encourage them", "def_zh": "激励；启发", "quote_en": "Great teachers inspire students to love learning.", "quote_zh": "优秀的老师激励学生热爱学习。", "ex_en": "The beautiful scenery can inspire me to write a poem.", "ex_zh": "优美的风景可以激发我写诗。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1217", "unit": "Unit 20"}, {"word": "perform", "pron": "pəˈfɔːm", "part_of_speech": "v.", "pos": "v.", "def_en": "to present a play, music or other entertainment to an audience", "def_zh": "表演；演出", "quote_en": "The band will perform at the festival next month.", "quote_zh": "乐队将于下个月在艺术节上演出。", "ex_en": "I'm going to perform a song at the school concert.", "ex_zh": "我要在学校音乐会上演唱一首歌。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1218", "unit": "Unit 20"}, {"word": "provoke", "pron": "prəˈvəʊk", "part_of_speech": "v.", "pos": "v.", "def_en": "to cause a strong reaction", "def_zh": "激起；引发", "quote_en": "The controversial painting provoked angry debate.", "quote_zh": "这幅有争议的画作引发了激烈的争论。", "ex_en": "His comment might provoke a lot of laughter.", "ex_zh": "他的评论可能会引起大家哄堂大笑。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1219", "unit": "Unit 20"}, {"word": "musical", "pron": "ˈmjuːzɪkl", "part_of_speech": "n.", "pos": "n.", "def_en": "A play or film in which the story is told mainly through songs and dancing.", "def_zh": "音乐剧；音乐片", "quote_en": "We saw a musical in London that lasted nearly three hours.", "quote_zh": "我们在伦敦看了一部将近三个小时的音乐剧。", "ex_en": "Her favourite musical is about a young orphan.", "ex_zh": "她最喜欢的音乐剧讲的是一个年轻孤儿的故事。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1220", "unit": "Unit 20"}, {"word": "beautiful", "pron": "ˈbjuːtɪfl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Very pleasing to look at, hear or experience.", "def_zh": "美丽的；优美的", "quote_en": "The gallery contains many beautiful paintings from the last century.", "quote_zh": "这家美术馆收藏了许多上个世纪的美丽画作。", "ex_en": "She sang a beautiful song at the concert.", "ex_zh": "她在音乐会上唱了一首优美的歌。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1221", "unit": "Unit 20"}, {"word": "rich", "pron": "rɪtʃ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Full of interest, detail or variety.", "def_zh": "丰富的；内涵深厚的", "quote_en": "The film is rich in symbolism, which makes it worth seeing twice.", "quote_zh": "这部电影充满象征意义，值得看两遍。", "ex_en": "Japan has a rich cultural heritage.", "ex_zh": "日本有丰富的文化遗产。", "chapter": "Unit 20 · The Arts · 艺术", "id": "w1222", "unit": "Unit 20"}, {"word": "monolingual", "pron": "ˌmɒnəʊˈlɪŋɡwəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Using or speaking only one language.", "def_zh": "单语的；只会一种语言的", "quote_en": "A monolingual dictionary explains words using only English.", "quote_zh": "单语词典只用英语来解释单词。", "ex_en": "Many children in this town are monolingual.", "ex_zh": "这个镇上的许多孩子只会说一种语言。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1223", "unit": "Unit 21"}, {"word": "bilingual", "pron": "baɪˈlɪŋɡwəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Using or speaking two languages.", "def_zh": "双语的；会说两种语言的", "quote_en": "A bilingual dictionary gives the translation of each word.", "quote_zh": "双语词典会给出每个单词的翻译。", "ex_en": "She grew up in a bilingual family.", "ex_zh": "她在一个双语家庭中长大。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1224", "unit": "Unit 21"}, {"word": "corpus", "pron": "ˈkɔːpəs", "part_of_speech": "n.", "pos": "n.", "def_en": "A large collection of written or spoken texts used to study how language is really used.", "def_zh": "语料库", "quote_en": "Researchers searched the corpus to see how often the phrase appears.", "quote_zh": "研究人员在语料库中查找这个短语出现的频率。", "ex_en": "This corpus contains millions of words from newspapers.", "ex_zh": "这个语料库包含数百万来自报纸的词汇。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1225", "unit": "Unit 21"}, {"word": "synonym", "pron": "ˈsɪnənɪm", "part_of_speech": "n.", "pos": "n.", "def_en": "A word with the same or almost the same meaning as another word.", "def_zh": "同义词", "quote_en": "\"Big\" is a common synonym for \"large\".", "quote_zh": "“big”是“large”的常见同义词。", "ex_en": "Try to use a synonym instead of repeating the same word.", "ex_zh": "试着用一个同义词，而不是重复同一个词。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1226", "unit": "Unit 21"}, {"word": "antonym", "pron": "ˈæntənɪm", "part_of_speech": "n.", "pos": "n.", "def_en": "A word with the opposite meaning to another word.", "def_zh": "反义词", "quote_en": "The antonym of \"ancient\" is \"modern\".", "quote_zh": "“ancient”的反义词是“modern”。", "ex_en": "Learning an antonym with each new word can double your vocabulary.", "ex_zh": "每学一个新词就同时学它的反义词，可以让词汇量翻倍。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1227", "unit": "Unit 21"}, {"word": "thesaurus", "pron": "θɪˈsɔːrəs", "part_of_speech": "n.", "pos": "n.", "def_en": "A book or tool that lists words with similar meanings.", "def_zh": "同义词词典", "quote_en": "I looked in a thesaurus to find a stronger word for \"good\".", "quote_zh": "我查了同义词词典，想找一个比“good”更有力的词。", "ex_en": "A thesaurus helps you avoid repeating words in your essay.", "ex_zh": "同义词词典能帮你避免在作文中重复用词。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1228", "unit": "Unit 21"}, {"word": "phonology", "pron": "fəˈnɒlədʒi", "part_of_speech": "n.", "pos": "n.", "def_en": "The study of the sound system of a language.", "def_zh": "音系学；语音体系", "quote_en": "Phonology explains why some English sounds are hard for Chinese speakers.", "quote_zh": "音系学解释了为什么有些英语发音对说汉语的人来说很难。", "ex_en": "She is studying phonology at university.", "ex_zh": "她在大学里学习音系学。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1229", "unit": "Unit 21"}, {"word": "etymology", "pron": "ˌetɪˈmɒlədʒi", "part_of_speech": "n.", "pos": "n.", "def_en": "The study of the origin and history of words.", "def_zh": "词源学；词源", "quote_en": "The etymology of \"salary\" goes back to the Latin word for salt.", "quote_zh": "“salary”的词源可以追溯到拉丁语中表示盐的词。", "ex_en": "Knowing the etymology of a word can help you remember it.", "ex_zh": "了解一个词的词源有助于记住它。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1230", "unit": "Unit 21"}, {"word": "prefix", "pron": "ˈpriːfɪks", "part_of_speech": "n.", "pos": "n.", "def_en": "A group of letters added to the beginning of a word to change its meaning.", "def_zh": "前缀", "quote_en": "The prefix \"un-\" gives the word \"happy\" the opposite meaning.", "quote_zh": "前缀“un-”使“happy”一词变成相反的意思。", "ex_en": "Add the prefix \"re-\" to make the word mean \"again\".", "ex_zh": "加上前缀“re-”，这个词就有“再次”的意思。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1231", "unit": "Unit 21"}, {"word": "suffix", "pron": "ˈsʌfɪks", "part_of_speech": "n.", "pos": "n.", "def_en": "A group of letters added to the end of a word to change its meaning or word class.", "def_zh": "后缀", "quote_en": "The suffix \"-ness\" turns an adjective into a noun.", "quote_zh": "后缀“-ness”可以把形容词变成名词。", "ex_en": "\"Teacher\" is formed by adding the suffix \"-er\" to \"teach\".", "ex_zh": "“teacher”是在“teach”后加后缀“-er”构成的。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1232", "unit": "Unit 21"}, {"word": "transitive", "pron": "ˈtrænsətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Describing a verb that needs a direct object.", "def_zh": "及物的", "quote_en": "\"Buy\" is a transitive verb because you must buy something.", "quote_zh": "“buy”是及物动词，因为你必须买到某样东西。", "ex_en": "A transitive verb is followed by an object.", "ex_zh": "及物动词后面要跟宾语。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1233", "unit": "Unit 21"}, {"word": "intransitive", "pron": "ɪnˈtrænsətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Describing a verb that does not take a direct object.", "def_zh": "不及物的", "quote_en": "\"Arrive\" is an intransitive verb, so we say \"she arrived\" with no object.", "quote_zh": "“arrive”是不及物动词，所以我们说“she arrived”，后面不带宾语。", "ex_en": "An intransitive verb does not need an object.", "ex_zh": "不及物动词不需要宾语。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1234", "unit": "Unit 21"}, {"word": "collocation", "pron": "ˌkɒləˈkeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "A combination of words that often go together naturally.", "def_zh": "搭配；词语搭配", "quote_en": "\"Make a decision\" is a natural collocation, but \"do a decision\" is not.", "quote_zh": "“make a decision”是自然的搭配，而“do a decision”则不是。", "ex_en": "Learning each collocation will make your writing sound more natural.", "ex_zh": "学习每一个搭配会让你的写作听起来更自然。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1235", "unit": "Unit 21"}, {"word": "analysis", "pron": "əˈnæləsɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "A careful examination of something in order to understand it.", "def_zh": "分析", "quote_en": "The analysis of the survey results took two weeks.", "quote_zh": "对调查结果的分析花了两周时间。", "ex_en": "Her analysis of the poem was clear and detailed.", "ex_zh": "她对这首诗的分析清晰而详细。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1236", "unit": "Unit 21"}, {"word": "consistent", "pron": "kənˈsɪstənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Always behaving or happening in the same way; not changing.", "def_zh": "一致的；始终如一的", "quote_en": "Use a consistent style of spelling throughout your essay.", "quote_zh": "在整篇文章中要使用始终一致的拼写风格。", "ex_en": "Her results have been consistent all year.", "ex_zh": "她全年的成绩一直很稳定。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1237", "unit": "Unit 21"}, {"word": "occur", "pron": "əˈkɜː", "part_of_speech": "v.", "pos": "v.", "def_en": "To happen, especially without being planned.", "def_zh": "发生；出现", "quote_en": "Accidents occur most often when drivers are tired.", "quote_zh": "事故最常发生在司机疲劳的时候。", "ex_en": "When did the earthquake occur?", "ex_zh": "地震是什么时候发生的？", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1238", "unit": "Unit 21"}, {"word": "pie chart", "pron": "ˈpaɪ tʃɑːt", "part_of_speech": "n.", "pos": "n.", "def_en": "A circular chart divided into slices to show proportions.", "def_zh": "饼图", "quote_en": "The pie chart shows how the family spends its monthly income.", "quote_zh": "这张饼图显示了这个家庭如何支配每月的收入。", "ex_en": "Look at the pie chart and describe the largest section.", "ex_zh": "看这张饼图，描述最大的那一部分。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1239", "unit": "Unit 21"}, {"word": "table", "pron": "ˈteɪbl", "part_of_speech": "n.", "pos": "n.", "def_en": "A set of facts or numbers arranged in rows and columns.", "def_zh": "表格", "quote_en": "The table gives the number of students in each year group.", "quote_zh": "这张表格列出了每个年级的学生人数。", "ex_en": "Use the figures in the table to support your answer.", "ex_zh": "用表格中的数据来支持你的答案。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1240", "unit": "Unit 21"}, {"word": "bar chart", "pron": "ˈbɑː tʃɑːt", "part_of_speech": "n.", "pos": "n.", "def_en": "A chart that uses bars of different heights or lengths to compare amounts.", "def_zh": "柱状图；条形图", "quote_en": "The bar chart compares the sales of four different products.", "quote_zh": "这张柱状图比较了四种不同产品的销量。", "ex_en": "In the bar chart, the tallest bar represents the most popular sport.", "ex_zh": "在这张柱状图中，最高的柱子代表最受欢迎的运动。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1241", "unit": "Unit 21"}, {"word": "line graph", "pron": "ˈlaɪn ɡrɑːf", "part_of_speech": "n.", "pos": "n.", "def_en": "A graph that uses a line to show how something changes over time.", "def_zh": "折线图", "quote_en": "The line graph shows how temperatures rose between 1990 and 2020.", "quote_zh": "这张折线图显示了1990年到2020年间气温的上升情况。", "ex_en": "Describe the main trend in the line graph.", "ex_zh": "描述这张折线图中的主要趋势。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1242", "unit": "Unit 21"}, {"word": "diagram", "pron": "ˈdaɪəɡræm", "part_of_speech": "n.", "pos": "n.", "def_en": "A simple drawing that explains how something works or is arranged.", "def_zh": "图表；示意图", "quote_en": "The diagram shows how rainwater is collected and cleaned.", "quote_zh": "这张示意图显示了雨水是如何被收集和净化的。", "ex_en": "Draw a diagram to explain the process.", "ex_zh": "画一张示意图来说明这个过程。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1243", "unit": "Unit 21"}, {"word": "flowchart", "pron": "ˈfləʊtʃɑːt", "part_of_speech": "n.", "pos": "n.", "def_en": "A diagram that shows the steps of a process using boxes and arrows.", "def_zh": "流程图", "quote_en": "The flowchart shows each stage of recycling plastic.", "quote_zh": "这张流程图显示了塑料回收的每个阶段。", "ex_en": "Follow the arrows in the flowchart from top to bottom.", "ex_zh": "沿着流程图中的箭头从上往下看。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1244", "unit": "Unit 21"}, {"word": "upward trend", "pron": "ˈʌpwəd trend", "part_of_speech": "n.", "pos": "n.", "def_en": "A general movement towards higher numbers over time.", "def_zh": "上升趋势", "quote_en": "There has been an upward trend in online shopping since 2015.", "quote_zh": "自2015年以来，网购呈上升趋势。", "ex_en": "The graph shows an upward trend in house prices.", "ex_zh": "这张图表显示房价呈上升趋势。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1245", "unit": "Unit 21"}, {"word": "downward trend", "pron": "ˈdaʊnwəd trend", "part_of_speech": "n.", "pos": "n.", "def_en": "A general movement towards lower numbers over time.", "def_zh": "下降趋势", "quote_en": "The figures reveal a downward trend in the number of smokers.", "quote_zh": "数据显示吸烟人数呈下降趋势。", "ex_en": "A downward trend began after the new law was introduced.", "ex_zh": "新法律出台后，出现了下降趋势。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1246", "unit": "Unit 21"}, {"word": "plateau", "pron": "ˈplætəʊ", "part_of_speech": "n.", "pos": "n.", "def_en": "A period when a figure stays at the same level after rising or falling.", "def_zh": "平稳期；停滞期", "quote_en": "After the rapid rise, sales reached a plateau in 2018.", "quote_zh": "在快速增长之后，销量在2018年进入平稳期。", "ex_en": "The number of visitors remained on a plateau for six months.", "ex_zh": "游客人数在六个月内保持平稳。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1247", "unit": "Unit 21"}, {"word": "linking words", "pron": "ˈlɪŋkɪŋ wɜːdz", "part_of_speech": "n.", "pos": "n.", "def_en": "Words such as \"however\" or \"therefore\" that connect ideas in a text.", "def_zh": "连接词", "quote_en": "Good writers use linking words to show how their ideas connect.", "quote_zh": "优秀的作者用连接词来表明观点之间的联系。", "ex_en": "\"Moreover\" and \"however\" are common linking words.", "ex_zh": "“moreover”和“however”是常见的连接词。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1248", "unit": "Unit 21"}, {"word": "opinion words", "pron": "əˈpɪnjən wɜːdz", "part_of_speech": "n.", "pos": "n.", "def_en": "Words and phrases that show what you think, such as \"I believe\" or \"in my view\".", "def_zh": "表达观点的词语", "quote_en": "Use opinion words such as \"I believe\" in the Speaking test.", "quote_zh": "在口语考试中使用“I believe”这样表达观点的词语。", "ex_en": "Underline the opinion words in the paragraph.", "ex_zh": "把这一段中表达观点的词语划出来。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1249", "unit": "Unit 21"}, {"word": "register", "pron": "ˈredʒɪstə", "part_of_speech": "n.", "pos": "n.", "def_en": "The level of formality of the language you use in a particular situation.", "def_zh": "语体；语域", "quote_en": "In an academic essay, you should use a formal register.", "quote_zh": "在学术论文中，你应该使用正式的语体。", "ex_en": "Changing your register depends on who you are talking to.", "ex_zh": "你要根据谈话对象来调整语体。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1250", "unit": "Unit 21"}, {"word": "formal tone", "pron": "ˈfɔːml təʊn", "part_of_speech": "n.", "pos": "n.", "def_en": "A serious, polite style of writing or speaking used in official situations.", "def_zh": "正式语气", "quote_en": "Write the letter to the manager in a formal tone.", "quote_zh": "给经理的信要用正式的语气来写。", "ex_en": "A formal tone avoids slang and short forms.", "ex_zh": "正式的语气避免使用俚语和缩略形式。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1251", "unit": "Unit 21"}, {"word": "informal tone", "pron": "ɪnˈfɔːml təʊn", "part_of_speech": "n.", "pos": "n.", "def_en": "A relaxed, friendly style of writing or speaking used with friends and family.", "def_zh": "非正式语气", "quote_en": "An email to a friend can use an informal tone.", "quote_zh": "给朋友的电子邮件可以用非正式的语气。", "ex_en": "She chose an informal tone for her blog.", "ex_zh": "她为自己的博客选择了非正式的语气。", "chapter": "Unit 21 · Reference & Writing · 参考与写作", "id": "w1252", "unit": "Unit 21"}, {"word": "letter phrases", "pron": "ˈletə ˈfreɪzɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "Standard expressions used to open, close or structure a letter.", "def_zh": "书信常用语", "quote_en": "Learn useful letter phrases such as \"I am writing to complain about\".", "quote_zh": "学习有用的书信常用语，比如“I am writing to complain about”。", "ex_en": "Good letter phrases make your writing sound polished.", "ex_zh": "恰当的书信常用语会让你的文章显得得体。", "chapter": "Unit 21 · Reference
