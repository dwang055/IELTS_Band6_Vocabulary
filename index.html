n nature; not controlled by people", "def_zh": "野生的", "quote_en": "Wild animals should not be kept as pets.", "quote_zh": "野生动物不应该被当作宠物饲养。", "ex_en": "We saw wild horses on the hill.", "ex_zh": "我们在山上看到了野马。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0498", "unit": "Unit 9"}, {"word": "adapt", "pron": "əˈdæpt", "part_of_speech": "v.", "pos": "v.", "def_en": "to change in order to suit new conditions", "def_zh": "适应；改编", "quote_en": "Animals must adapt to a changing climate in order to survive.", "quote_zh": "动物必须适应不断变化的气候才能生存。", "ex_en": "I need to adapt quickly to life in a new country.", "ex_zh": "我需要尽快适应在新国家的生活。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0499", "unit": "Unit 9"}, {"word": "combat", "pron": "ˈkɒmbæt", "part_of_speech": "v.", "pos": "v.", "def_en": "to try to stop something bad from happening", "def_zh": "对抗；防治", "quote_en": "Governments must act to combat climate change.", "quote_zh": "政府必须采取行动对抗气候变化。", "ex_en": "We need new ways to combat poverty.", "ex_zh": "我们需要新的方法来对抗贫困。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0500", "unit": "Unit 9"}, {"word": "cultivate", "pron": "ˈkʌltɪveɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to prepare land and grow crops on it", "def_zh": "耕种；培养", "quote_en": "Farmers cultivate rice in the wet fields of southern China.", "quote_zh": "农民在中国南方潮湿的农田里种植水稻。", "ex_en": "He wants to cultivate vegetables in his back garden.", "ex_zh": "他想在后院种蔬菜。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0501", "unit": "Unit 9"}, {"word": "eradicate", "pron": "ɪˈrædɪkeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to completely destroy or get rid of something", "def_zh": "根除；消灭", "quote_en": "Scientists hope to eradicate malaria within a few decades.", "quote_zh": "科学家希望在几十年内根除疟疾。", "ex_en": "The government aims to eradicate rats from the island.", "ex_zh": "政府的目标是消灭岛上的老鼠。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0502", "unit": "Unit 9"}, {"word": "hibernate", "pron": "ˈhaɪbəneɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to spend the winter in a deep sleep", "def_zh": "冬眠", "quote_en": "Bears hibernate during the coldest months of the year.", "quote_zh": "熊在一年中最冷的月份冬眠。", "ex_en": "I feel like I want to hibernate in winter.", "ex_zh": "我感觉冬天想冬眠。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0503", "unit": "Unit 9"}, {"word": "tolerate", "pron": "ˈtɒləreɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to accept something unpleasant without complaining", "def_zh": "容忍；耐受", "quote_en": "Some plants can tolerate very dry conditions.", "quote_zh": "有些植物可以耐受非常干燥的环境。", "ex_en": "I can't tolerate rude behaviour.", "ex_zh": "我无法容忍粗鲁的行为。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0504", "unit": "Unit 9"}, {"word": "worm", "pron": "wɜːm", "part_of_speech": "n.", "pos": "n.", "def_en": "A long, thin, soft animal with no legs or bones that lives in soil.", "def_zh": "蠕虫；蚯蚓", "quote_en": "Every worm in the soil helps to keep the ground healthy.", "quote_zh": "土壤里的每一条蚯蚓都有助于保持土地肥沃。", "ex_en": "The bird pulled a worm out of the wet grass.", "ex_zh": "那只鸟从湿草地里叼出一条虫子。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0505", "unit": "Unit 9"}, {"word": "wildlife", "pron": "ˈwaɪldlaɪf", "part_of_speech": "n.", "pos": "n.", "def_en": "Wild animals and plants living in their natural environment.", "def_zh": "野生动植物", "quote_en": "Building a road through the forest could harm the local wildlife.", "quote_zh": "在森林中修路可能会危害当地的野生动物。", "ex_en": "We went to a national park to see the wildlife.", "ex_zh": "我们去国家公园看野生动物。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0506", "unit": "Unit 9"}, {"word": "asteroid", "pron": "ˈæstərɔɪd", "part_of_speech": "n.", "pos": "n.", "def_en": "a small rocky object that moves around the sun", "def_zh": "小行星", "quote_en": "An asteroid hit the Earth millions of years ago.", "quote_zh": "数百万年前一颗小行星撞击了地球。", "ex_en": "The film is about an asteroid heading towards our planet.", "ex_zh": "这部电影讲的是一颗小行星飞向我们的星球。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0507", "unit": "Unit 10"}, {"word": "astronaut", "pron": "ˈæstrənɔːt", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who travels in space", "def_zh": "宇航员", "quote_en": "An astronaut must train for years before going into space.", "quote_zh": "宇航员在进入太空前必须训练多年。", "ex_en": "My dream is to become an astronaut.", "ex_zh": "我的梦想是成为一名宇航员。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0508", "unit": "Unit 10"}, {"word": "atmosphere", "pron": "ˈætməsfɪə", "part_of_speech": "n.", "pos": "n.", "def_en": "the layer of gases around the Earth", "def_zh": "大气层；气氛", "quote_en": "The atmosphere protects us from harmful radiation.", "quote_zh": "大气层保护我们免受有害辐射。", "ex_en": "The party had a friendly atmosphere.", "ex_zh": "聚会的气氛很友好。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0509", "unit": "Unit 10"}, {"word": "cosmos", "pron": "ˈkɒzmɒs", "part_of_speech": "n.", "pos": "n.", "def_en": "the universe as an ordered system", "def_zh": "宇宙", "quote_en": "Scientists have long tried to understand the cosmos.", "quote_zh": "科学家长期以来一直试图理解宇宙。", "ex_en": "I'm fascinated by the vastness of the cosmos.", "ex_zh": "我对宇宙的浩瀚着迷。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0510", "unit": "Unit 10"}, {"word": "crater", "pron": "ˈkreɪtə", "part_of_speech": "n.", "pos": "n.", "def_en": "a large round hole in the ground", "def_zh": "陨石坑；火山口", "quote_en": "The crater on the moon was made by a meteor.", "quote_zh": "月球上的陨石坑是由流星造成的。", "ex_en": "We hiked to the edge of a volcanic crater.", "ex_zh": "我们徒步到了火山口的边缘。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0511", "unit": "Unit 10"}, {"word": "debris", "pron": "ˈdebriː", "part_of_speech": "n.", "pos": "n.", "def_en": "pieces left after something has been destroyed", "def_zh": "碎片；残骸", "quote_en": "Space debris can damage satellites.", "quote_zh": "太空碎片可能损坏卫星。", "ex_en": "After the storm, the street was covered in debris.", "ex_zh": "风暴过后，街道上满是碎片。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0512", "unit": "Unit 10"}, {"word": "Earth", "pron": "ɜːθ", "part_of_speech": "n.", "pos": "n.", "def_en": "the planet we live on", "def_zh": "地球", "quote_en": "Earth is the only planet known to support life.", "quote_zh": "地球是已知唯一存在生命的行星。", "ex_en": "From space, Earth looks blue and beautiful.", "ex_zh": "从太空看，地球又蓝又美。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0513", "unit": "Unit 10"}, {"word": "exploration", "pron": "ˌekspləˈreɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the act of travelling to learn about a place", "def_zh": "探索；勘探", "quote_en": "Space exploration has led to many useful inventions.", "quote_zh": "太空探索催生了许多有用的发明。", "ex_en": "The exploration of the deep ocean is still limited.", "ex_zh": "对深海的探索仍然有限。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0514", "unit": "Unit 10"}, {"word": "explorer", "pron": "ɪkˈsplɔːrə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who travels to unknown places", "def_zh": "探险家", "quote_en": "The explorer spent years studying the polar regions.", "quote_zh": "这位探险家花了数年时间研究极地。", "ex_en": "My grandfather was a famous explorer.", "ex_zh": "我祖父是一位著名的探险家。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0515", "unit": "Unit 10"}, {"word": "galaxy", "pron": "ˈɡæləksi", "part_of_speech": "n.", "pos": "n.", "def_en": "a very large group of stars", "def_zh": "星系", "quote_en": "Our solar system is part of the Milky Way galaxy.", "quote_zh": "我们的太阳系是银河系的一部分。", "ex_en": "Astronomers have found a new galaxy.", "ex_zh": "天文学家发现了一个新的星系。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0516", "unit": "Unit 10"}, {"word": "gas", "pron": "ɡæs", "part_of_speech": "n.", "pos": "n.", "def_en": "a substance like air that is not solid or liquid", "def_zh": "气体；煤气", "quote_en": "Jupiter is made mostly of gas.", "quote_zh": "木星主要由气体构成。", "ex_en": "Don't forget to turn off the gas before you leave.", "ex_zh": "离开前别忘了关煤气。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0517", "unit": "Unit 10"}, {"word": "gravity", "pron": "ˈɡrævəti", "part_of_speech": "n.", "pos": "n.", "def_en": "the force that pulls objects towards the Earth", "def_zh": "重力；引力", "quote_en": "The moon has less gravity than the Earth.", "quote_zh": "月球的引力比地球小。", "ex_en": "Without gravity, we would float off the ground.", "ex_zh": "没有重力，我们就会飘离地面。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0518", "unit": "Unit 10"}, {"word": "horizon", "pron": "həˈraɪzn", "part_of_speech": "n.", "pos": "n.", "def_en": "the line where the sky meets the land or sea", "def_zh": "地平线", "quote_en": "The sun slowly sank below the horizon.", "quote_zh": "太阳慢慢沉到地平线以下。", "ex_en": "We watched the ship disappear over the horizon.", "ex_zh": "我们看着那艘船消失在地平线上。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0519", "unit": "Unit 10"}, {"word": "launch", "pron": "lɔːntʃ", "part_of_speech": "n.", "pos": "n.", "def_en": "the sending of a rocket into the air", "def_zh": "发射", "quote_en": "The launch of the rocket was delayed by bad weather.", "quote_zh": "火箭的发射因恶劣天气而推迟。", "ex_en": "We watched the launch live on television.", "ex_zh": "我们在电视上观看了发射直播。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0520", "unit": "Unit 10"}, {"word": "meteor", "pron": "ˈmiːtiə", "part_of_speech": "n.", "pos": "n.", "def_en": "a piece of rock that burns up in the sky", "def_zh": "流星", "quote_en": "A meteor lit up the night sky for a few seconds.", "quote_zh": "一颗流星照亮夜空几秒钟。", "ex_en": "I saw a meteor while camping last night.", "ex_zh": "昨晚露营时我看到了一颗流星。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0521", "unit": "Unit 10"}, {"word": "moon", "pron": "muːn", "part_of_speech": "n.", "pos": "n.", "def_en": "the natural satellite that orbits the Earth", "def_zh": "月亮；月球", "quote_en": "The moon takes about 27 days to orbit the Earth.", "quote_zh": "月球绕地球一周大约需要27天。", "ex_en": "The moon looks very bright tonight.", "ex_zh": "今晚月亮看起来很亮。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0522", "unit": "Unit 10"}, {"word": "ocean", "pron": "ˈəʊʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a very large area of sea", "def_zh": "海洋", "quote_en": "The Pacific is the largest ocean on Earth.", "quote_zh": "太平洋是地球上最大的海洋。", "ex_en": "We crossed the ocean by plane.", "ex_zh": "我们乘飞机越过了海洋。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0523", "unit": "Unit 10"}, {"word": "orbit", "pron": "ˈɔːbɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "the curved path of an object around a planet or star", "def_zh": "轨道", "quote_en": "The satellite is in orbit about 400 kilometres above the Earth.", "quote_zh": "这颗卫星在距离地球约400公里的轨道上运行。", "ex_en": "The Earth's orbit around the sun takes a year.", "ex_zh": "地球绕太阳的轨道运行一周需要一年。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0524", "unit": "Unit 10"}, {"word": "outer space", "pron": "ˈaʊtə speɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "the area beyond the Earth's atmosphere", "def_zh": "外太空", "quote_en": "Scientists are studying how plants grow in outer space.", "quote_zh": "科学家正在研究植物在外太空如何生长。", "ex_en": "I'd love to travel into outer space one day.", "ex_zh": "我很想有一天去外太空旅行。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0525", "unit": "Unit 10"}, {"word": "planet", "pron": "ˈplænɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "a large round object that moves around a star", "def_zh": "行星", "quote_en": "Mars is the planet most like Earth in our solar system.", "quote_zh": "火星是太阳系中最像地球的行星。", "ex_en": "Saturn is my favourite planet because of its rings.", "ex_zh": "土星是我最喜欢的行星，因为它有光环。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0526", "unit": "Unit 10"}, {"word": "radiation", "pron": "ˌreɪdiˈeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "energy sent out as waves or particles", "def_zh": "辐射", "quote_en": "Astronauts are exposed to higher levels of radiation in space.", "quote_zh": "宇航员在太空中暴露在更高水平的辐射下。", "ex_en": "Too much radiation can be harmful to health.", "ex_zh": "过量辐射可能对健康有害。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0527", "unit": "Unit 10"}, {"word": "rocket", "pron": "ˈrɒkɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "a vehicle that travels into space", "def_zh": "火箭", "quote_en": "The rocket reached orbit in under ten minutes.", "quote_zh": "火箭不到十分钟就进入了轨道。", "ex_en": "The rocket launched at dawn.", "ex_zh": "火箭在黎明时发射。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0528", "unit": "Unit 10"}, {"word": "satellite", "pron": "ˈsætəlaɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "an object that moves around a planet", "def_zh": "卫星", "quote_en": "A weather satellite sends images of clouds to the Earth.", "quote_zh": "气象卫星把云层图像传回地球。", "ex_en": "The satellite helps us to use GPS navigation.", "ex_zh": "这颗卫星帮助我们使用GPS导航。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0529", "unit": "Unit 10"}, {"word": "simulator", "pron": "ˈsɪmjuleɪtə", "part_of_speech": "n.", "pos": "n.", "def_en": "a machine that copies real conditions for training", "def_zh": "模拟器", "quote_en": "Pilots practise in a flight simulator before flying a real plane.", "quote_zh": "飞行员在驾驶真飞机前先在飞行模拟器中练习。", "ex_en": "The astronauts trained in a space simulator.", "ex_zh": "宇航员在太空模拟器中训练。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0530", "unit": "Unit 10"}, {"word": "solar system", "pron": "ˈsəʊlə ˈsɪstəm", "part_of_speech": "n.", "pos": "n.", "def_en": "the sun and all the planets that move around it", "def_zh": "太阳系", "quote_en": "There are eight planets in our solar system.", "quote_zh": "我们的太阳系有八大行星。", "ex_en": "I learned about the solar system at primary school.", "ex_zh": "我在小学学过太阳系。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0531", "unit": "Unit 10"}, {"word": "space", "pron": "speɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "the area beyond the Earth where stars and planets are", "def_zh": "太空；空间", "quote_en": "Space travel is expensive and dangerous.", "quote_zh": "太空旅行既昂贵又危险。", "ex_en": "Is there enough space in the car for everyone?", "ex_zh": "车里有足够的空间给大家坐吗？", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0532", "unit": "Unit 10"}, {"word": "spacecraft", "pron": "ˈspeɪskrɑːft", "part_of_speech": "n.", "pos": "n.", "def_en": "a vehicle that travels in space", "def_zh": "航天器", "quote_en": "The spacecraft landed safely on Mars.", "quote_zh": "这艘航天器安全降落在火星上。", "ex_en": "The spacecraft will take two years to reach its target.", "ex_zh": "这艘航天器要花两年才能到达目标。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0533", "unit": "Unit 10"}, {"word": "space shuttle", "pron": "speɪs ˈʃʌtl", "part_of_speech": "n.", "pos": "n.", "def_en": "a vehicle that can be used many times to travel into space", "def_zh": "航天飞机", "quote_en": "The space shuttle carried astronauts and equipment into orbit.", "quote_zh": "航天飞机把宇航员和设备送入轨道。", "ex_en": "I once visited a museum with a real space shuttle.", "ex_zh": "我曾参观过一个有真正航天飞机的博物馆。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0534", "unit": "Unit 10"}, {"word": "space station", "pron": "speɪs ˈsteɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a large structure where astronauts live and work in space", "def_zh": "空间站", "quote_en": "Astronauts live on the space station for several months.", "quote_zh": "宇航员在空间站里生活几个月。", "ex_en": "The space station orbits the Earth every ninety minutes.", "ex_zh": "空间站每九十分钟绕地球一周。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0535", "unit": "Unit 10"}, {"word": "surface", "pron": "ˈsɜːfɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "the outside or top layer of something", "def_zh": "表面", "quote_en": "Scientists study the surface of Mars with robots.", "quote_zh": "科学家用机器人研究火星表面。", "ex_en": "The surface of the lake was perfectly still.", "ex_zh": "湖面一片平静。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0536", "unit": "Unit 10"}, {"word": "universe", "pron": "ˈjuːnɪvɜːs", "part_of_speech": "n.", "pos": "n.", "def_en": "all of space and everything in it", "def_zh": "宇宙", "quote_en": "The universe is believed to be about fourteen billion years old.", "quote_zh": "据信宇宙大约有一百四十亿年的历史。", "ex_en": "Do you think there is life elsewhere in the universe?", "ex_zh": "你认为宇宙中其他地方有生命吗？", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0537", "unit": "Unit 10"}, {"word": "weightlessness", "pron": "ˈweɪtləsnəs", "part_of_speech": "n.", "pos": "n.", "def_en": "the state of feeling no weight in space", "def_zh": "失重", "quote_en": "Weightlessness affects an astronaut's muscles and bones.", "quote_zh": "失重会影响宇航员的肌肉和骨骼。", "ex_en": "The feeling of weightlessness must be amazing.", "ex_zh": "失重的感觉一定很奇妙。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0538", "unit": "Unit 10"}, {"word": "commercial", "pron": "kəˈmɜːʃl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "related to making money; for business", "def_zh": "商业的", "quote_en": "Commercial space flights may become common in the future.", "quote_zh": "商业太空飞行将来可能变得普遍。", "ex_en": "The company is developing a commercial airline service.", "ex_zh": "这家公司正在开发一项商业航空服务。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0539", "unit": "Unit 10"}, {"word": "cosmic", "pron": "ˈkɒzmɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the universe", "def_zh": "宇宙的", "quote_en": "Cosmic radiation can be dangerous for space travellers.", "quote_zh": "宇宙辐射对太空旅行者可能是危险的。", "ex_en": "The film is about a cosmic adventure.", "ex_zh": "这部电影讲述的是一次宇宙冒险。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0540", "unit": "Unit 10"}, {"word": "extreme", "pron": "ɪkˈstriːm", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very great in degree; very unusual", "def_zh": "极端的；极度的", "quote_en": "Astronauts must cope with extreme temperatures in space.", "quote_zh": "宇航员必须应对太空中的极端温度。", "ex_en": "I don't like extreme sports like bungee jumping.", "ex_zh": "我不喜欢蹦极这样的极限运动。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0541", "unit": "Unit 10"}, {"word": "gravitational", "pron": "ˌɡrævɪˈteɪʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to gravity", "def_zh": "引力的；重力的", "quote_en": "The moon's gravitational pull causes the ocean tides.", "quote_zh": "月球的引力造成了海洋潮汐。", "ex_en": "Gravitational forces keep the planets in orbit.", "ex_zh": "引力使行星保持在轨道上。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0542", "unit": "Unit 10"}, {"word": "horizontal", "pron": "ˌhɒrɪˈzɒntl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "flat and level; parallel to the ground", "def_zh": "水平的", "quote_en": "The satellite moved in a horizontal line across the sky.", "quote_zh": "卫星在天空中沿水平方向移动。", "ex_en": "Draw a horizontal line across the page.", "ex_zh": "在页面上画一条水平线。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0543", "unit": "Unit 10"}, {"word": "inevitable", "pron": "ɪˈnevɪtəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "certain to happen and unable to be avoided", "def_zh": "不可避免的", "quote_en": "Some people believe that space colonisation is inevitable.", "quote_zh": "有人认为太空殖民是不可避免的。", "ex_en": "Delays are inevitable when the weather is bad.", "ex_zh": "天气不好时，延误是不可避免的。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0544", "unit": "Unit 10"}, {"word": "lunar", "pron": "ˈluːnə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the moon", "def_zh": "月球的", "quote_en": "Lunar missions help scientists to learn about the early solar system.", "quote_zh": "月球任务帮助科学家了解早期太阳系。", "ex_en": "The Chinese Mid-Autumn Festival follows the lunar calendar.", "ex_zh": "中国的中秋节遵循农历。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0545", "unit": "Unit 10"}, {"word": "meteoric", "pron": "ˌmiːtiˈɒrɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very fast and successful", "def_zh": "飞速的；流星的", "quote_en": "The company's meteoric rise surprised everyone.", "quote_zh": "这家公司的飞速崛起让所有人惊讶。", "ex_en": "She had a meteoric career in science.", "ex_zh": "她在科学界的事业发展迅速。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0546", "unit": "Unit 10"}, {"word": "outer", "pron": "ˈaʊtə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "on the outside; far from the centre", "def_zh": "外部的；外层的", "quote_en": "The outer planets are very cold.", "quote_zh": "外层行星非常寒冷。", "ex_en": "He lives in the outer suburbs of the city.", "ex_zh": "他住在城市的外围郊区。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0547", "unit": "Unit 10"}, {"word": "solar", "pron": "ˈsəʊlə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the sun", "def_zh": "太阳的；太阳能的", "quote_en": "Solar panels on a spacecraft provide electricity.", "quote_zh": "航天器上的太阳能电池板提供电力。", "ex_en": "We installed solar panels on our roof.", "ex_zh": "我们在屋顶安装了太阳能电池板。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0548", "unit": "Unit 10"}, {"word": "terrestrial", "pron": "təˈrestriəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the Earth; living on land", "def_zh": "地球的；陆地的", "quote_en": "Terrestrial animals live on land rather than in water.", "quote_zh": "陆生动物生活在陆地上而不是水里。", "ex_en": "Mars is a terrestrial planet, like Earth.", "ex_zh": "火星和地球一样是类地行星。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0549", "unit": "Unit 10"}, {"word": "toxic", "pron": "ˈtɒksɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "poisonous", "def_zh": "有毒的", "quote_en": "The planet's atmosphere is toxic to humans.", "quote_zh": "这颗行星的大气层对人类有毒。", "ex_en": "Don't touch those toxic chemicals.", "ex_zh": "别碰那些有毒的化学品。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0550", "unit": "Unit 10"}, {"word": "uninhabitable", "pron": "ˌʌnɪnˈhæbɪtəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not suitable to live in", "def_zh": "不适合居住的", "quote_en": "Most planets in the solar system are uninhabitable.", "quote_zh": "太阳系中的大多数行星不适合居住。", "ex_en": "The house was uninhabitable after the fire.", "ex_zh": "火灾后这座房子无法居住了。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0551", "unit": "Unit 10"}, {"word": "universal", "pron": "ˌjuːnɪˈvɜːsl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to everyone or everything", "def_zh": "普遍的；宇宙的", "quote_en": "Gravity is a universal force.", "quote_zh": "引力是一种普遍存在的力。", "ex_en": "Music is a universal language.", "ex_zh": "音乐是一种通用语言。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0552", "unit": "Unit 10"}, {"word": "unmanned", "pron": "ʌnˈmænd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "without a crew or person on board", "def_zh": "无人的；无人驾驶的", "quote_en": "Unmanned missions are cheaper than those with astronauts.", "quote_zh": "无人任务比载人任务便宜。", "ex_en": "An unmanned spacecraft landed on the comet.", "ex_zh": "一艘无人航天器降落在彗星上。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0553", "unit": "Unit 10"}, {"word": "acclimatise", "pron": "əˈklaɪmətaɪz", "part_of_speech": "v.", "pos": "v.", "def_en": "to get used to a new climate or environment", "def_zh": "适应（新环境）", "quote_en": "Astronauts need time to acclimatise to weightlessness.", "quote_zh": "宇航员需要时间来适应失重。", "ex_en": "It took me a week to acclimatise to the cold weather.", "ex_zh": "我花了一周时间才适应寒冷的天气。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0554", "unit": "Unit 10"}, {"word": "colonise", "pron": "ˈkɒlənaɪz", "part_of_speech": "v.", "pos": "v.", "def_en": "to establish control over another place and live there", "def_zh": "殖民；开拓定居", "quote_en": "Some scientists believe humans could colonise Mars.", "quote_zh": "一些科学家认为人类可以在火星上殖民。", "ex_en": "Many early settlers wanted to colonise the island.", "ex_zh": "许多早期定居者想在这座岛上殖民定居。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0555", "unit": "Unit 10"}, {"word": "explore", "pron": "ɪkˈsplɔː", "part_of_speech": "v.", "pos": "v.", "def_en": "to travel to a place to find out about it", "def_zh": "探索；勘探", "quote_en": "Humans have always wanted to explore the unknown.", "quote_zh": "人类一直渴望探索未知。", "ex_en": "I'd like to explore the old part of the city.", "ex_zh": "我想探索这座城市的老城区。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0556", "unit": "Unit 10"}, {"word": "float", "pron": "fləʊt", "part_of_speech": "v.", "pos": "v.", "def_en": "to stay on the surface of a liquid or in the air", "def_zh": "漂浮", "quote_en": "Objects float inside a spacecraft because there is no gravity.", "quote_zh": "航天器内没有重力，所以物体会漂浮。", "ex_en": "A leaf can float down the river.", "ex_zh": "一片树叶可以顺着河漂下去。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0557", "unit": "Unit 10"}, {"word": "orbit", "pron": "ˈɔːbɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to move around a planet or star in a curved path", "def_zh": "绕…运行", "quote_en": "The moon orbits the Earth once every month.", "quote_zh": "月球每个月绕地球运行一周。", "ex_en": "The satellite will orbit the planet every two hours.", "ex_zh": "这颗卫星将每两小时绕这颗行星运行一圈。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0558", "unit": "Unit 10"}, {"word": "propel", "pron": "prəˈpel", "part_of_speech": "v.", "pos": "v.", "def_en": "to push something forward", "def_zh": "推进；推动", "quote_en": "Powerful engines propel the rocket into space.", "quote_zh": "强大的发动机推动火箭进入太空。", "ex_en": "Wind can propel the boat across the lake.", "ex_zh": "风可以推动小船穿过湖面。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0559", "unit": "Unit 10"}, {"word": "rotate", "pron": "rəʊˈteɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to turn around a central point", "def_zh": "旋转；自转", "quote_en": "The Earth rotates once every twenty-four hours.", "quote_zh": "地球每二十四小时自转一周。", "ex_en": "The wheel will rotate slowly when you push it.", "ex_zh": "你推它时，轮子会慢慢转动。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0560", "unit": "Unit 10"}, {"word": "sustain", "pron": "səˈsteɪn", "part_of_speech": "v.", "pos": "v.", "def_en": "to keep something going over time; to provide what is needed for life", "def_zh": "维持；支撑", "quote_en": "It is difficult to sustain human life on another planet.", "quote_zh": "在另一个星球上维持人类生命很困难。", "ex_en": "The business could not sustain its losses.", "ex_zh": "这家企业无法承受亏损。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0561", "unit": "Unit 10"}, {"word": "simulate", "pron": "ˈsɪmjuleɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to copy the conditions of something for testing or training", "def_zh": "模拟", "quote_en": "Scientists simulate space conditions in the laboratory.", "quote_zh": "科学家在实验室里模拟太空条件。", "ex_en": "The software can simulate a real flight.", "ex_zh": "这个软件可以模拟真实飞行。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0562", "unit": "Unit 10"}, {"word": "undergo", "pron": "ˌʌndəˈɡəʊ", "part_of_speech": "v.", "pos": "v.", "def_en": "to experience something, especially a change or test", "def_zh": "经历；接受", "quote_en": "Astronauts undergo years of physical and mental training.", "quote_zh": "宇航员要接受多年的身体和心理训练。", "ex_en": "The hospital will undergo major renovation.", "ex_zh": "这家医院将进行大规模翻修。", "chapter": "Unit 10 · Reaching for the Skies · 探索太空", "id": "w0563", "unit": "Unit 10"}, {"word": "access", "pron": "ˈækses", "part_of_speech": "n.", "pos": "n.", "def_en": "the ability or right to enter or use something", "def_zh": "通道；使用权", "quote_en": "Access to clean water is a basic human need.", "quote_zh": "获得清洁水是人类的基本需求。", "ex_en": "The building has easy access for wheelchair users.", "ex_zh": "这座建筑对轮椅使用者来说出入方便。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0564", "unit": "Unit 11"}, {"word": "approach", "pron": "əˈprəʊtʃ", "part_of_speech": "n.", "pos": "n.", "def_en": "a way of dealing with something", "def_zh": "方法；途径", "quote_en": "Architects now take a more sustainable approach to design.", "quote_zh": "建筑师现在在设计上采取更可持续的方法。", "ex_en": "I like the teacher's approach to grammar.", "ex_zh": "我喜欢这位老师教语法的方法。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0565", "unit": "Unit 11"}, {"word": "balcony", "pron": "ˈbælkəni", "part_of_speech": "n.", "pos": "n.", "def_en": "a platform attached to the outside wall of a building", "def_zh": "阳台", "quote_en": "Many city flats have a small balcony with a view.", "quote_zh": "许多城市公寓有一个能看风景的小阳台。", "ex_en": "We often have breakfast on the balcony.", "ex_zh": "我们常常在阳台上吃早餐。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0566", "unit": "Unit 11"}, {"word": "brick", "pron": "brɪk", "part_of_speech": "n.", "pos": "n.", "def_en": "a hard block used for building walls", "def_zh": "砖", "quote_en": "Brick is a strong and long-lasting building material.", "quote_zh": "砖是一种坚固耐用的建筑材料。", "ex_en": "The old house was built of red brick.", "ex_zh": "这座老房子是用红砖建的。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0567", "unit": "Unit 11"}, {"word": "building", "pron": "ˈbɪldɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "a structure with walls and a roof", "def_zh": "建筑物", "quote_en": "The tallest building in the city is over three hundred metres high.", "quote_zh": "这座城市最高的建筑物超过三百米。", "ex_en": "My office is in a modern glass building.", "ex_zh": "我的办公室在一栋现代的玻璃大楼里。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0568", "unit": "Unit 11"}, {"word": "ceiling", "pron": "ˈsiːlɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the surface that forms the top of a room", "def_zh": "天花板", "quote_en": "High ceilings make a room feel more spacious.", "quote_zh": "高高的天花板让房间显得更宽敞。", "ex_en": "There is a crack in the ceiling.", "ex_zh": "天花板上有一道裂缝。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0569", "unit": "Unit 11"}, {"word": "condition", "pron": "kənˈdɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the state of something", "def_zh": "状况；条件", "quote_en": "Many buildings are in poor condition and need repair.", "quote_zh": "许多建筑状况很差，需要修缮。", "ex_en": "The car is in good condition for its age.", "ex_zh": "就车龄而言，这辆车的状况很好。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0570", "unit": "Unit 11"}, {"word": "concrete", "pron": "ˈkɒŋkriːt", "part_of_speech": "n.", "pos": "n.", "def_en": "a hard building material made from cement, sand and water", "def_zh": "混凝土", "quote_en": "Modern skyscrapers are built with steel and concrete.", "quote_zh": "现代摩天大楼是用钢和混凝土建造的。", "ex_en": "The path is made of concrete.", "ex_zh": "这条小路是混凝土做的。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0571", "unit": "Unit 11"}, {"word": "construction", "pron": "kənˈstrʌkʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the process of building something", "def_zh": "建造；施工", "quote_en": "The construction of the bridge took three years.", "quote_zh": "这座桥的建造耗时三年。", "ex_en": "There is a lot of construction near my house.", "ex_zh": "我家附近有很多施工。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0572", "unit": "Unit 11"}, {"word": "cottage", "pron": "ˈkɒtɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a small house in the countryside", "def_zh": "村舍；小屋", "quote_en": "They bought a quiet cottage by the sea.", "quote_zh": "他们在海边买了一间安静的小屋。", "ex_en": "We rented a cottage for the holidays.", "ex_zh": "我们租了一间小屋度假。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0573", "unit": "Unit 11"}, {"word": "design", "pron": "dɪˈzaɪn", "part_of_speech": "n.", "pos": "n.", "def_en": "the way something is planned and made", "def_zh": "设计", "quote_en": "The design of the new library is both modern and practical.", "quote_zh": "新图书馆的设计既现代又实用。", "ex_en": "I like the design of your phone.", "ex_zh": "我喜欢你手机的设计。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0574", "unit": "Unit 11"}, {"word": "device", "pron": "dɪˈvaɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "a machine or tool for a particular purpose", "def_zh": "装置；设备", "quote_en": "A new device allows buildings to save energy.", "quote_zh": "一种新装置让建筑物能节省能源。", "ex_en": "I use a small device to charge my phone.", "ex_zh": "我用一个小设备给手机充电。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0575", "unit": "Unit 11"}, {"word": "engineering", "pron": "ˌendʒɪˈnɪərɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the work of designing and building machines, roads and bridges", "def_zh": "工程学", "quote_en": "Civil engineering is essential for building safe bridges.", "quote_zh": "土木工程对建造安全的桥梁至关重要。", "ex_en": "My brother is studying engineering at university.", "ex_zh": "我弟弟在大学学工程。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0576", "unit": "Unit 11"}, {"word": "flooding", "pron": "ˈflʌdɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "a large amount of water covering dry land", "def_zh": "洪水；水灾", "quote_en": "Flooding is a serious problem in low-lying cities.", "quote_zh": "洪水是地势低洼的城市面临的严重问题。", "ex_en": "Heavy rain caused flooding in the town.", "ex_zh": "大雨导致小镇发生水灾。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0577", "unit": "Unit 11"}, {"word": "housing", "pron": "ˈhaʊzɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "buildings where people live", "def_zh": "住房", "quote_en": "Affordable housing is a major concern in big cities.", "quote_zh": "经济适用房是大城市的一大问题。", "ex_en": "The cost of housing has risen sharply.", "ex_zh": "住房成本急剧上升。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0578", "unit": "Unit 11"}, {"word": "innovation", "pron": "ˌɪnəˈveɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a new idea or method", "def_zh": "创新", "quote_en": "Technological innovation has transformed the construction industry.", "quote_zh": "技术创新改变了建筑行业。", "ex_en": "Innovation is the key to success in business.", "ex_zh": "创新是商业成功的关键。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0579", "unit": "Unit 11"}, {"word": "invention", "pron": "ɪnˈvenʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "something new that someone has created", "def_zh": "发明", "quote_en": "The invention of the lift made tall buildings possible.", "quote_zh": "电梯的发明使高层建筑成为可能。", "ex_en": "The wheel was a great invention.", "ex_zh": "轮子是一项伟大的发明。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0580", "unit": "Unit 11"}, {"word": "lift shaft", "pron": "lɪft ʃɑːft", "part_of_speech": "n.", "pos": "n.", "def_en": "a vertical space in which a lift moves", "def_zh": "电梯井", "quote_en": "The lift shaft runs through the centre of the building.", "quote_zh": "电梯井贯穿建筑的中心。", "ex_en": "Workers were repairing the lift shaft.", "ex_zh": "工人们正在修理电梯井。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0581", "unit": "Unit 11"}, {"word": "occupant", "pron": "ˈɒkjəpənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who lives in or uses a room or building", "def_zh": "居住者；使用者", "quote_en": "Each occupant of the building must follow the fire rules.", "quote_zh": "大楼的每位住户都必须遵守消防规定。", "ex_en": "The previous occupant left the flat in a mess.", "ex_zh": "前一位住户把公寓弄得一团糟。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0582", "unit": "Unit 11"}, {"word": "operation", "pron": "ˌɒpəˈreɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the way something works; a planned action", "def_zh": "运作；操作", "quote_en": "The operation of the machine is simple and safe.", "quote_zh": "这台机器的操作简单又安全。", "ex_en": "The rescue operation lasted two days.", "ex_zh": "救援行动持续了两天。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0583", "unit": "Unit 11"}, {"word": "pump", "pron": "pʌmp", "part_of_speech": "n.", "pos": "n.", "def_en": "a machine that moves liquid or gas", "def_zh": "泵；抽水机", "quote_en": "A powerful pump removes water from the tunnel.", "quote_zh": "一台功率强大的泵把水从隧道里抽走。", "ex_en": "The pump in our house broke yesterday.", "ex_zh": "我们家的水泵昨天坏了。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0584", "unit": "Unit 11"}, {"word": "quarry", "pron": "ˈkwɒri", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where stone is dug from the ground", "def_zh": "采石场", "quote_en": "Stone from the local quarry was used to build the cathedral.", "quote_zh": "当地采石场的石头被用来建造大教堂。", "ex_en": "The old quarry is now a nature reserve.", "ex_zh": "这个旧采石场现在是自然保护区。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0585", "unit": "Unit 11"}, {"word": "residence", "pron": "ˈrezɪdəns", "part_of_speech": "n.", "pos": "n.", "def_en": "a house or the place where someone lives", "def_zh": "住所；住宅", "quote_en": "The prime minister's official residence is in Wellington.", "quote_zh": "总理的官邸在惠灵顿。", "ex_en": "I live in a student residence on campus.", "ex_zh": "我住在校园里的学生宿舍。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0586", "unit": "Unit 11"}, {"word": "scheme", "pron": "skiːm", "part_of_speech": "n.", "pos": "n.", "def_en": "an official plan or system", "def_zh": "计划；方案", "quote_en": "The government introduced a housing scheme for young families.", "quote_zh": "政府为年轻家庭推出了一项住房计划。", "ex_en": "There's a recycling scheme in our neighbourhood.", "ex_zh": "我们社区有一个回收计划。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0587", "unit": "Unit 11"}, {"word": "skyscraper", "pron": "ˈskaɪskreɪpə", "part_of_speech": "n.", "pos": "n.", "def_en": "a very tall building in a city", "def_zh": "摩天大楼", "quote_en": "Hong Kong is famous for its skyscrapers.", "quote_zh": "香港以摩天大楼闻名。", "ex_en": "I work on the fortieth floor of a skyscraper.", "ex_zh": "我在一栋摩天大楼的四十层工作。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0588", "unit": "Unit 11"}, {"word": "staircase", "pron": "ˈsteəkeɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "a set of steps inside a building", "def_zh": "楼梯", "quote_en": "The grand staircase is the main feature of the hall.", "quote_zh": "宏伟的楼梯是这座大厅的主要特色。", "ex_en": "I slipped on the staircase and hurt my ankle.", "ex_zh": "我在楼梯上滑倒，扭伤了脚踝。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0589", "unit": "Unit 11"}, {"word": "steel", "pron": "stiːl", "part_of_speech": "n.", "pos": "n.", "def_en": "a strong metal made from iron", "def_zh": "钢", "quote_en": "Steel is used in the frames of most tall buildings.", "quote_zh": "大多数高层建筑的框架使用钢材。", "ex_en": "The bridge is made of steel and concrete.", "ex_zh": "这座桥是由钢和混凝土建造的。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0590", "unit": "Unit 11"}, {"word": "structure", "pron": "ˈstrʌktʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "something built from parts; the way parts are arranged", "def_zh": "结构；建筑物", "quote_en": "The structure of the bridge is designed to withstand earthquakes.", "quote_zh": "这座桥的结构设计能抵御地震。", "ex_en": "The essay needs a clearer structure.", "ex_zh": "这篇文章需要更清晰的结构。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0591", "unit": "Unit 11"}, {"word": "tension", "pron": "ˈtenʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a feeling of stress; the state of being stretched", "def_zh": "紧张；张力", "quote_en": "The tension in the cables holds the bridge up.", "quote_zh": "缆索的张力撑住了这座桥。", "ex_en": "There was a lot of tension in the room.", "ex_zh": "房间里气氛非常紧张。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0592", "unit": "Unit 11"}, {"word": "timber", "pron": "ˈtɪmbə", "part_of_speech": "n.", "pos": "n.", "def_en": "wood used for building", "def_zh": "木材", "quote_en": "Timber is a renewable building material.", "quote_zh": "木材是一种可再生的建筑材料。", "ex_en": "The cottage is built from local timber.", "ex_zh": "这间小屋是用当地木材建造的。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0593", "unit": "Unit 11"}, {"word": "tunnel", "pron": "ˈtʌnl", "part_of_speech": "n.", "pos": "n.", "def_en": "an underground passage", "def_zh": "隧道", "quote_en": "The new tunnel will reduce traffic through the city centre.", "quote_zh": "新隧道将减少穿过市中心的交通。", "ex_en": "The train goes through a long tunnel under the sea.", "ex_zh": "火车穿过海底的一条长隧道。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0594", "unit": "Unit 11"}, {"word": "airy", "pron": "ˈeəri", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having plenty of fresh air; light and spacious", "def_zh": "通风的；宽敞明亮的", "quote_en": "The flat is bright and airy with large windows.", "quote_zh": "这套公寓有大窗户，明亮通风。", "ex_en": "I like airy rooms with lots of light.", "ex_zh": "我喜欢光线充足、通风的房间。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0595", "unit": "Unit 11"}, {"word": "congested", "pron": "kənˈdʒestɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "too crowded, especially with traffic", "def_zh": "拥挤的；堵塞的", "quote_en": "Congested roads waste time and cause pollution.", "quote_zh": "拥堵的道路浪费时间，还造成污染。", "ex_en": "The city centre is congested during rush hour.", "ex_zh": "高峰时段市中心很拥堵。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0596", "unit": "Unit 11"}, {"word": "conventional", "pron": "kənˈvenʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "following traditional methods or ideas", "def_zh": "传统的；常规的", "quote_en": "Conventional buildings use a lot of energy for heating.", "quote_zh": "传统建筑取暖需要消耗大量能源。", "ex_en": "I prefer conventional medicine to alternative treatments.", "ex_zh": "与替代疗法相比，我更喜欢常规医学。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0597", "unit": "Unit 11"}, {"word": "cosy", "pron": "ˈkəʊzi", "part_of_speech": "adj.", "pos": "adj.", "def_en": "warm, comfortable and pleasant", "def_zh": "温馨的；舒适的", "quote_en": "The small cottage had a cosy living room with a fireplace.", "quote_zh": "这间小屋有一个带壁炉的温馨客厅。", "ex_en": "I like staying in on a cosy evening with a book.", "ex_zh": "我喜欢在温馨的夜晚待在家看书。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0598", "unit": "Unit 11"}, {"word": "cramped", "pron": "kræmpt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "too small and uncomfortable", "def_zh": "狭窄的；拥挤的", "quote_en": "Many families live in cramped apartments in big cities.", "quote_zh": "在大城市里，许多家庭住在狭窄的公寓里。", "ex_en": "The room was cramped, with five people sharing it.", "ex_zh": "房间很拥挤，五个人合住。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0599", "unit": "Unit 11"}, {"word": "curved", "pron": "kɜːvd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having a shape that bends smoothly", "def_zh": "弯曲的", "quote_en": "The museum has a curved roof that looks like a wave.", "quote_zh": "这座博物馆有一个像波浪一样的弧形屋顶。", "ex_en": "We walked along a curved path by the river.", "ex_zh": "我们沿着河边一条弯曲的小路散步。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0600", "unit": "Unit 11"}, {"word": "disposable", "pron": "dɪˈspəʊzəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "designed to be thrown away after use", "def_zh": "一次性的", "quote_en": "Disposable plastic products create a lot of waste.", "quote_zh": "一次性塑料制品产生大量垃圾。", "ex_en": "I bought a disposable camera for the trip.", "ex_zh": "我为这次旅行买了一台一次性相机。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0601", "unit": "Unit 11"}, {"word": "domestic", "pron": "dəˈmestɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the home or to your own country", "def_zh": "家庭的；国内的", "quote_en": "Domestic energy use is rising as houses get bigger.", "quote_zh": "随着房子越来越大，家庭能源使用量也在上升。", "ex_en": "I do most of the domestic chores at home.", "ex_zh": "我在家做大部分家务。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0602", "unit": "Unit 11"}, {"word": "emerging", "pron": "ɪˈmɜːdʒɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "starting to appear or develop", "def_zh": "新兴的；正在出现的", "quote_en": "Emerging markets are growing faster than developed ones.", "quote_zh": "新兴市场比发达市场增长更快。", "ex_en": "I'm interested in emerging technologies.", "ex_zh": "我对新兴技术感兴趣。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0603", "unit": "Unit 11"}, {"word": "expanding", "pron": "ɪkˈspændɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "becoming larger in size or number", "def_zh": "扩大的；扩张的", "quote_en": "The city's expanding suburbs need more transport links.", "quote_zh": "这座城市不断扩大的郊区需要更多交通连接。", "ex_en": "The company is in an expanding market.", "ex_zh": "这家公司处于一个不断扩大的市场。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0604", "unit": "Unit 11"}, {"word": "feasible", "pron": "ˈfiːzəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "possible and likely to work", "def_zh": "可行的", "quote_en": "It is not feasible to build a tunnel across the whole bay.", "quote_zh": "在整个海湾修建一条隧道是不可行的。", "ex_en": "Is it feasible to finish the project by Friday?", "ex_zh": "这个项目能在周五前完成可行吗？", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0605", "unit": "Unit 11"}, {"word": "functional", "pron": "ˈfʌŋkʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "designed to be practical and useful", "def_zh": "实用的；功能性的", "quote_en": "The office has a simple, functional design.", "quote_zh": "这间办公室设计简洁实用。", "ex_en": "My new flat is small but very functional.", "ex_zh": "我的新公寓虽小但很实用。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0606", "unit": "Unit 11"}, {"word": "futuristic", "pron": "ˌfjuːtʃəˈrɪstɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very modern and looking like something from the future", "def_zh": "未来主义的；超前的", "quote_en": "The airport has a futuristic design.", "quote_zh": "这座机场的设计很有未来感。", "ex_en": "The film shows a futuristic city.", "ex_zh": "这部电影展示了一座未来主义的城市。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0607", "unit": "Unit 11"}, {"word": "high-rise", "pron": "ˈhaɪ raɪz", "part_of_speech": "adj.", "pos": "adj.", "def_en": "(of a building) having many floors", "def_zh": "高层的", "quote_en": "High-rise apartments are common in Hong Kong.", "quote_zh": "高层公寓在香港很常见。", "ex_en": "I live in a high-rise block near the station.", "ex_zh": "我住在车站附近的一栋高层楼里。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0608", "unit": "Unit 11"}, {"word": "ingenious", "pron": "ɪnˈdʒiːniəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very clever and original", "def_zh": "巧妙的；独具匠心的", "quote_en": "The engineers found an ingenious way to save energy.", "quote_zh": "工程师们想出了一个巧妙的节能办法。", "ex_en": "It was an ingenious solution to the problem.", "ex_zh": "这是解决这个问题的巧妙办法。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0609", "unit": "Unit 11"}, {"word": "innovative", "pron": "ˈɪnəveɪtɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "using new ideas or methods", "def_zh": "创新的", "quote_en": "The architect is known for innovative designs.", "quote_zh": "这位建筑师以创新设计闻名。", "ex_en": "The school uses innovative teaching methods.", "ex_zh": "这所学校使用创新的教学方法。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0610", "unit": "Unit 11"}, {"word": "impassable", "pron": "ɪmˈpɑːsəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "impossible to travel along or through", "def_zh": "无法通行的", "quote_en": "Heavy snow made the mountain road impassable.", "quote_zh": "大雪使山路无法通行。", "ex_en": "After the flood, many roads were impassable.", "ex_zh": "洪水过后，许多道路无法通行。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0611", "unit": "Unit 11"}, {"word": "mass-produced", "pron": "ˌmæs prəˈdjuːst", "part_of_speech": "adj.", "pos": "adj.", "def_en": "made in large numbers by machine", "def_zh": "批量生产的", "quote_en": "Mass-produced houses are cheaper but often look the same.", "quote_zh": "批量生产的房子更便宜，但往往看起来都一样。", "ex_en": "These mass-produced chairs are very affordable.", "ex_zh": "这些批量生产的椅子价格很实惠。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0612", "unit": "Unit 11"}, {"word": "modern", "pron": "ˈmɒdn", "part_of_speech": "adj.", "pos": "adj.", "def_en": "using the newest ideas or technology", "def_zh": "现代的", "quote_en": "Modern buildings often use glass and steel.", "quote_zh": "现代建筑常用玻璃和钢材。", "ex_en": "I prefer modern furniture to antique pieces.", "ex_zh": "我更喜欢现代家具而不是古董。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0613", "unit": "Unit 11"}, {"word": "multi-storey", "pron": "ˌmʌlti ˈstɔːri", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having several floors", "def_zh": "多层的", "quote_en": "A multi-storey car park saves space in the city centre.", "quote_zh": "多层停车场可节省市中心的空间。", "ex_en": "We park in a multi-storey car park near the mall.", "ex_zh": "我们把车停在商场附近的多层停车场。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0614", "unit": "Unit 11"}, {"word": "old-fashioned", "pron": "ˌəʊld ˈfæʃnd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not modern; belonging to the past", "def_zh": "过时的；老式的", "quote_en": "Some people find old-fashioned houses charming.", "quote_zh": "有些人觉得老式房子很有魅力。", "ex_en": "My grandmother has old-fashioned ideas about fashion.", "ex_zh": "我奶奶对时尚有老派的看法。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0615", "unit": "Unit 11"}, {"word": "ornate", "pron": "ɔːˈneɪt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "decorated with a lot of detail", "def_zh": "华丽的；装饰繁复的", "quote_en": "The cathedral has an ornate ceiling covered in gold.", "quote_zh": "这座大教堂有一个镶满金饰的华丽天花板。", "ex_en": "The palace is full of ornate furniture.", "ex_zh": "这座宫殿里到处是装饰华丽的家具。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0616", "unit": "Unit 11"}, {"word": "prefabricated", "pron": "ˌpriːˈfæbrɪkeɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "made in sections in a factory and put together elsewhere", "def_zh": "预制的", "quote_en": "Prefabricated houses can be built very quickly.", "quote_zh": "预制房屋可以非常迅速地建造。", "ex_en": "They live in a prefabricated cabin.", "ex_zh": "他们住在一间预制小屋里。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0617", "unit": "Unit 11"}, {"word": "prosperous", "pron": "ˈprɒspərəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "rich and successful", "def_zh": "繁荣的；富裕的", "quote_en": "The city became prosperous thanks to trade.", "quote_zh": "这座城市靠贸易变得繁荣。", "ex_en": "My uncle runs a prosperous restaurant.", "ex_zh": "我叔叔经营着一家生意兴隆的餐馆。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0618", "unit": "Unit 11"}, {"word": "single-storey", "pron": "ˌsɪŋɡl ˈstɔːri", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having only one floor", "def_zh": "单层的", "quote_en": "Single-storey houses are easier for elderly people to live in.", "quote_zh": "单层住宅对老年人来说更便于居住。", "ex_en": "My grandparents live in a single-storey house.", "ex_zh": "我祖父母住在一栋单层房子里。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0619", "unit": "Unit 11"}, {"word": "spacious", "pron": "ˈspeɪʃəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having a lot of space", "def_zh": "宽敞的", "quote_en": "The apartment is spacious, with three large bedrooms.", "quote_zh": "这套公寓很宽敞，有三个大卧室。", "ex_en": "I'd like a spacious kitchen.", "ex_zh": "我想要一个宽敞的厨房。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0620", "unit": "Unit 11"}, {"word": "state-of-the-art", "pron": "ˌsteɪt əv ði ˈɑːt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "using the newest and most advanced technology", "def_zh": "最先进的", "quote_en": "The hospital has state-of-the-art equipment.", "quote_zh": "这家医院拥有最先进的设备。", "ex_en": "The gym has state-of-the-art machines.", "ex_zh": "这家健身房有最先进的器械。", "chapter": "Unit 11 · Design and Innovation · 设计与创新", "id": "w0621", "unit": "Unit 11"}, {"word": "tricky", "pron": "ˈtrɪki", "part_of_speech": "adj.", "pos": "adj.", "def_en": "difficult to do or deal with", "def_zh": "棘手的；难办的", "quote_en": "Building on a steep hill is a tricky task 。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0655", "unit": "Unit 12"}, {"word": "data", "pron": "ˈdeɪtə", "part_of_speech": "n.", "pos": "n.", "def_en": "facts and information collected for analysis", "def_zh": "数据", "quote_en": "Companies collect data on how customers shop.", "quote_zh": "公司收集顾客购物方式的数据。", "ex_en": "I stored all my data on a hard drive.", "ex_zh": "我把所有数据存在了硬盘里。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0656", "unit": "Unit 12"}, {"word": "function", "pron": "ˈfʌŋkʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the purpose or job of something", "def_zh": "功能；作用", "quote_en": "The main function of a router is to share an internet connection.", "quote_zh": "路由器的主要功能是共享互联网连接。", "ex_en": "This button has a special function.", "ex_zh": "这个按钮有一个特殊的功能。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0657", "unit": "Unit 12"}, {"word": "gadget", "pron": "ˈɡædʒɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "a small useful device", "def_zh": "小器具；小玩意", "quote_en": "Young people love buying the latest gadget.", "quote_zh": "年轻人喜欢买最新的小玩意。", "ex_en": "My dad bought a gadget for peeling apples.", "ex_zh": "我爸爸买了一个削苹果的小器具。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0658", "unit": "Unit 12"}, {"word": "platform", "pron": "ˈplætfɔːm", "part_of_speech": "n.", "pos": "n.", "def_en": "a computer system or website where services are offered", "def_zh": "平台", "quote_en": "Social media platforms have changed how people share news.", "quote_zh": "社交媒体平台改变了人们分享新闻的方式。", "ex_en": "This platform lets you learn languages online.", "ex_zh": "这个平台让你在线学习语言。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0659", "unit": "Unit 12"}, {"word": "privacy", "pron": "ˈprɪvəsi", "part_of_speech": "n.", "pos": "n.", "def_en": "the right to keep personal information secret", "def_zh": "隐私", "quote_en": "Many users worry about privacy when they use apps.", "quote_zh": "许多用户在使用应用程序时担心隐私问题。", "ex_en": "I want some privacy when I study.", "ex_zh": "我学习时想要一点私人空间。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0660", "unit": "Unit 12"}, {"word": "security", "pron": "sɪˈkjʊərəti", "part_of_speech": "n.", "pos": "n.", "def_en": "protection against danger or theft", "def_zh": "安全；保安", "quote_en": "Online security is important when you shop on the internet.", "quote_zh": "在网上购物时，网络安全很重要。", "ex_en": "We had to go through security at the airport.", "ex_zh": "我们在机场必须通过安检。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0661", "unit": "Unit 12"}, {"word": "smartphone", "pron": "ˈsmɑːtfəʊn", "part_of_speech": "n.", "pos": "n.", "def_en": "a mobile phone that can access the internet and run apps", "def_zh": "智能手机", "quote_en": "A smartphone has replaced the camera, map and alarm clock for many people.", "quote_zh": "智能手机已取代许多人的相机、地图和闹钟。", "ex_en": "I check my smartphone every morning.", "ex_zh": "我每天早上都会看智能手机。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0662", "unit": "Unit 12"}, {"word": "social media", "pron": "ˌsəʊʃl ˈmiːdiə", "part_of_speech": "n.", "pos": "n.", "def_en": "websites and apps that let people share content", "def_zh": "社交媒体", "quote_en": "Social media allows people to keep in touch across the world.", "quote_zh": "社交媒体让人们可以与世界各地的人保持联系。", "ex_en": "I spend too much time on social media.", "ex_zh": "我在社交媒体上花的时间太多了。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0663", "unit": "Unit 12"}, {"word": "the Internet", "pron": "ði ˈɪntənet", "part_of_speech": "n.", "pos": "n.", "def_en": "the worldwide network of computers", "def_zh": "互联网", "quote_en": "The Internet has made it easy to learn new things.", "quote_zh": "互联网让学习新知识变得容易。", "ex_en": "I can't live without the Internet.", "ex_zh": "我离不开互联网。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0664", "unit": "Unit 12"}, {"word": "the latest", "pron": "ðə ˈleɪtɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "the most recent thing of its type", "def_zh": "最新的东西", "quote_en": "Many people queue for the latest from Apple.", "quote_zh": "许多人排队购买苹果公司的最新产品。", "ex_en": "I always want to have the latest phone.", "ex_zh": "我总想拥有最新款的手机。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0665", "unit": "Unit 12"}, {"word": "monitor", "pron": "ˈmɒnɪtə", "part_of_speech": "n.", "pos": "n.", "def_en": "a screen used with a computer", "def_zh": "显示器", "quote_en": "Using a large monitor can reduce eye strain.", "quote_zh": "使用大显示器可以减轻眼睛疲劳。", "ex_en": "My monitor stopped working this morning.", "ex_zh": "我的显示器今天早上不工作了。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0666", "unit": "Unit 12"}, {"word": "remote control", "pron": "rɪˌməʊt kənˈtrəʊl", "part_of_speech": "n.", "pos": "n.", "def_en": "a device used to operate a machine from a distance", "def_zh": "遥控器", "quote_en": "I can't find the remote control for the television.", "quote_zh": "我找不到电视的遥控器。", "ex_en": "Children often fight over the remote control.", "ex_zh": "孩子们常常争夺遥控器。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0667", "unit": "Unit 12"}, {"word": "technology", "pron": "tekˈnɒlədʒi", "part_of_speech": "n.", "pos": "n.", "def_en": "the use of scientific knowledge to make machines and tools", "def_zh": "科技；技术", "quote_en": "Technology has changed the way we work and communicate.", "quote_zh": "科技改变了我们工作和交流的方式。", "ex_en": "I'm interested in new technology.", "ex_zh": "我对新技术感兴趣。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0668", "unit": "Unit 12"}, {"word": "telecommunications", "pron": "ˌtelɪkəˌmjuːnɪˈkeɪʃnz", "part_of_speech": "n.", "pos": "n.", "def_en": "the sending of information over long distances by phone or internet", "def_zh": "电信", "quote_en": "Telecommunications has made international business much easier.", "quote_zh": "电信让国际业务容易得多。", "ex_en": "My uncle works in telecommunications.", "ex_zh": "我叔叔在电信行业工作。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0669", "unit": "Unit 12"}, {"word": "text message", "pron": "tekst ˈmesɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a short written message sent from a mobile phone", "def_zh": "短信", "quote_en": "A text message is often quicker than a phone call.", "quote_zh": "发短信常常比打电话更快。", "ex_en": "I'll send you a text message when I arrive.", "ex_zh": "我到了会给你发短信。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0670", "unit": "Unit 12"}, {"word": "virtual reality", "pron": "ˌvɜːtʃuəl riˈæləti", "part_of_speech": "n.", "pos": "n.", "def_en": "a computer-made environment that feels real", "def_zh": "虚拟现实", "quote_en": "Virtual reality can be used to train surgeons.", "quote_zh": "虚拟现实可用来培训外科医生。", "ex_en": "I tried a virtual reality game at the mall.", "ex_zh": "我在商场里玩了一个虚拟现实游戏。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0671", "unit": "Unit 12"}, {"word": "Wi-Fi", "pron": "ˈwaɪ faɪ", "part_of_speech": "n.", "pos": "n.", "def_en": "a system for connecting devices to the internet without wires", "def_zh": "无线网络", "quote_en": "Most cafes now offer free Wi-Fi to customers.", "quote_zh": "现在大多数咖啡馆为顾客提供免费无线网络。", "ex_en": "What's the Wi-Fi password?", "ex_zh": "无线网络密码是多少？", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0672", "unit": "Unit 12"}, {"word": "adequate", "pron": "ˈædɪkwət", "part_of_speech": "adj.", "pos": "adj.", "def_en": "enough for a particular purpose", "def_zh": "足够的；适当的", "quote_en": "Schools need adequate funding to buy computers.", "quote_zh": "学校需要足够的经费来购买电脑。", "ex_en": "The room was small but adequate for one person.", "ex_zh": "房间很小，但够一个人住了。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0673", "unit": "Unit 12"}, {"word": "basic", "pron": "ˈbeɪsɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "simple and necessary; forming the base", "def_zh": "基本的", "quote_en": "Basic computer skills are essential for most jobs.", "quote_zh": "基本的电脑技能对大多数工作来说必不可少。", "ex_en": "I have only a basic knowledge of coding.", "ex_zh": "我只有基本的编程知识。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0674", "unit": "Unit 12"}, {"word": "compact", "pron": "ˈkɒmpækt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "small and neatly designed", "def_zh": "小巧的；紧凑的", "quote_en": "Modern laptops are light and compact.", "quote_zh": "现代笔记本电脑轻便小巧。", "ex_en": "I bought a compact camera for travelling.", "ex_zh": "我买了一台小巧的相机用来旅行。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0675", "unit": "Unit 12"}, {"word": "cyber", "pron": "ˈsaɪbə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to computers and the internet", "def_zh": "网络的；计算机的", "quote_en": "Cyber crime has become a major concern for banks.", "quote_zh": "网络犯罪已成为银行的一大隐忧。", "ex_en": "Many schools teach cyber safety to students.", "ex_zh": "许多学校向学生教授网络安全知识。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0676", "unit": "Unit 12"}, {"word": "dated", "pron": "ˈdeɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "no longer fashionable or modern", "def_zh": "过时的", "quote_en": "The software looks dated compared with newer apps.", "quote_zh": "与较新的应用相比，这款软件看起来过时了。", "ex_en": "His taste in clothes is a bit dated.", "ex_zh": "他的穿衣品味有点过时。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0677", "unit": "Unit 12"}, {"word": "digital", "pron": "ˈdɪdʒɪtl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "using electronic signals; relating to computers", "def_zh": "数字的；数码的", "quote_en": "Digital technology is now used in most classrooms.", "quote_zh": "数字技术现在被用于大多数课堂。", "ex_en": "I read digital books on my tablet.", "ex_zh": "我在平板电脑上读电子书。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0678", "unit": "Unit 12"}, {"word": "efficient", "pron": "ɪˈfɪʃnt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "working well without wasting time or energy", "def_zh": "高效的", "quote_en": "Electric cars are more efficient than petrol cars.", "quote_zh": "电动汽车比汽油车更高效。", "ex_en": "She is an efficient worker who always meets deadlines.", "ex_zh": "她是个高效的员工，总是按时完成任务。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0679", "unit": "Unit 12"}, {"word": "portable", "pron": "ˈpɔːtəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "easy to carry or move", "def_zh": "便携的", "quote_en": "Portable chargers are useful when you are travelling.", "quote_zh": "便携式充电器在旅行时很有用。", "ex_en": "I carry a portable speaker to the park.", "ex_zh": "我带着便携音箱去公园。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0680", "unit": "Unit 12"}, {"word": "up-to-date", "pron": "ˌʌp tə ˈdeɪt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "modern; having the latest information", "def_zh": "最新的；现代的", "quote_en": "It is important to keep your software up-to-date.", "quote_zh": "保持软件更新很重要。", "ex_en": "The website has up-to-date news.", "ex_zh": "这个网站有最新的新闻。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0681", "unit": "Unit 12"}, {"word": "user-friendly", "pron": "ˌjuːzə ˈfrendli", "part_of_speech": "adj.", "pos": "adj.", "def_en": "easy to use", "def_zh": "用户友好的；易使用的", "quote_en": "User-friendly apps are popular with older people.", "quote_zh": "界面友好易用的应用在老年人中很受欢迎。", "ex_en": "The new website is very user-friendly.", "ex_zh": "新网站非常好用。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0682", "unit": "Unit 12"}, {"word": "virtual", "pron": "ˈvɜːtʃuəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "existing on a computer rather than in the physical world", "def_zh": "虚拟的；线上的", "quote_en": "Virtual classrooms allow students to learn from home.", "quote_zh": "虚拟课堂让学生在家就能学习。", "ex_en": "We had a virtual meeting because of the distance.", "ex_zh": "由于距离远，我们开了一次线上会议。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0683", "unit": "Unit 12"}, {"word": "wireless", "pron": "ˈwaɪələs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not using wires or cables", "def_zh": "无线的", "quote_en": "Wireless headphones are convenient for exercise.", "quote_zh": "无线耳机在运动时很方便。", "ex_en": "I connect to the wireless network at home.", "ex_zh": "我在家连接无线网络。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0684", "unit": "Unit 12"}, {"word": "access", "pron": "ˈækses", "part_of_speech": "v.", "pos": "v.", "def_en": "to get into a system or use information", "def_zh": "访问；获取", "quote_en": "Students can access the library catalogue from home.", "quote_zh": "学生在家就可以访问图书馆目录。", "ex_en": "I can't access my email account.", "ex_zh": "我无法登录我的电子邮箱。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0685", "unit": "Unit 12"}, {"word": "detect", "pron": "dɪˈtekt", "part_of_speech": "v.", "pos": "v.", "def_en": "to notice or discover something", "def_zh": "检测；发现", "quote_en": "Sensors can detect changes in temperature.", "quote_zh": "传感器可以检测温度变化。", "ex_en": "Antivirus software can detect harmful files.", "ex_zh": "杀毒软件可以检测有害文件。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0686", "unit": "Unit 12"}, {"word": "disable", "pron": "dɪsˈeɪbl", "part_of_speech": "v.", "pos": "v.", "def_en": "to stop something from working", "def_zh": "使失效；禁用", "quote_en": "You can disable notifications to avoid distractions.", "quote_zh": "你可以关闭通知以避免分心。", "ex_en": "A virus can disable the whole network.", "ex_zh": "病毒可以使整个网络瘫痪。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0687", "unit": "Unit 12"}, {"word": "display", "pron": "dɪˈspleɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to show something on a screen", "def_zh": "显示；展示", "quote_en": "The screen will display the results in a few seconds.", "quote_zh": "屏幕会在几秒内显示结果。", "ex_en": "The shop will display its newest laptops in the window.", "ex_zh": "这家店将把最新的笔记本电脑陈列在橱窗里。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0688", "unit": "Unit 12"}, {"word": "hack", "pron": "hæk", "part_of_speech": "v.", "pos": "v.", "def_en": "to gain unauthorised access to a computer system", "def_zh": "入侵（电脑）；黑客攻击", "quote_en": "Criminals try to hack into bank accounts.", "quote_zh": "犯罪分子试图入侵银行账户。", "ex_en": "Someone tried to hack my email.", "ex_zh": "有人试图入侵我的电子邮箱。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0689", "unit": "Unit 12"}, {"word": "monitor", "pron": "ˈmɒnɪtə", "part_of_speech": "v.", "pos": "v.", "def_en": "to watch and check something over a period of time", "def_zh": "监控；监测", "quote_en": "Some apps monitor how much time you spend on your phone.", "quote_zh": "有些应用会监测你使用手机的时间。", "ex_en": "The doctor will monitor my progress.", "ex_zh": "医生会监测我的恢复情况。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0690", "unit": "Unit 12"}, {"word": "operate", "pron": "ˈɒpəreɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to make a machine work; to function", "def_zh": "操作；运转", "quote_en": "Workers need training to operate the new machines.", "quote_zh": "工人需要培训才能操作新机器。", "ex_en": "I don't know how to operate this camera.", "ex_zh": "我不知道怎么操作这台相机。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0691", "unit": "Unit 12"}, {"word": "scroll", "pron": "skrəʊl", "part_of_speech": "v.", "pos": "v.", "def_en": "to move text or images up or down on a screen", "def_zh": "滚动（屏幕）", "quote_en": "Many people scroll through social media for hours.", "quote_zh": "许多人花好几个小时刷社交媒体。", "ex_en": "Scroll down to see more photos.", "ex_zh": "向下滚动可以看到更多照片。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0692", "unit": "Unit 12"}, {"word": "store", "pron": "stɔː", "part_of_speech": "v.", "pos": "v.", "def_en": "to keep information or things for future use", "def_zh": "存储；储存", "quote_en": "Cloud services allow you to store files online.", "quote_zh": "云服务允许你把文件存储在网上。", "ex_en": "I store all my photos on my laptop.", "ex_zh": "我把所有照片都存在笔记本电脑里。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0693", "unit": "Unit 12"}, {"word": "surpass", "pron": "səˈpɑːs", "part_of_speech": "v.", "pos": "v.", "def_en": "to do better than something else", "def_zh": "超过；超越", "quote_en": "Online sales are expected to surpass shop sales soon.", "quote_zh": "预计网络销售额很快会超过实体店销售额。", "ex_en": "The result might surpass all our expectations.", "ex_zh": "结果可能会超出我们所有人的预期。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0694", "unit": "Unit 12"}, {"word": "switch off", "pron": "swɪtʃ ɒf", "part_of_speech": "v.", "pos": "v.", "def_en": "to stop a machine by pressing a button", "def_zh": "关掉", "quote_en": "Remember to switch off all devices at night to save energy.", "quote_zh": "请记得夜里关掉所有设备以节省能源。", "ex_en": "Please switch off your phone during the exam.", "ex_zh": "考试期间请关掉手机。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0695", "unit": "Unit 12"}, {"word": "switch on", "pron": "swɪtʃ ɒn", "part_of_speech": "v.", "pos": "v.", "def_en": "to start a machine by pressing a button", "def_zh": "打开", "quote_en": "Switch on the computer and wait for it to load.", "quote_zh": "打开电脑，等它加载。", "ex_en": "Can you switch on the light, please?", "ex_zh": "请你打开灯好吗？", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0696", "unit": "Unit 12"}, {"word": "track", "pron": "træk", "part_of_speech": "v.", "pos": "v.", "def_en": "to follow or record the movement or progress of something", "def_zh": "追踪；跟踪", "quote_en": "Apps can track how many steps you take every day.", "quote_zh": "应用程序可以追踪你每天走多少步。", "ex_en": "I use an app to track my spending.", "ex_zh": "我用一个应用来记录我的开销。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0697", "unit": "Unit 12"}, {"word": "remotely", "pron": "rɪˈməʊtli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "from a distance using technology", "def_zh": "远程地", "quote_en": "Many employees now work remotely from home.", "quote_zh": "现在许多员工在家远程办公。", "ex_en": "I control the heating remotely with my phone.", "ex_zh": "我用手机远程控制暖气。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0698", "unit": "Unit 12"}, {"word": "stay in touch with", "pron": "steɪ ɪn tʌtʃ wɪð", "part_of_speech": "idiom", "pos": "idiom", "def_en": "to keep communicating with someone", "def_zh": "与…保持联系", "quote_en": "Technology makes it easy to stay in touch with friends abroad.", "quote_zh": "科技让与国外的朋友保持联系变得容易。", "ex_en": "I stay in touch with my old classmates through social media.", "ex_zh": "我通过社交媒体与老同学保持联系。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0699", "unit": "Unit 12"}, {"word": "computer savvy", "pron": "kəmˈpjuːtə ˈsævi", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Having good practical knowledge of computers.", "def_zh": "精通电脑的", "quote_en": "A computer savvy teenager can fix most software problems in minutes.", "quote_zh": "精通电脑的青少年几分钟就能解决大多数软件问题。", "ex_en": "My grandmother is not very computer savvy, so I help her with email.", "ex_zh": "我奶奶不太懂电脑，所以我帮她处理电子邮件。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0700", "unit": "Unit 12"}, {"word": "surf", "pron": "sɜːf", "part_of_speech": "v.", "pos": "v.", "def_en": "To move from one website to another on the internet.", "def_zh": "上网冲浪；浏览网页", "quote_en": "Many teenagers surf the internet for hours every evening.", "quote_zh": "许多青少年每天晚上上网浏览好几个小时。", "ex_en": "I like to surf online before I buy anything.", "ex_zh": "我买东西前喜欢先上网浏览一下。", "chapter": "Unit 12 · Information Technology · 信息技术", "id": "w0701", "unit": "Unit 12"}, {"word": "brand", "pron": "brænd", "part_of_speech": "n.", "pos": "n.", "def_en": "a name or design that identifies a product", "def_zh": "品牌", "quote_en": "A famous brand can attract customers around the world.", "quote_zh": "知名品牌可以吸引世界各地的顾客。", "ex_en": "I prefer to buy a well-known brand.", "ex_zh": "我更喜欢买知名品牌。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0702", "unit": "Unit 13"}, {"word": "culture", "pron": "ˈkʌltʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "the customs, beliefs and way of life of a group of people", "def_zh": "文化", "quote_en": "Globalisation can threaten traditional culture.", "quote_zh": "全球化可能威胁传统文化。", "ex_en": "I'm interested in learning about Japanese culture.", "ex_zh": "我对了解日本文化感兴趣。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0703", "unit": "Unit 13"}, {"word": "cycle", "pron": "ˈsaɪkl", "part_of_speech": "n.", "pos": "n.", "def_en": "a series of events that repeat in the same order", "def_zh": "周期；循环", "quote_en": "The economy goes through a cycle of growth and decline.", "quote_zh": "经济经历增长与衰退的周期。", "ex_en": "The water cycle is the first topic in science this term.", "ex_zh": "水循环是本学期科学课的第一个主题。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0704", "unit": "Unit 13"}, {"word": "demographics", "pron": "ˌdeməˈɡræfɪks", "part_of_speech": "n.", "pos": "n.", "def_en": "statistics about the population and its groups", "def_zh": "人口统计数据", "quote_en": "Changing demographics affect the demand for health services.", "quote_zh": "人口结构的变化影响医疗服务的需求。", "ex_en": "The company studies the demographics of its customers.", "ex_zh": "这家公司研究其顾客的人口特征。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0705", "unit": "Unit 13"}, {"word": "development", "pron": "dɪˈveləpmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "the process of growing or becoming more advanced", "def_zh": "发展；开发", "quote_en": "Economic development has improved living standards in many countries.", "quote_zh": "经济发展提高了许多国家的生活水平。", "ex_en": "I'm interested in new housing development.", "ex_zh": "我对新的住宅开发项目感兴趣。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0706", "unit": "Unit 13"}, {"word": "diversity", "pron": "daɪˈvɜːsəti", "part_of_speech": "n.", "pos": "n.", "def_en": "a range of different people or things", "def_zh": "多样性", "quote_en": "Cultural diversity makes a city more interesting.", "quote_zh": "文化多样性使城市更有趣。", "ex_en": "There is great diversity in my school.", "ex_zh": "我们学校的多样性很丰富。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0707", "unit": "Unit 13"}, {"word": "globalisation", "pron": "ˌɡləʊbəlaɪˈzeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the increasing connection of the world's economies and cultures", "def_zh": "全球化", "quote_en": "Globalisation has made it easier to buy goods from other countries.", "quote_zh": "全球化使从其他国家购买商品更容易。", "ex_en": "Some people worry about the effects of globalisation.", "ex_zh": "有些人担心全球化的影响。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0708", "unit": "Unit 13"}, {"word": "hindsight", "pron": "ˈhaɪndsaɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "understanding something after it has happened", "def_zh": "事后聪明；后见之明", "quote_en": "With hindsight, the company should have invested in technology earlier.", "quote_zh": "事后看来，这家公司本应更早投资科技。", "ex_en": "In hindsight, I should have studied harder.", "ex_zh": "现在回想起来，我本该更努力学习。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0709", "unit": "Unit 13"}, {"word": "icon", "pron": "ˈaɪkɒn", "part_of_speech": "n.", "pos": "n.", "def_en": "a famous person or thing that represents something", "def_zh": "偶像；象征", "quote_en": "The Eiffel Tower is a cultural icon of France.", "quote_zh": "埃菲尔铁塔是法国的文化象征。", "ex_en": "She is a fashion icon for many young people.", "ex_zh": "她是许多年轻人的时尚偶像。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0710", "unit": "Unit 13"}, {"word": "identity", "pron": "aɪˈdentəti", "part_of_speech": "n.", "pos": "n.", "def_en": "who a person is; the qualities that make a group different", "def_zh": "身份；特性", "quote_en": "Language is an important part of cultural identity.", "quote_zh": "语言是文化认同的重要组成部分。", "ex_en": "Immigrants sometimes struggle to keep their identity.", "ex_zh": "移民有时难以保持自己的身份认同。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0711", "unit": "Unit 13"}, {"word": "impact", "pron": "ˈɪmpækt", "part_of_speech": "n.", "pos": "n.", "def_en": "a strong effect on something", "def_zh": "影响；冲击", "quote_en": "Technology has had a huge impact on modern life.", "quote_zh": "科技对现代生活产生了巨大影响。", "ex_en": "The news had a big impact on me.", "ex_zh": "这条消息对我影响很大。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0712", "unit": "Unit 13"}, {"word": "implication", "pron": "ˌɪmplɪˈkeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a possible effect or result", "def_zh": "影响；含义", "quote_en": "The report discusses the implications of an ageing population.", "quote_zh": "这份报告讨论了人口老龄化的影响。", "ex_en": "What is the implication of this decision?", "ex_zh": "这个决定意味着什么？", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0713", "unit": "Unit 13"}, {"word": "increase", "pron": "ˈɪŋkriːs", "part_of_speech": "n.", "pos": "n.", "def_en": "a rise in amount or number", "def_zh": "增长；增加", "quote_en": "There has been a sharp increase in the number of online shoppers.", "quote_zh": "网购者的数量急剧增加。", "ex_en": "I got an increase in my pocket money.", "ex_zh": "我的零花钱增加了。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0714", "unit": "Unit 13"}, {"word": "influence", "pron": "ˈɪnfluəns", "part_of_speech": "n.", "pos": "n.", "def_en": "the power to affect people or things", "def_zh": "影响；影响力", "quote_en": "Social media has a strong influence on teenagers.", "quote_zh": "社交媒体对青少年有很强的影响力。", "ex_en": "My teacher had a great influence on me.", "ex_zh": "我的老师对我影响很大。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0715", "unit": "Unit 13"}, {"word": "industry", "pron": "ˈɪndəstri", "part_of_speech": "n.", "pos": "n.", "def_en": "the production of goods; a type of business", "def_zh": "工业；行业", "quote_en": "The tourism industry has grown rapidly in recent years.", "quote_zh": "近年来旅游业迅速发展。", "ex_en": "My dad works in the car industry.", "ex_zh": "我爸爸在汽车行业工作。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0716", "unit": "Unit 13"}, {"word": "isolation", "pron": "ˌaɪsəˈleɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the state of being alone or separate", "def_zh": "孤立；隔离", "quote_en": "Isolation can lead to loneliness among the elderly.", "quote_zh": "孤立可能导致老年人感到孤独。", "ex_en": "I felt a sense of isolation in my first week abroad.", "ex_zh": "我在国外的第一周感到很孤立。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0717", "unit": "Unit 13"}, {"word": "joint venture", "pron": "ˌdʒɔɪnt ˈventʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "a business project in which two or more companies work together", "def_zh": "合资企业", "quote_en": "The two firms formed a joint venture to build solar farms.", "quote_zh": "这两家公司成立了合资企业来建设太阳能发电场。", "ex_en": "My uncle's company is in a joint venture with a Japanese firm.", "ex_zh": "我叔叔的公司与一家日本公司成立了合资企业。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0718", "unit": "Unit 13"}, {"word": "market", "pron": "ˈmɑːkɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "the business of buying and selling; a place where goods are sold", "def_zh": "市场", "quote_en": "The market for electric cars is growing rapidly.", "quote_zh": "电动汽车市场正在迅速增长。", "ex_en": "We buy fresh vegetables at the local market.", "ex_zh": "我们在当地市场买新鲜蔬菜。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0719", "unit": "Unit 13"}, {"word": "modernisation", "pron": "ˌmɒdənaɪˈzeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the process of making something more modern", "def_zh": "现代化", "quote_en": "Rapid modernisation has changed life in rural areas.", "quote_zh": "快速的现代化改变了农村地区的生活。", "ex_en": "The modernisation of our school took a year.", "ex_zh": "我们学校的现代化改造用了一年。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0720", "unit": "Unit 13"}, {"word": "monopoly", "pron": "məˈnɒpəli", "part_of_speech": "n.", "pos": "n.", "def_en": "complete control of a product or service by one company", "def_zh": "垄断", "quote_en": "The company has a monopoly in the telecommunications market.", "quote_zh": "这家公司在电信市场上占据垄断地位。", "ex_en": "One firm has a monopoly on water in this region.", "ex_zh": "一家公司垄断了这个地区的供水。", "chapter": "Unit 13 · The Modern World
