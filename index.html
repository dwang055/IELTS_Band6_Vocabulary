const REVIEWS = {"Unit 1": [{"id": "p1", "genre": "Personal essay", "genre_zh": "个人随笔", "title": "Two Brothers, One Roof", "title_zh": "同一屋檐下的两兄弟", "lines": [[null, "My childhood was a happy one, thanks to a stable upbringing in a close-knit neighbourhood.", "我的童年很幸福，这要归功于在一个邻里亲密的社区里度过的稳定成长环境。"], [null, "Every Sunday our extended family came together for a family gathering at my grandmother's house.", "每个星期天，我们的大家庭都会在外婆家聚会。"], [null, "My mother, a single parent for a few years, had a strong maternal instinct, and she always knew when something was wrong.", "我母亲有几年是单亲家长，她有很强的母性本能，总能察觉到哪里不对劲。"], [null, "Yet I also had a rival at home: my sibling, who was only eleven months younger.", "可是我在家里也有一个对手：我的弟弟，他只比我小十一个月。"], [null, "Our sibling rivalry was fierce, and every game ended in a loud conflict.", "我们的手足之争非常激烈，每场游戏都以一场大吵收场。"], [null, "During my adolescence, we argued about everything, but there was always a deeper bond between us.", "在我的青春期，我们什么都吵，但我们之间始终有一种更深的联结。"], [null, "Looking back, I see that our ties never really broke, even when our relationship felt as if it might break down.", "回头看，我发现我们之间的纽带从未真正断裂，即使我们的关系看起来快要破裂的时候。"], [null, "Now that I have entered adulthood, my brother is one of my close friends, and our friendship feels natural.", "如今我已步入成年，弟弟是我亲密的朋友之一，我们的友情自然而然。"], [null, "We look very different, but we have something in common: we share a brotherhood that nothing can replace.", "我们长得很不一样，但有一个共同点：我们拥有任何东西都无法取代的兄弟情谊。"], [null, "Soon he will experience fatherhood himself, and I will happily play a role in raising his child.", "不久他将亲身体验为人父的滋味，而我会很乐意在抚养他孩子的过程中出一份力。"], [null, "When I think about motherhood, I understand how hard it must have been for her to endure long nights at work and still nurture us.", "每当想到母亲的身份，我就明白她当时一定很不容易：夜里长时间工作，还要继续养育我们。"], [null, "Family life can be tiring, but it is also deeply rewarding.", "家庭生活可能令人疲惫，但也深深地令人感到值得。"]]}, {"id": "p2", "genre": "Magazine feature", "genre_zh": "杂志特写", "title": "A Teenager Joins the Family", "title_zh": "一个少年加入家庭", "lines": [[null, "When the Clarks decided to adopt a teenager, they knew the family would have to accommodate a new personality.", "克拉克一家决定收养一名少年时，就知道全家必须接纳一个新的性格。"], [null, "\"We wanted to establish a routine early,\" said Mrs Clark, \"so that everyone could feel secure.\"", "“我们想早点建立一套日常作息，”克拉克太太说，“这样每个人都能有安全感。”"], [null, "The immediate family now includes three children, and each of them is learning to interact with the others in a new way.", "现在直系亲属包括三个孩子，每个孩子都在学习以新的方式与其他人相处。"], [null, "Experts say that daily interaction at the dinner table can help children develop confidence and trust.", "专家说，每天在餐桌上的互动可以帮助孩子培养自信和信任。"], [null, "The new arrival has a calm temperament, while the youngest child is lively and loud.", "新来的孩子性情平和，而最小的孩子则活泼好动、吵吵闹闹。"], [null, "Neighbours have noticed a striking resemblance between the two boys, although they are not related by blood.", "邻居们注意到这两个男孩长得惊人地相似，尽管他们并没有血缘关系。"], [null, "Children may inherit their parents' eyes or height, but not their values.", "孩子可能继承父母的眼睛或身高，但继承不了他们的价值观。"], [null, "Character is shaped by experience, and a child's nature is formed in the home as well as in the genes.", "性格是由经历塑造的，孩子的天性既来自基因，也在家庭中形成。"], [null, "Parental support matters most: a teenager needs to know that someone will always be there.", "父母的支持最重要：少年需要知道总有人会陪在身边。"], [null, "A social worker explained that the relation between a parent and an adopted child takes patience, and that a strong connection grows slowly.", "一位社工解释说，父母与被收养孩子之间的关系需要耐心，牢固的联结是慢慢建立起来的。"], [null, "\"It is not always easy,\" admitted Mr Clark, \"but we have learned to relate to each other with honesty.\"", "“这并不总是容易的，”克拉克先生承认，“但我们已学会诚实地彼此相处。”"], [null, "A distant relative even sent a card to welcome the new boy, which made the whole family smile.", "一位远房亲戚甚至寄来卡片欢迎这个新来的男孩，全家人都笑了。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Planning the Reunion", "title_zh": "筹备家庭团聚", "lines": [["A", "Maya, are you helping with the family reunion this year?", "玛雅，你今年会帮忙筹备家庭团聚吗？"], ["B", "Yes! I want to take an active role in the planning.", "会的！我想在筹备工作中发挥积极作用。"], ["A", "Good. Last year my maternal grandparents were not happy about the food.", "太好了。去年我外祖父母对饭菜不太满意。"], ["B", "Ha! My father always said that a close family needs good food and good conversation.", "哈！我爸爸总说，亲密的一家人需要美食和好的交谈。"], ["A", "I feel lucky, honestly. Most of my friends do not have such a stable home.", "老实说，我觉得自己很幸运。我大多数朋友都没有这么稳定的家。"], ["B", "My upbringing was very different from yours, but I never felt alone.", "我的成长环境和你的很不一样，但我从不觉得孤单。"], ["A", "That is what a family should give you, I think.", "我觉得这正是家庭应该给你的。"], ["B", "Exactly. Now, shall we send out the invitations tonight?", "没错。那么，我们今晚就把请柬发出去好吗？"]]}], "Unit 2": [{"id": "p1", "genre": "Parenting blog", "genre_zh": "育儿博客", "title": "From Infant to Toddler", "title_zh": "从婴儿到学步儿", "lines": [[null, "During infancy, an infant develops at an astonishing rate.", "在婴儿期，婴儿的发育速度惊人。"], [null, "Every milestone, from the first smile to the first step, marks a new stage of growth.", "从第一次微笑到第一步，每一个里程碑都标志着成长的一个新阶段。"], [null, "By the time a child becomes a toddler, he or she can already imitate adults and use a simple gesture to ask for something.", "孩子成为学步儿时，已经能模仿大人，并用简单的手势来表达需求。"], [null, "This is the period when a child begins to acquire language, and parents should bear in mind that every child learns at a different pace.", "这是孩子开始习得语言的时期，家长应记住每个孩子的学习节奏各不相同。"], [null, "A toddler can be clumsy, falling over every few minutes, but this is a normal phase.", "学步儿可能笨手笨脚，每隔几分钟就摔一跤，但这是正常的阶段。"], [null, "Some toddlers throw a tantrum when they cannot get what they want, and a patient parent will wait for the storm to pass.", "有些学步儿得不到想要的东西就会发脾气，而有耐心的家长会等风暴过去。"], [null, "Experts say that a healthy memory begins to form very early, and that a reminder such as a song can help a young child remember daily routines.", "专家说，健康的记忆很早就开始形成，一首歌之类的提示能帮助幼儿记住日常作息。"], [null, "Fond memories of this time will stay with you long after your child's height has doubled.", "即使孩子的身高翻了一倍，这段时光的美好回忆仍会长久留在你心中。"], [null, "Parents typically feel proud when their child is able to master a new skill.", "当孩子掌握一项新技能时，父母通常会感到自豪。"], [null, "Over time, the child will grow into an independent person.", "随着时间推移，孩子会成长为一个独立的人。"], [null, "Reading about child development can put your mind at ease.", "阅读有关儿童发展的内容能让你安心。"], [null, "Knowledge is a comfort, and it helps to remember to enjoy these years, because they pass quickly.", "知识能带来安慰，也别忘了享受这些年，因为它们过得很快。"], [null, "Whenever you feel tired, remind yourself that every parent has been there.", "每当你觉得疲惫时，提醒自己每位家长都经历过这些。"]]}, {"id": "p2", "genre": "Magazine feature", "genre_zh": "杂志特写", "title": "The Teenage Brain", "title_zh": "少年的大脑", "lines": [[null, "The move from childhood to adolescence is a significant transition for both the body and the brain.", "从童年到青春期的转变，对身体和大脑来说都是一次重大的过渡。"], [null, "An adolescent is no longer a child, but not yet fully-grown either.", "青少年不再是孩子，却也还没有完全长成。"], [null, "Cognitive ability improves quickly in these years, and teenagers become able to understand abstract ideas such as justice or freedom.", "这些年里认知能力迅速提高，青少年能够理解正义或自由这样的抽象概念。"], [null, "They also begin to grasp the concept of cause and effect, so they can foresee the consequence of an action.", "他们也开始理解因果的概念，因此能预见一个行为的后果。"], [null, "Yet maturity does not arrive overnight.", "然而成熟并非一夜之间到来。"], [null, "A teenager can still be immature and irresponsible, forgetting homework or ignoring curfews.", "少年仍可能不成熟、不负责任，忘记做作业或无视宵禁。"], [null, "Some become rebellious and challenge every rule at home, which is a normal part of growing up.", "有些人变得叛逆，质疑家里的每一条规矩，这是成长中的正常现象。"], [null, "Their behaviour is strongly shaped by peers, so the approval of friends often matters more than advice from parents.", "他们的行为深受同龄人影响，因此朋友的认可往往比父母的建议更重要。"], [null, "Good social skills, such as listening and sharing, help them make friends.", "良好的社交技能，如倾听与分享，能帮助他们交朋友。"], [null, "Their imagination is also at its most active, and many teenagers can visualise a future career in great detail.", "他们的想象力也最为活跃，许多少年能把未来的职业想象得十分具体。"], [null, "Adults should be tolerant and try to keep an open mind when a teenager's views seem strange.", "成年人应当宽容，当少年的看法显得奇怪时，要尽量保持开放的心态。"], [null, "After all, young people who feel understood will mature faster.", "毕竟，感到被理解的年轻人会更快成熟。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Remember When?", "title_zh": "还记得吗？", "lines": [["A", "Do you ever look back at your school days?", "你有没有回顾过自己的学生时代？"], ["B", "All the time. Last night I started to reminisce about our first day at primary school.", "经常。昨晚我开始回忆我们上小学的第一天。"], ["A", "Ha! I remember I was so nervous that my mind went blank when the teacher asked my name.", "哈！我记得当时我紧张得脑子一片空白，老师问我名字时我答不上来。"], ["B", "I once forgot to bring my lunch, because it slipped my mind.", "我有一次忘了带午饭，因为我完全忘了这件事。"], ["A", "You look worried today. Do you have something on your mind?", "你今天看起来有点担心。你有什么心事吗？"], ["B", "Yes. I have something in mind that I want to do after graduation: travel for a year.", "是的。我毕业后有个打算：旅行一年。"], ["A", "That sounds wonderful. Travelling can broaden the mind more than any textbook.", "听起来太棒了。旅行比任何课本都更能开阔眼界。"], ["B", "I hope so. A simple gesture like a smile can open doors anywhere in the world.", "我希望如此。一个微笑这样简单的手势，就能在世界各地为你打开大门。"], ["A", "And you will mature a lot on the way.", "而且你会在路上成熟许多。"], ["B", "Exactly. Now, shall we go and have lunch?", "没错。那么，我们去吃午饭吧？"]]}], "Unit 3": [{"id": "p1", "genre": "Health article", "genre_zh": "健康文章", "title": "Eat Well, Live Well", "title_zh": "吃得好，活得好", "lines": [[null, "A healthy diet gives your body every nutrient it needs, and good nutrition is the first step towards better health.", "健康的饮食能给身体提供所需的每一种营养物质，良好的营养是通往更好健康的第一步。"], [null, "A dietician will usually recommend a wide variety of foods and sensible portion sizes.", "营养师通常会建议食物多样化，并控制合理的分量。"], [null, "Check the ingredients on the label, because some foods contain a lot of fat and sugar.", "查看标签上的成分，因为有些食物含有大量脂肪和糖。"], [null, "A single serving of fast food can exceed your daily intake of salt.", "一份快餐就可能超过你每天的盐摄入量。"], [null, "Eating too much junk food can lead to obesity, and an obese person has a higher risk of disease.", "吃太多垃圾食品会导致肥胖，而肥胖的人患病风险更高。"], [null, "Being overweight puts stress on the heart, and extra weight can raise the chance of a heart attack or a stroke.", "超重会给心脏带来压力，多余的体重会增加心脏病发作或中风的几率。"], [null, "To avoid problems, try not to overeat, and do not skip breakfast.", "为避免问题，尽量不要暴饮暴食，也不要不吃早餐。"], [null, "Sometimes cravings appear when you are bored, so find a way to curb them, such as drinking water.", "无聊时有时会出现食欲冲动，所以要想办法抑制，比如喝水。"], [null, "A good appetite is a healthy sign, but eat moderate amounts.", "食欲好是健康的表现，但要适量进食。"], [null, "Regular meals help to maintain a stable weight.", "规律的饮食有助于保持稳定的体重。"], [null, "Drinking too much sugary juice is harmful, so reduce it.", "喝太多含糖果汁是有害的，所以要减少。"], [null, "The benefit of eating well is that you will have more energy, and a diet rich in fibre can help to prevent many illnesses.", "吃得好的好处是你会更有精力，富含纤维的饮食还有助于预防许多疾病。"], [null, "In the long run, healthy habits are a valuable asset.", "从长远来看，健康的习惯是一笔宝贵的财富。"]]}, {"id": "p2", "genre": "News report", "genre_zh": "新闻报道", "title": "Rise in Chronic Illness", "title_zh": "慢性疾病上升", "lines": [[null, "Doctors report a rise in chronic conditions, and the onset of symptoms often begins in middle age.", "医生报告慢性病有所增加，症状通常在中年开始出现。"], [null, "A correct diagnosis is essential, because early treatment can often cure a disease.", "正确的诊断至关重要，因为早期治疗往往可以治愈疾病。"], [null, "An infection can spread quickly, and an infectious illness such as flu can make an entire school sick.", "感染可能迅速扩散，像流感这样的传染病能让整所学校的人都病倒。"], [null, "An acute illness appears suddenly, while a persistent cough that lasts for weeks needs a check-up.", "急性疾病来得突然，而持续数周的咳嗽则需要检查。"], [null, "Many patients suffer from anxiety or depression as well as physical illness.", "许多患者除了身体疾病外，还受焦虑或抑郁困扰。"], [null, "Insomnia is common, and a poor night's sleep can disrupt the whole day.", "失眠很常见，一夜睡不好会扰乱一整天。"], [null, "Therapy, such as talking to a counsellor, can help to diminish worry.", "心理治疗，例如与咨询师交谈，有助于减轻忧虑。"], [null, "For some people, certain foods trigger an allergy, and an allergic reaction can range from a mild rash to something life-threatening.", "对某些人来说，某些食物会引发过敏，过敏反应可能从轻微皮疹到危及生命。"], [null, "Doctors advise that anyone with an eating disorder should seek help early.", "医生建议任何有饮食失调问题的人尽早寻求帮助。"], [null, "Hospitals try to eliminate the spread of germs and counteract the effect of resistant bacteria.", "医院努力消除细菌的传播，并抵消耐药细菌的影响。"], [null, "Too much fat can block an artery and slow the flow of blood.", "过多的脂肪会堵塞动脉，减缓血液流动。"], [null, "A factor such as age or family history can increase a patient's risk.", "年龄或家族史等因素会增加患者的风险。"], [null, "\"Most patients recover fully, but some need long-term care,\" a spokesman said.", "一位发言人说：“大多数患者完全康复，但有些人需要长期护理。”"], [null, "Regular exercise is vital for everyone.", "规律运动对每个人都至关重要。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "After Dinner at the Gym", "title_zh": "晚饭后去健身房", "lines": [["A", "Let's go for a brisk walk after dinner.", "晚饭后我们去快步走一走吧。"], ["B", "Good idea. I want to build muscle, but I don't want to overdo it.", "好主意。我想增肌，但我不想练得过度。"], ["A", "Right. Too much training can do more harm than good.", "对。训练过度弊大于利。"], ["B", "I alternate between cardio and weights, so my body can rest.", "我有氧和器械交替练，这样身体可以休息。"], ["A", "A short walk in the morning can also stimulate the mind.", "早晨短暂散步也能激发头脑。"], ["B", "True. By the way, how was your doctor's visit?", "没错。对了，你看医生的结果怎么样？"], ["A", "Fine. I'm going to get plenty of sleep tonight.", "没事。我今晚要好好睡一觉。"]]}], "Unit 4": [{"id": "p1", "genre": "Personal essay", "genre_zh": "个人随笔", "title": "A Balanced Life", "title_zh": "平衡的生活", "lines": [[null, "People from all walks of life want to lead a happy life, but each person has a different way of life.", "各行各业的人都想过上幸福的生活，但每个人的生活方式各不相同。"], [null, "For me, the key is balance between work and leisure.", "对我来说，关键是工作与休闲之间的平衡。"], [null, "My daily routine starts with a run, an outdoor activity that wakes me up.", "我的日常从跑步开始，这项户外活动能让我清醒。"], [null, "I used to feel bored and dissatisfied at work, and I was confused about what I really wanted.", "我以前对工作感到无聊、不满，也搞不清自己真正想要什么。"], [null, "A good friend gave me an insight: I had no hobby, and my lifestyle left no room for fun.", "一位好友让我有了领悟：我没有爱好，我的生活方式里没有留给娱乐的空间。"], [null, "Now I try to stay active and take part in a weekly football match, a recreational sport rather than a competition.", "现在我努力保持活跃，每周参加一场足球赛，那是一项休闲运动，而不是竞赛。"], [null, "The sport helps to satisfy my need to relax, and I always enjoy the company.", "这项运动有助于满足我放松的需要，而且我总是很享受那份陪伴。"], [null, "I also try to keep a positive outlook, and I avoid a negative attitude.", "我也努力保持积极的人生观，避免消极的态度。"], [null, "I am an optimist, though my brother is a pessimist and my sister is a realist.", "我是个乐观主义者，不过我哥哥是悲观主义者，我姐姐是现实主义者。"], [null, "Having a hobby can improve my mood, and creativity is a kind of self-expression that helps me express what I feel.", "有个爱好能改善我的心情，而创造力是一种自我表达，帮我表达自己的感受。"], [null, "In every aspect of life, I try to set a goal and work towards it.", "在生活的每个方面，我都努力设定一个目标并朝它前进。"], [null, "Each goal gives me a sense of fulfillment.", "每个目标都带给我一种成就感。"]]}, {"id": "p2", "genre": "Interview", "genre_zh": "人物访谈", "title": "The Risk-Taker", "title_zh": "敢于冒险的人", "lines": [[null, "Anna, 29, wanted to choose a risky career, and she is a natural risk-taker.", "29岁的安娜想选择一份有风险的职业，她天生就是个敢冒险的人。"], [null, "\"I had to make a decision: stay safe, or live life on the edge,\" she says.", "“我必须做出决定：求稳，还是活在刀刃上，”她说。"], [null, "\"A job in an office did not appeal to me.\"", "“办公室的工作对我没有吸引力。”"], [null, "\"The cost of living is high, and my living expenses were rising, but I wanted to make a living doing something I loved.\"", "“生活成本很高，我的日常开销也在上涨，但我想靠做自己热爱的事来谋生。”"], [null, "\"I am happy to work hard for a living, but I also wanted to achieve something.\"", "“我很乐意辛苦工作谋生，但我也想有所成就。”"], [null, "Her lifelong ambition is to open a bakery, and she knew it was a once in a lifetime opportunity when the shop became available.", "她毕生的志向是开一家面包店，当这家店铺空出来时，她知道这是千载难逢的机会。"], [null, "\"I did not want to miss an opportunity like that,\" she says.", "“我不想错过这样的机会，”她说。"], [null, "Her personality is warm, and she hopes the shop will attract many customers.", "她性格热情，希望这家店能吸引许多顾客。"], [null, "Business is intense, and the pressure is high. \"Friends put pressure on me to be careful with money,\" she admits.", "生意竞争激烈，压力很大。“朋友们给我施压，要我对钱谨慎一点，”她承认。"], [null, "\"I had to make a choice, and I do not regret it.\"", "“我必须做出选择，而我并不后悔。”"], [null, "\"My standard of living is lower than before, but I am successful in the way that matters.\"", "“我的生活水平比以前低，但我在重要的方面是成功的。”"], [null, "\"Being materialistic is not for me. Money cannot motivate me as much as my work does.\"", "“追求物质不适合我。金钱对我的激励不如工作本身。”"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Sports Day", "title_zh": "运动会", "lines": [["A", "Are you going to participate in the school's sports day?", "你会参加学校的运动会吗？"], ["B", "Of course. I want to live life to the full.", "当然。我想充实地度过每一天。"], ["A", "Good. We should fulfil our dreams while we are young.", "好。趁年轻，我们应该去实现自己的梦想。"], ["B", "A hobby has to meet a need, like relaxation or friendship.", "爱好必须满足某种需要，比如放松或友谊。"], ["A", "My teacher says my main priority should be study.", "我老师说我的首要任务应该是学习。"], ["B", "Study is important, but the desire to have fun is natural too.", "学习很重要，但想要玩乐的愿望也很自然。"], ["A", "I felt real disappointment when I lost the match last year.", "去年输掉比赛时我真的很失望。"], ["B", "That is all part of experience. You will learn from it.", "这都是经历的一部分。你会从中学到东西的。"]]}], "Unit 5": [{"id": "p1", "genre": "Personal essay", "genre_zh": "个人随笔", "title": "A Student's Journey", "title_zh": "求学之路", "lines": [[null, "My education began at a nursery, followed by kindergarten, where I learned to share and sing.", "我的教育始于托儿所，接着是幼儿园，在那里我学会了分享和唱歌。"], [null, "At primary school, I enjoyed every lesson, and at junior school the curriculum became more challenging.", "在小学，我喜欢每一堂课；到了初级中学，课程变得更具挑战性。"], [null, "My secondary school was mixed, but my sister attended a single-sex school across town.", "我的中学是男女同校，而我姐姐上的是城另一头的单性别学校。"], [null, "By my senior year at high school, I had become a studious student who spent hours in the library.", "到了高中最后一年，我已成为一个勤奋好学的学生，在图书馆一待就是几个小时。"], [null, "The syllabus listed every topic for the exam, so I made a plan for my homework and each assignment.", "教学大纲列出了考试的每个主题，于是我为作业和每项任务制定了计划。"], [null, "A kind tutor helped me with maths, and I managed to improve my grade.", "一位热心的辅导老师帮我学数学，我的成绩因此提高了。"], [null, "A classmate with a learning disorder taught me patience.", "一位有学习障碍的同学教会了我耐心。"], [null, "I will leave for college next year, and I hope to attend university afterwards.", "我明年将去上学院，之后希望进入大学。"]]}, {"id": "p2", "genre": "Study guide", "genre_zh": "学习指南", "title": "Surviving University Research", "title_zh": "大学科研生存指南", "lines": [[null, "A postgraduate student usually studies for a Master's degree or a PhD.", "研究生通常攻读硕士学位或博士学位。"], [null, "A Master's student writes a dissertation, while a PhD student writes a thesis.", "硕士生写学位论文，而博士生写博士论文。"], [null, "Academic research is the heart of the university, and each project explores one field.", "学术研究是大学的核心，每个项目探索一个领域。"], [null, "Before you start, define the scope of your study and be clear about its limits.", "开始之前，要界定研究的范围，并明确它的局限。"], [null, "Use reliable resources and check your sources carefully.", "使用可靠的资源，并仔细核查你的资料来源。"], [null, "You should conduct experiments carefully, then analyse the findings and results.", "你应认真开展实验，然后分析研究发现和结果。"], [null, "Every researcher must review earlier work and consider a different theory.", "每位研究者都必须回顾前人的工作，并考虑不同的理论。"], [null, "A heated controversy can arise when findings contradict accepted ideas.", "当研究发现与公认的观点相矛盾时，可能引发激烈的争议。"], [null, "Funding is limited, but you might receive a grant or a scholarship if you are eligible.", "经费有限，但如果你符合资格，也许能获得一笔补助金或奖学金。"], [null, "The lecturer will explain which program suits you best.", "讲师会解释哪个课程最适合你。"], [null, "Choose a topic that is relevant to your future career, perhaps something work-related.", "选一个与你未来职业相关的题目，也许是与工作有关的内容。"], [null, "It is relatively easy to start, but harder to finish.", "开始相对容易，完成则较难。"], [null, "Many students struggle to organise their time, so learn to concentrate and find out how to overcome distractions.", "许多学生难以安排好时间，所以要学会专心，并想办法克服干扰。"], [null, "Once you graduate, you can take a course in teaching, and before graduation you should ask for advice.", "毕业之后你可以修一门教学课程，而在毕业前你应该寻求建议。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Exam Week", "title_zh": "考试周", "lines": [["A", "I need to revise for the exam, but I have one more task to finish.", "我得为考试复习，不过还有一项任务要完成。"], ["B", "Which task is that?", "是哪项任务？"], ["A", "A short presentation about the library project.", "一个关于图书馆项目的简短演讲。"], ["B", "Take a break first. A fresh mind helps you review everything.", "先休息一下。头脑清醒有助于你复习所有内容。"], ["A", "You are right. I will start again after lunch.", "你说得对。我午饭后重新开始。"]]}], "Unit 6": [{"id": "p1", "genre": "Essay", "genre_zh": "短文", "title": "Learning a Language", "title_zh": "学习一门语言", "lines": [[null, "Your mother tongue is the first language you learn, and a native speaker uses it without effort.", "母语是你最先学会的语言，母语使用者毫不费力地使用它。"], [null, "For a learner, a language barrier can feel like a wall.", "对学习者来说，语言障碍可能像一堵墙。"], [null, "Building your vocabulary is the first step, and correct pronunciation makes you easier to understand.", "积累词汇是第一步，正确的发音会让别人更容易听懂你。"], [null, "Some learners focus on accuracy, while others value fluency, and good learners try to balance both.", "有些学习者注重准确，另一些人重视流利，而优秀的学习者会努力兼顾两者。"], [null, "A little hesitation is natural, so do not be afraid of silence.", "稍有迟疑是很自然的，所以不要害怕沉默。"], [null, "Every region has its own dialect, and sign language is a rich language of its own.", "每个地区都有自己的方言，而手语本身就是一种丰富的语言。"], [null, "Speech is only one means of communication, and good communication also depends on listening.", "说话只是交流的一种方式，良好的沟通也取决于倾听。"], [null, "A linguist who studies linguistics will tell you that no language is better than another.", "研究语言学的语言学家会告诉你，没有哪种语言比另一种更好。"], [null, "When you cannot pronounce a word, try again slowly, and if you stutter, take a breath.", "当你发不出某个词时，慢慢再试一次；如果你口吃，就深呼吸一下。"], [null, "Learn to communicate your ideas simply, and to comprehend what others say.", "学会简单地表达自己的想法，并理解别人所说的话。"], [null, "When you translate, do not rely on conjecture, but check a dictionary.", "翻译时不要靠猜测，而要查词典。"]]}, {"id": "p2", "genre": "Lecture notes", "genre_zh": "讲座笔记", "title": "Speaking Skills Seminar", "title_zh": "口语技巧研讨会", "lines": [[null, "The speaker will define the term \"register\" and demonstrate how it changes.", "演讲者将界定“语体”这个术语，并演示它如何变化。"], [null, "Language is not fixed; it continues to evolve as new words emerge.", "语言不是一成不变的，随着新词出现，它不断演变。"], [null, "Please distinguish between formal and informal speech, and state which suits each situation.", "请区分正式与非正式的说话方式，并说明各自适合哪种场合。"], [null, "A sophisticated speaker can explain a complex idea simply and illustrate it with a story.", "老练的演讲者能把复杂的想法解释得简单，并用故事加以说明。"], [null, "A spontaneous reply may sound natural, but an incoherent one confuses the listener.", "即兴的回答可能听起来自然，但语无伦次的回答会让听众困惑。"], [null, "A pause may indicate that the speaker is thinking, and a smile might signify friendliness.", "停顿可能表明说话者在思考，微笑则可能表示友好。"], [null, "Silence can imply disagreement, so ask a question to clarify the meaning and confirm it.", "沉默可能暗示不同意，所以要提问来澄清含义并加以确认。"], [null, "Learners often converse with classmates to practise, and they refer to notes when they are stuck.", "学习者常和同学交谈来练习，卡住时就查阅笔记。"], [null, "A good speaker will recall key points and suggest next steps.", "优秀的演讲者会回顾要点，并提出后续步骤。"], [null, "To conclude, every listener has an inherent right to understand.", "总之，每位听众都有与生俱来的理解权利。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Planning a Trip", "title_zh": "计划旅行", "lines": [["A", "Everyone should have a say in how we plan the trip.", "我们怎么计划这次旅行，每个人都应该有发言权。"], ["B", "Agreed. Having said that, we have a small budget.", "同意。话虽如此，我们的预算不多。"], ["A", "Needless to say, we cannot afford a hotel by the sea.", "不用说，我们住不起海边的酒店。"], ["B", "That is to say, we should find a cheap hostel.", "也就是说，我们得找一家便宜的青年旅舍。"], ["A", "There is something to be said for camping, too.", "露营也有它的好处。"], ["B", "Camping in winter is cold, to say the least.", "冬天露营冷得很，这么说还算客气了。"], ["A", "Well, when all is said and done, any trip is better than none.", "嗯，说到底，有旅行总比没有强。"], ["B", "You can say that again!", "你说得太对了！"]]}], "Unit 7": [{"id": "p1", "genre": "Travel blog", "genre_zh": "旅行博客", "title": "A Week on the Coast", "title_zh": "海边一周", "lines": [[null, "We planned a week-long trip to a coastal village, and our first task was to book accommodation.", "我们计划了一次为期一周的海滨小村之旅，第一件事就是预订住宿。"], [null, "Our itinerary was flexible, so we could change plans if the weather turned rough.", "我们的行程很灵活，如果天气变坏就可以改变计划。"], [null, "The journey took five hours, and my luggage was heavier than I expected.", "旅程花了五个小时，我的行李比预想的重。"], [null, "Our destination was a picturesque, quaint place with narrow streets and old stone houses.", "我们的目的地是一个风景如画、古色古香的地方，有狭窄的街道和古老的石屋。"], [null, "The scenic coastline was stunning, and the view from the hill was breathtaking.", "风景优美的海岸线令人惊艳，山上的景色更是美得让人屏息。"], [null, "We stayed on a budget, but the local people were warm, and every inhabitant seemed to know each other.", "我们预算有限，但当地人很热情，每位居民似乎都彼此认识。"], [null, "The beach was peaceful and unspoilt, far from the polluted city.", "海滩宁静而未经破坏，远离污染严重的城市。"], [null, "The only attraction was an old lighthouse, but we loved it.", "唯一的景点是一座旧灯塔，但我们很喜欢。"], [null, "We took a walk in the countryside, which was green and rural.", "我们在乡间散步，那里绿意盎然，充满田园气息。"], [null, "Public transport was limited, so we hired bikes, and I like to travel light.", "公共交通有限，所以我们租了自行车，而且我喜欢轻装出行。"], [null, "We love travelling this way.", "我们喜欢这样旅行。"], [null, "Facilities at the guesthouse were basic, but we had everything we needed.", "民宿的设施很简单，但我们需要的一切都有。"], [null, "A luxurious hotel would have been out of reach, but we felt like adventurous explorers.", "豪华酒店会是我们负担不起的，但我们感觉自己像爱冒险的探险家。"]]}, {"id": "p2", "genre": "News report", "genre_zh": "新闻报道", "title": "Tourism Boom in the Mountains", "title_zh": "山区旅游热", "lines": [[null, "Tourism is growing fast in this mountainous region, and each year more tourist groups arrive.", "这个多山地区的旅游业发展迅速，每年到访的游客团越来越多。"], [null, "Peak season runs from June to August, when the number of visitors can fluctuate dramatically.", "旺季从六月持续到八月，此时游客数量可能大幅波动。"], [null, "A remote village that once welcomed few visitors is now a popular choice.", "一个曾经鲜有游客的偏远村庄，如今成了热门选择。"], [null, "The trend towards eco-tourism is clear: visitors want to see unspoilt nature and respect the local community.", "生态旅游的趋势很明显：游客想看到未被破坏的自然，并尊重当地社区。"], [null, "Visitors must show identification at the park gate.", "游客必须在公园门口出示身份证件。"], [null, "The town has become cosmopolitan, with diverse restaurants serving food from many countries.", "这个小镇已变得国际化，各式餐厅供应来自许多国家的美食。"], [null, "Foreign tourists are often impressed by the traditional crafts of the area.", "外国游客常常对这一地区的传统手工艺印象深刻。"], [null, "Many urban families come to escape the noise of the city.", "许多城市家庭来这里躲避城市的噪音。"], [null, "Local officials worry about the effect of tourism on the landscape.", "当地官员担心旅游业对景观的影响。"], [null, "Too many cars can affect the air quality and harm the environment.", "过多的汽车会影响空气质量，危害环境。"], [null, "Some mountain trails are tough, so hikers should be prepared.", "有些山路很难走，所以徒步者应做好准备。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "At the Airport", "title_zh": "在机场", "lines": [["A", "Is this your only luggage?", "这就是你全部的行李吗？"], ["B", "Yes. I like to keep things simple when I travel.", "是的。我旅行时喜欢一切从简。"], ["A", "Where is your next destination?", "你的下一个目的地是哪里？"], ["B", "A quiet village in the mountains.", "山里的一个安静村庄。"], ["A", "That sounds peaceful. Enjoy your trip!", "听起来很宁静。祝你旅途愉快！"]]}], "Unit 8": [{"id": "p1", "genre": "Museum guide", "genre_zh": "博物馆导览", "title": "A Walk Through the Past", "title_zh": "穿越历史之旅", "lines": [[null, "Welcome to the museum, where we cover every age from prehistoric times to the present day.", "欢迎来到博物馆，我们涵盖了从史前时代到今天的每一个时代。"], [null, "The exhibits are arranged chronologically, and the timeline on the wall will help you follow them in chronological order.", "展品按时间顺序排列，墙上的时间线可以帮助你按先后顺序参观。"], [null, "In the Middle Ages, towns were small and life was hard.", "在中世纪，城镇很小，生活艰苦。"], [null, "This coin is from the fifth century, and the pottery next to it dates from an even earlier era.", "这枚硬币来自五世纪，旁边的陶器则来自更早的时代。"], [null, "The earliest tools in this case span nearly a million years.", "这个展柜里最早的工具跨越了近一百万年。"], [null, "Some objects predate written history, so an archaeologist must infer how they were used.", "有些物品早于文字记载的历史，所以考古学家必须推断它们的用途。"], [null, "Every excavation produces evidence, such as bones and tools.", "每次发掘都会产生证据，比如骨头和工具。"], [null, "Over the last decade, we have added three new rooms.", "在过去十年里，我们新增了三个展厅。"], [null, "Over a millennium, wind and rain can erode even the hardest stone.", "在一千年里，风雨甚至能侵蚀最坚硬的石头。"], [null, "A pioneer of photography took this historical image.", "这张历史影像由一位摄影先驱拍摄。"], [null, "Each generation leaves something behind.", "每一代人都会留下一些东西。"], [null, "Visitors who feel nostalgic about their grandparents' time often come to see the old kitchen.", "怀念祖辈时代的参观者常来看看那间旧厨房。"]]}, {"id": "p2", "genre": "Dialogue", "genre_zh": "对话", "title": "Late Again?", "title_zh": "又迟到了？", "lines": [["A", "Why did the bus take so long today?", "今天公交车怎么花了这么久？"], ["B", "Bad traffic. I do not want to be late again; I was late for two consecutive days.", "交通太糟。我不想再迟到了，我已经连着两天迟到了。"], ["A", "A punctual person always plans ahead.", "守时的人总是提前做好计划。"], ["B", "Previously, I lived near the station, so I always arrived on time.", "以前我住在车站附近，所以总能准时到。"], ["A", "Formerly, this road was a quiet street.", "这条路以前是一条安静的街道。"], ["B", "Anyway, the exam is imminent, and I have to get there in time.", "不管怎样，考试迫在眉睫，我得及时赶到。"], ["A", "Is the registration form time-consuming?", "登记表填起来很费时间吗？"], ["B", "A little. But a middle-aged man at the desk will help us.", "有一点。不过前台有位中年男士会帮我们。"]]}, {"id": "p3", "genre": "Diary entry", "genre_zh": "日记", "title": "A Day at the Library", "title_zh": "图书馆的一天", "lines": [[null, "Dear diary, I tend to lose track of time when I read about ancient Egypt.", "亲爱的日记，我一读到古埃及就容易忘了时间。"], [null, "Prior to this term, I never enjoyed history.", "在这个学期之前，我从不喜欢历史。"], [null, "Subsequently, my teacher lent me a book about a middle-aged explorer.", "后来，我的老师借给我一本关于一位中年探险家的书。"], [null, "I want to spend time on reading, but homework can take too much time.", "我想花时间读书，但作业可能占用太多时间。"], [null, "To save time, I now write my notes on my phone.", "为了节省时间，我现在用手机做笔记。"], [null, "I think it is the right time to start a history club.", "我觉得现在是成立历史社团的合适时机。"]]}], "Unit 9": [{"id": "p1", "genre": "Documentary narration", "genre_zh": "纪录片解说", "title": "Life in the Wild", "title_zh": "野外生活", "lines": [[null, "The animal kingdom is full of wonder, from the smallest insect to the largest predator.", "动物界充满奇迹，从最小的昆虫到最大的捕食者。"], [null, "A fox digs a burrow in the soil, and a bear sleeps in a den.", "狐狸在土里挖洞穴，熊则睡在兽穴里。"], [null, "In winter, some animals hibernate, and their prey hides too.", "冬天，有些动物冬眠，它们的猎物也会躲藏起来。"], [null, "Every species has a habitat where it feels at home.", "每个物种都有一个让它如在家中的栖息地。"], [null, "In a tropical forest, the vegetation is thick, and the climate is warm and wet.", "在热带森林里，植被茂密，气候温暖潮湿。"], [null, "A semi-arid region receives little rain, and in a truly arid desert, only specialist plants survive.", "半干旱地区降雨很少，而在真正干旱的沙漠里，只有特殊的植物能存活。"], [null, "Animals adapt to harsh places in surprising ways, and many can tolerate extreme heat.", "动物以惊人的方式适应严酷的环境，许多能忍受极端高温。"], [null, "Flora and fauna depend on each other, and the ecological balance is delicate.", "植物群和动物群相互依存，生态平衡十分脆弱。"], [null, "A scent in the air can warn a deer that danger is near.", "空气中的一缕气味就能警告鹿危险临近。"], [null, "Wild animals are very different from domesticated ones.", "野生动物与家养动物大不相同。"], [null, "A worm may seem small, but it improves the soil.", "蚯蚓看起来很小，却能改良土壤。"], [null, "Scientists who study ecology explain how each plant and animal is linked.", "研究生态学的科学家解释每种植物和动物是如何相互联系的。"], [null, "Evolution has shaped each creature over millions of years.", "进化在数百万年里塑造了每一种生物。"], [null, "Human nature is part of the natural world, and Mother Nature does not forgive our mistakes.", "人性是自然界的一部分，而大自然母亲不会原谅我们的错误。"], [null, "A native bird in New Zealand may be shy, but it is vulnerable to introduced animals.", "新西兰的一种本土鸟可能很怕生，但它容易受到外来动物的伤害。"], [null, "Protecting wildlife is a duty we all share.", "保护野生动物是我们共同的责任。"]]}, {"id": "p2", "genre": "News report", "genre_zh": "新闻报道", "title": "A Farmer's Struggle", "title_zh": "农民的艰难", "lines": [[null, "Agriculture is changing, and farmers now face a drier climate.", "农业正在变化，农民如今面对着更干燥的气候。"], [null, "Many farmers use pesticides to protect their crops, but a stubborn weed or a swarm of vermin keeps returning.", "许多农民使用杀虫剂保护庄稼，但顽固的杂草或成群的害虫总是卷土重来。"], [null, "Some insects have become resistant to chemicals.", "有些昆虫已对化学药剂产生了抗药性。"], [null, "Scientists have produced genetically modified plants that grow better in poor soil.", "科学家培育出了在贫瘠土壤中长势更好的转基因植物。"], [null, "Genetics is an exciting field, but the repercussions of changing a plant's genes are still unclear.", "遗传学是个令人兴奋的领域，但改变植物基因所带来的后果仍不明朗。"], [null, "A single drought can be catastrophic for a small farm, and a disastrous harvest can end a family's business.", "一场干旱对小农场可能是灾难性的，歉收的灾年可能让一个家庭的生意就此终结。"], [null, "A natural disaster such as a flood can destroy years of work.", "洪水之类的自然灾害可能毁掉多年的辛劳。"], [null, "Farmers must cultivate their land carefully and combat disease.", "农民必须精心耕作土地，并防治病害。"], [null, "The government wants to eradicate harmful pests.", "政府想根除有害的害虫。"], [null, "The decline in bee numbers is a worry.", "蜜蜂数量的下降令人担忧。"], [null, "Several species are now endangered, and one frog is already extinct.", "如今有几个物种濒危，有一种青蛙已经灭绝。"], [null, "The extinction of a species can upset the whole food chain.", "一个物种的灭绝可能扰乱整条食物链。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "A Walk in the Forest", "title_zh": "林间漫步", "lines": [["A", "Look at that bird! It is so colourful.", "看那只鸟！颜色真鲜艳。"], ["B", "I think it is a native species.", "我想它是本地物种。"], ["A", "How can you tell?", "你怎么看出来的？"], ["B", "My uncle works with wildlife, and he taught me a lot.", "我叔叔从事野生动物工作，他教了我很多。"], ["A", "Then let us stay quiet and listen.", "那我们安静地听一听吧。"]]}], "Unit 10": [{"id": "p1", "genre": "Science feature", "genre_zh": "科学特写", "title": "Journey to the Stars", "title_zh": "星际之旅", "lines": [[null, "Humans have always looked up at the moon and wondered about the cosmos.", "人类一直仰望月亮，对宇宙心怀好奇。"], [null, "Exploration of outer space began when the first rocket left Earth's atmosphere.", "当第一枚火箭离开地球大气层时，对外太空的探索就开始了。"], [null, "A powerful rocket must overcome gravity before it can launch a spacecraft into orbit.", "强大的火箭必须先克服重力，才能把航天器发射进轨道。"], [null, "An astronaut trains for years in a simulator to prepare for weightlessness.", "宇航员要在模拟器里训练多年，为失重状态做准备。"], [null, "Inside a space station, crew members float, and they must acclimatise to life without gravity.", "在空间站里，机组人员漂浮着，他们必须适应没有重力的生活。"], [null, "A space shuttle can carry a satellite and then return to Earth.", "航天飞机可以携带一颗卫星，然后返回地球。"], [null, "Our solar system has eight planets, and our galaxy contains billions of stars.", "我们的太阳系有八颗行星，我们的银河系包含数十亿颗恒星。"], [null, "Solar energy powers much of the equipment on board.", "太阳能为船上的大部分设备供电。"], [null, "The universe is vast, and the sun is only one star.", "宇宙浩瀚，太阳只是其中一颗恒星。"], [null, "A meteor burns up as it falls, but a large asteroid can leave a crater on the surface of a planet.", "流星在坠落时燃烧殆尽，但大的小行星会在行星表面留下陨石坑。"], [null, "Space debris is dangerous, and radiation is a serious risk.", "太空碎片很危险，辐射也是严重的风险。"], [null, "Jupiter is a giant ball of gas.", "木星是一个巨大的气体球。"], [null, "From a ship, an explorer sees the horizon curve.", "从飞船上，探险者能看到地平线弯曲。"], [null, "Most of Earth's surface is covered by ocean.", "地球表面的大部分被海洋覆盖。"]]}, {"id": "p2", "genre": "Magazine article", "genre_zh": "杂志文章", "title": "Could We Live on Mars?", "title_zh": "我们能在火星生活吗？", "lines": [[null, "Scientists want to colonise a distant planet, and an unmanned mission will go first.", "科学家想在遥远的星球上建立殖民地，而无人任务将率先出发。"], [null, "A lunar base would be easier to build, but it is less interesting.", "月球基地更容易建造，但没那么有趣。"], [null, "The atmosphere on Mars is toxic to humans, and the planet seems uninhabitable.", "火星的大气对人类有毒，这颗星球看起来无法居住。"], [null, "Conditions are extreme, and temperatures are very low.", "那里条件极端，气温很低。"], [null, "The planet's gravitational pull is weaker than ours.", "这颗行星的引力比地球的小。"], [null, "The laws of physics are universal, so the same equations work everywhere.", "物理定律是普适的，所以同样的方程到处适用。"], [null, "Commercial companies are now entering the race.", "商业公司现在也加入了竞赛。"], [null, "It is inevitable that humans will explore even farther.", "人类将探索得更远，这是不可避免的。"], [null, "Whether a colony can sustain life will depend on water and food.", "一个殖民地能否维持生命，取决于水和食物。"], [null, "Engineers will propel the ship with new engines, and it will rotate slowly to create artificial gravity.", "工程师将用新引擎推进飞船，飞船会缓慢旋转以制造人造重力。"], [null, "Astronauts will undergo months of tests, and computers will simulate the journey.", "宇航员将接受数月的测试，计算机会模拟整个旅程。"], [null, "Many people call the idea cosmic fiction, but a meteoric rise in funding has changed minds.", "许多人称这想法是宇宙科幻，但资金的迅猛增长改变了人们的看法。"], [null, "On the screen, a horizontal bar shows the ship's speed.", "屏幕上，一根水平条显示着飞船的速度。"], [null, "Earth is a terrestrial planet, while the outer planets are giants of gas and ice.", "地球是一颗类地行星，而外侧的行星是由气体和冰组成的巨人。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "A Night Under the Stars", "title_zh": "星空之夜", "lines": [["A", "Can you see that bright dot? It is a planet.", "你看到那个亮点了吗？那是一颗行星。"], ["B", "Wow. And that moving light must be a satellite.", "哇。那个移动的光点一定是颗卫星。"], ["A", "One day, I want to be an astronaut.", "总有一天，我想当宇航员。"], ["B", "Then you had better study hard.", "那你最好努力学习。"]]}], "Unit 11": [{"id": "p1", "genre": "Home blog", "genre_zh": "家居博客", "title": "Our Cottage Renovation", "title_zh": "我们的小屋翻新记", "lines": [[null, "We bought an old cottage built of brick and timber, and its condition was poor.", "我们买了一间用砖和木材建成的旧小屋，它的状况很差。"], [null, "The ceiling was low, and the rooms felt cramped and dark.", "天花板很低，房间显得局促而昏暗。"], [null, "Our plan was to renovate it, so we decided to demolish one wall and decorate the rest.", "我们的计划是翻新它，于是决定拆掉一堵墙，并装饰其余的部分。"], [null, "The old single-storey house is now a two-storey home with a curved staircase.", "这座旧的单层房子现在变成了带弧形楼梯的两层住宅。"], [null, "Upstairs, a small balcony gives us access to fresh air.", "楼上有个小阳台，让我们能呼吸到新鲜空气。"], [null, "The new rooms are spacious, airy and cosy at the same time.", "新房间宽敞、通风，同时又温馨舒适。"], [null, "We kept some old-fashioned details, such as an ornate fireplace.", "我们保留了一些老式的细节，比如一座华丽的壁炉。"], [null, "A typical house of this age is full of draughts, but ours is functional and warm.", "这个年代的典型房子到处漏风，但我们的既实用又暖和。"], [null, "The previous occupant had left the garden in a mess, and we had to reconstruct the fence.", "前一位住户把花园弄得一团糟，我们不得不重建篱笆。"], [null, "Soon we will occupy the new rooms, and the building will be our permanent residence.", "很快我们就将入住新房间，这栋建筑将成为我们的长久住所。"], [null, "Housing in this area is costly, so we are lucky to have found it.", "这个地区的住房很贵，所以我们能找到它很幸运。"], [null, "We hired a builder who could build the new wing fast.", "我们请了一位能快速建好新侧楼的建筑工人。"], [null, "We had to abandon our first idea of a glass roof, because it was not feasible.", "我们不得不放弃最初的玻璃屋顶设想，因为它不可行。"], [null, "In the end, we used concrete for the base.", "最后，我们用混凝土做了地基。"]]}, {"id": "p2", "genre": "Engineering news", "genre_zh": "工程新闻", "title": "The City of Tomorrow", "title_zh": "明日之城", "lines": [[null, "A skyscraper rises above the city, and this high-rise is a state-of-the-art tower that looks futuristic.", "一座摩天大楼在城市上空拔地而起，这座高层建筑是一座最先进的塔楼，看上去很有未来感。"], [null, "The designers took an innovative approach to its structure, using steel and glass.", "设计师为其结构采用了创新的方法，使用钢材和玻璃。"], [null, "The construction took four years, and engineering teams had to construct a deep base.", "施工花了四年，工程团队不得不修建很深的地基。"], [null, "Workers had to dig through rock, because the soil was unstable.", "工人们不得不凿穿岩石，因为土壤不稳定。"], [null, "Near the site, a quarry supplied stone, and a pump removed water.", "在工地附近，采石场供应石料，水泵抽走积水。"], [null, "Flooding is a danger in this area, so the engineers also built a tunnel and an underground car park.", "这个地区有洪水的危险，所以工程师还修了隧道和地下停车场。"], [null, "Steel cables hold the tension, and strong columns support the weight.", "钢缆承受拉力，坚固的立柱支撑重量。"], [null, "Inside, the lift shaft runs from the basement to the top, and you take a lift to the 60th floor.", "内部的电梯井从地下室通到楼顶，你可以乘电梯到60层。"], [null, "Many parts are mass-produced and prefabricated, which saved time.", "许多部件是批量生产、预先制造好的，这节省了时间。"], [null, "A strike briefly had to halt work, but the schedule was soon back on track.", "一次罢工曾让工程暂时停工，但进度很快又回到了正轨。"], [null, "The city is prosperous and expanding, and congested roads make a new design necessary.", "这座城市繁荣且不断扩张，拥堵的道路使新的设计成为必需。"], [null, "An ingenious system can activate the lights, and engineers hope to automate the whole building.", "一套巧妙的系统可以启动灯光，工程师希望让整栋楼实现自动化。"], [null, "Their latest invention is a window that cleans itself, a true innovation.", "他们最新的发明是一扇能自我清洁的窗户，这是真正的创新。"], [null, "A multi-storey car park will serve the tower, and a small device in every room controls the temperature.", "一座多层停车场将为这座塔楼服务，每个房间里的小装置控制着温度。"], [null, "In the past, inspectors could condemn an unsafe building, but modern checks are much stricter.", "过去，不安全的建筑可能被判定为危房，但如今的检查要严格得多。"], [null, "A scheme to connect the tower to the metro is under way.", "把这座塔楼与地铁相连的计划正在进行中。"], [null, "Some roads are impassable in winter, and the wiring work was tricky.", "有些道路冬天无法通行，布线工作也很棘手。"], [null, "Investors hope the project will triple in value, and some people say it is ultra-modern, while others find it too modern.", "投资者希望这个项目的价值能翻三倍，有人说它超级现代，也有人觉得它太现代了。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Furnishing the New Flat", "title_zh": "布置新公寓", "lines": [["A", "We should devise a plan for the new flat.", "我们应该为新公寓制定一个计划。"], ["B", "Let us not use disposable plates; they are wasteful.", "我们别用一次性盘子了，太浪费。"], ["A", "A conventional oven is fine; I do not need a fancy one.", "传统的烤箱就够了，我不需要花哨的。"], ["B", "Emerging technology can reduce domestic work, though.", "不过，新兴技术可以减少家务活。"], ["A", "Who will invent a robot that tidies my room?", "谁来发明一个替我整理房间的机器人呢？"], ["B", "Careful, the shelf might collapse if it is overloaded.", "小心，架子要是超载可能会塌。"], ["A", "The operation of this machine is simple.", "这台机器的操作很简单。"], ["B", "Good. Let us start.", "好，我们开始吧。"]]}], "Unit 12": [{"id": "p1", "genre": "Home blog", "genre_zh": "家居博客", "title": "My Smart Home", "title_zh": "我的智能家居", "lines": [[null, "My flat is full of smart technology, and every appliance is connected through Wi-Fi.", "我的公寓里满是智能科技，每件电器都通过无线网络相连。"], [null, "Fast broadband makes this possible, and the whole system runs on a wireless network.", "高速宽带使这一切成为可能，整个系统运行在无线网络上。"], [null, "I can operate the heating from my smartphone, and I can switch on the lights before I arrive.", "我可以用智能手机操作暖气，到家之前就能打开灯。"], [null, "When I leave, I switch off everything remotely.", "出门时，我远程关掉所有设备。"], [null, "A tiny chip inside the thermostat is what makes it efficient.", "温控器里的一枚小芯片使它很高效。"], [null, "The gadget I like best is a compact speaker with a user-friendly voice function.", "我最喜欢的小装置是一只紧凑的音箱，带有易用的语音功能。"], [null, "A large monitor on the wall can display the weather, and it lets me access my calendar.", "墙上的大显示屏可以显示天气，还能让我查看日历。"], [null, "I use the remote control less and less these days.", "如今我用遥控器越来越少了。"], [null, "I always try to buy the latest model, and I like my devices to be up-to-date, not dated.", "我总是尽量买最新的型号，我希望设备是最新的，而不是过时的。"], [null, "A friend who is more computer savvy than me helped to set it up.", "一位比我更精通电脑的朋友帮我安装了它。"], [null, "The whole system is digital, and even the portable charger is smart.", "整个系统都是数字化的，甚至便携充电器也是智能的。"]]}, {"id": "p2", "genre": "News report", "genre_zh": "新闻报道", "title": "Staying Safe Online", "title_zh": "网络安全", "lines": [[null, "A hacker can hack into a weak account in minutes, and cyberattack is a growing problem.", "黑客几分钟就能入侵一个薄弱的账户，网络攻击是一个日益严重的问题。"], [null, "Companies must protect their data, and security should never be treated as a basic extra.", "公司必须保护他们的数据，安全绝不应被当作一项基本的附加项。"], [null, "Privacy is also a concern, because a platform may track what you do online.", "隐私也令人担忧，因为平台可能会追踪你的网上行为。"], [null, "Social media sites store huge amounts of personal information.", "社交媒体网站储存着海量的个人信息。"], [null, "Adequate protection means strong passwords and regular updates.", "足够的保护意味着强密码和定期更新。"], [null, "A new program uses artificial intelligence to detect a threat early, and it can disable a harmful file.", "一款新程序利用人工智能及早发现威胁，并能使有害文件失效。"], [null, "Cyber crime may soon surpass old-fashioned theft in some countries.", "在一些国家，网络犯罪可能很快就会超过传统盗窃。"], [null, "People surf the Internet for hours and scroll through feeds without thinking.", "人们上网浏览几个小时，不假思索地滑动浏览信息流。"], [null, "A text message from an unknown number should not be trusted, and many offices now use a virtual private network.", "来自陌生号码的短信不应轻信，许多办公室现在使用虚拟专用网络。"], [null, "Telecommunications companies are improving mobile coverage.", "电信公司正在改善手机信号覆盖。"], [null, "Many pilots rely on automatic pilot in modern planes, thanks to computerisation.", "得益于计算机化，许多飞行员在现代飞机上依靠自动驾驶。"], [null, "Virtual reality is now used to train surgeons.", "虚拟现实现在被用于培训外科医生。"], [null, "Technology helps us to stay in touch with family overseas.", "科技帮助我们与海外的家人保持联系。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "A New Phone", "title_zh": "新手机", "lines": [["A", "Is your new phone easy to use?", "你的新手机好用吗？"], ["B", "Yes, very. The screen is bright and clear.", "好用，非常好用。屏幕明亮清晰。"], ["A", "Does it have a good camera?", "它的相机好吗？"], ["B", "It does. I can take photos even at night.", "好。我晚上也能拍照。"], ["A", "Great. Send me a picture later.", "太好了。回头给我发张照片。"]]}], "Unit 13": [{"id": "p1", "genre": "Social report", "genre_zh": "社会报告", "title": "A Changing Population", "title_zh": "变化中的人口", "lines": [[null, "The nation's population is changing, and demographic shifts are reshaping society.", "全国人口在变化，人口结构的转变正在重塑社会。"], [null, "Demographics show an ageing society, and the percentage of elderly people is rising.", "人口统计数据显示社会正在老龄化，老年人所占的百分比在上升。"], [null, "According to the statistics, the proportion of citizens over sixty-five will reach a quarter.", "根据统计数据，65岁以上公民所占比例将达到四分之一。"], [null, "One projection suggests that the number of workers will dwindle.", "一项预测显示，劳动者的数量将逐渐减少。"], [null, "Every prediction is uncertain, because unforeseen events can change the picture.", "每一个预测都不确定，因为意料之外的事件可能改变局面。"], [null, "Birth rates continue to decline, although immigration may cause an increase in the total.", "出生率持续下降，不过移民可能使总数增加。"], [null, "Many young people migrate to the cities in search of work.", "许多年轻人迁往城市寻找工作。"], [null, "The country has become more multicultural, and multiculturalism enriches daily life.", "这个国家变得更加多元文化，多元文化主义丰富了日常生活。"], [null, "Ethnic diversity brings new foods and traditions, and each group's culture is part of the national identity.", "民族多样性带来新的食物和传统，每个群体的文化都是国家身份认同的一部分。"], [null, "The impact on schools and hospitals will be large, and the implication is that more nurses will be needed.", "对学校和医院的影响将会很大，这意味着需要更多护士。"], [null, "Experts talk about the long-term effect, the mid-term plan and short-term needs.", "专家们谈论长期影响、中期计划和短期需求。"], [null, "The current system cannot cope.", "现行的制度无法应对。"], [null, "Several problems compound each other, and each factor can contribute to the pressure.", "好几个问题相互叠加，每个因素都可能加重压力。"], [null, "Governments must take sequential steps, and subsequent reports will measure progress.", "政府必须采取循序渐进的步骤，后续的报告将衡量进展。"]]}, {"id": "p2", "genre": "Business feature", "genre_zh": "商业特写", "title": "How Brands Go Global", "title_zh": "品牌如何走向世界", "lines": [[null, "Globalisation has turned small firms into global names, and a famous brand can be recognised worldwide.", "全球化把小公司变成了全球知名的名字，一个著名品牌能在世界各地被认出。"], [null, "An icon of sport or music can help a brand reach a wider market.", "体育或音乐界的偶像能帮助品牌打入更广阔的市场。"], [null, "In the car industry, two companies may merge to share costs.", "在汽车行业，两家公司可能合并以分摊成本。"], [null, "Some firms form a joint venture to enter a foreign market.", "有些公司成立合资企业以进入外国市场。"], [null, "A company that has a monopoly can set high prices, and large firms may dominate a sector.", "拥有垄断地位的公司可以定高价，大公司也可能主宰一个行业。"], [null, "Advertising can influence what young people buy.", "广告能影响年轻人购买什么。"], [null, "Countries that choose isolation often fall behind, while modernisation brings new jobs and productive factories.", "选择孤立的国家往往落后，而现代化带来新的工作和高产的工厂。"], [null, "Development is rarely smooth, and in hindsight, the rapid growth of some brands caused problems.", "发展很少一帆风顺，事后看来，某些品牌的快速增长引发了问题。"], [null, "Business moves in a cycle of growth and slowdown.", "商业在增长与放缓的周期中运行。"], [null, "Some critics remain sceptical, saying that wealthy countries gain the most.", "一些批评者仍持怀疑态度，称富裕国家获益最多。"], [null, "Shoppers love exotic products from far away.", "购物者喜欢来自远方的异国商品。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Which Brand?", "title_zh": "选哪个品牌？", "lines": [["A", "Which brand of trainers do you prefer?", "你更喜欢哪个牌子的运动鞋？"], ["B", "I do not mind, as long as they are comfortable.", "我不介意，只要穿着舒服就行。"], ["A", "Fair enough. Let us try the shop on the corner.", "有道理。我们去街角那家店试试吧。"]]}], "Unit 14": [{"id": "p1", "genre": "Editorial", "genre_zh": "社论", "title": "The Growing City", "title_zh": "不断壮大的城市", "lines": [[null, "Urbanisation is changing the world, and each megacity attracts millions of migrants.", "城市化正在改变世界，每座特大城市都吸引着数以百万计的移民。"], [null, "A migrant often sends money home to family.", "移民常常把钱寄回家给家人。"], [null, "A booming economy pulls workers into the city, but the streets become crowded.", "蓬勃发展的经济把工人吸引到城里，街道也随之变得拥挤。"], [null, "Overpopulation puts pressure on housing, and poverty pushes some families into a slum.", "人口过剩给住房带来压力，贫困把一些家庭推入贫民窟。"], [null, "A flat can be overpriced for many, and workers are overworked and underpaid.", "对许多人来说，一套公寓定价过高，而工人们则过度劳累、报酬偏低。"], [null, "Traffic jams waste hours, and the infrastructure of many cities cannot cope.", "交通堵塞浪费数小时，许多城市的基础设施不堪重负。"], [null, "In a developing country, a decent home is still a dream for some.", "在发展中国家，体面的住所对一些人来说仍是梦想。"], [null, "The rise in the number of residents is staggering.", "居民人数的增长令人震惊。"], [null, "Every city faces a challenge, and the most pressing issue is housing.", "每座城市都面临挑战，最紧迫的问题是住房。"], [null, "Leaders face a dilemma: build quickly or build well.", "领导者面临两难：是快速建造还是建好。"], [null, "Each difficulty is an obstacle, and any setback can delay progress.", "每个困难都是障碍，任何挫折都可能延误进展。"], [null, "Urban growth is double-edged: it brings wealth but also stress.", "城市增长是一把双刃剑：它带来财富，也带来压力。"], [null, "A one-sided view ignores the costs, and short-sighted plans solve today's problem but ignore tomorrow, while long-sighted leaders think ahead.", "片面的看法忽视代价，短视的规划只解决今天的问题而忽略明天，而有远见的领导者会提前考虑。"], [null, "Some neighbourhoods feel isolated from the rest of the city.", "有些社区感觉与城市其他部分隔绝。"], [null, "Tolerance between different groups makes a city stronger.", "不同群体之间的宽容使城市更强大。"], [null, "A resolution passed by the council promises more homes for everyone.", "市议会通过的一项决议承诺为每个人提供更多住房。"]]}, {"id": "p2", "genre": "Council meeting", "genre_zh": "市政会议", "title": "Fixing the City", "title_zh": "解决城市问题", "lines": [[null, "The mayor opened the meeting by promising to address the housing crisis.", "市长在会议开始时承诺要着手解决住房危机。"], [null, "\"We must adjust our plans,\" she said, \"and we must identify the real problems.\"", "“我们必须调整计划，”她说，“并且必须找出真正的问题。”"], [null, "Poor planning can cause long delays.", "糟糕的规划会造成长时间的延误。"], [null, "Delays will aggravate the problem, and new taxes could exacerbate it.", "延误会使问题恶化，新的税收可能使其更加严重。"], [null, "If we do nothing, the situation will deteriorate and conditions will worsen.", "如果我们什么都不做，局势会恶化，状况会变得更糟。"], [null, "We need to enhance public transport and deal with air pollution.", "我们需要改善公共交通，并处理空气污染问题。"], [null, "The plan must include every district and exclude no one.", "这项计划必须涵盖每个区，不排除任何人。"], [null, "Small businesses compete for space, but we want local shops to flourish.", "小企业争夺空间，但我们希望本地商店繁荣发展。"], [null, "Problems linger when nobody takes responsibility.", "没人负责时，问题会久拖不决。"], [null, "Councillors may modify any proposal after public comment, and they may raise questions.", "议员们可以在公众意见后修改任何提案，也可以提出问题。"], [null, "The architect will present the design.", "建筑师将展示设计方案。"], [null, "We must reform the planning rules and regulate rents.", "我们必须改革规划规则并管控租金。"], [null, "Our task is to remedy a situation that has lasted too long, and to remedy it fairly.", "我们的任务是补救一个已持续太久的局面，并公平地补救。"], [null, "Let us tackle the easiest problem first and resolve an issue every month.", "让我们先处理最容易的问题，并且每个月解决一个问题。"], [null, "These steps will transform the city.", "这些措施将改变这座城市。"], [null, "We must face the facts, find a solution and overcome a difficulty, one step at a time.", "我们必须面对事实，找到解决办法，一步一步克服困难。"], [null, "A compromise is needed, so we should reach a compromise with residents and find a compromise on the height of buildings.", "需要妥协，所以我们应该与居民达成妥协，并在建筑高度上找到折中方案。"], [null, "A disjointed plan will not work, so we must unite the departments.", "支离破碎的计划行不通，所以我们必须让各部门联合起来。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Rush Hour", "title_zh": "高峰时段", "lines": [["A", "The train is so crowded today!", "今天火车太挤了！"], ["B", "It is always like this at rush hour.", "高峰时段总是这样。"], ["A", "Let us wait for the next one.", "我们等下一班吧。"], ["B", "Good idea. I would rather arrive late than squashed.", "好主意。我宁愿晚到也不愿被挤扁。"]]}], "Unit 15": [{"id": "p1", "genre": "Environmental report", "genre_zh": "环境报告", "title": "A Planet Under Strain", "title_zh": "不堪重负的地球", "lines": [[null, "Climate change is the greatest threat to the environment, and its effects are pervasive.", "气候变化是对环境最大的威胁，其影响无处不在。"], [null, "Greenhouse gases trap heat, and each year emission levels rise.", "温室气体会困住热量，排放水平逐年上升。"], [null, "Car exhaust and factory fumes add to pollution, and every pollutant harms the air.", "汽车尾气和工厂烟雾加剧污染，每一种污染物都危害空气。"], [null, "Some pollution returns as acid rain, which damages forests.", "有些污染会以酸雨的形式返回，破坏森林。"], [null, "Deforestation leads to erosion, and soil washes away.", "森林砍伐导致侵蚀，土壤被冲走。"], [null, "A long drought can be followed by a devastating flood.", "长期干旱之后可能紧接着一场毁灭性的洪水。"], [null, "Every ecosystem has a delicate food chain, and biodiversity helps it to survive.", "每个生态系统都有脆弱的食物链，生物多样性帮助它延续。"], [null, "Chemical waste can contaminate rivers, and contamination spreads fast.", "化学废料会污染河流，污染扩散得很快。"], [null, "Water that is contaminated can make people ill.", "被污染的水会让人生病。"], [null, "Some damage is irreversible and irreparable, and an irreplaceable habitat, once lost, is gone for ever.", "有些损害是不可逆转、无法修复的，一个不可替代的栖息地一旦消失，就永远不复存在。"], [null, "Many species are at risk, and some are in danger of extinction.", "许多物种处于危险之中，有些面临灭绝的危险。"], [null, "Few pristine places remain.", "几乎没有留下几处原始纯净的地方。"], [null, "Such changes are unprecedented, they put a strain on nature, and some effects are life-threatening for humans too.", "这样的变化是前所未有的，它们给自然带来压力，有些影响对人类也是危及生命的。"], [null, "Environmental groups warn that if nothing changes, temperatures will inexorably rise, and more disasters will inevitably follow.", "环保组织警告说，如果什么都不改变，气温将不可阻挡地上升，更多的灾难将不可避免地随之而来。"]]}, {"id": "p2", "genre": "Debate", "genre_zh": "辩论", "title": "Can We Fix It?", "title_zh": "我们能解决吗？", "lines": [[null, "A sustainable economy is viable, but some say it is unattainable.", "可持续的经济是可行的，但有些人说它无法实现。"], [null, "Others call the goal achievable and worthwhile, because it is beneficial for everyone and advantageous for business.", "另一些人称这个目标是可以实现且值得的，因为它对每个人有益，对商业也有利。"], [null, "Choose environmentally friendly products and recyclable packaging.", "选择环保的产品和可回收的包装。"], [null, "Proper disposal of household refuse matters, and we must dispose of dangerous chemicals safely, not dump them in rivers.", "妥善处理生活垃圾很重要，我们必须安全处置危险化学品，而不是把它们倾倒进河里。"], [null, "The recycling process is taxing on small towns.", "回收过程对小城镇来说负担沉重。"], [null, "A company that pollutes should be liable for the damage, and no firm is immune from the law.", "污染环境的公司应对损害负责，没有哪家公司能免受法律约束。"], [null, "Farmers use too much fertiliser, which can threaten rivers.", "农民使用了过多的肥料，这可能威胁河流。"], [null, "We must confront the problem honestly.", "我们必须坦诚地面对这个问题。"], [null, "A sceptic may say that individual action is pointless, futile, fruitless or useless.", "怀疑者可能会说，个人行动毫无意义、徒劳、没有成果或毫无用处。"], [null, "It is doubtful, even questionable, that one country can succeed alone, and it is improbable, perhaps even unlikely.", "一个国家单打独斗能否成功是值得怀疑的，甚至可疑，而且不太可能，也许可能性极小。"], [null, "A full ban might be impracticable, but a small step is conceivable.", "全面禁止也许行不通，但迈出一小步是可以想象的。"], [null, "Some call the problem insoluble, but history shows otherwise.", "有些人称这个问题无法解决，但历史证明并非如此。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Recycling at Home", "title_zh": "在家回收", "lines": [["A", "Which bin does this bottle go in?", "这个瓶子该扔进哪个垃圾桶？"], ["B", "The blue one. It is plastic.", "蓝色的那个。它是塑料的。"], ["A", "And this paper?", "那这张纸呢？"], ["B", "Paper goes in the green bin.", "纸放进绿色的桶。"]]}], "Unit 16": [{"id": "p1", "genre": "Newspaper article", "genre_zh": "报纸文章", "title": "The Energy Crisis", "title_zh": "能源危机", "lines": [[null, "The world faces an energy crisis, and the situation is critical.", "世界正面临能源危机，形势十分危急。"], [null, "Most electricity still comes from fossil fuel, which also releases carbon and carbon dioxide.", "大部分电力仍来自化石燃料，它还会释放碳和二氧化碳。"], [null, "Each greenhouse gas traps heat, and emissions keep rising.", "每种温室气体都会困住热量，排放量持续上升。"], [null, "A factory may emit smoke, and a car can consume a lot of fuel.", "工厂可能排放烟雾，汽车可能消耗大量燃料。"], [null, "A hybrid vehicle uses less petrol, and many cars now run on unleaded fuel.", "混合动力汽车用的汽油更少，许多汽车现在使用无铅燃料。"], [null, "Drastic action is needed to counter climate change.", "需要采取果断措施来对抗气候变化。"], [null, "Oil reserves will deplete, so we must conserve what remains.", "石油储备将会耗尽，所以我们必须节约剩余的资源。"], [null, "Do not waste electricity, and switch off the lights when you leave.", "不要浪费电，离开时把灯关掉。"], [null, "Governments must expend money wisely on new energy.", "政府必须明智地把钱花在新能源上。"]]}, {"id": "p2", "genre": "News report", "genre_zh": "新闻报道", "title": "Going Renewable", "title_zh": "转向可再生能源", "lines": [[null, "Renewable power is the future, and a wind turbine can convert wind into electricity.", "可再生能源是未来，风力涡轮机可以把风转化为电。"], [null, "Solar panels absorb sunlight, and a rechargeable battery can retain the energy.", "太阳能电池板吸收阳光，可充电电池能储存能量。"], [null, "A battery will discharge slowly over time.", "电池会随着时间缓慢放电。"], [null, "Biofuel and hydrogen are promising alternative sources, while nuclear power is controversial.", "生物燃料和氢能是有前景的替代能源，而核能则存在争议。"], [null, "Eco-friendly design can preserve resources for future generations.", "环保设计可以为子孙后代保存资源。"], [null, "An effective policy will limit emissions, and the benefits will outweigh the costs.", "有效的政策将限制排放，收益将超过成本。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Saving Energy at Home", "title_zh": "在家节能", "lines": [["A", "Did you turn off the heater?", "你关暖气了吗？"], ["B", "Yes, and I unplugged the charger too.", "关了，我还拔掉了充电器。"], ["A", "Good. Our bill was very high last month.", "好。我们上个月的账单很高。"], ["B", "We can use less power at night.", "我们可以在晚上少用电。"]]}], "Unit 17": [{"id": "p1", "genre": "Careers guide", "genre_zh": "职业指南", "title": "Getting the Job", "title_zh": "找到工作", "lines": [[null, "Choosing a career is a big decision, and a good job should offer job satisfaction.", "选择职业是一个重大决定，一份好工作应当带来工作满足感。"], [null, "When you apply for a post, the employer reads your application, and each candidate may be invited to an interview.", "当你申请一个职位时，雇主会阅读你的申请，每位候选人都可能被邀请参加面试。"], [null, "Your qualifications and skills show what you can offer.", "你的资历和技能显示了你能提供什么。"], [null, "Employment in hospitality and retail is often part-time or casual, with shift work.", "酒店餐饮业和零售业的工作常常是兼职或临时的，还要轮班。"], [null, "Manual work, such as a labourer's, is demanding and exhausting, and it is often unskilled.", "体力劳动，比如劳工的工作，要求高又累人，而且往往是非技术性的。"], [null, "A clerk in an office may find the work monotonous.", "办公室文员可能会觉得工作单调乏味。"], [null, "Every occupation has its own rewards, and every profession has its own prospects.", "每种职业都有它自己的回报，每个行业都有它自己的前景。"], [null, "Pay and wages vary, and a monthly salary is usually fixed.", "报酬和工资各不相同，月薪通常是固定的。"], [null, "Your income or earnings may rise if you work overtime, and some firms offer a perk such as free lunch.", "如果你加班，收入或收益可能增加，有些公司还提供免费午餐之类的额外福利。"], [null, "A good boss supports the staff, and a kind supervisor treats every colleague fairly.", "好老板支持员工，和蔼的主管公平对待每一位同事。"], [null, "A friendly workplace makes the day pass quickly.", "友好的工作场所让一天过得很快。"], [null, "Everyone hopes to be promoted one day.", "每个人都希望有一天能得到晋升。"], [null, "If a firm closes, workers may be made redundant, and the number of unemployed people may increase.", "如果公司倒闭，工人可能被裁员，失业者的数量可能增加。"], [null, "A skilled workforce attracts investors, while high unemployment worries everyone.", "熟练的劳动力吸引投资者，而高失业率令所有人担忧。"], [null, "After retirement, many people enjoy time with family, and most people retire at sixty-five.", "退休之后，许多人享受与家人共度的时光，大多数人在六十五岁退休。"], [null, "Every employee deserves respect, and money is not everything.", "每位员工都值得尊重，金钱也不是一切。"]]}, {"id": "p2", "genre": "Business feature", "genre_zh": "商业特写", "title": "Selling It", "title_zh": "推销之道", "lines": [[null, "A good advertisement can persuade shoppers to buy.", "一则好广告能说服购物者购买。"], [null, "Advertising is expensive, so a company must plan its campaign carefully.", "广告很昂贵，所以公司必须精心策划其宣传活动。"], [null, "The marketing team studies the consumer and chooses a target group.", "营销团队研究消费者并选定目标人群。"], [null, "Attractive packaging helps a product stand out.", "吸引人的包装能让产品脱颖而出。"], [null, "Some firms aim at a niche market, selling special goods to a few customers.", "有些公司瞄准小众市场，向少数顾客销售特别的商品。"], [null, "A famous athlete may endorse a product, which gives it credibility.", "著名运动员可能为某款产品代言，这给它带来了可信度。"], [null, "The management holds a weekly meeting with each client.", "管理层每周与每位客户开一次会。"], [null, "Companies that earn big profits can invest in new equipment, and investors buy shares.", "赚取高额利润的公司可以投资新设备，投资者则购买股份。"], [null, "A takeover happens when one firm buys another.", "一家公司买下另一家时，就发生了收购。"], [null, "The trade between countries is a source of economic growth.", "国家之间的贸易是经济增长的来源。"], [null, "An economical choice saves money.", "经济实惠的选择能省钱。"], [null, "A customer may make a request for a refund.", "顾客可能会提出退款的请求。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "After the Interview", "title_zh": "面试之后", "lines": [["A", "How did the interview go?", "面试怎么样？"], ["B", "Quite well, I think. They asked about my skills.", "我觉得挺好的。他们问了我的技能。"], ["A", "Did they say when you will hear from them?", "他们说什么时候给你答复了吗？"], ["B", "Next week. I will keep my fingers crossed.", "下周。我会祈祷好运。"]]}], "Unit 18": [{"id": "p1", "genre": "Court report", "genre_zh": "法庭报道", "title": "On Trial", "title_zh": "受审", "lines": [[null, "Our actions have consequences, and an intrusion into a private home is a serious offence.", "我们的行为会带来后果，闯入私人住宅是严重的违法行为。"], [null, "The accused is on trial for fraud, and a jury must decide.", "被告因欺诈罪受审，由陪审团做出裁决。"], [null, "The prosecutor says the man is guilty, but his lawyer says he is innocent.", "检察官说这名男子有罪，但他的律师说他无罪。"], [null, "The judge reminds everyone that the prosecution must prove its case.", "法官提醒大家，控方必须证明自己的指控。"], [null, "\"It is not enough to say he had a motive; there must be proof of intent,\" the lawyer argued.", "律师辩称：“仅仅说他有动机是不够的，必须有故意的证据。”"], [null, "An offence may be intentional or unintentional, and recklessness can also be punishable.", "违法行为可能是故意的，也可能是无意的，鲁莽也可能受到惩处。"], [null, "If the jury decides to convict, the judge may impose a fine or send him to prison.", "如果陪审团决定定罪，法官可能处以罚款，或判他入狱。"], [null, "Imprisonment is a harsh punishment, and a strict sentence may deter others.", "监禁是一种严厉的惩罚，严格的判决可能威慑其他人。"], [null, "Police try to solve a crime, and courts try to convict a criminal.", "警方努力侦破案件，法庭努力给罪犯定罪。"], [null, "A person who chooses to commit a crime must accept the consequences.", "选择犯罪的人必须承担后果。"], [null, "A prisoner who behaves well may be released early, and courts may imprison a dangerous offender.", "表现良好的囚犯可能提前获释，法院也可能监禁危险的罪犯。"], [null, "Law should punish wrongdoing fairly.", "法律应当公平地惩罚不法行为。"]]}, {"id": "p2", "genre": "News feature", "genre_zh": "新闻特写", "title": "Crime and Society", "title_zh": "犯罪与社会", "lines": [[null, "The crime rate has fallen, but crime remains a concern.", "犯罪率已经下降，但犯罪仍令人担忧。"], [null, "A serious criminal may commit murder, kidnapping or arson.", "严重的罪犯可能犯下谋杀、绑架或纵火罪。"], [null, "Property crime, such as burglary, is common, and pickpocketing happens in crowded places.", "财产犯罪，如入室盗窃，很常见，而扒窃发生在拥挤的地方。"], [null, "Smuggling and drug-related crimes are harder to track.", "走私和与毒品相关的犯罪更难追踪。"], [null, "Petty crime, such as vandalism, may seem small, but each victim suffers.", "轻微犯罪，如故意破坏公物，看似不大，但每位受害者都会受苦。"], [null, "Swearing in public may be offensive, but is it a crime?", "在公共场合说脏话可能令人反感，但这算犯罪吗？"], [null, "Some call a non-violent act victimless, but dumping toxic waste harms everyone.", "有些人称非暴力行为为无受害者的行为，但倾倒有毒废物会伤害所有人。"], [null, "A random attack in a quiet street shocks a whole community.", "安静街道上的一次随机袭击会震惊整个社区。"], [null, "Crime prevention is better than punishment, and a clear penalty is a deterrent.", "预防犯罪胜于惩罚，明确的刑罚是一种威慑。"], [null, "Inequality in the social system can push some people toward crime.", "社会体制中的不平等可能把一些人推向犯罪。"], [null, "The authority of the police depends on public trust, and their job is protection.", "警察的权威取决于公众的信任，他们的工作是保护。"], [null, "A law-abiding citizen will abide by the rules, obey the law and respect the police.", "守法的公民会遵守规则，服从法律，尊重警察。"], [null, "A driver who ignores the signs will violate a traffic law, and each violation costs money.", "无视标志的司机会违反交通法规，每次违规都要花钱。"], [null, "Officers enforce the rules, and parliament may pass a law or abolish an old one.", "警官执行规则，议会可以通过一项法律，或废除一项旧法律。"], [null, "The new Act makes stalking a crime.", "这项新法令把跟踪骚扰定为犯罪。"], [null, "Some young people resent authority, and others perpetrate small crimes out of boredom.", "有些年轻人憎恶权威，另一些人出于无聊而犯下小罪。"], [null, "A person who continues to offend will face tougher sentences.", "继续犯法的人将面临更严厉的判决。"], [null, "The law aims to protect people.", "法律旨在保护人民。"], [null, "Most criminals are not evil, but they have made bad choices.", "大多数罪犯并不邪恶，只是做了错误的选择。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "The Witness", "title_zh": "目击证人", "lines": [["A", "Did you see what happened?", "你看到发生了什么吗？"], ["B", "Yes. A man ran out of the shop.", "看到了。一个男人从店里跑了出来。"], ["A", "Can you describe him?", "你能描述一下他吗？"], ["B", "He was tall, with a blue jacket.", "他个子很高，穿着一件蓝色夹克。"], ["A", "Thank you. Please tell the police.", "谢谢。请告诉警方。"]]}], "Unit 19": [{"id": "p1", "genre": "Essay", "genre_zh": "短文", "title": "Who Do We Trust?", "title_zh": "我们该相信谁？", "lines": [[null, "The media shape how we see the world, and the mass media reach millions every day.", "媒体塑造我们看世界的方式，大众传媒每天触达数百万人。"], [null, "The mainstream media, such as the national newspaper, still has great influence.", "主流媒体，比如全国性报纸，仍然有很大的影响力。"], [null, "A free press is essential in a democracy, and censorship limits what people can read.", "新闻自由对民主至关重要，而审查制度限制了人们能读到的内容。"], [null, "Some governments censor stories they dislike.", "有些政府会审查他们不喜欢的报道。"], [null, "No report is free of bias, since a biased article pushes a particular ideology, while an unbiased article tries to be fair.", "没有哪篇报道完全没有偏见：有偏见的文章宣扬某种意识形态，而不偏不倚的文章努力做到公正。"], [null, "An opinion is not the same as a fact, and good journalism is factual and informative.", "观点不等同于事实，好的新闻报道应当真实且信息丰富。"], [null, "A well-informed reader checks the source and tries to verify each claim.", "消息灵通的读者会核查来源，并设法核实每一项说法。"], [null, "An editor chooses which stories to run, and the publisher pays the bills.", "编辑决定刊登哪些报道，出版商则负责付账。"], [null, "An author may write for a journal, and each publication has its own style.", "作者可能为期刊写稿，每种出版物都有自己的风格。"], [null, "People used to buy the paper at a newsstand, but now many read the news online.", "人们过去常在报摊买报纸，现在许多人在网上看新闻。"], [null, "A television network can broadcast live to the whole country.", "电视网络可以向全国现场直播。"], [null, "Current affairs programmes inform viewers about politics.", "时事节目让观众了解政治。"]]}, {"id": "p2", "genre": "Magazine feature", "genre_zh": "杂志特写", "title": "The Price of Fame", "title_zh": "成名的代价", "lines": [[null, "Fame can arrive overnight, and a celebrity must live with constant exposure.", "名声可能一夜之间到来，名人必须忍受持续的曝光。"], [null, "The paparazzi follow stars everywhere, and their photos can intrude on private moments.", "狗仔队到处跟着明星，他们的照片可能侵扰私人时刻。"], [null, "A tabloid thrives on sensationalist stories with attention-grabbing headlines.", "小报靠耸人听闻的故事和吸引眼球的标题蓬勃发展。"], [null, "Such stories are entertaining, but often superficial.", "这类故事很有趣，但往往流于表面。"], [null, "Intrusive reporters may invade a family's privacy.", "爱打探的记者可能侵犯一个家庭的隐私。"], [null, "Some magazines exploit fear for profit and publish rumours and speculation.", "有些杂志为了利润利用恐惧心理，刊登谣言和猜测。"], [null, "A distorted story can ruin a career, while an artificial image can hide the real person.", "被歪曲的报道可能毁掉一份事业，而人为包装的形象会掩盖真实的人。"], [null, "Reality television claims to be realistic, but much of it is staged.", "真人秀电视声称很真实，但很多内容都是安排好的。"], [null, "Publicity can help a new singer, so agents publicise every concert.", "宣传可以帮助新歌手，所以经纪人会宣传每一场演唱会。"], [null, "A controversial remark can make headlines.", "一句有争议的言论可能登上头条。"], [null, "A serious paper may run an investigation, and an investigative reporter will investigate a scandal for months.", "严肃的报纸可能展开调查，调查记者会花数月时间调查一桩丑闻。"], [null, "An exposé can expose corruption and force the powerful to explain themselves.", "一篇揭露性报道可以揭露腐败，迫使有权势的人作出解释。"], [null, "Stars cannot control what is written about them, and the law should safeguard privacy.", "明星无法控制别人怎么写他们，法律应当保护隐私。"], [null, "Relevance matters: is a star's private life relevant to the public?", "相关性很重要：明星的私生活与公众有关吗？"], [null, "A good reporter will report the facts.", "好记者会报道事实。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "Reading the News", "title_zh": "读新闻", "lines": [["A", "Did you see the headline this morning?", "你看到今天早上的头条了吗？"], ["B", "Yes, but I do not trust that website.", "看到了，不过我不相信那个网站。"], ["A", "Why not?", "为什么？"], ["B", "It exaggerates everything. I prefer to check two sources.", "它什么都夸大。我更喜欢核对两个来源。"]]}], "Unit 20": [{"id": "p1", "genre": "Gallery guide", "genre_zh": "美术馆导览", "title": "A Visit to the Gallery", "title_zh": "参观美术馆", "lines": [[null, "The gallery is hosting an exhibition of works by a prominent artist.", "这家美术馆正在举办一位杰出艺术家的作品展。"], [null, "The paintings are vivid and brightly coloured, and her style is unmistakable.", "这些画作生动而色彩鲜艳，她的风格独一无二。"], [null, "One portrait shows a child, and a sculpture in the hall was made by a sculptor from a single block of stone.", "其中一幅肖像画的是一个孩子，大厅里的一件雕塑由一位雕塑家用一整块石头雕成。"], [null, "A wooden carving and other crafts fill the next room.", "下一个展厅里摆满了一件木雕和其他手工艺品。"], [null, "Each image tells a story, and the central theme is the sea.", "每幅图像都在讲述一个故事，核心主题是大海。"], [null, "The creation of such work needs a creative mind, and the artist is clearly accomplished and imaginative.", "这样的作品需要富有创造力的头脑，这位艺术家显然技艺精湛、富于想象。"], [null, "Visual art engages the eyes, but aesthetics is about more than looks.", "视觉艺术吸引眼睛，但美学不仅仅关乎外观。"], [null, "An aesthetic sense differs from person to person, and taste is personal.", "审美感因人而异，品味是个人的。"], [null, "Some pieces are awe-inspiring and fill me with awe.", "有些作品令人敬畏，让我充满惊叹。"], [null, "A painting can express strong emotion and set a mood.", "一幅画能表达强烈的情感并营造一种氛围。"], [null, "The show is interactive, so visitors can touch some objects.", "展览是互动式的，所以参观者可以触摸一些展品。"], [null, "Please turn off your phone, because it can be distracting.", "请关掉手机，因为它会让人分心。"], [null, "To appreciate art takes time, and appreciation grows with attention.", "欣赏艺术需要时间，鉴赏力随着专注而增长。"], [null, "A work of art can depict a quiet street or an imagined world, and it can enrich our lives.", "一件艺术作品可以描绘一条安静的街道或一个想象的世界，并能丰富我们的生活。"], [null, "It is beautiful and rich in detail, and artistic talent is easy to see.", "它美丽而细节丰富，艺术天分显而易见。"], [null, "Try to imagine the artist at work, and think about how much the arts mean to a community.", "试着想象艺术家工作时的样子，想想艺术对一个社区有多重要。"]]}, {"id": "p2", "genre": "Theatre review", "genre_zh": "剧评", "title": "A Night at the Theatre", "title_zh": "剧院之夜", "lines": [[null, "The theatre was full, and the audience waited for the performance to begin.", "剧院座无虚席，观众等待演出开始。"], [null, "The festival celebrates the performing arts, and this venue is its centre.", "艺术节庆祝表演艺术，这个场地是它的中心。"], [null, "The play is a new version of a classical tale by a famous writer.", "这部剧是一位著名作家的古典故事的新版本。"], [null, "The actor and the actress gave a passionate and emotional performance.", "男演员和女演员的表演充满激情、感人至深。"], [null, "An orchestra played live music, and a ballerina danced a short ballet.", "一支管弦乐队现场演奏，一位芭蕾舞女演员跳了一小段芭蕾。"], [null, "Earlier, a musician began to perform a solo, and the concert ended with an opera aria.", "早些时候，一位音乐家开始独奏，音乐会以一首歌剧咏叹调收尾。"], [null, "A popular musical is on next week.", "下周将上演一部受欢迎的音乐剧。"], [null, "The atmosphere was electric, and the small hall gave the show a sense of intimacy.", "气氛热烈，小小的大厅给演出带来一种亲密感。"], [null, "The response was warm, and a good performance is a strong stimulus for the imagination.", "反响热烈，一场好的演出是对想象力的强烈刺激。"], [null, "Some find it magical, others find it relaxing and stimulating.", "有人觉得它充满魔力，有人觉得它轻松而又振奋人心。"], [null, "Many plays are based on literature, and a literary novel can inspire a new production.", "许多戏剧改编自文学，一部文学小说可以激发一部新作品。"], [null, "A clip of the show went viral online.", "这场演出的一段视频在网上疯传。"], [null, "Theatre is a cultural gift, and this season offers an eclectic mix.", "戏剧是一份文化的馈赠，这个演出季呈现了一种兼收并蓄的组合。"], [null, "Art can provoke thought, influence society and create new ideas.", "艺术能引发思考、影响社会并创造新的想法。"], [null, "Some critics call it fundamental to society, and an influential and inspirational voice.", "一些评论家称它对社会至关重要，是一个有影响力、鼓舞人心的声音。"], [null, "For many, a play is a chance to escape, a form of expression and a source of inspiration.", "对许多人来说，看戏是一个逃离现实的机会，是一种表达方式，也是灵感的来源。"], [null, "Her performance was a sensation.", "她的表演轰动一时。"]]}, {"id": "p3", "genre": "Dialogue", "genre_zh": "对话", "title": "After the Show", "title_zh": "演出之后", "lines": [["A", "What did you think of the show?", "你觉得这场演出怎么样？"], ["B", "I loved the music. The singers were wonderful.", "我喜欢那音乐。歌手们太棒了。"], ["A", "Shall we get something to eat?", "我们去吃点东西吧？"], ["B", "Yes, I am starving!", "好啊，我饿坏了！"]]}], "Unit 21": [{"id": "p1", "genre": "Study guide", "genre_zh": "学习指南", "title": "Language Tools", "title_zh": "语言工具", "lines": [[null, "A monolingual dictionary uses only English, while a bilingual dictionary also gives a translation.", "单语词典只用英语，而双语词典还会给出翻译。"], [null, "A corpus is a large collection of real texts.", "语料库是大量真实文本的集合。"], [null, "Use a thesaurus to find a synonym, and learn an antonym with each new word.", "用同义词词典找近义词，并在学每个新词时同时学它的反义词。"], [null, "Phonology studies the sounds of a language, and etymology studies the history of words.", "音系学研究一种语言的语音，词源学研究单词的历史。"], [null, "A prefix comes at the beginning of a word, and a suffix comes at the end.", "前缀出现在单词开头，后缀出现在单词结尾。   rev:{pi:0,zh:true,listen:false,hide:false,playing:false,cur:-1}};

// ---------- device voices (fallback when an Edge mp3 is missing) ----------
var voices=[];
function scoreVoice(v){
  var n=v.name.toLowerCase(), l=(v.lang||'').replace('_','-').toLowerCase(), s=0;
  if(l.indexOf('en')!==0) return -1;
  if(n.indexOf('natural')>-1||n.indexOf('neural')>-1) s+=100;
  if(n.indexOf('online')>-1) s+=10;
  if(n.indexOf('premium')>-1||n.indexOf('enhanced')>-1) s+=60;
  if(n.indexOf('google uk english')>-1) s+=50;
  if(n.indexOf('google us english')>-1) s+=40;
  if(/(sonia|libby|ryan|aria|jenny|guy|serena|daniel|samantha|ava|isha|oliver)/.test(n)) s+=20;
  if(l==='en-gb') s+=15; else if(l==='en-au'||l==='en-nz') s+=8; else if(l==='en-us') s+=5;
  if(n.indexOf('compact')>-1||n.indexOf('espeak')>-1) s-=40;
  if(!v.localService) s+=3;
  return s;
}
function loadVoices(){
  if(!window.speechSynthesis) return;
  voices=speechSynthesis.getVoices().filter(function(v){return scoreVoice(v)>=0});
  voices.sort(function(a,b){return scoreVoice(b)-scoreVoice(a)});
  var sel=document.getElementById('voiceSel'); sel.innerHTML='';
  voices.forEach(function(v,i){var o=document.createElement('option');o.value=v.name;o.textContent=(i===0?'★ ':'')+v.name+' ('+v.lang+')';sel.appendChild(o)});
  if(!voices.length) return;
  if(!voices.some(function(v){return v.name===state.voice})) state.voice=voices[0].name;
  sel.value=state.voice;
}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}

// ---------- audio: Edge TTS mp3 first, device voice as fallback ----------
var cur=null, curBtn=null, misses=0, hits=0, runToken=0;
function setAudioNote(){
  var n=document.getElementById('audioNote');
  if(hits>0) n.textContent='🎙 Edge TTS audio active';
  else if(misses>=2) n.textContent='🔈 audio/ folder not found — using device voice';
  else n.textContent='';
}
function stopAll(){
  runToken++;
  if(cur){try{cur.pause()}catch(e){}cur=null}
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(curBtn){curBtn.classList.remove('playing');curBtn=null}
}
function deviceSpeak(text,btn,done,alt){
  if(!window.speechSynthesis){if(done)done();return}
  var u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,''));
  var v=voices.filter(function(x){return x.name===state.voice})[0];
  if(alt&&voices.length>1)v=voices.filter(function(x){return x.name!==state.voice&&x.lang===(v?v.lang:'en-GB')})[0]||voices[1];
  if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
  u.rate=parseFloat(state.rate);
  u.onend=u.onerror=function(){if(btn)btn.classList.remove('playing');if(done)done()};
  speechSynthesis.speak(u);
}
function play(file,text,btn,done,alt){
  stopAll();
  var token=runToken;
  if(btn){btn.classList.add('playing');curBtn=btn}
  function fallback(){ if(token!==runToken)return; misses++; setAudioNote(); deviceSpeak(text,btn,done,alt) }
  if(!file||misses>=2&&hits===0){deviceSpeak(text,btn,done,alt);return}
  var a=new Audio(file);cur=a;var settled=false;
  a.onerror=function(){if(settled)return;settled=true;fallback()};
  a.onended=function(){if(btn)btn.classList.remove('playing');if(done&&token===runToken)done()};
  a.onplaying=function(){hits++;settled=true;setAudioNote()};
  var p=a.play();if(p&&p.catch)p.catch(function(){if(settled)return;settled=true;fallback()});
}

// ---------- helpers ----------
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function rx(w){return w.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')}
function hl(sent,word){
  var re=new RegExp('\\b'+rx(word)+'\\b','i');
  return esc(sent).replace(re,function(m){return '<em>'+m+'</em>'});
}
function units(){var u=[];VOCAB.forEach(function(e){if(u.indexOf(e.unit)<0)u.push(e.unit)});return u}

function byWord(w){return VOCAB.filter(function(e){return e.word.toLowerCase()===w.toLowerCase()})[0]}

function unitRegex(u){
