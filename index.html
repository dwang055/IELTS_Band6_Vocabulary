@media(max-width:560px){.wtt-logo{width:96px;height:96px}header{justify-content:center;text-align:center}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#e6a817}.kicker span{letter-spacing:.05em;color:#f6efe0;font-weight:600}
.ttl{flex:1;min-width:200px;color:#f6efe0}.ttl h1{margin:0;font-size:21px}.ttl p{margin:2px 0 0;color:#cfdbe2;font-size:13px}
.badge{background:var(--gold);color:#1b3a4b;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
.bar label{color:var(--muted);display:flex;align-items:center;gap:6px}
select,input[type=text]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
select{max-width:260px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:7px 12px}
button:hover{border-color:var(--gold)}
button.pri{background:var(--gold);color:#1b3a4b;font-weight:700;border-color:var(--gold)}
nav{display:flex;gap:6px;padding:10px 18px 0;flex-wrap:wrap}
nav button{border-radius:10px 10px 0 0;border-bottom:none}
nav button.on{background:var(--gold);color:#1b3a4b;font-weight:700}
main{max-width:880px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.w{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.w h2{margin:0;font-size:26px;color:var(--gold)}
.pos{font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 6px}
.ipa{color:var(--muted);font-family:"Segoe UI",system-ui,sans-serif}
.spk{width:38px;height:38px;border-radius:50%;padding:0;font-size:17px;flex:none}
.spk.playing{background:var(--gold);color:#1b3a4b}
.def{margin:8px 0 2px}.zh{color:var(--muted)}
.sent{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.sent .tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sent em{font-style:normal;color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.unit{cursor:pointer}.unit h3{margin:0 0 4px;font-size:16px}.unit small{color:var(--muted)}
.prog{height:8px;background:var(--panel2);border-radius:6px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--good)}
.flash{min-height:230px;text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.flash .big{font-size:34px;color:var(--gold);font-weight:700}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.boxes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.boxes input{width:34px;height:42px;text-align:center;font-size:20px;font-weight:700;border-radius:8px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);text-transform:lowercase}
.boxes input.ok{border-color:var(--good)}.boxes input.no{border-color:var(--bad)}
.sp{width:14px}
.msg{text-align:center;min-height:26px;font-weight:700}.msg.ok{color:var(--good)}.msg.no{color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.hint{background:var(--panel2);border-left:4px solid var(--gold);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:14px}
.pill{display:inline-block;margin-top:6px;font-size:11px;background:var(--gold);color:#1b3a4b;border-radius:20px;padding:1px 9px;font-weight:700}.pill.off{background:var(--panel2);color:var(--muted);font-weight:400}
.chk{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted)}
.rline{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-radius:12px;border:1px solid transparent}
.rline.now{background:var(--panel2);border-color:var(--gold)}
.rtext{flex:1;line-height:1.7}.rtext.blur>div:first-child{filter:blur(7px);cursor:pointer;user-select:none}
.spkr{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;margin-top:6px;color:#1b3a4b}
.spkr.sA{background:var(--gold)}.spkr.sB{background:#7cc4e8}

her or father", "def_zh": "父亲或母亲；家长", "quote_en": "Every parent wants their child to be happy and healthy.", "quote_zh": "每位家长都希望孩子快乐健康。", "ex_en": "My parent works as a nurse at the local hospital.", "ex_zh": "我的家长在当地医院当护士。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0015", "unit": "Unit 1"}, {"word": "relation", "pron": "rɪˈleɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a connection between two or more people or things", "def_zh": "关系；联系；亲戚", "quote_en": "The relation between diet and health is well documented.", "quote_zh": "饮食与健康之间的关系有充分的记录。", "ex_en": "She is a distant relation of mine.", "ex_zh": "她是我的一个远亲。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0016", "unit": "Unit 1"}, {"word": "relationship", "pron": "rɪˈleɪʃnʃɪp", "part_of_speech": "n.", "pos": "n.", "def_en": "the way two people or groups feel and behave towards each other", "def_zh": "关系", "quote_en": "A good relationship with parents can improve a teenager's confidence.", "quote_zh": "与父母的良好关系可以增强青少年的自信。", "ex_en": "I have a close relationship with my brother.", "ex_zh": "我和哥哥关系很亲近。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0017", "unit": "Unit 1"}, {"word": "relative", "pron": "ˈrelətɪv", "part_of_speech": "n.", "pos": "n.", "def_en": "a member of your family", "def_zh": "亲戚；亲属", "quote_en": "Many relatives gather at our house during the Spring Festival.", "quote_zh": "春节期间，许多亲戚聚在我们家。", "ex_en": "I have a relative who lives in Auckland.", "ex_zh": "我有一个亲戚住在奥克兰。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0018", "unit": "Unit 1"}, {"word": "resemblance", "pron": "rɪˈzembləns", "part_of_speech": "n.", "pos": "n.", "def_en": "the fact of looking like someone or something", "def_zh": "相似；相像", "quote_en": "There is a striking resemblance between the twins.", "quote_zh": "这对双胞胎之间有惊人的相似之处。", "ex_en": "People often notice my resemblance to my father.", "ex_zh": "人们常常注意到我长得像我父亲。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0019", "unit": "Unit 1"}, {"word": "rivalry", "pr hapter": "Unit 1 · Growing Up · 成长", "id": "w0024", "unit": "Unit 1"}, {"word": "upbringing", "pron": "ˈʌpbrɪŋɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the way you are taught and treated as a child", "def_zh": "养育；教养", "quote_en": "A strict upbringing does not always produce obedient children.", "quote_zh": "严格的教养并不总能培养出听话的孩子。", "ex_en": "I had a traditional upbringing in a large family.", "ex_zh": "我在一个大家庭里接受了传统的养育。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0025", "unit": "Unit 1"}, {"word": "active role", "pron": "ˈæktɪv rəʊl", "part_of_speech": "n.", "pos": "n.", "def_en": "a role in which you take part and make a difference", "def_zh": "积极的角色；主动参与", "quote_en": "Fathers are now taking a more active role in raising children.", "quote_zh": "如今父亲在养育孩子方面扮演着更积极的角色。", "ex_en": "My parents took an active role in my education.", "ex_zh": "我的父母积极参与我的教育。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0026", "unit": "Unit 1"}, {"word": "extended family", "pron": "ɪkˈstendɪd ˈfæməli", "part_of_speech": "n.", "pos": "n.", "def_en": "a family including grandparents, aunts, uncles and cousins", "def_zh": "大家庭；扩展家庭", "quote_en": "In some countries the extended family lives in the same house.", "quote_zh": "在一些国家，大家庭成员住在同一所房子里。", "ex_en": "My extended family meets every New Year.", "ex_zh": "我的大家庭每年新年都会聚会。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0027", "unit": "Unit 1"}, {"word": "family gathering", "pron": "ˈfæməli ˈɡæðərɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "an occasion when family members meet together", "def_zh": "家庭聚会", "quote_en": "Family gathering is an important part of Chinese festivals.", "quote_zh": "家庭聚会是中国节日的重要组成部分。", "ex_en": "We have a big family gathering every summer.", "ex_zh": "我们每年夏天都有一次盛大的家庭聚会。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0028", "unit": "Unit 1"}, {"word": "immediate family", "pron": "ɪˈmiːdiət ˈfæməli", "part_of_speech": "n.", "pos": "n.", "def_en": "your parents, brothers, sisters, husband, wife and children", "def_zh": "直系亲属；近亲", "quote_en": "Only the immediate family attended the private ceremony.", "quote_zh": "只有直系亲属参加了这场私人仪式。", "ex_en": "My immediate family lives in the same city as me.", "ex_zh": "我的直系亲属和我住在同一座城市。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0029", "unit": "Unit 1"}, {"word": "maternal instinct", "pron": "məˈtɜːnl ˈɪnstɪŋkt", "part_of_speech": "n.", "pos": "n.", "def_en": "a mother's natural urge to protect and care for her child", "def_zh": "母性本能", "quote_en": "Maternal instinct is found in many animal species.", "quote_zh": "母性本能存在于许多动物物种中。", "ex_en": "She said her maternal instinct told her the baby was ill.", "ex_zh": "她说她的母性本能告诉她宝宝病了。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0030", "unit": "Unit 1"}, {"word": "sibling rivalry", "pron": "ˈsɪblɪŋ ˈraɪvlri", "part_of_speech": "n.", "pos": "n.", "def_en": "competition and jealousy between brothers and sisters", "def_zh": "兄弟姐妹间的竞争", "quote_en": "Sibling rivalry often decreases as children grow older.", "quote_zh": "随着孩子长大，兄弟姐妹间的竞争通常会减弱。", "ex_en": "We had a lot of sibling rivalry when we were young.", "ex_zh": "我们小时候兄弟姐妹间有很多竞争。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0031", "unit": "Unit 1"}, {"word": "stable upbringing", "pron": "ˈsteɪbl ˈʌpbrɪŋɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "a childhood with a secure and steady home life", "def_zh": "稳定的成长环境", "quote_en": "A stable upbringing gives children a sense of security.", "quote_zh": "稳定的成长环境给孩子安全感。", "ex_en": "I was lucky to have a stable upbringing.", "ex_zh": "我很幸运拥有稳定的成长环境。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0032", "unit": "Unit 1"}, {"word": "striking resemblance", "pron": "ˈstraɪkɪŋ rɪˈzembləns", "part_of_speech": "n.", "pos": "n.", "def_en": "a very noticeable similarity in appearance", "def_zh": "惊人的相似", "quote_en": "The boy bears a striking resemblance to his grandfather.", "quote_zh": "这个男孩和他祖父长得惊人地相似。", "ex_en": "She has a striking resemblance to her mother.", "ex_zh": "她和她母亲长得惊人地相似。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0033", "unit": "Unit 1"}, {"word": "close", "pron": "kləʊs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having a strong and friendly relationship", "def_zh": "亲密的；亲近的", "quote_en": "Close relationships with friends reduce stress in later life.", "quote_zh": "与朋友的亲密关系能减轻晚年的压力。", "ex_en": "I am very close to my cousin.", "ex_zh": "我和我的表亲非常亲近。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0034", "unit": "Unit 1"}, {"word": "close-knit", "pron": "ˌkləʊs ˈnɪt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "(of a group) united by strong relationships", "def_zh": "关系紧密的；团结的", "quote_en": "Close-knit communities often provide strong support for families.", "quote_zh": "关系紧密的社区常常为家庭提供有力的支持。", "ex_en": "I grew up in a close-knit family.", "ex_zh": "我在一个关系紧密的家庭中长大。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0035", "unit": "Unit 1"}, {"word": "maternal", "pron": "məˈtɜːnl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to a mother; like a mother", "def_zh": "母亲的；母性的", "quote_en": "Maternal care is vital during the first years of life.", "quote_zh": "母亲的照料在生命最初几年至关重要。", "ex_en": "My maternal grandmother lives in the countryside.", "ex_zh": "我的外婆住在乡下。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0036", "unit": "Unit 1"}, {"word": "parental", "pron": "pəˈrentl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to parents", "def_zh": "父母的；双亲的", "quote_en": "Parental guidance is important when children use the internet.", "quote_zh": "孩子上网时，父母的指导很重要。", "ex_en": "I need parental permission to go on the school trip.", "ex_zh": "我需要父母同意才能参加学校旅行。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0037", "unit": "Unit 1"}, {"word": "rewarding", "pron": "rɪˈwɔːdɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "giving you satisfaction or a feeling of success", "def_zh": "有益的；令人满意的", "quote_en": "Raising a child can be a difficult but rewarding experience.", "quote_zh": "养育孩子可能很艰难，但也很有收获。", "ex_en": "Teaching is a very rewarding job.", "ex_zh": "教书是一份非常有成就感的工作。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0038", "unit": "Unit 1"}, {"word": "stable", "pron": "ˈsteɪbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "firmly fixed and not likely to change suddenly", "def_zh": "稳定的；安稳的", "quote_en": "Children from stable families tend to perform better at school.", "quote_zh": "来自稳定家庭的孩子往往在学校表现更好。", "ex_en": "My parents have a stable income.", "ex_zh": "我父母的收入很稳定。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0039", "unit": "Unit 1"}, {"word": "accommodate", "pron": "əˈkɒmədeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to provide space for; to adjust to fit someone's needs", "def_zh": "容纳；适应；为…提供住处", "quote_en": "Families must accommodate the needs of both young and old members.", "quote_zh": "家庭必须照顾到年轻成员和年长成员的需要。", "ex_en": "The hotel can accommodate up to two hundred guests.", "ex_zh": "这家酒店最多可容纳两百位客人。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0040", "unit": "Unit 1"}, {"word": "adopt", "pron": "əˈdɒpt", "part_of_speech": "v.", "pos": "v.", "def_en": "to legally take a child into your family; to start using", "def_zh": "收养；采用", "quote_en": "Many couples decide to adopt a child from overseas.", "quote_zh": "许多夫妇决定收养一个海外的孩子。", "ex_en": "My aunt and uncle want to adopt a baby girl.", "ex_zh": "我姑姑和姑父想收养一个女婴。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0041", "unit": "Unit 1"}, {"word": "break down", "pron": "breɪk daʊn", "part_of_speech": "v.", "pos": "v.", "def_en": "to fail or stop working; to divide into parts", "def_zh": "崩溃；失败；分解", "quote_en": "Communication can break down when parents are always busy.", "quote_zh": "当父母总是很忙时，沟通可能会中断。", "ex_en": "I hope my car doesn't break down on the way to work.", "ex_zh": "我希望我的车上班路上不要抛锚。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0042", "unit": "Unit 1"}, {"word": "develop", "pron": "dɪˈveləp", "part_of_speech": "v.", "pos": "v.", "def_en": "to grow or change into something more advanced", "def_zh": "发展；成长；培养", "quote_en": "Children develop social skills by playing with others.", "quote_zh": "孩子通过与他人玩耍来培养社交技能。", "ex_en": "I want to develop my English speaking skills.", "ex_zh": "我想提高我的英语口语能力。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0043", "unit": "Unit 1"}, {"word": "endure", "pron": "ɪnˈdjʊə", "part_of_speech": "v.", "pos": "v.", "def_en": "to suffer something difficult or painful for a long time", "def_zh": "忍受；持续", "quote_en": "Some families endure great hardship during economic crises.", "quote_zh": "一些家庭在经济危机期间忍受着巨大的艰辛。", "ex_en": "I cannot endure noisy neighbours any longer.", "ex_zh": "我再也无法忍受吵闹的邻居了。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0044", "unit": "Unit 1"}, {"word": "establish", "pron": "ɪˈstæblɪʃ", "part_of_speech": "v.", "pos": "v.", "def_en": "to set up or create something that will last", "def_zh": "建立；确立", "quote_en": "Parents should establish clear rules at home.", "quote_zh": "父母应该在家里建立明确的规矩。", "ex_en": "I want to establish a good routine for studying.", "ex_zh": "我想建立一个良好的学习作息。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0045", "unit": "Unit 1"}, {"word": "inherit", "pron": "ɪnˈherɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to receive money, property or qualities from someone who has died or from your parents", "def_zh": "继承；遗传", "quote_en": "Children often inherit their parents' appearance and habits.", "quote_zh": "孩子常常遗传父母的外貌和习惯。", "ex_en": "I will inherit my grandmother's old piano one day.", "ex_zh": "有一天我会继承我奶奶的旧钢琴。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0046", "unit": "Unit 1"}, {"word": "interact", "pron": "ˌɪntərˈækt", "part_of_speech": "v.", "pos": "v.", "def_en": "to communicate or work together with others", "def_zh": "互动；相互作用", "quote_en": "Young children learn by interacting with adults and other children.", "quote_zh": "幼儿通过与成人和其他孩子互动来学习。", "ex_en": "I like to interact with students from different countries.", "ex_zh": "我喜欢和来自不同国家的学生交流。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0047", "unit": "Unit 1"}, {"word": "nurture", "pron": "ˈnɜːtʃə", "part_of_speech": "v.", "pos": "v.", "def_en": "to care for and help someone or something to grow", "def_zh": "养育；培育", "quote_en": "Good teachers nurture talent rather than simply teach facts.", "quote_zh": "好老师培养天赋，而不仅仅是教授知识。", "ex_en": "Parents should nurture their children's interests.", "ex_zh": "父母应该培养孩子的兴趣。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0048", "unit": "Unit 1"}, {"word": "relate", "pron": "rɪˈleɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to be connected to; to understand someone's feelings", "def_zh": "与…有关；理解（某人）", "quote_en": "Studies relate poor sleep to lower exam results.", "quote_zh": "研究把睡眠不足与较低的考试成绩联系起来。", "ex_en": "I can relate to her because I had the same problem.", "ex_zh": "我能理解她，因为我也遇到过同样的问题。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0049", "unit": "Unit 1"}, {"word": "have something in common", "pron": "hæv ˈsʌmθɪŋ ɪn ˈkɒmən", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to share interests or characteristics with someone", "def_zh": "有共同点", "quote_en": "Close friends usually have something in common.", "quote_zh": "亲密的朋友通常有共同点。", "ex_en": "We have something in common: we both love football.", "ex_zh": "我们有个共同点：我们都喜欢足球。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0050", "unit": "Unit 1"}, {"word": "play a role", "pron": "pleɪ ə rəʊl", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to have an influence or effect on something", "def_zh": "起作用；扮演角色", "quote_en": "Grandparents play a role in raising children in many families.", "quote_zh": "在许多家庭中，祖父母在养育孩子方面起着作用。", "ex_en": "Sports can play a role in making you more confident.", "ex_zh": "体育运动可以在增强自信方面起作用。", "chapter": "Unit 1 · Growing Up · 成长", "id": "w0051", "unit": "Unit 1"}, {"word": "ability", "pron": "əˈbɪləti", "part_of_speech": "n.", "pos": "n.", "def_en": "the power or skill to do something", "def_zh": "能力；才能", "quote_en": "A child's ability to learn languages is greatest before the age of ten.", "quote_zh": "孩子学习语言的能力在十岁之前最强。", "ex_en": "She has the ability to stay calm under pressure.", "ex_zh": "她有在压力下保持冷静的能力。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0052", "unit": "Unit 2"}, {"word": "adolescent", "pron": "ˌædəˈlesnt", "part_of_speech": "n.", "pos": "n.", "def_en": "a young person who is developing into an adult", "def_zh": "青少年", "quote_en": "An adolescent often wants more independence from the family.", "quote_zh": "青少年常常希望脱离家庭获得更多独立。", "ex_en": "When I was an adolescent, I spent hours on my phone.", "ex_zh": "我还是青少年时，花很多时间玩手机。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0053", "unit": "Unit 2"}, {"word": "behaviour", "pron": "bɪˈheɪvjə", "part_of_speech": "n.", "pos": "n.", "def_en": "the way a person acts", "def_zh": "行为；举止", "quote_en": "Violent games may affect children's behaviour at school.", "quote_zh": "暴力游戏可能影响孩子在学校的行为。", "ex_en": "His behaviour at the party was embarrassing.", "ex_zh": "他在聚会上的举止令人尴尬。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0054", "unit": "Unit 2"}, {"word": "concept", "pron": "ˈkɒnsept", "part_of_speech": "n.", "pos": "n.", "def_en": "an idea or principle", "def_zh": "概念；观念", "quote_en": "Young children find it hard to understand the concept of time.", "quote_zh": "幼儿很难理解时间的概念。", "ex_en": "The concept of recycling is new to some people.", "ex_zh": "回收利用的概念对一些人来说很新鲜。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0055", "unit": "Unit 2"}, {"word": "consequence", "pron": "ˈkɒnsɪkwəns", "part_of_speech": "n.", "pos": "n.", "def_en": "a result of an action or situation", "def_zh": "后果；结果", "quote_en": "Skipping school can have serious consequences for a teenager's future.", "quote_zh": "逃学可能对青少年的未来造成严重后果。", "ex_en": "Every choice has a consequence.", "ex_zh": "每个选择都有后果。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0056", "unit": "Unit 2"}, {"word": "gesture", "pron": "ˈdʒestʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "a movement of the hand or body that expresses an idea", "def_zh": "手势；姿态", "quote_en": "A friendly gesture can help babies feel safe.", "quote_zh": "友好的手势能让婴儿感到安全。", "ex_en": "He made a rude gesture at the driver.", "ex_zh": "他对司机做了一个粗鲁的手势。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0057", "unit": "Unit 2"}, {"word": "growth", "pron": "ɡrəʊθ", "part_of_speech": "n.", "pos": "n.", "def_en": "the process of increasing in size or developing", "def_zh": "成长；增长", "quote_en": "Healthy food is essential for a child's growth.", "quote_zh": "健康的食物对孩子的成长至关重要。", "ex_en": "There has been rapid growth in the city's population.", "ex_zh": "这座城市的人口增长迅速。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0058", "unit": "Unit 2"}, {"word": "height", "pron": "haɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "how tall someone or something is", "def_zh": "身高；高度", "quote_en": "A person's height is partly decided by their genes.", "quote_zh": "一个人的身高部分由基因决定。", "ex_en": "What is your height?", "ex_zh": "你的身高是多少？", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0059", "unit": "Unit 2"}, {"word": "imagination", "pron": "ɪˌmædʒɪˈneɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the ability to form pictures or ideas in your mind", "def_zh": "想象力", "quote_en": "Reading stories stimulates a child's imagination.", "quote_zh": "读故事能激发孩子的想象力。", "ex_en": "You need a lot of imagination to write fiction.", "ex_zh": "写小说需要很强的想象力。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0060", "unit": "Unit 2"}, {"word": "infancy", "pron": "ˈɪnfənsi", "part_of_speech": "n.", "pos": "n.", "def_en": "the time when you are a baby or very young child", "def_zh": "婴儿期；幼年", "quote_en": "Most speech patterns are learned in infancy.", "quote_zh": "大多数说话方式是在婴儿期学会的。", "ex_en": "The company is still in its infancy.", "ex_zh": "这家公司仍处于起步阶段。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0061", "unit": "Unit 2"}, {"word": "infant", "pron": "ˈɪnfənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a baby or very young child", "def_zh": "婴儿；幼儿", "quote_en": "An infant needs to be fed every few hours.", "quote_zh": "婴儿每隔几个小时就需要喂养。", "ex_en": "The infant slept quietly in her mother's arms.", "ex_zh": "婴儿安静地睡在妈妈的怀里。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0062", "unit": "Unit 2"}, {"word": "knowledge", "pron": "ˈnɒlɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "information and understanding that you have gained", "def_zh": "知识；了解", "quote_en": "Children acquire knowledge through play and exploration.", "quote_zh": "孩子通过玩耍和探索获得知识。", "ex_en": "My knowledge of history is quite limited.", "ex_zh": "我的历史知识相当有限。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0063", "unit": "Unit 2"}, {"word": "maturity", "pron": "məˈtʃʊərəti", "part_of_speech": "n.", "pos": "n.", "def_en": "the quality of behaving like a sensible adult", "def_zh": "成熟；成年", "quote_en": "Emotional maturity does not always come with age.", "quote_zh": "情感上的成熟并不总是随着年龄而来。", "ex_en": "She showed great maturity in handling the problem.", "ex_zh": "她处理这个问题时表现得非常成熟。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0064", "unit": "Unit 2"}, {"word": "memory", "pron": "ˈmeməri", "part_of_speech": "n.", "pos": "n.", "def_en": "the ability to remember; something you remember", "def_zh": "记忆；记性；回忆", "quote_en": "Regular exercise can improve memory in older adults.", "quote_zh": "定期锻炼可以改善老年人的记忆力。", "ex_en": "I have a good memory for faces.", "ex_zh": "我很擅长记人脸。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0065", "unit": "Unit 2"}, {"word": "milestone", "pron": "ˈmaɪlstəʊn", "part_of_speech": "n.", "pos": "n.", "def_en": "an important event in a person's life or development", "def_zh": "里程碑；重要阶段", "quote_en": "Learning to walk is a major milestone for a toddler.", "quote_zh": "学会走路是幼儿的一个重要里程碑。", "ex_en": "Getting my driving licence was an important milestone.", "ex_zh": "拿到驾照是一个重要的里程碑。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0066", "unit": "Unit 2"}, {"word": "mind", "pron": "maɪnd", "part_of_speech": "n.", "pos": "n.", "def_en": "your thoughts and ability to think", "def_zh": "头脑；思想；心智", "quote_en": "A child's mind develops fastest in the first three years.", "quote_zh": "孩子的心智在头三年发展最快。", "ex_en": "My mind is full of ideas for the project.", "ex_zh": "我满脑子都是这个项目的想法。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0067", "unit": "Unit 2"}, {"word": "peers", "pron": "pɪəz", "part_of_speech": "n.", "pos": "n.", "def_en": "people of the same age or status as you", "def_zh": "同龄人；同辈", "quote_en": "Teenagers are strongly influenced by their peers.", "quote_zh": "青少年深受同龄人的影响。", "ex_en": "I get on well with my peers at university.", "ex_zh": "我和大学里的同龄人相处得很好。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0068", "unit": "Unit 2"}, {"word": "period", "pron": "ˈpɪəriəd", "part_of_speech": "n.", "pos": "n.", "def_en": "a length of time", "def_zh": "时期；阶段", "quote_en": "Adolescence is a period of rapid change.", "quote_zh": "青春期是快速变化的时期。", "ex_en": "I lived abroad for a short period.", "ex_zh": "我在国外住过一小段时间。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0069", "unit": "Unit 2"}, {"word": "phase", "pron": "feɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "a stage in a process of development", "def_zh": "阶段；时期", "quote_en": "Many children go through a phase of asking endless questions.", "quote_zh": "许多孩子会经历一个不停提问的阶段。", "ex_en": "It's just a phase; he will grow out of it.", "ex_zh": "这只是一个阶段，他长大后就会好的。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0070", "unit": "Unit 2"}, {"word": "rate", "pron": "reɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "the speed or frequency at which something happens", "def_zh": "速度；比率", "quote_en": "Children develop at different rates.", "quote_zh": "孩子们的发育速度各不相同。", "ex_en": "The birth rate in many countries is falling.", "ex_zh": "许多国家的出生率在下降。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0071", "unit": "Unit 2"}, {"word": "reminder", "pron": "rɪˈmaɪndə", "part_of_speech": "n.", "pos": "n.", "def_en": "something that makes you remember", "def_zh": "提醒；提示物", "quote_en": "Photographs are a powerful reminder of the past.", "quote_zh": "照片是对过去有力的提醒。", "ex_en": "I set a reminder on my phone for the meeting.", "ex_zh": "我在手机上为会议设了一个提醒。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0072", "unit": "Unit 2"}, {"word": "social skills", "pron": "ˈsəʊʃl skɪlz", "part_of_speech": "n.", "pos": "n.", "def_en": "the ability to communicate and get on well with other people", "def_zh": "社交能力", "quote_en": "Group activities help children develop good social skills.", "quote_zh": "集体活动有助于孩子培养良好的社交能力。", "ex_en": "I joined a club to improve my social skills.", "ex_zh": "我加入了一个社团来提高社交能力。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0073", "unit": "Unit 2"}, {"word": "skill", "pron": "skɪl", "part_of_speech": "n.", "pos": "n.", "def_en": "the ability to do something well", "def_zh": "技能；技巧", "quote_en": "Reading is the most important skill children learn at school.", "quote_zh": "阅读是孩子在学校学到的最重要的技能。", "ex_en": "Cooking is a useful life skill.", "ex_zh": "烹饪是一项有用的生活技能。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0074", "unit": "Unit 2"}, {"word": "stage", "pron": "steɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a particular point in a process or development", "def_zh": "阶段；时期", "quote_en": "Each stage of child development has its own challenges.", "quote_zh": "儿童成长的每个阶段都有各自的挑战。", "ex_en": "I am at an early stage of learning English.", "ex_zh": "我正处于学习英语的早期阶段。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0075", "unit": "Unit 2"}, {"word": "toddler", "pron": "ˈtɒdlə", "part_of_speech": "n.", "pos": "n.", "def_en": "a very young child who is learning to walk", "def_zh": "学步的幼儿", "quote_en": "A toddler needs constant supervision.", "quote_zh": "学步的幼儿需要时刻有人看护。", "ex_en": "My nephew is a toddler and he never stops running.", "ex_zh": "我的侄子刚学会走路，一刻也不停地跑。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0076", "unit": "Unit 2"}, {"word": "transition", "pron": "trænˈzɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a change from one state or stage to another", "def_zh": "过渡；转变", "quote_en": "The transition from primary to secondary school can be difficult.", "quote_zh": "从小学到中学的过渡可能很困难。", "ex_en": "Moving abroad was a big transition for me.", "ex_zh": "搬到国外对我来说是一个很大的转变。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0077", "unit": "Unit 2"}, {"word": "abstract", "pron": "ˈæbstrækt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "existing as an idea rather than a physical thing", "def_zh": "抽象的", "quote_en": "Young children find abstract ideas difficult to understand.", "quote_zh": "幼儿觉得抽象的概念很难理解。", "ex_en": "I find abstract art hard to appreciate.", "ex_zh": "我觉得抽象艺术很难欣赏。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0078", "unit": "Unit 2"}, {"word": "cognitive", "pron": "ˈkɒɡnətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "related to thinking and understanding", "def_zh": "认知的", "quote_en": "Cognitive development accelerates during early childhood.", "quote_zh": "认知发展在幼儿期加速。", "ex_en": "Puzzles are good for cognitive skills.", "ex_zh": "拼图游戏有益于认知能力。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0079", "unit": "Unit 2"}, {"word": "clumsy", "pron": "ˈklʌmzi", "part_of_speech": "adj.", "pos": "adj.", "def_en": "moving or doing things in a careless, awkward way", "def_zh": "笨拙的；笨手笨脚的", "quote_en": "Toddlers are often clumsy because their coordination is still developing.", "quote_zh": "幼儿常常笨手笨脚，因为他们的协调能力仍在发育。", "ex_en": "I'm so clumsy that I always spill my drink.", "ex_zh": "我太笨手笨脚了，总是打翻饮料。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0080", "unit": "Unit 2"}, {"word": "fond", "pron": "fɒnd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having a liking for someone or something", "def_zh": "喜爱的；喜欢的", "quote_en": "Most children are fond of their grandparents.", "quote_zh": "大多数孩子都喜欢自己的祖父母。", "ex_en": "I am very fond of my little cousin.", "ex_zh": "我非常喜欢我的小表弟。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0081", "unit": "Unit 2"}, {"word": "fully-grown", "pron": "ˌfʊli ˈɡrəʊn", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having reached full size and development", "def_zh": "完全长成的；成熟的", "quote_en": "A fully-grown elephant can weigh over five tonnes.", "quote_zh": "一头完全长成的大象体重可超过五吨。", "ex_en": "The puppy will be fully-grown in about a year.", "ex_zh": "这只小狗大约一年后会完全长大。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0082", "unit": "Unit 2"}, {"word": "immature", "pron": "ˌɪməˈtʃʊə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "behaving in a childish way; not fully developed", "def_zh": "不成熟的；幼稚的", "quote_en": "Teenagers are sometimes seen as emotionally immature.", "quote_zh": "青少年有时被认为情感上不成熟。", "ex_en": "It was immature of him to ignore the problem.", "ex_zh": "他对这个问题视而不见，真幼稚。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0083", "unit": "Unit 2"}, {"word": "independent", "pron": "ˌɪndɪˈpendənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not needing help or control from other people", "def_zh": "独立的", "quote_en": "Children become more independent as they grow up.", "quote_zh": "孩子长大后会变得更加独立。", "ex_en": "I want to be financially independent.", "ex_zh": "我想在经济上独立。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0084", "unit": "Unit 2"}, {"word": "irresponsible", "pron": "ˌɪrɪˈspɒnsəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not thinking about the results of your actions", "def_zh": "不负责任的", "quote_en": "It is irresponsible to leave young children at home alone.", "quote_zh": "把年幼的孩子独自留在家里是不负责任的。", "ex_en": "He was irresponsible with money when he was young.", "ex_zh": "他年轻时花钱毫无责任感。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0085", "unit": "Unit 2"}, {"word": "mature", "pron": "məˈtʃʊə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "fully grown; behaving in a sensible adult way", "def_zh": "成熟的", "quote_en": "A mature person can control their emotions.", "quote_zh": "成熟的人能够控制自己的情绪。", "ex_en": "She is very mature for her age.", "ex_zh": "就她的年龄而言，她非常成熟。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0086", "unit": "Unit 2"}, {"word": "patient", "pron": "ˈpeɪʃnt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to wait calmly without getting angry", "def_zh": "有耐心的", "quote_en": "Teachers of young children must be patient.", "quote_zh": "教幼儿的老师必须有耐心。", "ex_en": "You need to be patient when learning a language.", "ex_zh": "学习语言时你需要有耐心。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0087", "unit": "Unit 2"}, {"word": "rebellious", "pron": "rɪˈbeljəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "refusing to obey rules or authority", "def_zh": "叛逆的；反抗的", "quote_en": "Rebellious behaviour is common among teenagers.", "quote_zh": "叛逆行为在青少年中很常见。", "ex_en": "I was a rebellious teenager.", "ex_zh": "我年轻时很叛逆。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0088", "unit": "Unit 2"}, {"word": "significant", "pron": "sɪɡˈnɪfɪkənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "important or large enough to have an effect", "def_zh": "重要的；显著的", "quote_en": "The first five years have a significant impact on a child's future.", "quote_zh": "头五年对孩子的未来有重要影响。", "ex_en": "There was a significant improvement in my grades.", "ex_zh": "我的成绩有了显著提高。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0089", "unit": "Unit 2"}, {"word": "tolerant", "pron": "ˈtɒlərənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "willing to accept different opinions or behaviour", "def_zh": "宽容的；包容的", "quote_en": "A tolerant society respects people of all backgrounds.", "quote_zh": "宽容的社会尊重来自各种背景的人。", "ex_en": "My parents are tolerant of my choices.", "ex_zh": "我的父母包容我的选择。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0090", "unit": "Unit 2"}, {"word": "acquire", "pron": "əˈkwaɪə", "part_of_speech": "v.", "pos": "v.", "def_en": "to get or gain something, especially skills or knowledge", "def_zh": "获得；习得", "quote_en": "Children acquire language naturally through listening and imitation.", "quote_zh": "孩子通过倾听和模仿自然地习得语言。", "ex_en": "I want to acquire more work experience.", "ex_zh": "我想获得更多工作经验。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0091", "unit": "Unit 2"}, {"word": "gesture", "pron": "ˈdʒestʃə", "part_of_speech": "v.", "pos": "v.", "def_en": "to make a movement to show or express something", "def_zh": "做手势；示意", "quote_en": "Babies often gesture towards the things they want.", "quote_zh": "婴儿常常用手势指向他们想要的东西。", "ex_en": "Please gesture to me if you need help.", "ex_zh": "如果你需要帮助，请向我示意。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0092", "unit": "Unit 2"}, {"word": "grow", "pron": "ɡrəʊ", "part_of_speech": "v.", "pos": "v.", "def_en": "to become bigger or more developed", "def_zh": "成长；生长；变得", "quote_en": "Children grow quickly during their first two years.", "quote_zh": "孩子在头两年长得很快。", "ex_en": "I want to grow up and become a doctor.", "ex_zh": "我想长大后成为一名医生。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0093", "unit": "Unit 2"}, {"word": "imitate", "pron": "ˈɪmɪteɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to copy the way someone behaves or speaks", "def_zh": "模仿", "quote_en": "Young children imitate the adults around them.", "quote_zh": "幼儿模仿周围的成年人。", "ex_en": "My little brother likes to imitate cartoon characters.", "ex_zh": "我的小弟弟喜欢模仿卡通人物。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0094", "unit": "Unit 2"}, {"word": "master", "pron": "ˈmɑːstə", "part_of_speech": "v.", "pos": "v.", "def_en": "to learn something so well that you can do it perfectly", "def_zh": "掌握；精通", "quote_en": "It takes years to master a foreign language.", "quote_zh": "掌握一门外语需要很多年。", "ex_en": "I want to master the piano before I turn twenty.", "ex_zh": "我想在二十岁之前精通钢琴。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0095", "unit": "Unit 2"}, {"word": "mature", "pron": "məˈtʃʊə", "part_of_speech": "v.", "pos": "v.", "def_en": "to become fully developed or more sensible", "def_zh": "成熟；发育成熟", "quote_en": "Boys tend to mature later than girls.", "quote_zh": "男孩往往比女孩成熟得晚。", "ex_en": "I think I will mature a lot at university.", "ex_zh": "我想我在大学里会成熟很多。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0096", "unit": "Unit 2"}, {"word": "remember", "pron": "rɪˈmembə", "part_of_speech": "v.", "pos": "v.", "def_en": "to bring back a fact or event into your mind", "def_zh": "记得；想起", "quote_en": "Most people cannot remember anything from before the age of three.", "quote_zh": "大多数人记不起三岁之前的任何事情。", "ex_en": "I remember my first day at school clearly.", "ex_zh": "我清楚地记得我上学的第一天。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0097", "unit": "Unit 2"}, {"word": "remind", "pron": "rɪˈmaɪnd", "part_of_speech": "v.", "pos": "v.", "def_en": "to make someone remember something", "def_zh": "提醒；使想起", "quote_en": "Old photographs remind people of happy times.", "quote_zh": "旧照片让人想起快乐的时光。", "ex_en": "Please remind me to call my mother tonight.", "ex_zh": "请提醒我今晚给妈妈打电话。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0098", "unit": "Unit 2"}, {"word": "reminisce", "pron": "ˌremɪˈnɪs", "part_of_speech": "v.", "pos": "v.", "def_en": "to talk or think about happy times in the past", "def_zh": "回忆；追忆", "quote_en": "Elderly people often reminisce about their childhood.", "quote_zh": "老年人常常回忆他们的童年。", "ex_en": "We sat up late to reminisce about our school days.", "ex_zh": "我们熬夜回忆我们的学生时代。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0099", "unit": "Unit 2"}, {"word": "visualise", "pron": "ˈvɪʒuəlaɪz", "part_of_speech": "v.", "pos": "v.", "def_en": "to form a picture of something in your mind", "def_zh": "想象；设想", "quote_en": "Good readers visualise the scenes described in a story.", "quote_zh": "优秀的读者会在脑海中想象故事里描述的场景。", "ex_en": "I can visualise myself living in London.", "ex_zh": "我能想象自己住在伦敦的样子。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0100", "unit": "Unit 2"}, {"word": "typically", "pron": "ˈtɪpɪkli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "in the usual way; as is normal", "def_zh": "通常；典型地", "quote_en": "Children typically begin to speak at around twelve months.", "quote_zh": "孩子通常在大约十二个月大时开始说话。", "ex_en": "I typically wake up at seven o'clock.", "ex_zh": "我通常七点起床。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0101", "unit": "Unit 2"}, {"word": "look back", "pron": "lʊk bæk", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to think about the past", "def_zh": "回顾；回想", "quote_en": "When we look back on our school days, we see how much we have changed.", "quote_zh": "当我们回顾学生时代，就会发现自己变了多少。", "ex_en": "When I look back, I realise I was lucky.", "ex_zh": "回想起来，我意识到自己很幸运。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0102", "unit": "Unit 2"}, {"word": "throw a tantrum", "pron": "θrəʊ ə ˈtæntrəm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to suddenly shout and behave angrily like a small child", "def_zh": "发脾气；大吵大闹", "quote_en": "Toddlers often throw a tantrum when they cannot get what they want.", "quote_zh": "幼儿得不到想要的东西时常常发脾气。", "ex_en": "My little sister might throw a tantrum if we leave the supermarket now.", "ex_zh": "如果我们现在离开超市，我妹妹可能会发脾气。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0103", "unit": "Unit 2"}, {"word": "bear in mind", "pron": "beər ɪn maɪnd", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to remember something and consider it", "def_zh": "记住；牢记", "quote_en": "Parents should bear in mind that every child is different.", "quote_zh": "父母应该记住每个孩子都是不同的。", "ex_en": "Bear in mind that the shop closes at six.", "ex_zh": "请记住这家店六点关门。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0104", "unit": "Unit 2"}, {"word": "broaden the mind", "pron": "ˈbrɔːdn ðə maɪnd", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to give someone new experiences and ideas", "def_zh": "开阔眼界", "quote_en": "Travel can broaden the mind and increase tolerance.", "quote_zh": "旅行可以开阔眼界，增进宽容。", "ex_en": "Studying abroad can broaden the mind.", "ex_zh": "出国留学可以开阔眼界。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0105", "unit": "Unit 2"}, {"word": "have something in mind", "pron": "hæv ˈsʌmθɪŋ ɪn maɪnd", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to be thinking of a plan or idea", "def_zh": "心里有打算", "quote_en": "Do you have something in mind for your next holiday?", "quote_zh": "你下次假期有什么打算吗？", "ex_en": "I have something in mind for her birthday.", "ex_zh": "我心里已有她生日的打算。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0106", "unit": "Unit 2"}, {"word": "have something on your mind", "pron": "hæv ˈsʌmθɪŋ ɒn jɔː maɪnd", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to be worried or thinking about a problem", "def_zh": "心事重重；挂念某事", "quote_en": "Do you have something on your mind that you want to tell your parents?", "quote_zh": "你心里有什么想对父母说的事吗？", "ex_en": "You look quiet. Do you have something on your mind?", "ex_zh": "你看起来很安静，有什么心事吗？", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0107", "unit": "Unit 2"}, {"word": "it slipped my mind", "pron": "ɪt slɪpt maɪ maɪnd", "part_of_speech": "phrase", "pos": "phrase", "def_en": "I forgot about it", "def_zh": "我忘了", "quote_en": "Sorry, it slipped my mind that the meeting was today.", "quote_zh": "抱歉，我忘了会议是今天。", "ex_en": "I wanted to call you, but it slipped my mind.", "ex_zh": "我本想给你打电话，但我忘了。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0108", "unit": "Unit 2"}, {"word": "keep an open mind", "pron": "kiːp ən ˈəʊpən maɪnd", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to be willing to consider new ideas", "def_zh": "保持开放的心态", "quote_en": "Students should keep an open mind when studying other cultures.", "quote_zh": "学生在学习其他文化时应保持开放的心态。", "ex_en": "Please keep an open mind about the new plan.", "ex_zh": "对新计划请保持开放的心态。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0109", "unit": "Unit 2"}, {"word": "my mind went blank", "pron": "maɪ maɪnd went blæŋk", "part_of_speech": "phrase", "pos": "phrase", "def_en": "I suddenly could not remember or think of anything", "def_zh": "我脑子一片空白", "quote_en": "When the teacher asked the question, my mind went blank.", "quote_zh": "老师提问时，我脑子一片空白。", "ex_en": "In the exam, my mind went blank for a moment.", "ex_zh": "考试时，我有一刻脑子一片空白。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0110", "unit": "Unit 2"}, {"word": "put your mind at ease", "pron": "pʊt jɔː maɪnd æt iːz", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to stop someone feeling worried", "def_zh": "让你放心", "quote_en": "A clear explanation from the doctor will put your mind at ease.", "quote_zh": "医生清楚的解释会让你放心。", "ex_en": "Let me put your mind at ease: the flight is on time.", "ex_zh": "让我让你放心：航班准时。", "chapter": "Unit 2 · Mental and Physical Development · 身心发展", "id": "w0111", "unit": "Unit 2"}, {"word": "allergy", "pron": "ˈælədʒi", "part_of_speech": "n.", "pos": "n.", "def_en": "a medical condition in which your body reacts badly to a substance", "def_zh": "过敏症", "quote_en": "A peanut allergy can cause a serious reaction in some children.", "quote_zh": "花生过敏可能使一些孩子出现严重反应。", "ex_en": "I have an allergy to cats.", "ex_zh": "我对猫过敏。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0112", "unit": "Unit 3"}, {"word": "anxiety", "pron": "æŋˈzaɪəti", "part_of_speech": "n.", "pos": "n.", "def_en": "a feeling of worry or fear", "def_zh": "焦虑；忧虑", "quote_en": "Exercise can reduce anxiety and improve mood.", "quote_zh": "锻炼可以减轻焦虑、改善情绪。", "ex_en": "I feel a lot of anxiety before exams.", "ex_zh": "考试前我感到非常焦虑。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0113", "unit": "Unit 3"}, {"word": "appetite", "pron": "ˈæpɪtaɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "the desire to eat food", "def_zh": "食欲；胃口", "quote_en": "Stress can cause a loss of appetite.", "quote_zh": "压力可能导致食欲不振。", "ex_en": "I have a big appetite after playing sport.", "ex_zh": "运动后我胃口很大。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0114", "unit": "Unit 3"}, {"word": "artery", "pron": "ˈɑːtəri", "part_of_speech": "n.", "pos": "n.", "def_en": "a tube that carries blood from the heart to the body", "def_zh": "动脉", "quote_en": "A diet high in fat can block the arteries.", "quote_zh": "高脂肪饮食会堵塞动脉。", "ex_en": "The doctor checked the artery in my neck.", "ex_zh": "医生检查了我脖子上的动脉。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0115", "unit": "Unit 3"}, {"word": "asset", "pron": "ˈæset", "part_of_speech": "n.", "pos": "n.", "def_en": "something valuable or useful", "def_zh": "资产；有价值的东西", "quote_en": "Good health is our most valuable asset.", "quote_zh": "健康是我们最宝贵的财富。", "ex_en": "Your sense of humour is a great asset.", "ex_zh": "你的幽默感是一大优势。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0116", "unit": "Unit 3"}, {"word": "benefit", "pron": "ˈbenɪfɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "a good effect or advantage", "def_zh": "益处；好处", "quote_en": "Regular walking has many health benefits.", "quote_zh": "经常散步对健康有许多益处。", "ex_en": "The main benefit of cycling is that it is free.", "ex_zh": "骑自行车的主要好处是不用花钱。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0117", "unit": "Unit 3"}, {"word": "cravings", "pron": "ˈkreɪvɪŋz", "part_of_speech": "n.", "pos": "n.", "def_en": "strong desires for something, especially food", "def_zh": "渴望；强烈的食欲", "quote_en": "Sugar cravings are hard to control for many people.", "quote_zh": "对糖的渴望让许多人难以控制。", "ex_en": "I get cravings for chocolate in the afternoon.", "ex_zh": "我下午总会特别想吃巧克力。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0118", "unit": "Unit 3"}, {"word": "depression", "pron": "dɪˈpreʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a medical condition of deep sadness; a period of economic decline", "def_zh": "抑郁；萧条", "quote_en": "Regular exercise can help to prevent depression.", "quote_zh": "定期锻炼有助于预防抑郁。", "ex_en": "Doctors say that depression is a common illness.", "ex_zh": "医生说抑郁是一种常见的疾病。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0119", "unit": "Unit 3"}, {"word": "diagnosis", "pron": "ˌdaɪəɡˈnəʊsɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "the identification of an illness by a doctor", "def_zh": "诊断", "quote_en": "An early diagnosis improves the chance of recovery.", "quote_zh": "早期诊断能提高康复的机会。", "ex_en": "The doctor gave me a diagnosis after the tests.", "ex_zh": "检查之后医生给了我诊断结果。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0120", "unit": "Unit 3"}, {"word": "diet", "pron": "ˈdaɪət", "part_of_speech": "n.", "pos": "n.", "def_en": "the food you usually eat; a special eating plan", "def_zh": "饮食；节食", "quote_en": "A balanced diet includes plenty of fruit and vegetables.", "quote_zh": "均衡饮食包括大量水果和蔬菜。", "ex_en": "I am trying to follow a healthy diet.", "ex_zh": "我正在努力保持健康饮食。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0121", "unit": "Unit 3"}, {"word": "dietician", "pron": "ˌdaɪəˈtɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "an expert who advises people about food and health", "def_zh": "营养师", "quote_en": "A dietician can help patients plan healthy meals.", "quote_zh": "营养师可以帮助患者规划健康的饮食。", "ex_en": "I made an appointment to see a dietician.", "ex_zh": "我预约了一位营养师。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0122", "unit": "Unit 3"}, {"word": "disease", "pron": "dɪˈziːz", "part_of_speech": "n.", "pos": "n.", "def_en": "an illness of the body", "def_zh": "疾病", "quote_en": "Poor diet is linked to heart disease.", "quote_zh": "不良饮食与心脏病有关。", "ex_en": "Washing your hands can stop the spread of disease.", "ex_zh": "洗手可以阻止疾病传播。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0123", "unit": "Unit 3"}, {"word": "eating disorder", "pron": "ˈiːtɪŋ dɪsˈɔːdə", "part_of_speech": "n.", "pos": "n.", "def_en": "a mental health condition involving an unhealthy relationship with food", "def_zh": "饮食失调", "quote_en": "Social media may contribute to an eating disorder among teenagers.", "quote_zh": "社交媒体可能导致青少年出现饮食失调。", "ex_en": "The school offers support for students with an eating disorder.", "ex_zh": "学校为饮食失调的学生提供支持。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0124", "unit": "Unit 3"}, {"word": "exercise", "pron": "ˈeksəsaɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "physical activity done to stay healthy", "def_zh": "运动；锻炼", "quote_en": "Regular exercise strengthens the heart.", "quote_zh": "定期锻炼可以增强心脏。", "ex_en": "I try to do some exercise every morning.", "ex_zh": "我尽量每天早上锻炼一下。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0125", "unit": "Unit 3"}, {"word": "factor", "pron": "ˈfæktə", "part_of_speech": "n.", "pos": "n.", "def_en": "one of the things that influence a result", "def_zh": "因素", "quote_en": "Stress is an important factor in many illnesses.", "quote_zh": "压力是许多疾病的重要因素。", "ex_en": "Cost was a key factor in my decision.", "ex_zh": "费用是我做决定的关键因素。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0126", "unit": "Unit 3"}, {"word": "fast food", "pron": "fɑːst fuːd", "part_of_speech": "n.", "pos": "n.", "def_en": "food that is prepared and served quickly", "def_zh": "快餐", "quote_en": "Eating too much fast food leads to weight gain.", "quote_zh": "吃太多快餐会导致体重增加。", "ex_en": "I only eat fast food once a week.", "ex_zh": "我一周只吃一次快餐。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0127", "unit": "Unit 3"}, {"word": "fat", "pron": "fæt", "part_of_speech": "n.", "pos": "n.", "def_en": "a substance in food that stores energy; the soft part of the body", "def_zh": "脂肪", "quote_en": "Too much saturated fat is bad for the heart.", "quote_zh": "摄入过多饱和脂肪对心脏不好。", "ex_en": "This yoghurt is low in fat.", "ex_zh": "这种酸奶脂肪含量低。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0128", "unit": "Unit 3"}, {"word": "harm", "pron": "hɑːm", "part_of_speech": "n.", "pos": "n.", "def_en": "damage or injury", "def_zh": "伤害；危害", "quote_en": "Smoking does great harm to the lungs.", "quote_zh": "吸烟对肺部有很大危害。", "ex_en": "A little chocolate will not do you any harm.", "ex_zh": "吃一点巧克力不会对你有什么害处。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0129", "unit": "Unit 3"}, {"word": "health", "pron": "helθ", "part_of_speech": "n.", "pos": "n.", "def_en": "the condition of your body and mind", "def_zh": "健康", "quote_en": "Good health depends on diet, exercise and sleep.", "quote_zh": "良好的健康取决于饮食、运动和睡眠。", "ex_en": "My grandfather is in good health for his age.", "ex_zh": "就他的年龄而言，我爷爷身体很健康。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0130", "unit": "Unit 3"}, {"word": "heart attack", "pron": "hɑːt əˈtæk", "part_of_speech": "n.", "pos": "n.", "def_en": "a sudden serious medical condition in which the heart stops working normally", "def_zh": "心脏病发作", "quote_en": "Obesity increases the risk of a heart attack.", "quote_zh": "肥胖会增加心脏病发作的风险。", "ex_en": "My uncle had a heart attack last year.", "ex_zh": "我叔叔去年心脏病发作过。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0131", "unit": "Unit 3"}, {"word": "infection", "pron": "ɪnˈfekʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a disease caused by bacteria or a virus", "def_zh": "感染", "quote_en": "Washing hands reduces the risk of infection.", "quote_zh": "洗手能降低感染的风险。", "ex_en": "I had a throat infection last week.", "ex_zh": "我上周喉咙感染了。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0132", "unit": "Unit 3"}, {"word": "ingredients", "pron": "ɪnˈɡriːdiənts", "part_of_speech": "n.", "pos": "n.", "def_en": "the foods that are used to make a particular dish", "def_zh": "配料；原料", "quote_en": "Fresh ingredients make meals healthier and tastier.", "quote_zh": "新鲜的食材让饭菜更健康、更美味。", "ex_en": "I bought all the ingredients for the soup.", "ex_zh": "我买齐了做这道汤的所有配料。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0133", "unit": "Unit 3"}, {"word": "insomnia", "pron": "ɪnˈsɒmniə", "part_of_speech": "n.", "pos": "n.", "def_en": "the condition of being unable to sleep", "def_zh": "失眠", "quote_en": "Too much caffeine can cause insomnia.", "quote_zh": "摄入过多咖啡因可能导致失眠。", "ex_en": "I suffer from insomnia when I'm worried.", "ex_zh": "我一担心就会失眠。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0134", "unit": "Unit 3"}, {"word": "intake", "pron": "ˈɪnteɪk", "part_of_speech": "n.", "pos": "n.", "def_en": "the amount of food or drink taken into the body", "def_zh": "摄入量", "quote_en": "Doctors advise reducing your salt intake.", "quote_zh": "医生建议减少盐的摄入量。", "ex_en": "My daily intake of water is about two litres.", "ex_zh": "我每天的饮水量大约两升。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0135", "unit": "Unit 3"}, {"word": "junk food", "pron": "dʒʌŋk fuːd", "part_of_speech": "n.", "pos": "n.", "def_en": "unhealthy food that is high in fat, sugar or salt", "def_zh": "垃圾食品", "quote_en": "Advertising of junk food to children should be banned.", "quote_zh": "应该禁止向儿童宣传垃圾食品。", "ex_en": "I try not to eat junk food during the week.", "ex_zh": "我尽量工作日不吃垃圾食品。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0136", "unit": "Unit 3"}, {"word": "muscle", "pron": "ˈmʌsl", "part_of_speech": "n.", "pos": "n.", "def_en": "a body tissue that produces movement", "def_zh": "肌肉", "quote_en": "Exercise helps to build muscle and burn fat.", "quote_zh": "锻炼有助于增肌和燃脂。", "ex_en": "I pulled a muscle in my leg during the game.", "ex_zh": "我在比赛中拉伤了腿部肌肉。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0137", "unit": "Unit 3"}, {"word": "nutrient", "pron": "ˈnjuːtriənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a substance that plants and animals need to grow and stay healthy", "def_zh": "营养物质", "quote_en": "Fruit and vegetables are rich in nutrients.", "quote_zh": "水果和蔬菜富含营养物质。", "ex_en": "Our body needs every nutrient to stay healthy.", "ex_zh": "我们的身体需要各种营养物质来保持健康。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0138", "unit": "Unit 3"}, {"word": "nutrition", "pron": "njuːˈtrɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the process of getting the food you need to stay healthy", "def_zh": "营养", "quote_en": "Good nutrition is essential for children's brain development.", "quote_zh": "良好的营养对儿童大脑发育至关重要。", "ex_en": "I studied nutrition at university.", "ex_zh": "我在大学学过营养学。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0139", "unit": "Unit 3"}, {"word": "obesity", "pron": "əʊˈbiːsəti", "part_of_speech": "n.", "pos": "n.", "def_en": "the condition of being very overweight", "def_zh": "肥胖", "quote_en": "Obesity has become a serious problem in many countries.", "quote_zh": "肥胖在许多国家已成为严重的问题。", "ex_en": "Obesity can lead to diabetes and heart disease.", "ex_zh": "肥胖可能导致糖尿病和心脏病。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0140", "unit": "Unit 3"}, {"word": "onset", "pron": "ˈɒnset", "part_of_speech": "n.", "pos": "n.", "def_en": "the beginning of something, especially something unpleasant", "def_zh": "开始；发作", "quote_en": "Exercise can delay the onset of many diseases.", "quote_zh": "锻炼可以延缓许多疾病的发作。", "ex_en": "The onset of winter brings colds and flu.", "ex_zh": "冬天的开始带来感冒和流感。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0141", "unit": "Unit 3"}, {"word": "portion", "pron": "ˈpɔːʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "an amount of food for one person", "def_zh": "一份（食物）；部分", "quote_en": "Smaller portions help people control their weight.", "quote_zh": "较小的份量有助于人们控制体重。", "ex_en": "I only ate a small portion of cake.", "ex_zh": "我只吃了一小份蛋糕。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0142", "unit": "Unit 3"}, {"word": "risk", "pron": "rɪsk", "part_of_speech": "n.", "pos": "n.", "def_en": "the possibility that something bad will happen", "def_zh": "风险；危险", "quote_en": "Smoking increases the risk of lung cancer.", "quote_zh": "吸烟会增加患肺癌的风险。", "ex_en": "There is a risk of rain this afternoon.", "ex_zh": "今天下午有下雨的可能。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0143", "unit": "Unit 3"}, {"word": "serving", "pron": "ˈsɜːvɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "an amount of food for one person", "def_zh": "一份食物", "quote_en": "Nutritionists recommend five servings of vegetables a day.", "quote_zh": "营养学家建议每天吃五份蔬菜。", "ex_en": "One serving of rice is enough for me.", "ex_zh": "一份米饭对我来说就够了。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0144", "unit": "Unit 3"}, {"word": "stress", "pron": "stres", "part_of_speech": "n.", "pos": "n.", "def_en": "pressure or worry caused by problems in your life", "def_zh": "压力；紧张", "quote_en": "Long-term stress can damage your health.", "quote_zh": "长期压力会损害你的健康。", "ex_en": "I'm under a lot of stress at work.", "ex_zh": "我工作压力很大。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0145", "unit": "Unit 3"}, {"word": "stroke", "pron": "strəʊk", "part_of_speech": "n.", "pos": "n.", "def_en": "a sudden illness caused by a blocked blood supply to the brain", "def_zh": "中风", "quote_en": "High blood pressure increases the risk of a stroke.", "quote_zh": "高血压会增加中风的风险。", "ex_en": "My grandfather had a stroke two years ago.", "ex_zh": "我爷爷两年前中过风。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0146", "unit": "Unit 3"}, {"word": "treatment", "pron": "ˈtriːtmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "medical care given to a patient", "def_zh": "治疗", "quote_en": "New treatment has improved survival rates for many patients.", "quote_zh": "新的治疗方法提高了许多患者的存活率。", "ex_en": "The treatment took about six weeks.", "ex_zh": "这次治疗大约持续了六周。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0147", "unit": "Unit 3"}, {"word": "therapy", "pron": "ˈθerəpi", "part_of_speech": "n.", "pos": "n.", "def_en": "treatment to help someone recover from an illness or problem", "def_zh": "疗法；治疗", "quote_en": "Physical therapy helps patients recover after an injury.", "quote_zh": "物理治疗帮助患者在受伤后康复。", "ex_en": "She goes to therapy once a week.", "ex_zh": "她每周去做一次治疗。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0148", "unit": "Unit 3"}, {"word": "variety", "pron": "vəˈraɪəti", "part_of_speech": "n.", "pos": "n.", "def_en": "a number of different types of things", "def_zh": "多样性；种类", "quote_en": "A variety of foods is important for a balanced diet.", "quote_zh": "食物种类多样对均衡饮食很重要。", "ex_en": "The cafe sells a wide variety of teas.", "ex_zh": "这家咖啡馆出售多种茶。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0149", "unit": "Unit 3"}, {"word": "weight", "pron": "weɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "how heavy someone or something is", "def_zh": "体重；重量", "quote_en": "Losing weight slowly is safer than crash dieting.", "quote_zh": "慢慢减重比快速节食更安全。", "ex_en": "I have put on some weight recently.", "ex_zh": "我最近长胖了一点。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0150", "unit": "Unit 3"}, {"word": "acute", "pron": "əˈkjuːt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "(of an illness) severe but short; very serious", "def_zh": "急性的；严重的", "quote_en": "Acute pain should be checked by a doctor immediately.", "quote_zh": "急性疼痛应立即由医生检查。", "ex_en": "There is an acute shortage of nurses in the hospital.", "ex_zh": "这家医院的护士严重短缺。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0151", "unit": "Unit 3"}, {"word": "allergic", "pron": "əˈlɜːdʒɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having an allergy", "def_zh": "过敏的", "quote_en": "Some children are allergic to milk or eggs.", "quote_zh": "有些孩子对牛奶或鸡蛋过敏。", "ex_en": "I'm allergic to pollen in spring.", "ex_zh": "我春天对花粉过敏。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0152", "unit": "Unit 3"}, {"word": "alternate", "pron": "ɔːlˈtɜːnət", "part_of_speech": "adj.", "pos": "adj.", "def_en": "happening one after the other in turn; every second", "def_zh": "交替的；隔一个的", "quote_en": "Alternate days of exercise and rest help the body recover.", "quote_zh": "锻炼和休息交替进行的日子有助于身体恢复。", "ex_en": "I go to the gym on alternate days.", "ex_zh": "我隔天去一次健身房。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0153", "unit": "Unit 3"}, {"word": "brisk", "pron": "brɪsk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "quick and energetic", "def_zh": "轻快的；有活力的", "quote_en": "A brisk walk for thirty minutes can improve heart health.", "quote_zh": "快步走三十分钟可以改善心脏健康。", "ex_en": "I take a brisk walk before breakfast.", "ex_zh": "我早餐前会快步走一走。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0154", "unit": "Unit 3"}, {"word": "chronic", "pron": "ˈkrɒnɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "lasting for a long time or often returning", "def_zh": "慢性的；长期的", "quote_en": "Chronic illnesses such as diabetes require long-term care.", "quote_zh": "糖尿病等慢性病需要长期护理。", "ex_en": "My grandmother suffers from chronic back pain.", "ex_zh": "我奶奶患有慢性背痛。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0155", "unit": "Unit 3"}, {"word": "harmful", "pron": "ˈhɑːmfl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "causing damage or injury", "def_zh": "有害的", "quote_en": "Too much sugar is harmful to teeth.", "quote_zh": "过多的糖对牙齿有害。", "ex_en": "Smoking is harmful to your health.", "ex_zh": "吸烟对健康有害。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0156", "unit": "Unit 3"}, {"word": "healthy", "pron": "ˈhelθi", "part_of_speech": "adj.", "pos": "adj.", "def_en": "in good physical condition; good for your health", "def_zh": "健康的；有益健康的", "quote_en": "A healthy lifestyle includes balanced meals and regular sleep.", "quote_zh": "健康的生活方式包括均衡饮食和规律睡眠。", "ex_en": "I try to eat healthy food every day.", "ex_zh": "我努力每天吃健康的食物。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0157", "unit": "Unit 3"}, {"word": "infectious", "pron": "ɪnˈfekʃəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "(of a disease) able to spread to other people", "def_zh": "传染性的", "quote_en": "Colds are highly infectious in crowded classrooms.", "quote_zh": "在拥挤的教室里，感冒极易传染。", "ex_en": "The doctor said the disease is infectious.", "ex_zh": "医生说这种病具有传染性。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0158", "unit": "Unit 3"}, {"word": "moderate", "pron": "ˈmɒdərət", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not extreme; of medium level", "def_zh": "适度的；中等的", "quote_en": "Moderate exercise is better than none at all.", "quote_zh": "适度的运动总比不运动好。", "ex_en": "I drink a moderate amount of coffee.", "ex_zh": "我喝适量的咖啡。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0159", "unit": "Unit 3"}, {"word": "obese", "pron": "əʊˈbiːs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very overweight in a way that is unhealthy", "def_zh": "肥胖的", "quote_en": "Obese patients are more likely to develop diabetes.", "quote_zh": "肥胖的患者更有可能患上糖尿病。", "ex_en": "The doctor warned him that he was obese.", "ex_zh": "医生警告他已经肥胖了。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0160", "unit": "Unit 3"}, {"word": "overweight", "pron": "ˈəʊvəweɪt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "heavier than is healthy", "def_zh": "超重的", "quote_en": "Many overweight children do not get enough exercise.", "quote_zh": "许多超重的孩子运动量不足。", "ex_en": "I'm a little overweight, so I'm going jogging.", "ex_zh": "我有点超重，所以我要去慢跑。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0161", "unit": "Unit 3"}, {"word": "persistent", "pron": "pəˈsɪstənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "continuing for a long time; refusing to give up", "def_zh": "持续的；坚持不懈的", "quote_en": "A persistent cough should be examined by a doctor.", "quote_zh": "持续咳嗽应该由医生检查。", "ex_en": "She is persistent and never gives up easily.", "ex_zh": "她很执着，从不轻易放弃。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0162", "unit": "Unit 3"}, {"word": "regular", "pron": "ˈreɡjələ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "happening at equal intervals; usual", "def_zh": "规律的；定期的", "quote_en": "Regular check-ups can detect problems early.", "quote_zh": "定期体检可以尽早发现问题。", "ex_en": "I go for a regular run on Sundays.", "ex_zh": "我周日定期去跑步。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0163", "unit": "Unit 3"}, {"word": "vital", "pron": "ˈvaɪtl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "extremely important and necessary", "def_zh": "至关重要的；必不可少的", "quote_en": "Sleep is vital for the body to repair itself.", "quote_zh": "睡眠对身体自我修复至关重要。", "ex_en": "It is vital that you drink enough water.", "ex_zh": "你必须喝足够的水，这一点至关重要。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0164", "unit": "Unit 3"}, {"word": "avoid", "pron": "əˈvɔɪd", "part_of_speech": "v.", "pos": "v.", "def_en": "to stay away from something or prevent it", "def_zh": "避免；躲开", "quote_en": "People with heart problems should avoid salty food.", "quote_zh": "有心脏问题的人应避免吃咸的食物。", "ex_en": "I try to avoid sugary drinks.", "ex_zh": "我尽量避免喝含糖饮料。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0165", "unit": "Unit 3"}, {"word": "counteract", "pron": "ˌkaʊntərˈækt", "part_of_speech": "v.", "pos": "v.", "def_en": "to reduce or stop the effect of something", "def_zh": "抵消；对抗", "quote_en": "Exercise can counteract the effects of a desk job.", "quote_zh": "运动可以抵消久坐办公的影响。", "ex_en": "Vitamin C may counteract the damage from smoking.", "ex_zh": "维生素C可能抵消吸烟造成的伤害。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0166", "unit": "Unit 3"}, {"word": "curb", "pron": "kɜːb", "part_of_speech": "v.", "pos": "v.", "def_en": "to control or limit something", "def_zh": "抑制；控制", "quote_en": "Governments should curb the sale of junk food to children.", "quote_zh": "政府应该限制向儿童出售垃圾食品。", "ex_en": "I need to curb my spending on snacks.", "ex_zh": "我需要控制自己在零食上的花费。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0167", "unit": "Unit 3"}, {"word": "cure", "pron": "kjʊə", "part_of_speech": "v.", "pos": "v.", "def_en": "to make an illness go away; a treatment that heals", "def_zh": "治愈；疗法", "quote_en": "Scientists are still searching for a cure for cancer.", "quote_zh": "科学家仍在寻找治愈癌症的方法。", "ex_en": "Antibiotics can cure many infections.", "ex_zh": "抗生素可以治愈许多感染。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0168", "unit": "Unit 3"}, {"word": "diminish", "pron": "dɪˈmɪnɪʃ", "part_of_speech": "v.", "pos": "v.", "def_en": "to become or make something smaller or less", "def_zh": "减少；减弱", "quote_en": "Regular exercise may diminish the risk of heart disease.", "quote_zh": "定期锻炼可以降低心脏病的风险。", "ex_en": "The pain began to diminish after a few days.", "ex_zh": "几天后疼痛开始减轻。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0169", "unit": "Unit 3"}, {"word": "disrupt", "pron": "dɪsˈrʌpt", "part_of_speech": "v.", "pos": "v.", "def_en": "to interrupt the normal way something works", "def_zh": "扰乱；打乱", "quote_en": "Late-night screen use can disrupt your sleep.", "quote_zh": "深夜使用屏幕会扰乱你的睡眠。", "ex_en": "Noise can disrupt my sleep at night.", "ex_zh": "噪音会在夜里扰乱我的睡眠。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0170", "unit": "Unit 3"}, {"word": "eliminate", "pron": "ɪˈlɪmɪneɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to completely remove something", "def_zh": "消除；根除", "quote_en": "It is impossible to eliminate stress from modern life.", "quote_zh": "不可能彻底消除现代生活中的压力。", "ex_en": "I'm trying to eliminate sugar from my diet.", "ex_zh": "我正努力从饮食中去掉糖。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0171", "unit": "Unit 3"}, {"word": "maintain", "pron": "meɪnˈteɪn", "part_of_speech": "v.", "pos": "v.", "def_en": "to keep something at the same level or in good condition", "def_zh": "保持；维持", "quote_en": "Eating well helps people maintain a healthy weight.", "quote_zh": "吃得好有助于人们保持健康的体重。", "ex_en": "I try to maintain a regular sleep schedule.", "ex_zh": "我努力保持规律的作息。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0172", "unit": "Unit 3"}, {"word": "overdo", "pron": "ˌəʊvəˈduː", "part_of_speech": "v.", "pos": "v.", "def_en": "to do something too much", "def_zh": "做得过火；过度", "quote_en": "Don't overdo exercise when you first start.", "quote_zh": "刚开始时不要运动过度。", "ex_en": "Be careful not to overdo it at the gym.", "ex_zh": "在健身房要小心别练过头。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0173", "unit": "Unit 3"}, {"word": "overeat", "pron": "ˌəʊvərˈiːt", "part_of_speech": "v.", "pos": "v.", "def_en": "to eat more than you need", "def_zh": "吃得过多", "quote_en": "People tend to overeat when they are stressed.", "quote_zh": "人们在有压力时往往会吃得过多。", "ex_en": "I always overeat at festivals.", "ex_zh": "我过节时总会吃得太多。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0174", "unit": "Unit 3"}, {"word": "prevent", "pron": "prɪˈvent", "part_of_speech": "v.", "pos": "v.", "def_en": "to stop something from happening", "def_zh": "预防；阻止", "quote_en": "A balanced diet can prevent many illnesses.", "quote_zh": "均衡饮食可以预防许多疾病。", "ex_en": "Wearing a helmet can prevent serious injury.", "ex_zh": "戴头盔可以防止严重受伤。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0175", "unit": "Unit 3"}, {"word": "recommend", "pron": "ˌrekəˈmend", "part_of_speech": "v.", "pos": "v.", "def_en": "to suggest that something is good or should be done", "def_zh": "推荐；建议", "quote_en": "Doctors recommend at least thirty minutes of exercise a day.", "quote_zh": "医生建议每天至少锻炼三十分钟。", "ex_en": "Can you recommend a good dentist?", "ex_zh": "你能推荐一位好牙医吗？", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0176", "unit": "Unit 3"}, {"word": "recover", "pron": "rɪˈkʌvə", "part_of_speech": "v.", "pos": "v.", "def_en": "to get better after an illness or difficult time", "def_zh": "康复；恢复", "quote_en": "Most patients recover within a few weeks.", "quote_zh": "大多数患者在几周内康复。", "ex_en": "I hope to recover from the flu soon.", "ex_zh": "我希望能尽快从流感中康复。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0177", "unit": "Unit 3"}, {"word": "reduce", "pron": "rɪˈdjuːs", "part_of_speech": "v.", "pos": "v.", "def_en": "to make something smaller in size or amount", "def_zh": "减少；降低", "quote_en": "Eating less salt can reduce blood pressure.", "quote_zh": "少吃盐可以降低血压。", "ex_en": "I want to reduce the amount of sugar I eat.", "ex_zh": "我想减少糖的摄入量。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0178", "unit": "Unit 3"}, {"word": "skip", "pron": "skɪp", "part_of_speech": "v.", "pos": "v.", "def_en": "to not do or have something that you normally do", "def_zh": "跳过；省略", "quote_en": "Students who skip breakfast often feel tired in class.", "quote_zh": "不吃早餐的学生上课常常感到疲倦。", "ex_en": "I sometimes skip lunch when I'm busy.", "ex_zh": "我忙的时候有时会不吃午饭。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0179", "unit": "Unit 3"}, {"word": "stimulate", "pron": "ˈstɪmjəleɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to encourage something to develop or become more active", "def_zh": "刺激；激发", "quote_en": "Exercise can stimulate the brain and improve memory.", "quote_zh": "运动可以刺激大脑，改善记忆。", "ex_en": "A cup of coffee can stimulate me in the morning.", "ex_zh": "早上一杯咖啡能让我提神。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0180", "unit": "Unit 3"}, {"word": "trigger", "pron": "ˈtrɪɡə", "part_of_speech": "v.", "pos": "v.", "def_en": "to cause something to start", "def_zh": "引发；触发", "quote_en": "Certain foods can trigger headaches in some people.", "quote_zh": "某些食物会使一些人头痛。", "ex_en": "Stress can trigger an allergic reaction.", "ex_zh": "压力可能引发过敏反应。", "chapter": "Unit 3 · Keeping Fit · 保持健康", "id": "w0181", "unit": "Unit 3"}, {"word": "activity", "pron": "ækˈtɪvəti", "part_of_speech": "n.", "pos": "n.", "def_en": "something that you do for enjoyment or exercise", "def_zh": "活动", "quote_en": "Outdoor activity improves both physical and mental health.", "quote_zh": "户外活动能改善身心健康。", "ex_en": "My favourite activity at weekends is hiking.", "ex_zh": "我周末最喜欢的活动是徒步。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0182", "unit": "Unit 4"}, {"word": "aspect", "pron": "ˈæspekt", "part_of_speech": "n.", "pos": "n.", "def_en": "one part of a situation or subject", "def_zh": "方面", "quote_en": "Work-life balance is an important aspect of modern life.", "quote_zh": "工作与生活的平衡是现代生活的一个重要方面。", "ex_en": "The most difficult aspect of the job is the long hours.", "ex_zh": "这份工作最难的方面是工作时间长。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0183", "unit": "Unit 4"}, {"word": "attitude", "pron": "ˈætɪtjuːd", "part_of_speech": "n.", "pos": "n.", "def_en": "the way you think and feel about something", "def_zh": "态度", "quote_en": "A positive attitude can help people overcome difficulties.", "quote_zh": "积极的态度可以帮助人们克服困难。", "ex_en": "He has a very relaxed attitude towards money.", "ex_zh": "他对金钱的态度非常随意。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0184", "unit": "Unit 4"}, {"word": "balance", "pron": "ˈbæləns", "part_of_speech": "n.", "pos": "n.", "def_en": "a state in which different things are in the right amounts", "def_zh": "平衡", "quote_en": "It is important to achieve a balance between work and rest.", "quote_zh": "在工作和休息之间取得平衡很重要。", "ex_en": "I try to keep a balance between study and fun.", "ex_zh": "我努力在学习和娱乐之间保持平衡。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0185", "unit": "Unit 4"}, {"word": "competition", "pron": "ˌkɒmpəˈtɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "an event or situation in which people try to win", "def_zh": "竞争；比赛", "quote_en": "Competition in the job market has increased in recent years.", "quote_zh": "近年来就业市场的竞争加剧了。", "ex_en": "I entered a cooking competition last month.", "ex_zh": "我上个月参加了一场烹饪比赛。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0186", "unit": "Unit 4"}, {"word": "creativity", "pron": "ˌkriːeɪˈtɪvəti", "part_of_speech": "n.", "pos": "n.", "def_en": "the ability to produce new and original ideas", "def_zh": "创造力", "quote_en": "Schools should encourage creativity as well as exam skills.", "quote_zh": "学校应该在培养应试技能的同时鼓励创造力。", "ex_en": "Painting is a great way to express my creativity.", "ex_zh": "绘画是表达我创造力的好方式。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0187", "unit": "Unit 4"}, {"word": "daily routine", "pron": "ˈdeɪli ruːˈtiːn", "part_of_speech": "n.", "pos": "n.", "def_en": "the things you do every day in the same order", "def_zh": "日常作息", "quote_en": "A regular daily routine helps children feel secure.", "quote_zh": "规律的日常作息让孩子有安全感。", "ex_en": "My daily routine starts with a cup of tea.", "ex_zh": "我的日常作息从一杯茶开始。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0188", "unit": "Unit 4"}, {"word": "desire", "pron": "dɪˈzaɪə", "part_of_speech": "n.", "pos": "n.", "def_en": "a strong wish to have or do something", "def_zh": "渴望；愿望", "quote_en": "Many young people have a strong desire to travel.", "quote_zh": "许多年轻人有强烈的旅行愿望。", "ex_en": "I have no desire to live in a big city.", "ex_zh": "我一点也不想住在大城市。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0189", "unit": "Unit 4"}, {"word": "disappointment", "pron": "ˌdɪsəˈpɔɪntmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "the feeling of being sad because something was not as good as expected", "def_zh": "失望", "quote_en": "Failure can lead to disappointment, but also to learning.", "quote_zh": "失败可能带来失望，但也带来学习。", "ex_en": "It was a big disappointment when the trip was cancelled.", "ex_zh": "旅行被取消，我非常失望。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0190", "unit": "Unit 4"}, {"word": "experience", "pron": "ɪkˈspɪəriəns", "part_of_speech": "n.", "pos": "n.", "def_en": "knowledge or skill gained from doing something; something that happens to you", "def_zh": "经验；经历", "quote_en": "Work experience helps students prepare for their careers.", "quote_zh": "工作经验帮助学生为职业生涯做准备。", "ex_en": "Living abroad was an amazing experience for me.", "ex_zh": "在国外生活对我来说是一次奇妙的经历。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0191", "unit": "Unit 4"}, {"word": "fulfillment", "pron": "fʊlˈfɪlmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a feeling of satisfaction from achieving something", "def_zh": "成就感；满足感", "quote_en": "Many people find fulfillment in helping others.", "quote_zh": "许多人从帮助他人中获得满足感。", "ex_en": "I get a sense of fulfillment from teaching.", "ex_zh": "教书给我带来成就感。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0192", "unit": "Unit 4"}, {"word": "goal", "pron": "ɡəʊl", "part_of_speech": "n.", "pos": "n.", "def_en": "something you hope to achieve", "def_zh": "目标", "quote_en": "Setting clear goals can motivate students to study harder.", "quote_zh": "设定明确的目标可以激励学生更努力学习。", "ex_en": "My main goal this year is to pass IELTS.", "ex_zh": "我今年的主要目标是通过雅思考试。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0193", "unit": "Unit 4"}, {"word": "hobby", "pron": "ˈhɒbi", "part_of_speech": "n.", "pos": "n.", "def_en": "an activity you do for pleasure in your free time", "def_zh": "爱好", "quote_en": "Having a hobby can reduce stress.", "quote_zh": "拥有爱好可以减轻压力。", "ex_en": "My hobby is collecting stamps.", "ex_zh": "我的爱好是集邮。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0194", "unit": "Unit 4"}, {"word": "insight", "pron": "ˈɪnsaɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "a deep understanding of a person or situation", "def_zh": "洞察；深刻见解", "quote_en": "Travelling gives us insight into other cultures.", "quote_zh": "旅行让我们深入了解其他文化。", "ex_en": "The book gave me a real insight into her life.", "ex_zh": "这本书让我真正了解了她的生活。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0195", "unit": "Unit 4"}, {"word": "leisure", "pron": "ˈleʒə", "part_of_sp
