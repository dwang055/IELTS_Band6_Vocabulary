eech": "n.", "pos": "n.", "def_en": "time when you are not working and can relax", "def_zh": "闲暇；休闲", "quote_en": "People today have more leisure time than in the past.", "quote_zh": "今天的人们比过去有更多的休闲时间。", "ex_en": "I enjoy reading in my leisure time.", "ex_zh": "我喜欢在闲暇时读书。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0196", "unit": "Unit 4"}, {"word": "lifestyle", "pron": "ˈlaɪfstaɪl", "part_of_speech": "n.", "pos": "n.", "def_en": "the way a person lives", "def_zh": "生活方式", "quote_en": "A healthy lifestyle can prevent many diseases.", "quote_zh": "健康的生活方式可以预防许多疾病。", "ex_en": "I prefer a quiet lifestyle in the countryside.", "ex_zh": "我更喜欢乡下安静的生活方式。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0197", "unit": "Unit 4"}, {"word": "optimist", "pron": "ˈɒptɪmɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who always expects good things to happen", "def_zh": "乐观主义者", "quote_en": "An optimist usually recovers faster from setbacks.", "quote_zh": "乐观的人通常从挫折中恢复得更快。", "ex_en": "I'm an optimist, so I always look on the bright side.", "ex_zh": "我是个乐观的人，总是看到事物好的一面。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0198", "unit": "Unit 4"}, {"word": "outlook", "pron": "ˈaʊtlʊk", "part_of_speech": "n.", "pos": "n.", "def_en": "your general attitude to life; what is likely to happen", "def_zh": "观点；前景", "quote_en": "A positive outlook can improve mental wellbeing.", "quote_zh": "积极的人生观可以改善心理健康。", "ex_en": "The economic outlook for next year is uncertain.", "ex_zh": "明年的经济前景不明朗。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0199", "unit": "Unit 4"}, {"word": "opportunity", "pron": "ˌɒpəˈtjuːnəti", "part_of_speech": "n.", "pos": "n.", "def_en": "a chance to do something good", "def_zh": "机会", "quote_en": "Studying abroad offers a valuable opportunity to learn a language.", "quote_zh": "出国留学为学习语言提供了宝贵的机会。", "ex_en": "I'd love the opportunity to work in London.", "ex_zh": "我很想有机会在伦敦工作。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0200", "unit": "Unit 4"}, {"word": "personality", "pron": "ˌpɜːsəˈnæləti", "part_of_speech": "n.", "pos": "n.", "def_en": "the qualities that make up a person's character", "def_zh": "个性；性格", "quote_en": "Personality can affect the type of career a person chooses.", "quote_zh": "个性会影响一个人选择的职业类型。", "ex_en": "She has a warm and friendly personality.", "ex_zh": "她性格热情友好。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0201", "unit": "Unit 4"}, {"word": "pessimist", "pron": "ˈpesɪmɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who always expects bad things to happen", "def_zh": "悲观主义者", "quote_en": "A pessimist may avoid taking risks.", "quote_zh": "悲观的人可能会避免冒险。", "ex_en": "Don't be such a pessimist; things will get better.", "ex_zh": "别这么悲观，事情会好起来的。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0202", "unit": "Unit 4"}, {"word": "priority", "pron": "praɪˈɒrəti", "part_of_speech": "n.", "pos": "n.", "def_en": "something that is more important than other things", "def_zh": "优先事项", "quote_en": "For most families, education is a top priority.", "quote_zh": "对大多数家庭来说，教育是首要任务。", "ex_en": "My priority right now is to find a job.", "ex_zh": "我现在的首要任务是找工作。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0203", "unit": "Unit 4"}, {"word": "pressure", "pron": "ˈpreʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "a feeling of worry because people expect a lot from you", "def_zh": "压力", "quote_en": "Students often feel pressure to get high grades.", "quote_zh": "学生常常感到必须取得高分的压力。", "ex_en": "I work well under pressure.", "ex_zh": "我在压力下工作得很好。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0204", "unit": "Unit 4"}, {"word": "realist", "pron": "ˈriːəlɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who accepts things as they are", "def_zh": "现实主义者", "quote_en": "A realist sets goals that are achievable.", "quote_zh": "现实主义者会设定可以实现的目标。", "ex_en": "I'm a realist; I know it won't be easy.", "ex_zh": "我是个现实的人，我知道这不会容易。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0205", "unit": "Unit 4"}, {"word": "risk-taker", "pron": "ˈrɪsk teɪkə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who is willing to try things that may be dangerous or uncertain", "def_zh": "敢于冒险的人", "quote_en": "Successful entrepreneurs are often risk-takers.", "quote_zh": "成功的企业家往往是敢于冒险的人。", "ex_en": "My brother is a real risk-taker; he loves extreme sports.", "ex_zh": "我哥哥是个敢于冒险的人，他喜欢极限运动。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0206", "unit": "Unit 4"}, {"word": "self-expression", "pron": "ˌself ɪkˈspreʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the expression of your own feelings, ideas or personality", "def_zh": "自我表达", "quote_en": "Art classes give children a chance for self-expression.", "quote_zh": "艺术课给孩子们提供自我表达的机会。", "ex_en": "Dancing is a form of self-expression for me.", "ex_zh": "跳舞对我来说是一种自我表达。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0207", "unit": "Unit 4"}, {"word": "sense", "pron": "sens", "part_of_speech": "n.", "pos": "n.", "def_en": "a natural ability or feeling; a good understanding", "def_zh": "感觉；意识；理智", "quote_en": "A sense of purpose helps people stay motivated.", "quote_zh": "目标感有助于人们保持动力。", "ex_en": "She has a good sense of humour.", "ex_zh": "她很有幽默感。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0208", "unit": "Unit 4"}, {"word": "all walks of life", "pron": "ɔːl wɔːks əv laɪf", "part_of_speech": "n.", "pos": "n.", "def_en": "people from every kind of background", "def_zh": "各行各业；各种背景", "quote_en": "The festival attracts visitors from all walks of life.", "quote_zh": "这个节日吸引了来自各行各业的游客。", "ex_en": "My gym has members from all walks of life.", "ex_zh": "我的健身房有来自各行各业的会员。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0209", "unit": "Unit 4"}, {"word": "cost of living", "pron": "kɒst əv ˈlɪvɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the amount of money needed for basic things such as food and housing", "def_zh": "生活成本", "quote_en": "The cost of living in big cities is rising rapidly.", "quote_zh": "大城市的生活成本正在迅速上升。", "ex_en": "The cost of living in Auckland is quite high.", "ex_zh": "奥克兰的生活成本相当高。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0210", "unit": "Unit 4"}, {"word": "lifelong ambition", "pron": "ˈlaɪflɒŋ æmˈbɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "something you have wanted to achieve all your life", "def_zh": "毕生的志向", "quote_en": "Becoming a doctor was her lifelong ambition.", "quote_zh": "成为医生是她毕生的志向。", "ex_en": "Writing a novel is my lifelong ambition.", "ex_zh": "写一部小说是我毕生的志向。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0211", "unit": "Unit 4"}, {"word": "living expenses", "pron": "ˈlɪvɪŋ ɪkˈspensɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "the money you spend on rent, food and basic needs", "def_zh": "生活费", "quote_en": "International students must cover their own living expenses.", "quote_zh": "国际学生必须自己承担生活费。", "ex_en": "My parents pay my tuition, but I pay my living expenses.", "ex_zh": "我父母付学费，但生活费我自己付。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0212", "unit": "Unit 4"}, {"word": "once in a lifetime opportunity", "pron": "wʌns ɪn ə ˈlaɪftaɪm ˌɒpəˈtjuːnəti", "part_of_speech": "n.", "pos": "n.", "def_en": "a chance that will probably never happen again", "def_zh": "千载难逢的机会", "quote_en": "Studying at a top university is a once in a lifetime opportunity.", "quote_zh": "在顶尖大学学习是千载难逢的机会。", "ex_en": "Seeing the northern lights was a once in a lifetime opportunity.", "ex_zh": "看到北极光是千载难逢的机会。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0213", "unit": "Unit 4"}, {"word": "standard of living", "pron": "ˈstændəd əv ˈlɪvɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the level of comfort and wealth a person or country has", "def_zh": "生活水平", "quote_en": "Economic growth has raised the standard of living in many countries.", "quote_zh": "经济增长提高了许多国家的生活水平。", "ex_en": "The standard of living in my country has improved a lot.", "ex_zh": "我国的生活水平提高了很多。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0214", "unit": "Unit 4"}, {"word": "way of life", "pron": "weɪ əv laɪf", "part_of_speech": "n.", "pos": "n.", "def_en": "the way in which a person or community lives", "def_zh": "生活方式", "quote_en": "Tourism has changed the traditional way of life in many villages.", "quote_zh": "旅游业改变了许多村庄的传统生活方式。", "ex_en": "Cycling to work is part of my way of life.", "ex_zh": "骑车上班是我生活方式的一部分。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0215", "unit": "Unit 4"}, {"word": "active", "pron": "ˈæktɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "doing a lot of physical or mental activity", "def_zh": "积极的；活跃的", "quote_en": "Active people tend to have a lower risk of heart disease.", "quote_zh": "活跃的人患心脏病的风险往往较低。", "ex_en": "I'm quite active and enjoy sports every day.", "ex_zh": "我很好动，每天都喜欢运动。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0216", "unit": "Unit 4"}, {"word": "bored", "pron": "bɔːd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "feeling tired and uninterested", "def_zh": "无聊的；厌烦的", "quote_en": "Students who feel bored in class may lose interest in learning.", "quote_zh": "在课堂上感到无聊的学生可能会失去学习兴趣。", "ex_en": "I get bored very easily on long journeys.", "ex_zh": "我在长途旅行中很容易感到无聊。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0217", "unit": "Unit 4"}, {"word": "confused", "pron": "kənˈfjuːzd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "unable to think clearly or understand", "def_zh": "困惑的；迷惑的", "quote_en": "Many students feel confused when choosing a university course.", "quote_zh": "许多学生在选择大学专业时感到困惑。", "ex_en": "I'm confused about which road to take.", "ex_zh": "我不知道该走哪条路，很困惑。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0218", "unit": "Unit 4"}, {"word": "dissatisfied", "pron": "dɪsˈsætɪsfaɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not happy with something", "def_zh": "不满意的", "quote_en": "Many employees are dissatisfied with their working hours.", "quote_zh": "许多员工对工作时间不满意。", "ex_en": "I was dissatisfied with the service at the restaurant.", "ex_zh": "我对这家餐厅的服务不满意。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0219", "unit": "Unit 4"}, {"word": "intense", "pron": "ɪnˈtens", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very strong or extreme", "def_zh": "强烈的；紧张的", "quote_en": "Intense competition can cause stress among students.", "quote_zh": "激烈的竞争会让学生感到压力。", "ex_en": "I felt intense excitement before the match.", "ex_zh": "比赛前我感到非常兴奋。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0220", "unit": "Unit 4"}, {"word": "materialistic", "pron": "məˌtɪəriəˈlɪstɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "caring too much about money and possessions", "def_zh": "物质主义的；重物质的", "quote_en": "Modern society is often seen as materialistic.", "quote_zh": "现代社会常被看作是物质主义的。", "ex_en": "I don't want to be materialistic; I value friendship more.", "ex_zh": "我不想成为物质主义者，我更看重友谊。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0221", "unit": "Unit 4"}, {"word": "negative", "pron": "ˈneɡətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "bad or harmful; not hopeful", "def_zh": "消极的；负面的", "quote_en": "Negative thoughts can reduce motivation.", "quote_zh": "消极的想法会降低动力。", "ex_en": "Try not to be so negative about the exam.", "ex_zh": "不要对考试这么消极。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0222", "unit": "Unit 4"}, {"word": "outdoor", "pron": "ˈaʊtdɔː", "part_of_speech": "adj.", "pos": "adj.", "def_en": "happening or used outside", "def_zh": "户外的", "quote_en": "Outdoor sports are popular among young people in New Zealand.", "quote_zh": "户外运动在新西兰的年轻人中很受欢迎。", "ex_en": "I love outdoor activities like camping.", "ex_zh": "我喜欢露营之类的户外活动。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0223", "unit": "Unit 4"}, {"word": "positive", "pron": "ˈpɒzətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "good or hopeful; confident", "def_zh": "积极的；正面的", "quote_en": "A positive attitude helps people cope with change.", "quote_zh": "积极的态度帮助人们应对变化。", "ex_en": "I feel positive about the future.", "ex_zh": "我对未来感到乐观。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0224", "unit": "Unit 4"}, {"word": "recreational", "pron": "ˌrekriˈeɪʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "done for enjoyment in your free time", "def_zh": "娱乐的；休闲的", "quote_en": "Recreational facilities such as parks improve quality of life.", "quote_zh": "公园等休闲设施能提高生活质量。", "ex_en": "I enjoy recreational cycling on weekends.", "ex_zh": "我周末喜欢骑车休闲。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0225", "unit": "Unit 4"}, {"word": "successful", "pron": "səkˈsesfl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "achieving what you wanted", "def_zh": "成功的", "quote_en": "Successful people usually set clear goals.", "quote_zh": "成功的人通常会设定明确的目标。", "ex_en": "She runs a successful online business.", "ex_zh": "她经营着一家成功的网店。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0226", "unit": "Unit 4"}, {"word": "achieve", "pron": "əˈtʃiːv", "part_of_speech": "v.", "pos": "v.", "def_en": "to succeed in doing something good", "def_zh": "实现；达到", "quote_en": "Hard work is the best way to achieve your dreams.", "quote_zh": "努力工作是实现梦想的最佳途径。", "ex_en": "I hope to achieve a score of 7 in IELTS.", "ex_zh": "我希望雅思考试能拿到7分。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0227", "unit": "Unit 4"}, {"word": "appeal", "pron": "əˈpiːl", "part_of_speech": "v.", "pos": "v.", "def_en": "to be attractive or interesting to someone", "def_zh": "吸引；有吸引力", "quote_en": "Adventure sports appeal to many young people.", "quote_zh": "冒险运动吸引了许多年轻人。", "ex_en": "The idea of living abroad can really appeal to me.", "ex_zh": "住在国外的想法对我很有吸引力。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0228", "unit": "Unit 4"}, {"word": "attract", "pron": "əˈtrækt", "part_of_speech": "v.", "pos": "v.", "def_en": "to make people interested or draw them towards you", "def_zh": "吸引", "quote_en": "Big cities attract young people looking for work.", "quote_zh": "大城市吸引寻找工作的年轻人。", "ex_en": "The festival will attract thousands of tourists every year.", "ex_zh": "这个节日每年都会吸引成千上万的游客。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0229", "unit": "Unit 4"}, {"word": "choose", "pron": "tʃuːz", "part_of_speech": "v.", "pos": "v.", "def_en": "to decide which one you want", "def_zh": "选择", "quote_en": "Students should be free to choose their own subjects.", "quote_zh": "学生应该可以自由选择自己的科目。", "ex_en": "I want to choose a university in New Zealand.", "ex_zh": "我想选择一所新西兰的大学。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0230", "unit": "Unit 4"}, {"word": "express", "pron": "ɪkˈspres", "part_of_speech": "v.", "pos": "v.", "def_en": "to show what you think or feel", "def_zh": "表达；表示", "quote_en": "Art allows people to express their emotions.", "quote_zh": "艺术让人们能够表达自己的情感。", "ex_en": "I find it hard to express my feelings in English.", "ex_zh": "我觉得用英语表达感受很难。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0231", "unit": "Unit 4"}, {"word": "enjoy", "pron": "ɪnˈdʒɔɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to get pleasure from something", "def_zh": "享受；喜欢", "quote_en": "Most people enjoy spending time with their family.", "quote_zh": "大多数人喜欢和家人共度时光。", "ex_en": "I enjoy listening to music while I walk.", "ex_zh": "我喜欢边走路边听音乐。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0232", "unit": "Unit 4"}, {"word": "fulfil", "pron": "fʊlˈfɪl", "part_of_speech": "v.", "pos": "v.", "def_en": "to achieve or complete something you wanted to do", "def_zh": "实现；履行", "quote_en": "Travelling helped her fulfil a childhood dream.", "quote_zh": "旅行帮助她实现了一个童年的梦想。", "ex_en": "I want to fulfil my parents' expectations.", "ex_zh": "我想不辜负父母的期望。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0233", "unit": "Unit 4"}, {"word": "improve", "pron": "ɪmˈpruːv", "part_of_speech": "v.", "pos": "v.", "def_en": "to become better or make something better", "def_zh": "改善；提高", "quote_en": "Regular practice can improve your speaking skills.", "quote_zh": "经常练习可以提高你的口语能力。", "ex_en": "I want to improve my English before the exam.", "ex_zh": "我想在考试前提高英语水平。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0234", "unit": "Unit 4"}, {"word": "motivate", "pron": "ˈməʊtɪveɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to make someone want to do something", "def_zh": "激励；激发", "quote_en": "Good teachers know how to motivate their students.", "quote_zh": "好老师知道如何激励学生。", "ex_en": "Setting small targets helps to motivate me.", "ex_zh": "设定小目标有助于激励我。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0235", "unit": "Unit 4"}, {"word": "participate", "pron": "pɑːˈtɪsɪpeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to take part in an activity", "def_zh": "参加；参与", "quote_en": "Students should participate in sports as well as study.", "quote_zh": "学生除了学习，也应该参加体育运动。", "ex_en": "I like to participate in school events.", "ex_zh": "我喜欢参加学校的活动。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0236", "unit": "Unit 4"}, {"word": "regret", "pron": "rɪˈɡret", "part_of_speech": "v.", "pos": "v.", "def_en": "to feel sorry about something you did or did not do", "def_zh": "后悔；遗憾", "quote_en": "Many people regret not spending more time with their family.", "quote_zh": "许多人后悔没有多陪家人。", "ex_en": "I don't regret my decision to study abroad.", "ex_zh": "我不后悔自己出国留学的决定。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0237", "unit": "Unit 4"}, {"word": "relax", "pron": "rɪˈlæks", "part_of_speech": "v.", "pos": "v.", "def_en": "to rest and become calm", "def_zh": "放松；休息", "quote_en": "Listening to music helps people relax after work.", "quote_zh": "听音乐帮助人们下班后放松。", "ex_en": "I like to relax by reading a book.", "ex_zh": "我喜欢通过看书来放松。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0238", "unit": "Unit 4"}, {"word": "satisfy", "pron": "ˈsætɪsfaɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to give someone what they want or need", "def_zh": "使满意；满足", "quote_en": "A well-paid job alone may not satisfy everyone.", "quote_zh": "仅靠一份高薪工作可能无法让每个人满意。", "ex_en": "The new menu should satisfy all customers.", "ex_zh": "新菜单应该能让所有顾客满意。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0239", "unit": "Unit 4"}, {"word": "lead a happy life", "pron": "liːd ə ˈhæpi laɪf", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to live in a way that makes you happy", "def_zh": "过幸福的生活", "quote_en": "Strong relationships help people lead a happy life.", "quote_zh": "牢固的人际关系帮助人们过上幸福的生活。", "ex_en": "I just want to lead a happy life with my family.", "ex_zh": "我只想和家人过幸福的生活。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0240", "unit": "Unit 4"}, {"word": "live life on the edge", "pron": "lɪv laɪf ɒn ði edʒ", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to take risks and do exciting or dangerous things", "def_zh": "过着冒险的生活", "quote_en": "Some people prefer to live life on the edge.", "quote_zh": "有些人更喜欢过冒险的生活。", "ex_en": "He likes to live life on the edge, so he goes skydiving.", "ex_zh": "他喜欢过冒险的生活，所以去跳伞。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0241", "unit": "Unit 4"}, {"word": "live life to the full", "pron": "lɪv laɪf tə ðə fʊl", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to enjoy life as much as possible", "def_zh": "充分享受生活", "quote_en": "Many retired people want to live life to the full.", "quote_zh": "许多退休的人想充分享受生活。", "ex_en": "I want to live life to the full while I'm young.", "ex_zh": "我想趁年轻充分享受生活。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0242", "unit": "Unit 4"}, {"word": "make a choice", "pron": "meɪk ə tʃɔɪs", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to decide between different options", "def_zh": "做出选择", "quote_en": "Students must make a choice about their subjects at fifteen.", "quote_zh": "学生在十五岁时必须对科目做出选择。", "ex_en": "It's difficult to make a choice between the two jobs.", "ex_zh": "在这两份工作之间做出选择很难。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0243", "unit": "Unit 4"}, {"word": "make a decision", "pron": "meɪk ə dɪˈsɪʒn", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to decide something after thinking about it", "def_zh": "做决定", "quote_en": "Parents should help teenagers to make a decision about their future.", "quote_zh": "父母应该帮助青少年对未来做出决定。", "ex_en": "I need more time to make a decision.", "ex_zh": "我需要更多时间来做决定。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0244", "unit": "Unit 4"}, {"word": "make a living", "pron": "meɪk ə ˈlɪvɪŋ", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to earn enough money to live on", "def_zh": "谋生；维持生计", "quote_en": "Many artists find it hard to make a living.", "quote_zh": "许多艺术家觉得很难维持生计。", "ex_en": "He wants to make a living by teaching English online.", "ex_zh": "他想靠在线教英语谋生。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0245", "unit": "Unit 4"}, {"word": "meet a need", "pron": "miːt ə niːd", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to provide what is necessary", "def_zh": "满足需求", "quote_en": "Public libraries meet a need for free learning resources.", "quote_zh": "公共图书馆满足了人们对免费学习资源的需求。", "ex_en": "The new bus service will meet a need in our area.", "ex_zh": "新的公交服务将满足我们地区的需求。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0246", "unit": "Unit 4"}, {"word": "miss an opportunity", "pron": "mɪs ən ˌɒpəˈtjuːnəti", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to fail to use a chance", "def_zh": "错过机会", "quote_en": "Do not miss an opportunity to learn from your mistakes.", "quote_zh": "不要错过从错误中学习的机会。", "ex_en": "I don't want to miss an opportunity like this.", "ex_zh": "我不想错过这样的机会。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0247", "unit": "Unit 4"}, {"word": "put pressure on", "pron": "pʊt ˈpreʃə ɒn", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to try to force someone to do something", "def_zh": "给…施加压力", "quote_en": "Parents should not put pressure on their children to get top grades.", "quote_zh": "父母不应该给孩子施加取得高分的压力。", "ex_en": "Please don't put pressure on me to decide now.", "ex_zh": "请不要逼我现在就做决定。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0248", "unit": "Unit 4"}, {"word": "set a goal", "pron": "set ə ɡəʊl", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to decide on something you want to achieve", "def_zh": "设定目标", "quote_en": "It is useful to set a goal at the start of each year.", "quote_zh": "在每年年初设定目标很有用。", "ex_en": "I set a goal to read one book a month.", "ex_zh": "我设定了每月读一本书的目标。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0249", "unit": "Unit 4"}, {"word": "take part", "pron": "teɪk pɑːt", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to join in an activity", "def_zh": "参加；参与", "quote_en": "Millions of people take part in the marathon every year.", "quote_zh": "每年有数百万人参加马拉松。", "ex_en": "I want to take part in a speech contest next month.", "ex_zh": "我想参加下个月的一场演讲比赛。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0250", "unit": "Unit 4"}, {"word": "work hard for a living", "pron": "wɜːk hɑːd fər ə ˈlɪvɪŋ", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to have a physically demanding job to earn money", "def_zh": "辛苦谋生", "quote_en": "Many farmers work hard for a living.", "quote_zh": "许多农民辛苦谋生。", "ex_en": "My parents work hard for a living to support us.", "ex_zh": "我父母辛苦谋生来养活我们。", "chapter": "Unit 4 · Lifestyles · 生活方式", "id": "w0251", "unit": "Unit 4"}, {"word": "assignment", "pron": "əˈsaɪnmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a piece of work given to a student", "def_zh": "作业；任务", "quote_en": "Students must submit each assignment before the deadline.", "quote_zh": "学生必须在截止日期前提交每项作业。", "ex_en": "I have a long assignment due on Friday.", "ex_zh": "我周五要交一份很长的作业。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0252", "unit": "Unit 5"}, {"word": "college", "pron": "ˈkɒlɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where people study after school", "def_zh": "学院；大专", "quote_en": "Many students attend college to learn a practical skill.", "quote_zh": "许多学生上学院学习实用技能。", "ex_en": "My sister is studying nursing at college.", "ex_zh": "我姐姐在学院学护理。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0253", "unit": "Unit 5"}, {"word": "controversy", "pron": "ˈkɒntrəvɜːsi", "part_of_speech": "n.", "pos": "n.", "def_en": "a public argument about something people disagree on", "def_zh": "争议；争论", "quote_en": "There is still controversy over the use of mobile phones in schools.", "quote_zh": "关于在学校使用手机仍有争议。", "ex_en": "The new exam caused a lot of controversy.", "ex_zh": "新的考试引起了很多争议。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0254", "unit": "Unit 5"}, {"word": "curriculum", "pron": "kəˈrɪkjələm", "part_of_speech": "n.", "pos": "n.", "def_en": "the subjects taught at a school or college", "def_zh": "课程；教学大纲", "quote_en": "The national curriculum includes science, maths and English.", "quote_zh": "国家课程包括科学、数学和英语。", "ex_en": "Our school has added coding to the curriculum.", "ex_zh": "我们学校把编程加入了课程。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0255", "unit": "Unit 5"}, {"word": "dissertation", "pron": "ˌdɪsəˈteɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a long piece of writing for a university degree", "def_zh": "学位论文", "quote_en": "Students must complete a dissertation in their final year.", "quote_zh": "学生必须在最后一年完成一篇学位论文。", "ex_en": "I'm writing my dissertation on climate change.", "ex_zh": "我正在写关于气候变化的学位论文。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0256", "unit": "Unit 5"}, {"word": "education", "pron": "ˌedʒuˈkeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the process of teaching and learning at school or university", "def_zh": "教育", "quote_en": "Free education should be available to every child.", "quote_zh": "每个孩子都应享有免费教育。", "ex_en": "I received my education in New Zealand.", "ex_zh": "我在新西兰接受教育。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0257", "unit": "Unit 5"}, {"word": "exam", "pron": "ɪɡˈzæm", "part_of_speech": "n.", "pos": "n.", "def_en": "a formal test of knowledge", "def_zh": "考试", "quote_en": "Too many exams can cause stress for young people.", "quote_zh": "过多的考试会给年轻人带来压力。", "ex_en": "I have an exam tomorrow morning.", "ex_zh": "我明天早上有一场考试。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0258", "unit": "Unit 5"}, {"word": "field", "pron": "fiːld", "part_of_speech": "n.", "pos": "n.", "def_en": "an area of study or work", "def_zh": "领域；专业", "quote_en": "She is an expert in the field of marine biology.", "quote_zh": "她是海洋生物学领域的专家。", "ex_en": "Which field do you want to work in?", "ex_zh": "你想在哪个领域工作？", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0259", "unit": "Unit 5"}, {"word": "findings", "pron": "ˈfaɪndɪŋz", "part_of_speech": "n.", "pos": "n.", "def_en": "the results of a study or investigation", "def_zh": "研究结果；发现", "quote_en": "The findings of the survey were published last month.", "quote_zh": "这项调查的结果于上个月发表。", "ex_en": "The report's findings surprised the whole class.", "ex_zh": "这份报告的发现让全班感到惊讶。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0260", "unit": "Unit 5"}, {"word": "funding", "pron": "ˈfʌndɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "money provided for a particular purpose", "def_zh": "资金；经费", "quote_en": "Universities need more funding for scientific research.", "quote_zh": "大学需要更多的科研经费。", "ex_en": "The school received funding to build a new library.", "ex_zh": "学校获得了建新图书馆的资金。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0261", "unit": "Unit 5"}, {"word": "grade", "pron": "ɡreɪd", "part_of_speech": "n.", "pos": "n.", "def_en": "a mark given for schoolwork; a school year level", "def_zh": "成绩；年级", "quote_en": "Students who work hard usually get good grades.", "quote_zh": "努力学习的学生通常成绩好。", "ex_en": "I'm in Grade 11 this year.", "ex_zh": "我今年上十一年级。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0262", "unit": "Unit 5"}, {"word": "graduation", "pron": "ˌɡrædʒuˈeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the time when you receive your degree or finish your studies", "def_zh": "毕业；毕业典礼", "quote_en": "Graduation is an exciting moment for students and their families.", "quote_zh": "毕业对学生和家人来说是令人兴奋的时刻。", "ex_en": "My parents flew to New Zealand for my graduation.", "ex_zh": "我父母飞到新西兰参加我的毕业典礼。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0263", "unit": "Unit 5"}, {"word": "grant", "pron": "ɡrɑːnt", "part_of_speech": "n.", "pos": "n.", "def_en": "money given by an organisation for a specific purpose", "def_zh": "助学金；补助金", "quote_en": "Some students receive a grant to cover their tuition fees.", "quote_zh": "一些学生获得助学金来支付学费。", "ex_en": "She applied for a research grant.", "ex_zh": "她申请了一笔研究资助金。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0264", "unit": "Unit 5"}, {"word": "high school", "pron": "haɪ skuːl", "part_of_speech": "n.", "pos": "n.", "def_en": "a school for students aged about 14 to 18", "def_zh": "高中", "quote_en": "Most students take their national exams in high school.", "quote_zh": "大多数学生在高中参加国家考试。", "ex_en": "I went to a high school near my home.", "ex_zh": "我上的是我家附近的一所高中。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0265", "unit": "Unit 5"}, {"word": "homework", "pron": "ˈhəʊmwɜːk", "part_of_speech": "n.", "pos": "n.", "def_en": "school work done at home", "def_zh": "家庭作业", "quote_en": "Too much homework leaves children with little free time.", "quote_zh": "过多的家庭作业使孩子几乎没有空闲时间。", "ex_en": "I usually do my homework after dinner.", "ex_zh": "我通常晚饭后做作业。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0266", "unit": "Unit 5"}, {"word": "junior school", "pron": "ˈdʒuːniə skuːl", "part_of_speech": "n.", "pos": "n.", "def_en": "a school for children aged about 7 to 11", "def_zh": "小学（低年级学校）", "quote_en": "Children begin to learn a foreign language in junior school.", "quote_zh": "孩子们在小学开始学习一门外语。", "ex_en": "I remember my teachers at junior school very well.", "ex_zh": "我对小学时的老师记得很清楚。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0267", "unit": "Unit 5"}, {"word": "kindergarten", "pron": "ˈkɪndəɡɑːtn", "part_of_speech": "n.", "pos": "n.", "def_en": "a school for children aged about 3 to 6", "def_zh": "幼儿园", "quote_en": "Children learn through play in kindergarten.", "quote_zh": "孩子在幼儿园通过玩耍学习。", "ex_en": "My little brother starts kindergarten next month.", "ex_zh": "我弟弟下个月开始上幼儿园。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0268", "unit": "Unit 5"}, {"word": "learning disorder", "pron": "ˈlɜːnɪŋ dɪsˈɔːdə", "part_of_speech": "n.", "pos": "n.", "def_en": "a condition that makes learning difficult", "def_zh": "学习障碍", "quote_en": "Teachers should support students with a learning disorder.", "quote_zh": "老师应该支持有学习障碍的学生。", "ex_en": "He has a learning disorder, so he gets extra help.", "ex_zh": "他有学习障碍，所以得到额外的帮助。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0269", "unit": "Unit 5"}, {"word": "lecturer", "pron": "ˈlektʃərə", "part_of_speech": "n.", "pos": "n.", "def_en": "a teacher at a university", "def_zh": "大学讲师", "quote_en": "The lecturer gave a clear explanation of the theory.", "quote_zh": "讲师清楚地解释了这个理论。", "ex_en": "My lecturer is very helpful and kind.", "ex_zh": "我的讲师非常乐于助人，也很和蔼。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0270", "unit": "Unit 5"}, {"word": "library", "pron": "ˈlaɪbrəri", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where books are kept for people to read or borrow", "def_zh": "图书馆", "quote_en": "The university library is open twenty-four hours during exams.", "quote_zh": "考试期间，大学图书馆全天开放。", "ex_en": "I borrow books from the library every week.", "ex_zh": "我每周都从图书馆借书。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0271", "unit": "Unit 5"}, {"word": "limits", "pron": "ˈlɪmɪts", "part_of_speech": "n.", "pos": "n.", "def_en": "the greatest amount or level allowed", "def_zh": "限制；限度", "quote_en": "There should be limits on how much homework is set.", "quote_zh": "对布置作业的量应有限制。", "ex_en": "Don't push yourself beyond your limits.", "ex_zh": "不要强迫自己超出自己的极限。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0272", "unit": "Unit 5"}, {"word": "Master's", "pron": "ˈmɑːstəz", "part_of_speech": "n.", "pos": "n.", "def_en": "a university degree after a first degree", "def_zh": "硕士学位", "quote_en": "A Master's usually takes one or two years to complete.", "quote_zh": "硕士学位通常需要一到两年完成。", "ex_en": "I'm planning to do a Master's in education.", "ex_zh": "我打算攻读教育学硕士。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0273", "unit": "Unit 5"}, {"word": "nursery", "pron": "ˈnɜːsəri", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where very young children are looked after", "def_zh": "托儿所；幼儿园", "quote_en": "Many working parents send their children to nursery.", "quote_zh": "许多上班的父母把孩子送去托儿所。", "ex_en": "My daughter goes to nursery three days a week.", "ex_zh": "我女儿每周去三天托儿所。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0274", "unit": "Unit 5"}, {"word": "PhD", "pron": "ˌpiː eɪtʃ ˈdiː", "part_of_speech": "n.", "pos": "n.", "def_en": "the highest university degree", "def_zh": "博士学位", "quote_en": "A PhD requires several years of original research.", "quote_zh": "博士学位需要几年的原创研究。", "ex_en": "My cousin is doing a PhD in physics.", "ex_zh": "我表哥正在攻读物理学博士。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0275", "unit": "Unit 5"}, {"word": "primary school", "pron": "ˈpraɪməri skuːl", "part_of_speech": "n.", "pos": "n.", "def_en": "a school for children aged about 5 to 11", "def_zh": "小学", "quote_en": "Primary school lays the foundation for later learning.", "quote_zh": "小学为后来的学习打下基础。", "ex_en": "I walked to primary school with my friends.", "ex_zh": "我和朋友们步行去上小学。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0276", "unit": "Unit 5"}, {"word": "program", "pron": "ˈprəʊɡræm", "part_of_speech": "n.", "pos": "n.", "def_en": "a course of study; a set of computer instructions", "def_zh": "课程项目；程序", "quote_en": "The university offers a two-year business program.", "quote_zh": "这所大学提供为期两年的商科课程。", "ex_en": "I'm studying in an exchange program this year.", "ex_zh": "我今年参加一个交换项目。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0277", "unit": "Unit 5"}, {"word": "project", "pron": "ˈprɒdʒekt", "part_of_speech": "n.", "pos": "n.", "def_en": "a piece of work involving research or planning", "def_zh": "项目；课题", "quote_en": "Group project work develops teamwork skills.", "quote_zh": "小组项目作业培养团队合作能力。", "ex_en": "We have a science project due next week.", "ex_zh": "我们下周要交一个科学项目。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0278", "unit": "Unit 5"}, {"word": "research", "pron": "rɪˈsɜːtʃ", "part_of_speech": "n.", "pos": "n.", "def_en": "careful study to find new information", "def_zh": "研究；调查", "quote_en": "Research shows that sleep improves memory.", "quote_zh": "研究表明睡眠能改善记忆。", "ex_en": "I did some research before choosing a university.", "ex_zh": "选大学之前我做了一些调研。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0279", "unit": "Unit 5"}, {"word": "resources", "pron": "rɪˈzɔːsɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "materials and supplies that can be used", "def_zh": "资源；资料", "quote_en": "Schools need enough resources to teach effectively.", "quote_zh": "学校需要足够的资源才能有效教学。", "ex_en": "The library has plenty of online resources.", "ex_zh": "图书馆有大量在线资源。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0280", "unit": "Unit 5"}, {"word": "results", "pron": "rɪˈzʌlts", "part_of_speech": "n.", "pos": "n.", "def_en": "marks or scores from tests or exams", "def_zh": "成绩；结果", "quote_en": "Exam results are published in August.", "quote_zh": "考试成绩在八月公布。", "ex_en": "I'm waiting for my IELTS results.", "ex_zh": "我正在等雅思成绩。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0281", "unit": "Unit 5"}, {"word": "scholarship", "pron": "ˈskɒləʃɪp", "part_of_speech": "n.", "pos": "n.", "def_en": "money given to a student to pay for their education", "def_zh": "奖学金", "quote_en": "Many talented students depend on a scholarship to study abroad.", "quote_zh": "许多有才华的学生依靠奖学金出国留学。", "ex_en": "She won a scholarship to Cambridge.", "ex_zh": "她获得了剑桥大学的奖学金。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0282", "unit": "Unit 5"}, {"word": "scope", "pron": "skəʊp", "part_of_speech": "n.", "pos": "n.", "def_en": "the range of a subject or activity", "def_zh": "范围", "quote_en": "The scope of the research was limited to three schools.", "quote_zh": "这项研究的范围仅限于三所学校。", "ex_en": "That topic is outside the scope of this course.", "ex_zh": "这个话题超出了本课程的范围。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0283", "unit": "Unit 5"}, {"word": "secondary school", "pron": "ˈsekəndri skuːl", "part_of_speech": "n.", "pos": "n.", "def_en": "a school for students aged about 11 to 18", "def_zh": "中学", "quote_en": "In secondary school, students begin to choose their subjects.", "quote_zh": "在中学，学生开始选择科目。", "ex_en": "I enjoyed my years at secondary school.", "ex_zh": "我很喜欢中学的那几年。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0284", "unit": "Unit 5"}, {"word": "sources", "pron": "ˈsɔːsɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "people, books or documents that provide information", "def_zh": "来源；资料", "quote_en": "Students should always list their sources in an essay.", "quote_zh": "学生应该在论文中列出资料来源。", "ex_en": "Wikipedia is not one of my main sources.", "ex_zh": "维基百科不是我的主要资料来源。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0285", "unit": "Unit 5"}, {"word": "syllabus", "pron": "ˈsɪləbəs", "part_of_speech": "n.", "pos": "n.", "def_en": "a list of topics in a course of study", "def_zh": "教学大纲", "quote_en": "The syllabus lists all the texts students must read.", "quote_zh": "教学大纲列出了学生必须阅读的所有文本。", "ex_en": "The teacher gave us a copy of the syllabus.", "ex_zh": "老师给了我们一份教学大纲。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0286", "unit": "Unit 5"}, {"word": "task", "pron": "tɑːsk", "part_of_speech": "n.", "pos": "n.", "def_en": "a piece of work to be done", "def_zh": "任务", "quote_en": "Writing task 2 requires an essay of at least 250 words.", "quote_zh": "写作任务2要求写一篇至少250字的文章。", "ex_en": "My main task today is to finish this report.", "ex_zh": "我今天的主要任务是完成这份报告。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0287", "unit": "Unit 5"}, {"word": "theory", "pron": "ˈθɪəri", "part_of_speech": "n.", "pos": "n.", "def_en": "a set of ideas that explain something", "def_zh": "理论；学说", "quote_en": "Students learn both theory and practice in this course.", "quote_zh": "学生在这门课程中既学理论也学实践。", "ex_en": "I don't understand the theory behind it.", "ex_zh": "我不理解它背后的理论。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0288", "unit": "Unit 5"}, {"word": "thesis", "pron": "ˈθiːsɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "a long piece of writing for a higher degree; a main argument", "def_zh": "论文；论点", "quote_en": "Her thesis explored the effects of social media on teenagers.", "quote_zh": "她的论文探讨了社交媒体对青少年的影响。", "ex_en": "My thesis is due in November.", "ex_zh": "我的论文十一月到期。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0289", "unit": "Unit 5"}, {"word": "tutor", "pron": "ˈtjuːtə", "part_of_speech": "n.", "pos": "n.", "def_en": "a teacher who works with one student or a small group", "def_zh": "导师；家教", "quote_en": "A private tutor can help a student improve quickly.", "quote_zh": "私人家教能帮助学生快速进步。", "ex_en": "My tutor suggested I read more journal articles.", "ex_zh": "我的导师建议我多读期刊文章。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0290", "unit": "Unit 5"}, {"word": "topic", "pron": "ˈtɒpɪk", "part_of_speech": "n.", "pos": "n.", "def_en": "a subject that you write or talk about", "def_zh": "话题；主题", "quote_en": "The essay topic was about the benefits of online learning.", "quote_zh": "论文的主题是在线学习的好处。", "ex_en": "Today's topic is about public transport.", "ex_zh": "今天的话题是关于公共交通。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0291", "unit": "Unit 5"}, {"word": "university", "pron": "ˌjuːnɪˈvɜːsəti", "part_of_speech": "n.", "pos": "n.", "def_en": "an educational institution where students study for degrees", "def_zh": "大学", "quote_en": "More young people are going to university than ever before.", "quote_zh": "上大学的年轻人比以往任何时候都多。", "ex_en": "I want to study at a university in New Zealand.", "ex_zh": "我想在新西兰的大学学习。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0292", "unit": "Unit 5"}, {"word": "academic", "pron": "ˌækəˈdemɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to education, especially at college or university", "def_zh": "学术的；学业的", "quote_en": "Academic success depends on motivation as well as ability.", "quote_zh": "学业成功既取决于能力，也取决于动力。", "ex_en": "My academic results were better this year.", "ex_zh": "我今年的学业成绩更好了。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0293", "unit": "Unit 5"}, {"word": "eligible", "pron": "ˈelɪdʒəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having the right to do or receive something", "def_zh": "有资格的", "quote_en": "Only students under twenty-five are eligible for the grant.", "quote_zh": "只有二十五岁以下的学生才有资格获得助学金。", "ex_en": "Am I eligible to apply for the scholarship?", "ex_zh": "我有资格申请这项奖学金吗？", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0294", "unit": "Unit 5"}, {"word": "mixed", "pron": "mɪkst", "part_of_speech": "adj.", "pos": "adj.", "def_en": "including different types of people or things", "def_zh": "混合的；男女混合的", "quote_en": "Some parents prefer a mixed school to a single-sex one.", "quote_zh": "一些家长更喜欢男女混校而不是单性别学校。", "ex_en": "I went to a mixed school with boys and girls.", "ex_zh": "我上的是男女混校。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0295", "unit": "Unit 5"}, {"word": "postgraduate", "pron": "ˌpəʊstˈɡrædʒuət", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to study after a first degree", "def_zh": "研究生的", "quote_en": "Postgraduate courses often involve independent research.", "quote_zh": "研究生课程通常涉及独立研究。", "ex_en": "She is a postgraduate student at Auckland University.", "ex_zh": "她是奥克兰大学的研究生。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0296", "unit": "Unit 5"}, {"word": "relevant", "pron": "ˈreləvənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "connected with what is being discussed or done", "def_zh": "相关的；切题的", "quote_en": "Teachers should choose topics that are relevant to students' lives.", "quote_zh": "老师应该选择与学生生活相关的话题。", "ex_en": "Please include only relevant information in your essay.", "ex_zh": "请在论文中只包含相关信息。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0297", "unit": "Unit 5"}, {"word": "senior", "pron": "ˈsiːniə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "older or higher in rank", "def_zh": "高年级的；资深的", "quote_en": "Senior students often help younger ones with their studies.", "quote_zh": "高年级学生常常帮助低年级学生学习。", "ex_en": "I am a senior in high school this year.", "ex_zh": "我今年是高中高年级学生。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0298", "unit": "Unit 5"}, {"word": "single-sex", "pron": "ˌsɪŋɡl ˈseks", "part_of_speech": "adj.", "pos": "adj.", "def_en": "for only boys or only girls", "def_zh": "单一性别的；男校或女校", "quote_en": "Some research suggests girls do better in single-sex schools.", "quote_zh": "一些研究表明女生在单一性别的学校成绩更好。", "ex_en": "My sister attended a single-sex school.", "ex_zh": "我姐姐上的是一所女校。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0299", "unit": "Unit 5"}, {"word": "studious", "pron": "ˈstjuːdiəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "spending a lot of time studying", "def_zh": "好学的；用功的", "quote_en": "A studious child often becomes a successful adult.", "quote_zh": "用功的孩子往往成为成功的成年人。", "ex_en": "My brother is quiet and studious.", "ex_zh": "我哥哥安静而好学。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0300", "unit": "Unit 5"}, {"word": "work-related", "pron": "ˈwɜːk rɪleɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "connected with a job", "def_zh": "与工作有关的", "quote_en": "Work-related stress is increasing among young teachers.", "quote_zh": "与工作有关的压力在年轻教师中不断增加。", "ex_en": "I take courses on work-related skills in the evening.", "ex_zh": "我晚上上与工作相关的技能课程。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0301", "unit": "Unit 5"}, {"word": "analyse", "pron": "ˈænəlaɪz", "part_of_speech": "v.", "pos": "v.", "def_en": "to examine something carefully in order to understand it", "def_zh": "分析", "quote_en": "Students are taught to analyse texts critically.", "quote_zh": "学生被教导批判性地分析文本。", "ex_en": "We need to analyse the data from the survey.", "ex_zh": "我们需要分析调查数据。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0302", "unit": "Unit 5"}, {"word": "conduct", "pron": "kənˈdʌkt", "part_of_speech": "v.", "pos": "v.", "def_en": "to carry out an activity or study", "def_zh": "进行；开展", "quote_en": "Researchers conduct experiments to test their theories.", "quote_zh": "研究人员做实验来检验他们的理论。", "ex_en": "We will conduct a survey of fifty students.", "ex_zh": "我们将对五十名学生进行调查。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0303", "unit": "Unit 5"}, {"word": "concentrate", "pron": "ˈkɒnsntreɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to give all your attention to something", "def_zh": "集中注意力；专心", "quote_en": "Noisy environments make it hard for students to concentrate.", "quote_zh": "嘈杂的环境使学生很难集中注意力。", "ex_en": "I can't concentrate when the TV is on.", "ex_zh": "电视开着的时候我无法集中注意力。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0304", "unit": "Unit 5"}, {"word": "consider", "pron": "kənˈsɪdə", "part_of_speech": "v.", "pos": "v.", "def_en": "to think carefully about something", "def_zh": "考虑；认为", "quote_en": "Students should consider their interests before choosing a course.", "quote_zh": "学生在选择课程前应该考虑自己的兴趣。", "ex_en": "I'm going to consider studying abroad next year.", "ex_zh": "我打算考虑明年出国留学。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0305", "unit": "Unit 5"}, {"word": "find out", "pron": "faɪnd aʊt", "part_of_speech": "v.", "pos": "v.", "def_en": "to discover information", "def_zh": "查明；发现", "quote_en": "Researchers aim to find out why some students learn faster.", "quote_zh": "研究人员旨在查明为什么有些学生学得更快。", "ex_en": "I need to find out when the exam starts.", "ex_zh": "我需要查明考试什么时候开始。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0306", "unit": "Unit 5"}, {"word": "graduate", "pron": "ˈɡrædʒuət", "part_of_speech": "v.", "pos": "v.", "def_en": "to complete a university degree", "def_zh": "毕业", "quote_en": "Most students graduate after three or four years.", "quote_zh": "大多数学生三四年后毕业。", "ex_en": "I will graduate from university next summer.", "ex_zh": "我明年夏天从大学毕业。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0307", "unit": "Unit 5"}, {"word": "learn", "pron": "lɜːn", "part_of_speech": "v.", "pos": "v.", "def_en": "to gain knowledge or skill", "def_zh": "学习；学会", "quote_en": "Children learn best when they are interested in the subject.", "quote_zh": "孩子对科目感兴趣时学得最好。", "ex_en": "I want to learn how to play the guitar.", "ex_zh": "我想学弹吉他。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0308", "unit": "Unit 5"}, {"word": "organise", "pron": "ˈɔːɡənaɪz", "part_of_speech": "v.", "pos": "v.", "def_en": "to arrange or plan something in order", "def_zh": "组织；安排", "quote_en": "Students need to organise their time to meet deadlines.", "quote_zh": "学生需要安排好时间以便按期完成任务。", "ex_en": "I organise my notes by topic.", "ex_zh": "我按主题整理笔记。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0309", "unit": "Unit 5"}, {"word": "overcome", "pron": "ˌəʊvəˈkʌm", "part_of_speech": "v.", "pos": "v.", "def_en": "to succeed in dealing with a problem", "def_zh": "克服；战胜", "quote_en": "Many students overcome language barriers when they study abroad.", "quote_zh": "许多学生在国外留学时克服了语言障碍。", "ex_en": "I hope to overcome my fear of public speaking.", "ex_zh": "我希望克服对公开演讲的恐惧。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0310", "unit": "Unit 5"}, {"word": "review", "pron": "rɪˈvjuː", "part_of_speech": "v.", "pos": "v.", "def_en": "to study something again; to examine something", "def_zh": "复习；审查", "quote_en": "Students should review their notes regularly before exams.", "quote_zh": "学生应在考试前定期复习笔记。", "ex_en": "I review new vocabulary every evening.", "ex_zh": "我每天晚上复习新词汇。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0311", "unit": "Unit 5"}, {"word": "revise", "pron": "rɪˈvaɪz", "part_of_speech": "v.", "pos": "v.", "def_en": "to study again for an exam; to change something to improve it", "def_zh": "复习；修改", "quote_en": "Students often revise for exams in the library.", "quote_zh": "学生常常在图书馆里复习备考。", "ex_en": "I need to revise my essay before handing it in.", "ex_zh": "我需要在交作业前修改文章。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0312", "unit": "Unit 5"}, {"word": "struggle", "pron": "ˈstrʌɡl", "part_of_speech": "v.", "pos": "v.", "def_en": "to try very hard to do something difficult", "def_zh": "挣扎；奋力", "quote_en": "Many international students struggle with academic writing.", "quote_zh": "许多国际学生在学术写作上很吃力。", "ex_en": "I often struggle to understand the lecture.", "ex_zh": "我经常听不懂这堂讲座，很吃力。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0313", "unit": "Unit 5"}, {"word": "relatively", "pron": "ˈrelətɪvli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "when compared to something else", "def_zh": "相对地；比较", "quote_en": "Tuition fees are relatively low in some European countries.", "quote_zh": "在一些欧洲国家，学费相对较低。", "ex_en": "The exam was relatively easy this year.", "ex_zh": "今年的考试相对比较容易。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0314", "unit": "Unit 5"}, {"word": "take a course", "pron": "teɪk ə kɔːs", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to join and study on a course", "def_zh": "修一门课程", "quote_en": "Adults can take a course in the evening to gain new skills.", "quote_zh": "成年人可以晚上修一门课程来获得新技能。", "ex_en": "I want to take a course in photography.", "ex_zh": "我想修一门摄影课程。", "chapter": "Unit 5 · Student Life · 学生生活", "id": "w0315", "unit": "Unit 5"}, {"word": "accuracy", "pron": "ˈækjərəsi", "part_of_speech": "n.", "pos": "n.", "def_en": "the quality of being correct and exact", "def_zh": "准确性；精确度", "quote_en": "Accuracy in grammar is important for a high IELTS writing score.", "quote_zh": "语法的准确性对雅思写作高分很重要。", "ex_en": "I'm working on the accuracy of my pronunciation.", "ex_zh": "我正在提高发音的准确性。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0316", "unit": "Unit 6"}, {"word": "communication", "pron": "kəˌmjuːnɪˈkeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the act of sharing information or ideas", "def_zh": "交流；沟通", "quote_en": "Good communication is essential in any relationship.", "quote_zh": "良好的沟通在任何关系中都是必不可少的。", "ex_en": "Email is my main form of communication at work.", "ex_zh": "电子邮件是我工作中的主要沟通方式。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0317", "unit": "Unit 6"}, {"word": "conjecture", "pron": "kənˈdʒektʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "an opinion formed without complete information", "def_zh": "猜测；推测", "quote_en": "The article was based on conjecture rather than evidence.", "quote_zh": "这篇文章基于猜测而非证据。", "ex_en": "It's pure conjecture, but I think she is leaving.", "ex_zh": "这纯属猜测，但我认为她要走了。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0318", "unit": "Unit 6"}, {"word": "dialect", "pron": "ˈdaɪəlekt", "part_of_speech": "n.", "pos": "n.", "def_en": "a form of a language spoken in a particular region", "def_zh": "方言", "quote_en": "Many Chinese dialects are very different from Mandarin.", "quote_zh": "许多汉语方言与普通话差别很大。", "ex_en": "My grandmother speaks a local dialect.", "ex_zh": "我奶奶说一种当地方言。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0319", "unit": "Unit 6"}, {"word": "fluency", "pron": "ˈfluːənsi", "part_of_speech": "n.", "pos": "n.", "def_en": "the ability to speak or write smoothly and easily", "def_zh": "流利；流畅", "quote_en": "Fluency develops through regular speaking practice.", "quote_zh": "流利程度需要通过定期的口语练习来培养。", "ex_en": "My goal is to improve my fluency in English.", "ex_zh": "我的目标是提高英语流利度。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0320", "unit": "Unit 6"}, {"word": "hesitation", "pron": "ˌhezɪˈteɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a pause before saying or doing something", "def_zh": "犹豫；迟疑", "quote_en": "Frequent hesitation can lower your fluency score in the speaking test.", "quote_zh": "频繁的迟疑会降低你口语考试的流利度得分。", "ex_en": "She answered without hesitation.", "ex_zh": "她毫不犹豫地回答了。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0321", "unit": "Unit 6"}, {"word": "language", "pron": "ˈlæŋɡwɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a system of words used for communication", "def_zh": "语言", "quote_en": "Learning a second language improves memory and creativity.", "quote_zh": "学习第二语言能提高记忆力和创造力。", "ex_en": "English is the language of international business.", "ex_zh": "英语是国际商务的语言。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0322", "unit": "Unit 6"}, {"word": "language barrier", "pron": "ˈlæŋɡwɪdʒ ˈbæriə", "part_of_speech": "n.", "pos": "n.", "def_en": "a difficulty in communicating because of different languages", "def_zh": "语言障碍", "quote_en": "The language barrier is a major challenge for new immigrants.", "quote_zh": "语言障碍是新移民面临的一大挑战。", "ex_en": "We solved the language barrier by using gestures.", "ex_zh": "我们用手势解决了语言障碍。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0323", "unit": "Unit 6"}, {"word": "linguist", "pron": "ˈlɪŋɡwɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who studies languages", "def_zh": "语言学家", "quote_en": "A linguist can explain how languages change over time.", "quote_zh": "语言学家可以解释语言如何随时间变化。", "ex_en": "My uncle is a linguist at a university.", "ex_zh": "我叔叔是大学里的语言学家。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0324", "unit": "Unit 6"}, {"word": "linguistics", "pron": "lɪŋˈɡwɪstɪks", "part_of_speech": "n.", "pos": "n.", "def_en": "the scientific study of language", "def_zh": "语言学", "quote_en": "Linguistics helps us understand how children acquire language.", "quote_zh": "语言学帮助我们理解儿童如何习得语言。", "ex_en": "I'm taking a course in linguistics this semester.", "ex_zh": "我这学期修了一门语言学课程。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0325", "unit": "Unit 6"}, {"word": "means of communication", "pron": "miːnz əv kəˌmjuːnɪˈkeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a way of sending or sharing information", "def_zh": "交流方式；通讯手段", "quote_en": "Social media is now a popular means of communication among young people.", "quote_zh": "社交媒体现在是年轻人中流行的交流方式。", "ex_en": "The phone is still my main means of communication.", "ex_zh": "电话仍是我的主要沟通方式。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0326", "unit": "Unit 6"}, {"word": "mother tongue", "pron": "ˈmʌðə tʌŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the first language you learn as a child", "def_zh": "母语", "quote_en": "Children learn best in their mother tongue in the early years.", "quote_zh": "孩子在早期用母语学习效果最好。", "ex_en": "My mother tongue is Mandarin.", "ex_zh": "我的母语是普通话。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0327", "unit": "Unit 6"}, {"word": "native speaker", "pron": "ˈneɪtɪv ˈspiːkə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who has spoken a language since childhood", "def_zh": "母语使用者", "quote_en": "Many learners want to practise with a native speaker.", "quote_zh": "许多学习者想和母语使用者练习。", "ex_en": "My teacher is a native speaker of English.", "ex_zh": "我的老师是英语母语者。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0328", "unit": "Unit 6"}, {"word": "pronunciation", "pron": "prəˌnʌnsiˈeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the way a word is said", "def_zh": "发音", "quote_en": "Clear pronunciation helps the listener understand you.", "quote_zh": "清晰的发音有助于听者理解你。", "ex_en": "My pronunciation of the word \"thought\" is not good.", "ex_zh": "我对单词\"thought\"的发音不好。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0329", "unit": "Unit 6"}, {"word": "sign language", "pron": "saɪn ˈlæŋɡwɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a language that uses hand movements for people who cannot hear", "def_zh": "手语", "quote_en": "Sign language is an official language in New Zealand.", "quote_zh": "手语是新西兰的官方语言之一。", "ex_en": "I'm learning sign language to talk with my deaf friend.", "ex_zh": "我正在学手语，以便和我的聋人朋友交谈。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0330", "unit": "Unit 6"}, {"word": "vocabulary", "pron": "vəˈkæbjələri", "part_of_speech": "n.", "pos": "n.", "def_en": "all the words a person knows or uses", "def_zh": "词汇", "quote_en": "A wide vocabulary helps you express ideas more precisely.", "quote_zh": "丰富的词汇有助于你更准确地表达想法。", "ex_en": "I try to learn ten new words of vocabulary every day.", "ex_zh": "我努力每天学十个新词汇。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0331", "unit": "Unit 6"}, {"word": "incoherent", "pron": "ˌɪnkəʊˈhɪərənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not clear or logical", "def_zh": "语无伦次的；不连贯的", "quote_en": "An incoherent essay is difficult for the examiner to follow.", "quote_zh": "语无伦次的文章让考官很难看懂。", "ex_en": "He was so tired that his speech became incoherent.", "ex_zh": "他太累了，说话变得语无伦次。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0332", "unit": "Unit 6"}, {"word": "inherent", "pron": "ɪnˈherənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "existing as a natural or basic part of something", "def_zh": "固有的；内在的", "quote_en": "There are inherent difficulties in translating poetry.", "quote_zh": "翻译诗歌有其固有的困难。", "ex_en": "Some risk is inherent in any business.", "ex_zh": "任何生意都有一定的内在风险。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0333", "unit": "Unit 6"}, {"word": "sophisticated", "pron": "səˈfɪstɪkeɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "complex or advanced; having good taste and experience", "def_zh": "复杂的；老练的", "quote_en": "Dolphins use a sophisticated system of communication.", "quote_zh": "海豚使用一套复杂的交流系统。", "ex_en": "She has a sophisticated taste in music.", "ex_zh": "她对音乐的品味很高雅。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0334", "unit": "Unit 6"}, {"word": "spontaneous", "pron": "spɒnˈteɪniəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "done naturally without planning", "def_zh": "自发的；自然的", "quote_en": "Spontaneous speech is harder to control than prepared speech.", "quote_zh": "即兴的讲话比准备好的讲话更难控制。", "ex_en": "We made a spontaneous decision to go to the beach.", "ex_zh": "我们临时决定去海边。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0335", "unit": "Unit 6"}, {"word": "clarify", "pron": "ˈklærɪfaɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to make something easier to understand", "def_zh": "澄清；阐明", "quote_en": "Teachers should clarify the instructions before the test.", "quote_zh": "老师应该在测试前把说明讲清楚。", "ex_en": "Could you clarify what you mean by that?", "ex_zh": "你能解释一下你的意思吗？", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0336", "unit": "Unit 6"}, {"word": "communicate", "pron": "kəˈmjuːnɪkeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to share information or ideas with others", "def_zh": "交流；沟通", "quote_en": "Learners need to communicate in English every day.", "quote_zh": "学习者需要每天用英语交流。", "ex_en": "I communicate with my family by video call.", "ex_zh": "我通过视频通话与家人联系。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0337", "unit": "Unit 6"}, {"word": "comprehend", "pron": "ˌkɒmprɪˈhend", "part_of_speech": "v.", "pos": "v.", "def_en": "to understand fully", "def_zh": "理解；领会", "quote_en": "Young children cannot always comprehend complex instructions.", "quote_zh": "幼儿并不总能理解复杂的指令。", "ex_en": "I couldn't comprehend what he was saying.", "ex_zh": "我听不懂他在说什么。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0338", "unit": "Unit 6"}, {"word": "conclude", "pron": "kənˈkluːd", "part_of_speech": "v.", "pos": "v.", "def_en": "to decide something after thinking about the facts", "def_zh": "得出结论；结束", "quote_en": "The researchers concluded that bilingual children have better memory.", "quote_zh": "研究人员得出结论：双语儿童记忆力更好。", "ex_en": "We can conclude that the test was too difficult.", "ex_zh": "我们可以得出结论：这次测试太难了。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0339", "unit": "Unit 6"}, {"word": "confirm", "pron": "kənˈfɜːm", "part_of_speech": "v.", "pos": "v.", "def_en": "to show or say that something is true", "def_zh": "证实；确认", "quote_en": "The results confirm the importance of regular practice.", "quote_zh": "结果证实了定期练习的重要性。", "ex_en": "Please confirm your booking by email.", "ex_zh": "请通过电子邮件确认你的预订。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0340", "unit": "Unit 6"}, {"word": "converse", "pron": "kənˈvɜːs", "part_of_speech": "v.", "pos": "v.", "def_en": "to have a conversation", "def_zh": "交谈；谈话", "quote_en": "It's useful to converse with native speakers as often as possible.", "quote_zh": "尽可能多地与母语使用者交谈很有帮助。", "ex_en": "We like to converse for hours about our favourite books.", "ex_zh": "我们喜欢就最喜欢的书交谈好几个小时。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0341", "unit": "Unit 6"}, {"word": "define", "pron": "dɪˈfaɪn", "part_of_speech": "v.", "pos": "v.", "def_en": "to explain the exact meaning of a word or idea", "def_zh": "定义；界定", "quote_en": "Students should define key terms at the start of an essay.", "quote_zh": "学生应该在文章开头定义关键术语。", "ex_en": "How would you define success?", "ex_zh": "你会怎样定义成功？", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0342", "unit": "Unit 6"}, {"word": "demonstrate", "pron": "ˈdemənstreɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to show clearly that something is true or how to do something", "def_zh": "证明；展示", "quote_en": "Good speakers demonstrate a wide range of vocabulary.", "quote_zh": "优秀的演讲者能展示出广泛的词汇。", "ex_en": "The teacher will demonstrate how to use the software.", "ex_zh": "老师将演示如何使用这个软件。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0343", "unit": "Unit 6"}, {"word": "distinguish", "pron": "dɪˈstɪŋɡwɪʃ", "part_of_speech": "v.", "pos": "v.", "def_en": "to recognise the difference between things", "def_zh": "区分；辨别", "quote_en": "Learners must distinguish between formal and informal language.", "quote_zh": "学习者必须区分正式语言和非正式语言。", "ex_en": "I can't distinguish between these two sounds.", "ex_zh": "我分不清这两个音。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0344", "unit": "Unit 6"}, {"word": "emerge", "pron": "ɪˈmɜːdʒ", "part_of_speech": "v.", "pos": "v.", "def_en": "to appear or become known", "def_zh": "出现；浮现", "quote_en": "New slang words emerge every year among young people.", "quote_zh": "每年年轻人中都会出现新的俚语。", "ex_en": "The truth will finally emerge after the investigation.", "ex_zh": "调查后真相终将浮出水面。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0345", "unit": "Unit 6"}, {"word": "evolve", "pron": "ɪˈvɒlv", "part_of_speech": "v.", "pos": "v.", "def_en": "to develop gradually over time", "def_zh": "演变；进化", "quote_en": "Languages evolve as societies change.", "quote_zh": "语言随着社会的变化而演变。", "ex_en": "My opinions may evolve over the years.", "ex_zh": "我的看法可能会随着岁月而演变。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0346", "unit": "Unit 6"}, {"word": "explain", "pron": "ɪkˈspleɪn", "part_of_speech": "v.", "pos": "v.", "def_en": "to make something clear by describing it", "def_zh": "解释；说明", "quote_en": "Teachers should explain grammar rules using simple examples.", "quote_zh": "老师应该用简单的例子解释语法规则。", "ex_en": "Can you explain how this machine works?", "ex_zh": "你能解释一下这台机器是怎么工作的吗？", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0347", "unit": "Unit 6"}, {"word": "illustrate", "pron": "ˈɪləstreɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to show or explain something using examples or pictures", "def_zh": "说明；举例说明", "quote_en": "The graph illustrates the rise in internet use.", "quote_zh": "这张图表说明了互联网使用的增长。", "ex_en": "Let me illustrate my point with an example.", "ex_zh": "让我用一个例子来说明我的观点。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0348", "unit": "Unit 6"}, {"word": "imply", "pron": "ɪmˈplaɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to suggest something without saying it directly", "def_zh": "暗示；意味着", "quote_en": "His silence seemed to imply that he disagreed.", "quote_zh": "他的沉默似乎暗示他不同意。", "ex_en": "Are you trying to imply that I made a mistake?", "ex_zh": "你是想暗示我犯了错吗？", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0349", "unit": "Unit 6"}, {"word": "indicate", "pron": "ˈɪndɪkeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to show or point out", "def_zh": "表明；指出", "quote_en": "The survey results indicate that most people prefer online shopping.", "quote_zh": "调查结果表明大多数人更喜欢网购。", "ex_en": "This sign can indicate the way to the station.", "ex_zh": "这个标志可以指明去车站的路。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0350", "unit": "Unit 6"}, {"word": "pronounce", "pron": "prəˈnaʊns", "part_of_speech": "v.", "pos": "v.", "def_en": "to say a word in a particular way", "def_zh": "发音", "quote_en": "Many learners find it hard to pronounce English vowels correctly.", "quote_zh": "许多学习者觉得很难正确发英语元音。", "ex_en": "How do you pronounce your name?", "ex_zh": "你的名字怎么发音？", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0351", "unit": "Unit 6"}, {"word": "recall", "pron": "rɪˈkɔːl", "part_of_speech": "v.", "pos": "v.", "def_en": "to remember something", "def_zh": "回忆起；记起", "quote_en": "Many people can recall their first day at school.", "quote_zh": "许多人能回忆起上学的第一天。", "ex_en": "I can't recall where I put my keys.", "ex_zh": "我想不起来把钥匙放哪儿了。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0352", "unit": "Unit 6"}, {"word": "refer", "pron": "rɪˈfɜː", "part_of_speech": "v.", "pos": "v.", "def_en": "to mention or talk about; to look at for information", "def_zh": "提到；参考", "quote_en": "Students should refer to the textbook when they have questions.", "quote_zh": "学生有疑问时应该参考课本。", "ex_en": "The speaker will refer to a recent survey.", "ex_zh": "发言者将提到最近的一项调查。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0353", "unit": "Unit 6"}, {"word": "signify", "pron": "ˈsɪɡnɪfaɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to mean or be a sign of something", "def_zh": "表示；意味着", "quote_en": "In some cultures, nodding can signify agreement.", "quote_zh": "在一些文化中，点头可以表示同意。", "ex_en": "A red light can signify danger.", "ex_zh": "红灯可以表示危险。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0354", "unit": "Unit 6"}, {"word": "state", "pron": "steɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to say or write something clearly", "def_zh": "陈述；声明", "quote_en": "The essay should state your opinion clearly in the introduction.", "quote_zh": "文章应在引言中清楚地陈述你的观点。", "ex_en": "Please state your name and address.", "ex_zh": "请说明你的姓名和地址。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0355", "unit": "Unit 6"}, {"word": "stutter", "pron": "ˈstʌtə", "part_of_speech": "v.", "pos": "v.", "def_en": "to repeat sounds when you speak because of difficulty", "def_zh": "口吃；结巴", "quote_en": "Some children stutter when they feel nervous.", "quote_zh": "有些孩子紧张时会结巴。", "ex_en": "I stutter a little when I speak in public.", "ex_zh": "我在公开场合说话时会有点结巴。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0356", "unit": "Unit 6"}, {"word": "suggest", "pron": "səˈdʒest", "part_of_speech": "v.", "pos": "v.", "def_en": "to put forward an idea for someone to consider", "def_zh": "建议；暗示", "quote_en": "Research suggests that bilingual children are better at multitasking.", "quote_zh": "研究表明双语儿童更擅长多任务处理。", "ex_en": "I suggest we meet at the library.", "ex_zh": "我建议我们在图书馆见面。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0357", "unit": "Unit 6"}, {"word": "translate", "pron": "trænzˈleɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to change words from one language to another", "def_zh": "翻译", "quote_en": "It is difficult to translate idioms directly into another language.", "quote_zh": "把习语直接翻译成另一种语言很困难。", "ex_en": "Can you translate this sentence into Chinese?", "ex_zh": "你能把这个句子翻译成中文吗？", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0358", "unit": "Unit 6"}, {"word": "have a say", "pron": "hæv ə seɪ", "part_of_speech": "idiom", "pos": "idiom", "def_en": "to be allowed to give your opinion in a decision", "def_zh": "有发言权", "quote_en": "Young people should have a say in decisions that affect them.", "quote_zh": "年轻人对影响他们的决定应该有发言权。", "ex_en": "Every member of the team should have a say in the plan.", "ex_zh": "团队的每位成员都应该对计划有发言权。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0359", "unit": "Unit 6"}, {"word": "having said that", "pron": "ˈhævɪŋ sed ðæt", "part_of_speech": "idiom", "pos": "idiom", "def_en": "used to introduce a different or opposite point", "def_zh": "话虽如此", "quote_en": "The course is expensive. Having said that, it is excellent value.", "quote_zh": "这门课很贵。话虽如此，它物超所值。", "ex_en": "I like the flat. Having said that, it's too small.", "ex_zh": "我喜欢这套公寓。话虽如此，它太小了。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0360", "unit": "Unit 6"}, {"word": "needless to say", "pron": "ˈniːdləs tə seɪ", "part_of_speech": "idiom", "pos": "idiom", "def_en": "used to introduce something that is obvious", "def_zh": "不用说；不言而喻", "quote_en": "Needless to say, regular practice is the key to fluency.", "quote_zh": "不用说，定期练习是流利的关键。", "ex_en": "Needless to say, I was delighted with the result.", "ex_zh": "不用说，我对结果很满意。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0361", "unit": "Unit 6"}, {"word": "that is to say", "pron": "ðæt ɪz tə seɪ", "part_of_speech": "idiom", "pos": "idiom", "def_en": "used to explain something in other words", "def_zh": "也就是说", "quote_en": "He is a polyglot, that is to say, he speaks many languages.", "quote_zh": "他是个通晓多种语言的人，也就是说，他会说很多种语言。", "ex_en": "I live nearby, that is to say, five minutes away.", "ex_zh": "我住得很近，也就是说，离这里五分钟。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0362", "unit": "Unit 6"}, {"word": "there is something to be said for", "pron": "ðeər ɪz ˈsʌmθɪŋ tə bi sed fɔː", "part_of_speech": "idiom", "pos": "idiom", "def_en": "used to say that something has some good points", "def_zh": "…也有可取之处", "quote_en": "There is something to be said for learning a language at a young age.", "quote_zh": "从小学语言也有可取之处。", "ex_en": "There is something to be said for living in the countryside.", "ex_zh": "住在乡下也有它的好处。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0363", "unit": "Unit 6"}, {"word": "to say the least", "pron": "tə seɪ ðə liːst", "part_of_speech": "idiom", "pos": "idiom", "def_en": "used to show that something is actually much worse or stronger", "def_zh": "至少可以说；说得轻点", "quote_en": "The results were disappointing, to say the least.", "quote_zh": "结果说得轻点也是令人失望的。", "ex_en": "The service was slow, to say the least.", "ex_zh": "至少可以说，服务很慢。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0364", "unit": "Unit 6"}, {"word": "when all is said and done", "pron": "wen ɔːl ɪz sed ænd dʌn", "part_of_speech": "idiom", "pos": "idiom", "def_en": "used to mean \"after considering everything\"", "def_zh": "归根结底；毕竟", "quote_en": "When all is said and done, effective communication matters most.", "quote_zh": "归根结底，有效的沟通最重要。", "ex_en": "When all is said and done, it's your decision.", "ex_zh": "归根结底，这是你的决定。", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0365", "unit": "Unit 6"}, {"word": "you can say that again", "pron": "juː kæn seɪ ðæt əˈɡen", "part_of_speech": "idiom", "pos": "idiom", "def_en": "used to agree strongly with someone", "def_zh": "你说得太对了", "quote_en": "\"It's cold today.\" \"You can say that again!\"", "quote_zh": "“今天好冷。”“你说得太对了！”", "ex_en": "\"The exam was difficult.\" \"You can say that again!\"", "ex_zh": "“这次考试很难。”“你说得太对了！”", "chapter": "Unit 6 · Effective Communication · 有效沟通", "id": "w0366", "unit": "Unit 6"}, {"word": "accommodation", "pron": "əˌkɒməˈdeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a place to stay or live", "def_zh": "住宿", "quote_en": "Accommodation is often the biggest expense for tourists.", "quote_zh": "住宿往往是游客最大的开销。", "ex_en": "I booked accommodation near the beach.", "ex_zh": "我订了靠近海滩的住宿。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0367", "unit": "Unit 7"}, {"word": "attraction", "pron": "əˈtrækʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "something interesting that people visit", "def_zh": "景点；吸引力", "quote_en": "The Sky Tower is a major tourist attraction in Auckland.", "quote_zh": "天空塔是奥克兰的一个主要旅游景点。", "ex_en": "The main attraction of the town is its old castle.", "ex_zh": "这座小镇的主要景点是它的古堡。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0368", "unit": "Unit 7"}, {"word": "community", "pron": "kəˈmjuːnəti", "part_of_speech": "n.", "pos": "n.", "def_en": "a group of people living in the same area", "def_zh": "社区；群体", "quote_en": "Tourism can bring economic benefits to the local community.", "quote_zh": "旅游业可以给当地社区带来经济利益。", "ex_en": "I live in a friendly community.", "ex_zh": "我住在一个友好的社区。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0369", "unit": "Unit 7"}, {"word": "countryside", "pron": "ˈkʌntrisaɪd", "part_of_speech": "n.", "pos": "n.", "def_en": "land outside towns and cities", "def_zh": "乡村；农村", "quote_en": "Many city workers dream of living in the countryside.", "quote_zh": "许多城市上班族梦想住在乡下。", "ex_en": "We went for a walk in the countryside.", "ex_zh": "我们去乡村散步。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0370", "unit": "Unit 7"}, {"word": "destination", "pron": "ˌdestɪˈneɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the place where someone is going", "def_zh": "目的地", "quote_en": "Japan has become a popular holiday destination for New Zealanders.", "quote_zh": "日本已成为新西兰人热门的度假目的地。", "ex_en": "What is your final destination?", "ex_zh": "你的最终目的地是哪里？", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0371", "unit": "Unit 7"}, {"word": "eco-tourism", "pron": "ˈiːkəʊ ˌtʊərɪzəm", "part_of_speech": "n.", "pos": "n.", "def_en": "tourism that protects the natural environment", "def_zh": "生态旅游", "quote_en": "Eco-tourism aims to protect natural habitats.", "quote_zh": "生态旅游旨在保护自然栖息地。", "ex_en": "I'm interested in eco-tourism and wildlife.", "ex_zh": "我对生态旅游和野生动物感兴趣。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0372", "unit": "Unit 7"}, {"word": "effect", "pron": "ɪˈfekt", "part_of_speech": "n.", "pos": "n.", "def_en": "a change caused by something", "def_zh": "影响；效果", "quote_en": "Mass tourism has a negative effect on the environment.", "quote_zh": "大众旅游对环境有负面影响。", "ex_en": "The medicine had no effect on me.", "ex_zh": "这种药对我没有效果。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0373", "unit": "Unit 7"}, {"word": "facilities", "pron": "fəˈsɪlətiz", "part_of_speech": "n.", "pos": "n.", "def_en": "buildings or services provided for a purpose", "def_zh": "设施", "quote_en": "The resort offers excellent facilities for families.", "quote_zh": "这个度假村为家庭提供优质设施。", "ex_en": "The hotel facilities include a gym and a pool.", "ex_zh": "酒店设施包括健身房和游泳池。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0374", "unit": "Unit 7"}, {"word": "identification", "pron": "aɪˌdentɪfɪˈkeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a document that proves who you are", "def_zh": "身份证明；识别", "quote_en": "Passengers must show identification at the airport.", "quote_zh": "乘客必须在机场出示身份证明。", "ex_en": "Don't forget to bring some identification.", "ex_zh": "别忘了带上身份证明。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0375", "unit": "Unit 7"}, {"word": "inhabitant", "pron": "ɪnˈhæbɪtənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who lives in a place", "def_zh": "居民", "quote_en": "The island has only a few hundred inhabitants.", "quote_zh": "这座岛只有几百名居民。", "ex_en": "Each inhabitant of the village is very friendly.", "ex_zh": "村子里的每位居民都很友好。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0376", "unit": "Unit 7"}, {"word": "itinerary", "pron": "aɪˈtɪnərəri", "part_of_speech": "n.", "pos": "n.", "def_en": "a detailed plan of a journey", "def_zh": "行程；旅行计划", "quote_en": "The travel agent prepared a seven-day itinerary for us.", "quote_zh": "旅行社为我们准备了七天的行程。", "ex_en": "Our itinerary includes three cities in Italy.", "ex_zh": "我们的行程包括意大利的三座城市。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0377", "unit": "Unit 7"}, {"word": "journey", "pron": "ˈdʒɜːni", "part_of_speech": "n.", "pos": "n.", "def_en": "an act of travelling from one place to another", "def_zh": "旅程；旅行", "quote_en": "The journey from Auckland to Wellington takes about an hour by plane.", "quote_zh": "从奥克兰到惠灵顿坐飞机大约一小时。", "ex_en": "I enjoyed the long train journey.", "ex_zh": "我很享受这次漫长的火车旅程。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0378", "unit": "Unit 7"}, {"word": "landscape", "pron": "ˈlændskeɪp", "part_of_speech": "n.", "pos": "n.", "def_en": "everything you can see in an area of land", "def_zh": "风景；景观", "quote_en": "The mountain landscape attracts thousands of visitors each year.", "quote_zh": "山地风景每年吸引成千上万的游客。", "ex_en": "The landscape in New Zealand is stunning.", "ex_zh": "新西兰的风景令人惊叹。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0379", "unit": "Unit 7"}, {"word": "luggage", "pron": "ˈlʌɡɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "bags and suitcases that you take on a trip", "def_zh": "行李", "quote_en": "Airlines limit the weight of passengers' luggage.", "quote_zh": "航空公司限制乘客行李的重量。", "ex_en": "I lost my luggage at the airport.", "ex_zh": "我在机场丢了行李。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0380", "unit": "Unit 7"}, {"word": "peak", "pron": "piːk", "part_of_speech": "n.", "pos": "n.", "def_en": "the highest point; the time of greatest activity", "def_zh": "顶峰；高峰", "quote_en": "Hotel prices rise sharply during the peak season.", "quote_zh": "旺季期间酒店价格大幅上涨。", "ex_en": "We reached the peak of the mountain at noon.", "ex_zh": "我们中午到达了山顶。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0381", "unit": "Unit 7"}, {"word": "tourism", "pron": "ˈtʊərɪzəm", "part_of_speech": "n.", "pos": "n.", "def_en": "the business of providing services for visitors", "def_zh": "旅游业", "quote_en": "Tourism is a major source of income for many islands.", "quote_zh": "旅游业是许多岛屿的主要收入来源。", "ex_en": "Tourism has grown quickly in my hometown.", "ex_zh": "我的家乡旅游业发展得很快。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0382", "unit": "Unit 7"}, {"word": "tourist", "pron": "ˈtʊərɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who visits a place for pleasure", "def_zh": "游客", "quote_en": "Every year millions of tourists visit New Zealand.", "quote_zh": "每年有数百万游客访问新西兰。", "ex_en": "I felt like a tourist in my own city.", "ex_zh": "我在自己的城市里感觉像个游客。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0383", "unit": "Unit 7"}, {"word": "transport", "pron": "ˈtrænspɔːt", "part_of_speech": "n.", "pos": "n.", "def_en": "a system of vehicles for moving people or goods", "def_zh": "交通；运输", "quote_en": "Public transport reduces traffic congestion in big cities.", "quote_zh": "公共交通减少了大城市的交通拥堵。", "ex_en": "Public transport in my city is cheap and reliable.", "ex_zh": "我所在城市的公共交通便宜又可靠。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0384", "unit": "Unit 7"}, {"word": "travel", "pron": "ˈtrævl", "part_of_speech": "n.", "pos": "n.", "def_en": "the activity of going from place to place", "def_zh": "旅行；出行", "quote_en": "Air travel has become cheaper over the past twenty years.", "quote_zh": "过去二十年里，航空旅行变得便宜了。", "ex_en": "I love to travel and meet new people.", "ex_zh": "我喜欢旅行并结识新朋友。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0385", "unit": "Unit 7"}, {"word": "travelling", "pron": "ˈtrævəlɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the activity of going on journeys", "def_zh": "旅行；出行", "quote_en": "Travelling t
