}
function markText(text,re){
  var out='',last=0,m;re.lastIndex=0;
  var src=text;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    var e=byWord(m[0]);
    if(state.rev.hide&&e) out+='<span class="gap" data-w="'+esc(e.word)+'" title="'+esc(e.def_zh)+'">▢▢▢ <small>'+esc(e.def_zh.split('；')[0])+'</small></span>';
    else out+='<span class="kw" data-w="'+esc(m[0])+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;

}

  h+='<div class="note" style="margin-bottom:8px">Tap a <span class="kw">highlighted word</span> for its meaning and sound. Tap 🔊 on any sentence to hear it.</div><div id="revBody">';
  p.lines.forEach(function(l,i){
    var file='audio/r_'+state.unit.replace(' ','').toLowerCase()+'_'+p.id+'_'+('0'+(i+1)).slice(-2)+'.mp3';
    h+='<div class="rline'+(r.cur===i?' now':'')+'" data-li="'+i+'">'+(l[0]?'<span class="spkr s'+l[0]+'">'+l[0]+'</span>':'')+
       '<button class="spk" data-audio="'+file+'" data-say="'+esc(l[1])+'" data-alt="'+(l[0]==='B'?1:0)+'" aria-label="Listen">🔊</button>'+
       '<div class="rtext'+(r.listen?' blur':'')+'"><div>'+markText(l[1],re)+'</div>'+(r.zh?'<div class="zh">'+esc(l[2])+'</div>':'')+'</div></div>';
  });
  h+='</div><div id="kwPop" class="pop" style="display:none"></div></div>';
  return h;
}
function render(){
  if((state.tab==='learn'||state.tab==='review')&&state.unit==='ALL')state.unit=units()[0];
  renderTabs();
  var v=document.getElementById('view');
  v.innerHTML=state.tab==='units'?vUnits():state.tab==='learn'?vLearn():state.tab==='flash'?vFlash():state.tab==='quiz'?vQuiz():vReview();
  if(state.tab==='quiz'){var f=v.querySelector('.boxes input');if(f)f.focus();if(state.auto)setTimeout(function(){var b=document.getElementById('qPlay');if(b)b.click()},250)}
  if(state.tab==='flash'&&state.auto&&!state.flip){setTimeout(function(){var b=document.querySelector('#flashCard .spk');if(b)b.click()},250)}
}
function rate(word,good){var b=boxOf(word);b=good?Math.min(5,b+1):1;state.box[word]=b;sset('box',state.box)}

// ----- play-all for review -----
function lineBtn(i){var el=document.querySelector('.rline[data-li="'+i+'"] .spk');return el}
function playAll(i){
  var ps=REVIEWS[state.unit],p=ps[state.rev.pi];
  if(i>=p.lines.length){state.rev.playing=false;state.rev.cur=-1;render();return}
  state.rev.playing=true;state.rev.cur=i;
  document.querySelectorAll('.rline').forEach(function(n){n.classList.toggle('now',+n.dataset.li===i)});
  var pb=document.getElementById('revPlayAll');if(pb)pb.textContent='■ Stop';
  var b=lineBtn(i);
  play(b.dataset.audio,b.dataset.say,b,function(){if(state.rev.playing)playAll(i+1)},b.dataset.alt==='1');
}

// ---------- events ----------
document.addEventListener('click',function(ev){
  var kw=ev.target.closest('.kw,.gap');
  if(kw){
    var e=byWord(kw.dataset.w);if(!e)return;
    if(kw.classList.contains('gap')){kw.outerHTML='<span class="kw" data-w="'+esc(e.word)+'">'+esc(e.word)+'</span>'}
    var pop=document.getElementById('kwPop');
    pop.style.display='block';
    pop.innerHTML='<b style="color:var(--gold);font-size:18px">'+esc(e.word)+'</b> <span class="pos">'+esc(e.pos)+'</span> <span class="ipa">/'+esc(e.pron)+'/</span> '+spk(aw(e),e.word)+'<div>'+esc(e.def_en)+'</div><div class="zh">'+esc(e.def_zh)+'</div>';
    pop.querySelector('.spk').click();
    return;
  }
  var t=ev.target.closest('button,.unit,#flashCard,.rtext');if(!t)return;
  if(t.classList&&t.classList.contains('rtext')){t.classList.remove('blur');return}
  if(t.dataset&&t.dataset.audio!==undefined){ev.stopPropagation();play(t.dataset.audio,t.dataset.say,t,null,t.dataset.alt==='1');return}
  if(t.dataset&&t.dataset.tab){stopAll();state.rev.playing=false;state.tab=t.dataset.tab;state.flip=false;render();return}
  if(t.dataset&&t.dataset.rp!==undefined){stopAll();state.rev.playing=false;state.rev.cur=-1;state.rev.pi=+t.dataset.rp;render();return}
  if(t.classList.contains('unit')){state.unit=t.dataset.unit;state.tab='learn';render();return}
  var id=t.id,n=pool().length;
  if(id==='revPlayAll'){if(state.rev.playing){stopAll();state.rev.playing=false;state.rev.cur=-1;render()}else{playAll(0)}return}
  if(id==='flashCard'){state.flip=!state.flip;render();if(state.flip&&state.auto){var b=document.querySelector('#flashCard .spk');if(b)b.click()}return}
  if(id==='nextC'){state.idx++;state.flip=false;render()}
  if(id==='prevC'){state.idx=(state.idx+n-1)%n;state.flip=false;render()}
  if(id==='goodC'){rate(pool()[state.idx%n].word,true);state.idx++;state.flip=false;render()}
  if(id==='againC'){rate(pool()[state.idx%n].word,false);state.idx++;state.flip=false;render()}
  if(id==='themeBtn'){state.light=!state.light;sset('light',state.light);document.body.classList.toggle('light',state.light)}
  if(id==='testVoice'){play('audio/test.mp3','Social media can broaden the mind, but it may also be a distraction.',t)}
  if(id==='qNext'){state.quizIdx++;render()}
  if(id==='qCheck')checkQ();
  if(id==='qHint'){var ins=document.querySelectorAll('#boxes input'),w=pool()[state.quizIdx%n].word;for(var i=0;i<ins.length;i++){if(!ins[i].value){ins[i].value=w[ins[i].dataset.i];break}}}
});
document.addEventListener('input',function(ev){
  var el=ev.target;if(el.parentNode&&el.parentNode.id==='boxes'&&el.value){var nx=el.nextElementSibling;while(nx&&nx.tagName!=='INPUT')nx=nx.nextElementSibling;if(nx)nx.focus()}
});
document.addEventListener('keydown',function(ev){
  var el=ev.target;
  if(el.parentNode&&el.parentNode.id==='boxes'){
    if(ev.key==='Enter'){checkQ()}
    if(ev.key==='Backspace'&&!el.value){var p=el.previousElementSibling;while(p&&p.tagName!=='INPUT')p=p.previousElementSibling;if(p){p.focus();p.value=''}}
  }
});
function checkQ(){
  var e=pool()[state.quizIdx%pool().length],ins=document.querySelectorAll('#boxes input'),ok=true;
  var letters=e.word.replace(/[\s\-\/]/g,'');var k=0;
  ins.forEach(function(i){var good=i.value.toLowerCase()===e.word[i.dataset.i].toLowerCase();i.className=good?'ok':'no';if(!good)ok=false});
  var m=document.getElementById('qMsg');
  m.className='msg '+(ok?'ok':'no');m.textContent=ok?'✓ Correct! '+e.word:'✗ Try again — '+letters.length+' letters';
  rate(e.word,ok);
  if(ok&&state.auto){var b=document.getElementById('qPlay');play(ae(e),e.ex_en,b)}
}
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='voiceSel'){state.voice=el.value;sset('voice',state.voice);deviceSpeak('This is how the fallback voice sounds.',null)}
  if(el.id==='rateSel'){state.rate=el.value;sset('rate',state.rate)}
  if(el.id==='autoPlay'){state.auto=el.checked;sset('auto',state.auto)}
  if(el.id==='langSel'){state.lang=el.value;sset('lang',state.lang);render()}
  if(el.id==='unitSel'){stopAll();state.rev.playing=false;state.rev.cur=-1;state.rev.pi=0;state.unit=el.value;state.idx=0;state.quizIdx=0;state.flip=false;render()}
  if(el.id==='revZh'){state.rev.zh=el.checked;render()}
  if(el.id==='revListen'){state.rev.listen=el.checked;render()}
  if(el.id==='revHide'){state.rev.hide=el.checked;render()}
});
document.getElementById('rateSel').value=state.rate;
document.getElementById('autoPlay').checked=state.auto;
document.getElementById('langSel').value=state.lang;
document.body.classList.toggle('light',state.light);
render();

</script>
</body>
</html>
