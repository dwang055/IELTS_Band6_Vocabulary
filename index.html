eaches you more than any textbook can.", "quote_zh": "旅行比任何课本都能教给你更多东西。", "ex_en": "I enjoy travelling by train.", "ex_zh": "我喜欢乘火车旅行。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0386", "unit": "Unit 7"}, {"word": "trend", "pron": "trend", "part_of_speech": "n.", "pos": "n.", "def_en": "a general direction in which something is changing", "def_zh": "趋势；潮流", "quote_en": "There is a growing trend towards eco-friendly holidays.", "quote_zh": "环保度假的趋势越来越明显。", "ex_en": "Short city breaks are the current trend.", "ex_zh": "短途城市游是当前的潮流。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0387", "unit": "Unit 7"}, {"word": "trip", "pron": "trɪp", "part_of_speech": "n.", "pos": "n.", "def_en": "a journey to a place and back", "def_zh": "旅行；短途旅行", "quote_en": "School trips help students learn outside the classroom.", "quote_zh": "学校旅行帮助学生在课堂之外学习。", "ex_en": "We took a day trip to the lake.", "ex_zh": "我们去湖边进行了一日游。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0388", "unit": "Unit 7"}, {"word": "village", "pron": "ˈvɪlɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a small town in the countryside", "def_zh": "村庄", "quote_en": "Many young people leave their village to find work in the city.", "quote_zh": "许多年轻人离开村庄去城市找工作。", "ex_en": "My grandparents live in a quiet village.", "ex_zh": "我的祖父母住在一个安静的村庄里。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0389", "unit": "Unit 7"}, {"word": "adventurous", "pron": "ədˈventʃərəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "willing to try new or exciting things", "def_zh": "爱冒险的；大胆的", "quote_en": "Adventurous travellers prefer unusual destinations.", "quote_zh": "爱冒险的旅行者喜欢不寻常的目的地。", "ex_en": "I'm adventurous, so I like to try local food.", "ex_zh": "我爱冒险，所以喜欢尝试当地美食。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0390", "unit": "Unit 7"}, {"word": "budget", "pron": "ˈbʌdʒɪt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not expensive; low-cost", "def_zh": "经济实惠的；预算有限的", "quote_en": "Budget airlines have made travel more affordable.", "quote_zh": "廉价航空使旅行更加经济实惠。", "ex_en": "We stayed in a budget hotel near the station.", "ex_zh": "我们住在车站附近的一家经济型酒店。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0391", "unit": "Unit 7"}, {"word": "breathtaking", "pron": "ˈbreθteɪkɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "extremely beautiful or surprising", "def_zh": "惊艳的；令人叹为观止的", "quote_en": "The view from the top of the mountain was breathtaking.", "quote_zh": "山顶的景色令人叹为观止。", "ex_en": "The sunset over the sea was breathtaking.", "ex_zh": "海上的日落美得令人惊叹。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0392", "unit": "Unit 7"}, {"word": "coastal", "pron": "ˈkəʊstl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "near or relating to the coast", "def_zh": "沿海的", "quote_en": "Coastal towns attract many visitors in summer.", "quote_zh": "沿海城镇夏天吸引许多游客。", "ex_en": "I grew up in a small coastal village.", "ex_zh": "我在一个沿海小村庄长大。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0393", "unit": "Unit 7"}, {"word": "cosmopolitan", "pron": "ˌkɒzməˈpɒlɪtən", "part_of_speech": "adj.", "pos": "adj.", "def_en": "containing people from many different countries", "def_zh": "国际化的；世界性的", "quote_en": "London is a cosmopolitan city with people from all over the world.", "quote_zh": "伦敦是一座国际化的城市，居住着来自世界各地的人。", "ex_en": "I love the cosmopolitan atmosphere of Auckland.", "ex_zh": "我喜欢奥克兰国际化的氛围。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0394", "unit": "Unit 7"}, {"word": "diverse", "pron": "daɪˈvɜːs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very different from each other; varied", "def_zh": "多样的；不同的", "quote_en": "The country has a diverse culture and landscape.", "quote_zh": "这个国家拥有多元的文化和景观。", "ex_en": "My class is diverse, with students from ten countries.", "ex_zh": "我们班很多元，有来自十个国家的学生。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0395", "unit": "Unit 7"}, {"word": "flexible", "pron": "ˈfleksəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to change or be changed easily", "def_zh": "灵活的；可变通的", "quote_en": "A flexible itinerary lets you change your plans at short notice.", "quote_zh": "灵活的行程让你可以临时改变计划。", "ex_en": "I'm flexible about the time of the meeting.", "ex_zh": "会议时间我可以灵活调整。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0396", "unit": "Unit 7"}, {"word": "foreign", "pron": "ˈfɒrən", "part_of_speech": "adj.", "pos": "adj.", "def_en": "from or relating to another country", "def_zh": "外国的", "quote_en": "Foreign visitors often enjoy trying local food.", "quote_zh": "外国游客常常喜欢尝试当地美食。", "ex_en": "I'd like to learn a foreign language.", "ex_zh": "我想学一门外语。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0397", "unit": "Unit 7"}, {"word": "local", "pron": "ˈləʊkl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to a particular area", "def_zh": "当地的；本地的", "quote_en": "Local customs should be respected by all tourists.", "quote_zh": "所有游客都应尊重当地习俗。", "ex_en": "I prefer to eat at local restaurants.", "ex_zh": "我更喜欢在当地餐馆吃饭。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0398", "unit": "Unit 7"}, {"word": "luxurious", "pron": "lʌɡˈʒʊəriəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very comfortable and expensive", "def_zh": "奢华的；豪华的", "quote_en": "The luxurious hotel has a private beach.", "quote_zh": "这家豪华酒店有一片私人海滩。", "ex_en": "We stayed in a luxurious suite for our honeymoon.", "ex_zh": "我们蜜月时住了一间豪华套房。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0399", "unit": "Unit 7"}, {"word": "mountainous", "pron": "ˈmaʊntənəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having many mountains", "def_zh": "多山的", "quote_en": "The mountainous region is popular with skiers.", "quote_zh": "这个多山地区深受滑雪者欢迎。", "ex_en": "The south of the island is very mountainous.", "ex_zh": "岛的南部山很多。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0400", "unit": "Unit 7"}, {"word": "peaceful", "pron": "ˈpiːsfl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "calm and quiet", "def_zh": "宁静的；平和的", "quote_en": "Many people visit the countryside to find a peaceful environment.", "quote_zh": "许多人去乡下寻找宁静的环境。", "ex_en": "I love the peaceful atmosphere of the lake.", "ex_zh": "我喜欢湖边宁静的氛围。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0401", "unit": "Unit 7"}, {"word": "picturesque", "pron": "ˌpɪktʃəˈresk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "beautiful in a way that looks like a picture", "def_zh": "如画的；风景优美的", "quote_en": "The picturesque village attracts many photographers.", "quote_zh": "这个风景如画的村庄吸引了许多摄影师。", "ex_en": "We stayed in a picturesque little town.", "ex_zh": "我们住在一个风景如画的小镇上。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0402", "unit": "Unit 7"}, {"word": "polluted", "pron": "pəˈluːtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "made dirty or harmful", "def_zh": "被污染的", "quote_en": "Tourists avoid polluted beaches.", "quote_zh": "游客避开被污染的海滩。", "ex_en": "The river near my home is badly polluted.", "ex_zh": "我家附近的河流污染严重。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0403", "unit": "Unit 7"}, {"word": "quaint", "pron": "kweɪnt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "attractively old-fashioned", "def_zh": "古雅的；古色古香的", "quote_en": "The town is famous for its quaint cottages and narrow streets.", "quote_zh": "这座小镇以古色古香的小屋和狭窄的街道而闻名。", "ex_en": "We had tea in a quaint little cafe.", "ex_zh": "我们在一家古雅的小咖啡馆喝了茶。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0404", "unit": "Unit 7"}, {"word": "remote", "pron": "rɪˈməʊt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "far away from towns or other places", "def_zh": "偏远的；遥远的", "quote_en": "Remote islands often have limited access to services.", "quote_zh": "偏远的岛屿往往难以获得各种服务。", "ex_en": "I stayed in a remote village in the mountains.", "ex_zh": "我住在山里一个偏远的村庄。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0405", "unit": "Unit 7"}, {"word": "rough", "pron": "rʌf", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not smooth; not gentle", "def_zh": "粗糙的；汹涌的", "quote_en": "The ferry was cancelled because of rough seas.", "quote_zh": "由于海面汹涌，渡轮被取消了。", "ex_en": "The road was rough, and the journey was uncomfortable.", "ex_zh": "路很颠簸，旅程很不舒服。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0406", "unit": "Unit 7"}, {"word": "rural", "pron": "ˈrʊərəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the countryside", "def_zh": "农村的；乡村的", "quote_en": "Many rural areas depend on tourism for income.", "quote_zh": "许多农村地区依靠旅游业获得收入。", "ex_en": "I grew up in a rural area.", "ex_zh": "我在农村地区长大。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0407", "unit": "Unit 7"}, {"word": "scenic", "pron": "ˈsiːnɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having beautiful natural views", "def_zh": "风景优美的", "quote_en": "The scenic route along the coast is popular with cyclists.", "quote_zh": "沿海岸的风景优美路线深受骑行者欢迎。", "ex_en": "We took a scenic drive through the valley.", "ex_zh": "我们开车游览了风景优美的山谷。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0408", "unit": "Unit 7"}, {"word": "stunning", "pron": "ˈstʌnɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "extremely beautiful or impressive", "def_zh": "极美的；令人惊叹的", "quote_en": "The island has stunning beaches and clear water.", "quote_zh": "这座岛有绝美的海滩和清澈的海水。", "ex_en": "The view from my hotel room was stunning.", "ex_zh": "我酒店房间的景色美极了。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0409", "unit": "Unit 7"}, {"word": "tough", "pron": "tʌf", "part_of_speech": "adj.", "pos": "adj.", "def_en": "difficult; strong and able to deal with hardship", "def_zh": "艰难的；坚强的", "quote_en": "It is tough to travel with small children.", "quote_zh": "带着小孩旅行很不容易。", "ex_en": "The hike was tough, but the view was worth it.", "ex_zh": "徒步很艰难，但风景值得。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0410", "unit": "Unit 7"}, {"word": "traditional", "pron": "trəˈdɪʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "following customs that have existed for a long time", "def_zh": "传统的", "quote_en": "Visitors enjoy watching traditional dance performances.", "quote_zh": "游客喜欢观看传统舞蹈表演。", "ex_en": "My grandmother cooks traditional Chinese dishes.", "ex_zh": "我奶奶做传统的中国菜。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0411", "unit": "Unit 7"}, {"word": "unspoilt", "pron": "ʌnˈspɔɪlt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "in its natural state and not damaged by development", "def_zh": "未被破坏的；原始的", "quote_en": "The unspoilt beaches are a major attraction for tourists.", "quote_zh": "未被破坏的海滩是游客的一大吸引力。", "ex_en": "I want to find an unspoilt place to relax.", "ex_zh": "我想找一个未被破坏的地方放松。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0412", "unit": "Unit 7"}, {"word": "urban", "pron": "ˈɜːbən", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to towns and cities", "def_zh": "城市的", "quote_en": "Urban areas are usually more crowded than rural ones.", "quote_zh": "城市地区通常比农村地区更拥挤。", "ex_en": "I prefer urban life because it's convenient.", "ex_zh": "我更喜欢城市生活，因为方便。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0413", "unit": "Unit 7"}, {"word": "affect", "pron": "əˈfekt", "part_of_speech": "v.", "pos": "v.", "def_en": "to have an influence on something", "def_zh": "影响", "quote_en": "Bad weather can affect the number of tourists.", "quote_zh": "恶劣天气会影响游客数量。", "ex_en": "Noise from the street can affect my sleep.", "ex_zh": "街上的噪音会影响我的睡眠。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0414", "unit": "Unit 7"}, {"word": "fluctuate", "pron": "ˈflʌktʃueɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to change frequently, especially in number or amount", "def_zh": "波动；起伏", "quote_en": "Hotel prices fluctuate throughout the year.", "quote_zh": "酒店价格全年都在波动。", "ex_en": "The temperature can fluctuate a lot in spring.", "ex_zh": "春天气温可能波动很大。", "chapter": "Unit 7 · On the Move · 旅行与迁移", "id": "w0415", "unit": "Unit 7"}, {"word": "age", "pron": "eɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "how old someone is; a period of history", "def_zh": "年龄；时代", "quote_en": "The average age of the population has risen in many countries.", "quote_zh": "许多国家的人口平均年龄已经上升。", "ex_en": "At my age, I need more sleep.", "ex_zh": "在我这个年纪，我需要更多睡眠。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0416", "unit": "Unit 8"}, {"word": "archaeologist", "pron": "ˌɑːkiˈɒlədʒɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who studies the past by digging up ancient objects", "def_zh": "考古学家", "quote_en": "The archaeologist discovered tools that were thousands of years old.", "quote_zh": "考古学家发现了有几千年历史的工具。", "ex_en": "My cousin wants to become an archaeologist.", "ex_zh": "我表弟想成为一名考古学家。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0417", "unit": "Unit 8"}, {"word": "century", "pron": "ˈsentʃəri", "part_of_speech": "n.", "pos": "n.", "def_en": "a period of one hundred years", "def_zh": "世纪", "quote_en": "The invention of the printing press changed society in the fifteenth century.", "quote_zh": "印刷术的发明在十五世纪改变了社会。", "ex_en": "This old house was built in the nineteenth century.", "ex_zh": "这座老房子建于十九世纪。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0418", "unit": "Unit 8"}, {"word": "decade", "pron": "ˈdekeɪd", "part_of_speech": "n.", "pos": "n.", "def_en": "a period of ten years", "def_zh": "十年", "quote_en": "The city has changed dramatically over the last decade.", "quote_zh": "这座城市在过去十年里发生了巨大变化。", "ex_en": "I have lived here for more than a decade.", "ex_zh": "我在这里住了十多年了。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0419", "unit": "Unit 8"}, {"word": "era", "pron": "ˈɪərə", "part_of_speech": "n.", "pos": "n.", "def_en": "a long period of history with a particular character", "def_zh": "时代；纪元", "quote_en": "The digital era has changed how people communicate.", "quote_zh": "数字时代改变了人们的交流方式。", "ex_en": "My grandfather lived through the era of black-and-white television.", "ex_zh": "我祖父经历过黑白电视的时代。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0420", "unit": "Unit 8"}, {"word": "evidence", "pron": "ˈevɪdəns", "part_of_speech": "n.", "pos": "n.", "def_en": "facts or signs that show something is true", "def_zh": "证据", "quote_en": "There is strong evidence that early humans used fire.", "quote_zh": "有强有力的证据表明早期人类使用火。", "ex_en": "The police found no evidence of a crime.", "ex_zh": "警方没有发现犯罪的证据。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0421", "unit": "Unit 8"}, {"word": "excavation", "pron": "ˌekskəˈveɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the digging up of ancient remains", "def_zh": "发掘；挖掘", "quote_en": "The excavation revealed the remains of a Roman villa.", "quote_zh": "这次发掘揭示了一座罗马别墅的遗迹。", "ex_en": "The excavation took place over three summers.", "ex_zh": "这次发掘持续了三个夏天。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0422", "unit": "Unit 8"}, {"word": "generation", "pron": "ˌdʒenəˈreɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "all the people born around the same time", "def_zh": "一代人；世代", "quote_en": "The older generation often values tradition more.", "quote_zh": "老一代人通常更看重传统。", "ex_en": "My generation grew up with smartphones.", "ex_zh": "我这一代人是伴着智能手机长大的。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0423", "unit": "Unit 8"}, {"word": "the Middle Ages", "pron": "ðə ˈmɪdl ˈeɪdʒɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "the period of European history from about 500 to 1500", "def_zh": "中世纪", "quote_en": "Many castles in Europe were built in the Middle Ages.", "quote_zh": "欧洲许多城堡是在中世纪建造的。", "ex_en": "I'm studying life in the Middle Ages at school.", "ex_zh": "我在学校学习中世纪的生活。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0424", "unit": "Unit 8"}, {"word": "millennium", "pron": "mɪˈleniəm", "part_of_speech": "n.", "pos": "n.", "def_en": "a period of one thousand years", "def_zh": "千年", "quote_en": "The city has been a trading centre for over a millennium.", "quote_zh": "这座城市作为贸易中心已有一千多年。", "ex_en": "We celebrated the start of the new millennium in 2000.", "ex_zh": "我们在2000年庆祝新千年的开始。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0425", "unit": "Unit 8"}, {"word": "pioneer", "pron": "ˌpaɪəˈnɪə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who is the first to do something new", "def_zh": "先驱；开拓者", "quote_en": "Marie Curie was a pioneer in the field of radioactivity.", "quote_zh": "玛丽·居里是放射性研究领域的先驱。", "ex_en": "My uncle is a pioneer of online education.", "ex_zh": "我叔叔是在线教育的先驱。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0426", "unit": "Unit 8"}, {"word": "timeline", "pron": "ˈtaɪmlaɪn", "part_of_speech": "n.", "pos": "n.", "def_en": "a list or diagram of events in the order they happened", "def_zh": "时间线；时间表", "quote_en": "The museum displays a timeline of major inventions.", "quote_zh": "博物馆展示了重大发明的时间线。", "ex_en": "Our teacher drew a timeline on the board.", "ex_zh": "我们老师在黑板上画了一条时间线。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0427", "unit": "Unit 8"}, {"word": "ancient", "pron": "ˈeɪnʃənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very old; from a long time ago", "def_zh": "古代的；古老的", "quote_en": "Ancient civilisations built remarkable monuments.", "quote_zh": "古代文明建造了非凡的纪念碑。", "ex_en": "We visited some ancient ruins in Greece.", "ex_zh": "我们参观了希腊的一些古代遗迹。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0428", "unit": "Unit 8"}, {"word": "chronological", "pron": "ˌkrɒnəˈlɒdʒɪkl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "arranged in the order in which events happened", "def_zh": "按时间顺序的", "quote_en": "The essay presents events in chronological order.", "quote_zh": "这篇文章按时间顺序叙述事件。", "ex_en": "Please put these photos in chronological order.", "ex_zh": "请把这些照片按时间顺序排列。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0429", "unit": "Unit 8"}, {"word": "consecutive", "pron": "kənˈsekjətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "following one after another without a break", "def_zh": "连续的", "quote_en": "It rained for five consecutive days.", "quote_zh": "连续下了五天雨。", "ex_en": "She won the title for the third consecutive year.", "ex_zh": "她连续第三年赢得冠军。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0430", "unit": "Unit 8"}, {"word": "historical", "pron": "hɪˈstɒrɪkl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "connected with the past", "def_zh": "历史的；有关历史的", "quote_en": "The museum holds many historical documents.", "quote_zh": "博物馆收藏着许多历史文件。", "ex_en": "I enjoy reading historical novels.", "ex_zh": "我喜欢读历史小说。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0431", "unit": "Unit 8"}, {"word": "imminent", "pron": "ˈɪmɪnənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "about to happen very soon", "def_zh": "即将发生的；迫近的", "quote_en": "The storm is imminent, so residents should stay indoors.", "quote_zh": "暴风雨即将来临，居民应待在室内。", "ex_en": "The company's collapse seemed imminent.", "ex_zh": "这家公司的倒闭似乎迫在眉睫。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0432", "unit": "Unit 8"}, {"word": "middle-aged", "pron": "ˌmɪdl ˈeɪdʒd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "between about 40 and 60 years old", "def_zh": "中年的", "quote_en": "Middle-aged workers sometimes find it hard to learn new technology.", "quote_zh": "中年员工有时觉得很难学习新技术。", "ex_en": "My neighbour is a friendly middle-aged man.", "ex_zh": "我的邻居是一位友善的中年男士。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0433", "unit": "Unit 8"}, {"word": "nostalgic", "pron": "nɒˈstældʒɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "feeling happy and sad when thinking about the past", "def_zh": "怀旧的", "quote_en": "Old songs can make people feel nostalgic.", "quote_zh": "老歌会让人感到怀旧。", "ex_en": "I feel nostalgic when I look at my childhood photos.", "ex_zh": "看我童年的照片时，我感到怀旧。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0434", "unit": "Unit 8"}, {"word": "prehistoric", "pron": "ˌpriːhɪˈstɒrɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "from the time before written records", "def_zh": "史前的", "quote_en": "Prehistoric people lived in caves and hunted animals.", "quote_zh": "史前的人们住在洞穴里，以狩猎为生。", "ex_en": "The museum has a prehistoric tool collection.", "ex_zh": "博物馆有一批史前工具藏品。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0435", "unit": "Unit 8"}, {"word": "prior", "pron": "ˈpraɪə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "happening or existing before something else", "def_zh": "先前的；在…之前", "quote_en": "Prior to the industrial revolution, most people worked on farms.", "quote_zh": "在工业革命之前，大多数人在农场工作。", "ex_en": "You need prior permission to enter this area.", "ex_zh": "进入这个区域需要事先许可。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0436", "unit": "Unit 8"}, {"word": "punctual", "pron": "ˈpʌŋktʃuəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "arriving or doing something at the right time", "def_zh": "准时的", "quote_en": "Punctual employees make a good impression on managers.", "quote_zh": "准时的员工给经理留下好印象。", "ex_en": "I try to be punctual for every class.", "ex_zh": "我尽量每节课都准时。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0437", "unit": "Unit 8"}, {"word": "time-consuming", "pron": "ˈtaɪm kənˌsjuːmɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "taking a lot of time", "def_zh": "耗时的", "quote_en": "Doing archaeological research is slow and time-consuming.", "quote_zh": "考古研究缓慢而耗时。", "ex_en": "Cooking from scratch can be time-consuming.", "ex_zh": "从头做饭可能很耗时。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0438", "unit": "Unit 8"}, {"word": "erode", "pron": "ɪˈrəʊd", "part_of_speech": "v.", "pos": "v.", "def_en": "to gradually wear away", "def_zh": "侵蚀；削弱", "quote_en": "Rain and wind erode rocks over thousands of years.", "quote_zh": "雨水和风经过几千年侵蚀岩石。", "ex_en": "Constant criticism can erode a person's confidence.", "ex_zh": "不断的批评会削弱一个人的自信。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0439", "unit": "Unit 8"}, {"word": "infer", "pron": "ɪnˈfɜː", "part_of_speech": "v.", "pos": "v.", "def_en": "to form an opinion based on evidence", "def_zh": "推断；推论", "quote_en": "Historians infer how people lived from the objects they left.", "quote_zh": "历史学家从人们遗留的物品推断他们的生活方式。", "ex_en": "I can infer from her smile that she is happy.", "ex_zh": "我可以从她的笑容推断她很开心。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0440", "unit": "Unit 8"}, {"word": "predate", "pron": "ˌpriːˈdeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to exist or happen before something else", "def_zh": "早于；先于", "quote_en": "Some cave paintings predate written language by thousands of years.", "quote_zh": "一些洞穴壁画比文字早了几千年。", "ex_en": "This building seems to predate the city's first church.", "ex_zh": "这座建筑似乎早于这座城市的第一座教堂。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0441", "unit": "Unit 8"}, {"word": "span", "pron": "spæn", "part_of_speech": "v.", "pos": "v.", "def_en": "to continue over a period of time", "def_zh": "跨越；持续", "quote_en": "The history of the empire spans more than five hundred years.", "quote_zh": "这个帝国的历史跨越了五百多年。", "ex_en": "Her career will span four decades.", "ex_zh": "她的职业生涯将长达四十年。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0442", "unit": "Unit 8"}, {"word": "chronologically", "pron": "ˌkrɒnəˈlɒdʒɪkli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "in the order that events happened", "def_zh": "按时间顺序地", "quote_en": "The documents are arranged chronologically in the archive.", "quote_zh": "档案中的文件按时间顺序排列。", "ex_en": "Tell me the story chronologically, from the start.", "ex_zh": "请按时间顺序从头讲这个故事。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0443", "unit": "Unit 8"}, {"word": "formerly", "pron": "ˈfɔːməli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "in the past; before now", "def_zh": "以前；从前", "quote_en": "The museum was formerly a school.", "quote_zh": "这座博物馆以前是一所学校。", "ex_en": "I formerly worked in a bank.", "ex_zh": "我以前在银行工作。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0444", "unit": "Unit 8"}, {"word": "previously", "pron": "ˈpriːviəsli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "at an earlier time", "def_zh": "先前；以前", "quote_en": "Previously, most families did not own a car.", "quote_zh": "以前，大多数家庭没有汽车。", "ex_en": "I had previously met her at a conference.", "ex_zh": "我之前在一次会议上见过她。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0445", "unit": "Unit 8"}, {"word": "subsequently", "pron": "ˈsʌbsɪkwəntli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "afterwards; later", "def_zh": "随后；后来", "quote_en": "The company was subsequently bought by a larger firm.", "quote_zh": "这家公司随后被一家较大的公司收购。", "ex_en": "I failed the test but subsequently passed.", "ex_zh": "我这次考试没通过，但后来通过了。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0446", "unit": "Unit 8"}, {"word": "in time", "pron": "ɪn taɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "early enough; eventually", "def_zh": "及时；最终", "quote_en": "The rescue team arrived in time to save the passengers.", "quote_zh": "救援队及时赶到，救了乘客。", "ex_en": "I got to the station in time for the train.", "ex_zh": "我及时赶到车站赶上了火车。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0447", "unit": "Unit 8"}, {"word": "lose track of time", "pron": "luːz træk əv taɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to not notice how much time has passed", "def_zh": "忘记时间", "quote_en": "Visitors often lose track of time in the museum.", "quote_zh": "参观者在博物馆里常常忘了时间。", "ex_en": "I lose track of time when I read.", "ex_zh": "我读书时会忘记时间。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0448", "unit": "Unit 8"}, {"word": "on time", "pron": "ɒn taɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "at the correct or planned time", "def_zh": "准时", "quote_en": "Trains in Japan are almost always on time.", "quote_zh": "日本的火车几乎总是准时。", "ex_en": "Please be on time for the interview.", "ex_zh": "请准时参加面试。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0449", "unit": "Unit 8"}, {"word": "save time", "pron": "seɪv taɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to use less time to do something", "def_zh": "节省时间", "quote_en": "Online shopping can save time for busy people.", "quote_zh": "网购可以为忙碌的人节省时间。", "ex_en": "Taking the bus will save time.", "ex_zh": "乘公交车会节省时间。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0450", "unit": "Unit 8"}, {"word": "spend time", "pron": "spend taɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to use time doing something", "def_zh": "花时间", "quote_en": "Grandparents like to spend time with their grandchildren.", "quote_zh": "祖父母喜欢花时间陪孙辈。", "ex_en": "I spend time with my friends on weekends.", "ex_zh": "我周末花时间和朋友在一起。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0451", "unit": "Unit 8"}, {"word": "take so long", "pron": "teɪk səʊ lɒŋ", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to need a lot of time", "def_zh": "花这么长时间", "quote_en": "Why does it take so long to get a visa?", "quote_zh": "为什么办签证要花这么长时间？", "ex_en": "I didn't expect the journey to take so long.", "ex_zh": "我没想到旅程要花这么长时间。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0452", "unit": "Unit 8"}, {"word": "take too much time", "pron": "teɪk tuː mʌtʃ taɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to need more time than is reasonable", "def_zh": "花太多时间", "quote_en": "Writing a long essay can take too much time if you don't plan.", "quote_zh": "如果不做计划，写长篇文章可能会花太多时间。", "ex_en": "Homework shouldn't take too much time every evening.", "ex_zh": "每晚的作业不应花太多时间。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0453", "unit": "Unit 8"}, {"word": "the right time", "pron": "ðə raɪt taɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "the best or suitable moment", "def_zh": "合适的时机", "quote_en": "Now is the right time to invest in education.", "quote_zh": "现在是投资教育的合适时机。", "ex_en": "I'm waiting for the right time to tell him.", "ex_zh": "我在等合适的时机告诉他。", "chapter": "Unit 8 · Through the Ages · 历史长河", "id": "w0454", "unit": "Unit 8"}, {"word": "agriculture", "pron": "ˈæɡrɪkʌltʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "the practice of farming", "def_zh": "农业", "quote_en": "Agriculture is the main source of income in rural areas.", "quote_zh": "农业是农村地区的主要收入来源。", "ex_en": "My uncle works in agriculture.", "ex_zh": "我叔叔从事农业。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0455", "unit": "Unit 9"}, {"word": "animal kingdom", "pron": "ˈænɪml ˈkɪŋdəm", "part_of_speech": "n.", "pos": "n.", "def_en": "all living animals as a group", "def_zh": "动物界", "quote_en": "The blue whale is the largest creature in the animal kingdom.", "quote_zh": "蓝鲸是动物界中最大的生物。", "ex_en": "There are many strange creatures in the animal kingdom.", "ex_zh": "动物界有许多奇特的生物。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0456", "unit": "Unit 9"}, {"word": "burrow", "pron": "ˈbʌrəʊ", "part_of_speech": "n.", "pos": "n.", "def_en": "a hole in the ground made by an animal", "def_zh": "洞穴；地洞", "quote_en": "Rabbits dig a burrow to protect themselves from predators.", "quote_zh": "兔子挖洞穴来保护自己免受捕食者伤害。", "ex_en": "The fox returned to its burrow at dawn.", "ex_zh": "狐狸在黎明时回到它的洞穴。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0457", "unit": "Unit 9"}, {"word": "climate", "pron": "ˈklaɪmət", "part_of_speech": "n.", "pos": "n.", "def_en": "the typical weather conditions in a region", "def_zh": "气候", "quote_en": "Climate affects the kinds of crops that farmers can grow.", "quote_zh": "气候影响农民可以种植的作物种类。", "ex_en": "The climate in New Zealand is mild.", "ex_zh": "新西兰的气候温和。", "chapter": "Unit 9 · The Natural World · 自然世界", "id": "w0458", "unit": "Unit 9"}, {"word": "crops", "pron": "krɒps", "part_of_speech": "n.", "pos": "n.", "def_en": "plants grown for food on farms", "def_zh": "农作物", "quote_en": "Drought has destroyed many crops this year.", "
