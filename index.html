, "def_zh": "排放；释放", "quote_en": "Factories must not discharge waste into the river.", "quote_zh": "工厂不得向河里排放废物。", "ex_en": "The battery will discharge slowly when it is not used.", "ex_zh": "电池不使用时会缓慢放电。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0914", "unit": "Unit 16"}, {"word": "emit", "pron": "ɪˈmɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to send out gas, light or sound", "def_zh": "排放；发出", "quote_en": "Coal power stations emit large amounts of carbon dioxide.", "quote_zh": "燃煤发电站排放大量二氧化碳。", "ex_en": "The old car can emit a lot of black smoke.", "ex_zh": "这辆旧车可能冒出很多黑烟。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0915", "unit": "Unit 16"}, {"word": "expend", "pron": "ɪkˈspend", "part_of_speech": "v.", "pos": "v.", "def_en": "to use a large amount of energy or money", "def_zh": "花费；消耗", "quote_en": "Heating a large house expends a great deal of energy.", "quote_zh": "给大房子供暖消耗大量能源。", "ex_en": "I had to expend a lot of effort on the project.", "ex_zh": "我在这个项目上不得不花很多精力。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0916", "unit": "Unit 16"}, {"word": "limit", "pron": "ˈlɪmɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to keep something within a certain amount", "def_zh": "限制", "quote_en": "Governments should limit the use of private cars in the city centre.", "quote_zh": "政府应该限制私家车在市中心的使用。", "ex_en": "I limit my screen time to one hour a day.", "ex_zh": "我把每天的屏幕时间限制在一小时。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0917", "unit": "Unit 16"}, {"word": "outweigh", "pron": "ˌaʊtˈweɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to be greater or more important than something else", "def_zh": "超过；比…更重要", "quote_en": "The benefits of wind power outweigh the costs.", "quote_zh": "风能的好处超过了成本。", "ex_en": "The advantages of living here outweigh the disadvantages.", "ex_zh": "住在这里的好处多于坏处。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0918", "unit": "Unit 16"}, {"word": "preserve", "pron": "prɪˈzɜːv", "part_of_speech": "v.", "pos": "v.", "def_en": "to keep something in its original state", "def_zh": "保护；保存", "quote_en": "National parks help to preserve natural habitats.", "quote_zh": "国家公园有助于保护自然栖息地。", "ex_en": "We want to preserve our old traditions.", "ex_zh": "我们想保存我们的古老传统。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0919", "unit": "Unit 16"}, {"word": "retain", "pron": "rɪˈteɪn", "part_of_speech": "v.", "pos": "v.", "def_en": "to keep something", "def_zh": "保留；保持", "quote_en": "Good insulation helps a house retain heat in winter.", "quote_zh": "良好的隔热层有助于房屋在冬天保暖。", "ex_en": "I can't retain information when I'm tired.", "ex_zh": "我累的时候记不住信息。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0920", "unit": "Unit 16"}, {"word": "waste", "pron": "weɪst", "part_of_speech": "v.", "pos": "v.", "def_en": "to use more of something than is necessary", "def_zh": "浪费", "quote_en": "We should not waste water when we brush our teeth.", "quote_zh": "我们刷牙时不应该浪费水。", "ex_en": "Don't waste your time on that.", "ex_zh": "别在那件事上浪费时间。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0921", "unit": "Unit 16"}, {"word": "advertisement", "pron": "ədˈvɜːtɪsmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a notice or film that tries to persuade people to buy something", "def_zh": "广告", "quote_en": "An advertisement on television can reach millions of people.", "quote_zh": "电视广告可以覆盖数百万人。", "ex_en": "I saw an advertisement for a job in the newspaper.", "ex_zh": "我在报纸上看到一则招聘广告。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0922", "unit": "Unit 17"}, {"word": "advertising", "pron": "ˈædvətaɪzɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the business of making people want to buy things", "def_zh": "广告业；广告宣传", "quote_en": "Advertising influences what young people choose to buy.", "quote_zh": "广告影响年轻人的购买选择。", "ex_en": "My cousin works in advertising.", "ex_zh": "我表哥在广告行业工作。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0923", "unit": "Unit 17"}, {"word": "boss", "pron": "bɒs", "part_of_speech": "n.", "pos": "n.", "def_en": "the person in charge of workers", "def_zh": "老板；上司", "quote_en": "A good boss listens to the ideas of his employees.", "quote_zh": "好老板会倾听员工的想法。", "ex_en": "My boss gave me a day off on Friday.", "ex_zh": "我的老板给了我周五一天假。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0924", "unit": "Unit 17"}, {"word": "campaign", "pron": "kæmˈpeɪn", "part_of_speech": "n.", "pos": "n.", "def_en": "a planned set of actions to achieve a particular aim", "def_zh": "活动；宣传运动", "quote_en": "The company launched an advertising campaign to promote the new product.", "quote_zh": "公司发起了一场广告宣传活动来推广新产品。", "ex_en": "They started a campaign to save the old library.", "ex_zh": "他们发起了一场拯救老图书馆的活动。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0925", "unit": "Unit 17"}, {"word": "candidate", "pron": "ˈkændɪdət", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who applies for a job or takes an exam", "def_zh": "候选人；应聘者", "quote_en": "The company interviewed five candidates for the position.", "quote_zh": "公司为这个职位面试了五位候选人。", "ex_en": "I was the only candidate with experience.", "ex_zh": "我是唯一有经验的应聘者。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0926", "unit": "Unit 17"}, {"word": "career", "pron": "kəˈrɪə", "part_of_speech": "n.", "pos": "n.", "def_en": "the series of jobs a person has in their working life", "def_zh": "职业；事业", "quote_en": "Many young people change their career several times.", "quote_zh": "许多年轻人会多次转换职业。", "ex_en": "I want a career in medicine.", "ex_zh": "我想从事医学行业。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0927", "unit": "Unit 17"}, {"word": "clerk", "pron": "klɑːk", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who does office work such as filing", "def_zh": "职员；办事员", "quote_en": "A bank clerk helped me open an account.", "quote_zh": "一位银行职员帮我开了账户。", "ex_en": "My father worked as a clerk for thirty years.", "ex_zh": "我父亲当了三十年职员。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0928", "unit": "Unit 17"}, {"word": "client", "pron": "ˈklaɪənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who pays for a service", "def_zh": "客户", "quote_en": "A lawyer must protect the interests of the client.", "quote_zh": "律师必须保护客户的利益。", "ex_en": "I have a meeting with a new client tomorrow.", "ex_zh": "我明天要和一位新客户开会。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0929", "unit": "Unit 17"}, {"word": "colleague", "pron": "ˈkɒliːɡ", "part_of_speech": "n.", "pos": "n.", "def_en": "a person you work with", "def_zh": "同事", "quote_en": "A friendly relationship with a colleague makes work more enjoyable.", "quote_zh": "与同事友好相处使工作更愉快。", "ex_en": "I have lunch with my colleague every day.", "ex_zh": "我每天和我的同事一起吃午饭。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0930", "unit": "Unit 17"}, {"word": "company", "pron": "ˈkʌmpəni", "part_of_speech": "n.", "pos": "n.", "def_en": "a business organisation", "def_zh": "公司", "quote_en": "A large company may employ thousands of people.", "quote_zh": "大公司可能雇用成千上万的员工。", "ex_en": "I work for a small software company.", "ex_zh": "我在一家小型软件公司工作。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0931", "unit": "Unit 17"}, {"word": "consumer", "pron": "kənˈsjuːmə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who buys goods or services", "def_zh": "消费者", "quote_en": "Consumers are becoming more aware of environmental issues.", "quote_zh": "消费者对环境问题的意识越来越强。", "ex_en": "As a consumer, I always compare prices.", "ex_zh": "作为消费者，我总是比较价格。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0932", "unit": "Unit 17"}, {"word": "credibility", "pron": "ˌkredəˈbɪləti", "part_of_speech": "n.", "pos": "n.", "def_en": "the quality of being believable", "def_zh": "可信度", "quote_en": "A company's credibility depends on honest advertising.", "quote_zh": "一家公司的可信度取决于诚实的广告。", "ex_en": "The news site lost its credibility after the false story.", "ex_zh": "那个新闻网站因虚假报道失去了可信度。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0933", "unit": "Unit 17"}, {"word": "customer", "pron": "ˈkʌstəmə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who buys goods or services from a shop", "def_zh": "顾客", "quote_en": "Good service keeps customers coming back.", "quote_zh": "良好的服务能让顾客再次光临。", "ex_en": "The customer asked for a refund.", "ex_zh": "顾客要求退款。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0934", "unit": "Unit 17"}, {"word": "earnings", "pron": "ˈɜːnɪŋz", "part_of_speech": "n.", "pos": "n.", "def_en": "the money a person receives for work", "def_zh": "收入；收益", "quote_en": "Average earnings have risen by two per cent this year.", "quote_zh": "今年平均收入增长了百分之二。", "ex_en": "My earnings from the part-time job help pay for my studies.", "ex_zh": "我兼职的收入帮助支付我的学业。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0935", "unit": "Unit 17"}, {"word": "employee", "pron": "ɪmˈplɔɪiː", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who works for a company", "def_zh": "雇员；员工", "quote_en": "Happy employees are more productive.", "quote_zh": "快乐的员工效率更高。", "ex_en": "Each employee has a ten-day holiday.", "ex_zh": "每位员工有十天假期。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0936", "unit": "Unit 17"}, {"word": "employer", "pron": "ɪmˈplɔɪə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person or company that pays people to work", "def_zh": "雇主", "quote_en": "A good employer offers training for its staff.", "quote_zh": "好雇主会为员工提供培训。", "ex_en": "My employer is very flexible about working hours.", "ex_zh": "我的雇主在工作时间上很灵活。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0937", "unit": "Unit 17"}, {"word": "employment", "pron": "ɪmˈplɔɪmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "paid work; the state of having a job", "def_zh": "就业；工作", "quote_en": "The government aims to increase employment among young people.", "quote_zh": "政府的目标是增加年轻人的就业。", "ex_en": "I'm looking for part-time employment.", "ex_zh": "我正在找兼职工作。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0938", "unit": "Unit 17"}, {"word": "goods", "pron": "ɡʊdz", "part_of_speech": "n.", "pos": "n.", "def_en": "things that are made to be sold", "def_zh": "商品；货物", "quote_en": "Online shopping allows consumers to buy goods from all over the world.", "quote_zh": "网购使消费者可以购买来自世界各地的商品。", "ex_en": "The shop sells electrical goods.", "ex_zh": "这家店出售电器商品。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0939", "unit": "Unit 17"}, {"word": "income", "pron": "ˈɪnkʌm", "part_of_speech": "n.", "pos": "n.", "def_en": "money that a person receives regularly", "def_zh": "收入", "quote_en": "Families on a low income often struggle to pay for housing.", "quote_zh": "低收入家庭往往难以支付住房费用。", "ex_en": "My income comes from teaching.", "ex_zh": "我的收入来自教书。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0940", "unit": "Unit 17"}, {"word": "interview", "pron": "ˈɪntəvjuː", "part_of_speech": "n.", "pos": "n.", "def_en": "a formal meeting to ask someone questions, for example about a job", "def_zh": "面试；采访", "quote_en": "You should prepare carefully for a job interview.", "quote_zh": "你应该为求职面试做好充分准备。", "ex_en": "I have an interview next Monday.", "ex_zh": "我下周一有个面试。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0941", "unit": "Unit 17"}, {"word": "job", "pron": "dʒɒb", "part_of_speech": "n.", "pos": "n.", "def_en": "work that you do to earn money", "def_zh": "工作；职业", "quote_en": "Finding a job is difficult for many graduates.", "quote_zh": "找工作对许多毕业生来说很难。", "ex_en": "I got a part-time job at a cafe.", "ex_zh": "我在一家咖啡馆找到了一份兼职。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0942", "unit": "Unit 17"}, {"word": "job satisfaction", "pron": "dʒɒb ˌsætɪsˈfækʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the feeling of being happy with your work", "def_zh": "工作满意度", "quote_en": "Job satisfaction is often more important than a high salary.", "quote_zh": "工作满意度往往比高薪更重要。", "ex_en": "I get a lot of job satisfaction from helping people.", "ex_zh": "我从帮助别人中获得很大的工作满足感。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0943", "unit": "Unit 17"}, {"word": "labourer", "pron": "ˈleɪbərə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who does hard physical work", "def_zh": "体力劳动者；工人", "quote_en": "A labourer on a building site works long hours.", "quote_zh": "建筑工地上的工人工作时间很长。", "ex_en": "My grandfather was a farm labourer.", "ex_zh": "我祖父是农场工人。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0944", "unit": "Unit 17"}, {"word": "management", "pron": "ˈmænɪdʒmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "the people who control a company; the act of controlling", "def_zh": "管理层；管理", "quote_en": "Good management is the key to a successful business.", "quote_zh": "良好的管理是企业成功的关键。", "ex_en": "The management has decided to open a new branch.", "ex_zh": "管理层已决定开设一家新分店。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0945", "unit": "Unit 17"}, {"word": "manual work", "pron": "ˌmænjuəl ˈwɜːk", "part_of_speech": "n.", "pos": "n.", "def_en": "work done with your hands, often physical", "def_zh": "体力劳动", "quote_en": "Manual work can be tiring but rewarding.", "quote_zh": "体力劳动可能很累，但也有成就感。", "ex_en": "My brother prefers manual work to office work.", "ex_zh": "我弟弟喜欢体力劳动胜过办公室工作。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0946", "unit": "Unit 17"}, {"word": "marketing", "pron": "ˈmɑːkɪtɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the activity of promoting and selling products", "def_zh": "市场营销", "quote_en": "Marketing plays an important role in a company's success.", "quote_zh": "市场营销在公司的成功中起着重要作用。", "ex_en": "I study marketing at university.", "ex_zh": "我在大学学市场营销。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0947", "unit": "Unit 17"}, {"word": "meeting", "pron": "ˈmiːtɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "an occasion when people come together to discuss something", "def_zh": "会议", "quote_en": "The meeting lasted for more than two hours.", "quote_zh": "会议持续了两个多小时。", "ex_en": "I have a meeting with my manager at ten.", "ex_zh": "我十点和经理开会。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0948", "unit": "Unit 17"}, {"word": "money", "pron": "ˈmʌni", "part_of_speech": "n.", "pos": "n.", "def_en": "coins and notes used to buy things", "def_zh": "钱", "quote_en": "Many people work abroad to earn more money.", "quote_zh": "许多人到国外工作以赚更多的钱。", "ex_en": "I'm saving money for a holiday.", "ex_zh": "我在为度假存钱。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0949", "unit": "Unit 17"}, {"word": "niche", "pron": "niːʃ", "part_of_speech": "n.", "pos": "n.", "def_en": "a small, specialised area of the market", "def_zh": "利基市场；细分领域", "quote_en": "The company found a niche selling eco-friendly shoes.", "quote_zh": "这家公司找到了一个销售环保鞋的细分市场。", "ex_en": "She has found a niche in the fashion industry.", "ex_zh": "她在时装行业中找到了自己的细分领域。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0950", "unit": "Unit 17"}, {"word": "occupation", "pron": "ˌɒkjuˈpeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a person's job or profession", "def_zh": "职业", "quote_en": "Please write your name, age and occupation on the form.", "quote_zh": "请在表格上填写您的姓名、年龄和职业。", "ex_en": "What is your occupation?", "ex_zh": "你的职业是什么？", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0951", "unit": "Unit 17"}, {"word": "office", "pron": "ˈɒfɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where people work at desks", "def_zh": "办公室", "quote_en": "Many people now work from home rather than in an office.", "quote_zh": "现在许多人在家工作而不是在办公室。", "ex_en": "My office is on the third floor.", "ex_zh": "我的办公室在三楼。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0952", "unit": "Unit 17"}, {"word": "overtime", "pron": "ˈəʊvətaɪm", "part_of_speech": "n.", "pos": "n.", "def_en": "extra hours worked beyond normal working time", "def_zh": "加班；加班费", "quote_en": "Many employees work overtime to earn extra money.", "quote_zh": "许多员工加班来赚额外的钱。", "ex_en": "I worked overtime last night to finish the report.", "ex_zh": "我昨晚加班完成了报告。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0953", "unit": "Unit 17"}, {"word": "packaging", "pron": "ˈpækɪdʒɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the materials used to wrap products", "def_zh": "包装", "quote_en": "Excess packaging creates a lot of waste.", "quote_zh": "过度包装产生大量垃圾。", "ex_en": "The packaging of the product was very attractive.", "ex_zh": "这件产品的包装非常吸引人。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0954", "unit": "Unit 17"}, {"word": "pay", "pron": "peɪ", "part_of_speech": "n.", "pos": "n.", "def_en": "money received for work", "def_zh": "薪水；报酬", "quote_en": "Nurses deserve better pay for their hard work.", "quote_zh": "护士的辛勤工作应该得到更好的报酬。", "ex_en": "The pay is good but the hours are long.", "ex_zh": "薪水不错，但工作时间很长。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0955", "unit": "Unit 17"}, {"word": "perk", "pron": "pɜːk", "part_of_speech": "n.", "pos": "n.", "def_en": "an extra benefit given to an employee", "def_zh": "额外福利", "quote_en": "Free meals are one of the perks of working for the company.", "quote_zh": "免费餐是为这家公司工作的福利之一。", "ex_en": "A company car is a nice perk.", "ex_zh": "公司配车是一项不错的福利。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0956", "unit": "Unit 17"}, {"word": "product", "pron": "ˈprɒdʌkt", "part_of_speech": "n.", "pos": "n.", "def_en": "something that is made or grown to be sold", "def_zh": "产品", "quote_en": "The company launched a new product last month.", "quote_zh": "这家公司上个月推出了一款新产品。", "ex_en": "This product is made from recycled plastic.", "ex_zh": "这个产品是用再生塑料做的。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0957", "unit": "Unit 17"}, {"word": "profession", "pron": "prəˈfeʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a job that needs special training", "def_zh": "职业；行业", "quote_en": "Teaching is a respected profession in many countries.", "quote_zh": "教师在许多国家是一个受人尊敬的职业。", "ex_en": "My sister chose nursing as her profession.", "ex_zh": "我姐姐选择了护理作为她的职业。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0958", "unit": "Unit 17"}, {"word": "prospects", "pron": "ˈprɒspekts", "part_of_speech": "n.", "pos": "n.", "def_en": "the chances of future success", "def_zh": "前景；机会", "quote_en": "Good qualifications improve your career prospects.", "quote_zh": "良好的资历能改善你的职业前景。", "ex_en": "The job prospects for engineers are excellent.", "ex_zh": "工程师的就业前景非常好。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0959", "unit": "Unit 17"}, {"word": "qualifications", "pron": "ˌkwɒlɪfɪˈkeɪʃnz", "part_of_speech": "n.", "pos": "n.", "def_en": "exams passed or training completed for a job", "def_zh": "资历；资格", "quote_en": "Employers often ask for qualifications as well as experience.", "quote_zh": "雇主常常要求有资历，也看重经验。", "ex_en": "I'm studying to get better qualifications.", "ex_zh": "我在学习以获得更好的资历。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0960", "unit": "Unit 17"}, {"word": "retirement", "pron": "rɪˈtaɪəmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "the time when someone stops working because of age", "def_zh": "退休", "quote_en": "Many people plan their retirement carefully.", "quote_zh": "许多人会仔细规划自己的退休生活。", "ex_en": "My father is looking forward to retirement.", "ex_zh": "我父亲期待着退休。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0961", "unit": "Unit 17"}, {"word": "salary", "pron": "ˈsæləri", "part_of_speech": "n.", "pos": "n.", "def_en": "fixed pay received every month", "def_zh": "薪水；工资", "quote_en": "A high salary does not always mean a happy life.", "quote_zh": "高薪并不总意味着幸福的生活。", "ex_en": "My salary is paid on the last day of the month.", "ex_zh": "我的薪水在每个月的最后一天发放。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0962", "unit": "Unit 17"}, {"word": "shares", "pron": "ʃeəz", "part_of_speech": "n.", "pos": "n.", "def_en": "parts of the ownership of a company", "def_zh": "股份；股票", "quote_en": "Employees may be given shares in the company.", "quote_zh": "员工可能会获得公司的股份。", "ex_en": "He bought shares in a technology firm.", "ex_zh": "他购买了一家科技公司的股票。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0963", "unit": "Unit 17"}, {"word": "shift work", "pron": "ʃɪft wɜːk", "part_of_speech": "n.", "pos": "n.", "def_en": "work done during set periods, including nights", "def_zh": "轮班工作", "quote_en": "Shift work can disturb a person's sleep pattern.", "quote_zh": "轮班工作可能扰乱人的睡眠规律。", "ex_en": "Nurses often have to do shift work.", "ex_zh": "护士常常要轮班工作。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0964", "unit": "Unit 17"}, {"word": "skills", "pron": "skɪlz", "part_of_speech": "n.", "pos": "n.", "def_en": "abilities to do something well", "def_zh": "技能", "quote_en": "Employers value communication skills above all else.", "quote_zh": "雇主最看重沟通技能。", "ex_en": "I need to improve my computer skills.", "ex_zh": "我需要提高我的电脑技能。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0965", "unit": "Unit 17"}, {"word": "staff", "pron": "stɑːf", "part_of_speech": "n.", "pos": "n.", "def_en": "the people who work for a company", "def_zh": "员工；职员", "quote_en": "The school has over fifty members of staff.", "quote_zh": "这所学校有五十多名教职员工。", "ex_en": "The staff at the hotel were very friendly.", "ex_zh": "酒店的员工非常友好。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0966", "unit": "Unit 17"}, {"word": "supervisor", "pron": "ˈsuːpəvaɪzə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who watches and directs the work of others", "def_zh": "主管；监督人", "quote_en": "A supervisor should give clear instructions to the team.", "quote_zh": "主管应该给团队清晰的指示。", "ex_en": "My supervisor praised my work.", "ex_zh": "我的主管表扬了我的工作。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0967", "unit": "Unit 17"}, {"word": "takeover", "pron": "ˈteɪkəʊvə", "part_of_speech": "n.", "pos": "n.", "def_en": "when one company buys control of another", "def_zh": "收购；接管", "quote_en": "The takeover led to the loss of five hundred jobs.", "quote_zh": "这次收购导致五百人失业。", "ex_en": "The bank announced a takeover of its rival.", "ex_zh": "这家银行宣布收购其竞争对手。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0968", "unit": "Unit 17"}, {"word": "target", "pron": "ˈtɑːɡɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "a goal that you try to reach", "def_zh": "目标；指标", "quote_en": "The sales team missed its monthly target.", "quote_zh": "销售团队没有完成月度目标。", "ex_en": "My target is to save a thousand dollars this year.", "ex_zh": "我的目标是今年存一千美元。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0969", "unit": "Unit 17"}, {"word": "trade", "pron": "treɪd", "part_of_speech": "n.", "pos": "n.", "def_en": "the buying and selling of goods", "def_zh": "贸易", "quote_en": "International trade has grown rapidly in recent decades.", "quote_zh": "近几十年来，国际贸易迅速增长。", "ex_en": "My family is in the clothing trade.", "ex_zh": "我家从事服装贸易。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0970", "unit": "Unit 17"}, {"word": "unemployment", "pron": "ˌʌnɪmˈplɔɪmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "the state of not having a job", "def_zh": "失业", "quote_en": "High unemployment can lead to social problems.", "quote_zh": "高失业率可能导致社会问题。", "ex_en": "Youth unemployment is a serious concern.", "ex_zh": "青年失业是一个严重的问题。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0971", "unit": "Unit 17"}, {"word": "wages", "pron": "ˈweɪdʒɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "money paid regularly to workers", "def_zh": "工资", "quote_en": "Many workers are demanding higher wages.", "quote_zh": "许多工人要求提高工资。", "ex_en": "My wages are paid every Friday.", "ex_zh": "我的工资每周五发放。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0972", "unit": "Unit 17"}, {"word": "workforce", "pron": "ˈwɜːkfɔːs", "part_of_speech": "n.", "pos": "n.", "def_en": "all the people who work in a company or country", "def_zh": "劳动力；员工队伍", "quote_en": "The country's workforce is becoming older.", "quote_zh": "这个国家的劳动力正在老龄化。", "ex_en": "The company has a workforce of two thousand.", "ex_zh": "这家公司有两千名员工。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0973", "unit": "Unit 17"}, {"word": "workplace", "pron": "ˈwɜːkpleɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "the place where people work", "def_zh": "工作场所", "quote_en": "A safe workplace is every employee's right.", "quote_zh": "安全的工作场所是每位员工的权利。", "ex_en": "My workplace is very close to home.", "ex_zh": "我的工作场所离家很近。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0974", "unit": "Unit 17"}, {"word": "hospitality", "pron": "ˌhɒspɪˈtæləti", "part_of_speech": "n.", "pos": "n.", "def_en": "the business of looking after guests in hotels and restaurants", "def_zh": "酒店餐饮业；好客", "quote_en": "Hospitality is one of the biggest employers in tourist areas.", "quote_zh": "在旅游地区，酒店餐饮业是最大的雇主之一。", "ex_en": "I work in hospitality during the summer.", "ex_zh": "我暑假在酒店餐饮业工作。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0975", "unit": "Unit 17"}, {"word": "casual", "pron": "ˈkæʒuəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relaxed and informal; not permanent", "def_zh": "休闲的；临时的", "quote_en": "Many companies now allow casual clothes on Fridays.", "quote_zh": "许多公司现在允许周五穿休闲服。", "ex_en": "I do casual work at weekends.", "ex_zh": "我周末做临时工。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0976", "unit": "Unit 17"}, {"word": "demanding", "pron": "dɪˈmɑːndɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "needing a lot of time, effort or skill", "def_zh": "要求高的；费力的", "quote_en": "A demanding job can leave little time for family.", "quote_zh": "要求很高的工作可能让人没有多少时间陪伴家人。", "ex_en": "My boss is very demanding.", "ex_zh": "我的老板要求非常高。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0977", "unit": "Unit 17"}, {"word": "economic", "pron": "ˌiːkəˈnɒmɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to money, trade and industry", "def_zh": "经济的", "quote_en": "Economic growth can create new jobs.", "quote_zh": "经济增长可以创造新的就业岗位。", "ex_en": "The country faces serious economic problems.", "ex_zh": "这个国家面临严重的经济问题。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0978", "unit": "Unit 17"}, {"word": "economical", "pron": "ˌiːkəˈnɒmɪkl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not wasting money or resources", "def_zh": "节约的；经济实惠的", "quote_en": "A small car is more economical than a large one.", "quote_zh": "小型车比大型车更省钱。", "ex_en": "It's more economical to cook at home.", "ex_zh": "在家做饭更经济实惠。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0979", "unit": "Unit 17"}, {"word": "exhausting", "pron": "ɪɡˈzɔːstɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "making you extremely tired", "def_zh": "令人筋疲力尽的", "quote_en": "Long working hours can be exhausting.", "quote_zh": "长时间工作可能让人筋疲力尽。", "ex_en": "It was an exhausting day at work.", "ex_zh": "工作上度过了令人筋疲力尽的一天。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0980", "unit": "Unit 17"}, {"word": "monotonous", "pron": "məˈnɒtənəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "boring because it never changes", "def_zh": "单调的", "quote_en": "Factory work can be monotonous because of the repetition.", "quote_zh": "由于重复，工厂工作可能很单调。", "ex_en": "I find the long drive monotonous.", "ex_zh": "我觉得长途驾驶很单调。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0981", "unit": "Unit 17"}, {"word": "part-time", "pron": "ˌpɑːt ˈtaɪm", "part_of_speech": "adj.", "pos": "adj.", "def_en": "for only part of the normal working week", "def_zh": "兼职的", "quote_en": "Many students do part-time jobs to earn extra money.", "quote_zh": "许多学生做兼职来赚额外的钱。", "ex_en": "I have a part-time job at a bookshop.", "ex_zh": "我在一家书店做兼职。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0982", "unit": "Unit 17"}, {"word": "retail", "pron": "ˈriːteɪl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to selling goods to the public", "def_zh": "零售的", "quote_en": "The retail sector employs millions of people.", "quote_zh": "零售业雇用了数百万人。", "ex_en": "I work in retail at a clothes store.", "ex_zh": "我在一家服装店做零售工作。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0983", "unit": "Unit 17"}, {"word": "redundant", "pron": "rɪˈdʌndənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "no longer needed for a job", "def_zh": "被裁员的；多余的", "quote_en": "Hundreds of workers were made redundant when the factory closed.", "quote_zh": "工厂倒闭时，数百名工人被裁员。", "ex_en": "My brother was made redundant last month.", "ex_zh": "我哥哥上个月被裁员了。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0984", "unit": "Unit 17"}, {"word": "unemployed", "pron": "ˌʌnɪmˈplɔɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "without a paid job", "def_zh": "失业的", "quote_en": "Unemployed people may lose confidence over time.", "quote_zh": "失业的人可能会随着时间失去信心。", "ex_en": "He has been unemployed for six months.", "ex_zh": "他已经失业六个月了。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0985", "unit": "Unit 17"}, {"word": "unskilled", "pron": "ʌnˈskɪld", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not having special training or skills", "def_zh": "无技能的；非熟练的", "quote_en": "Unskilled workers are the first to lose jobs in a recession.", "quote_zh": "在经济衰退中，非熟练工人最先失业。", "ex_en": "Unskilled work is often poorly paid.", "ex_zh": "无需技能的工作通常报酬不高。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0986", "unit": "Unit 17"}, {"word": "apply", "pron": "əˈplaɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to ask formally for a job or place", "def_zh": "申请", "quote_en": "Graduates should apply for jobs several months before they finish.", "quote_zh": "毕业生应该在毕业前几个月申请工作。", "ex_en": "I plan to apply to three universities.", "ex_zh": "我打算申请三所大学。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0987", "unit": "Unit 17"}, {"word": "earn", "pron": "ɜːn", "part_of_speech": "v.", "pos": "v.", "def_en": "to receive money for work", "def_zh": "挣（钱）；赚得", "quote_en": "Doctors earn high salaries in most countries.", "quote_zh": "在大多数国家，医生薪水很高。", "ex_en": "I earn about a thousand dollars a week.", "ex_zh": "我每周大约挣一千美元。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0988", "unit": "Unit 17"}, {"word": "endorse", "pron": "ɪnˈdɔːs", "part_of_speech": "v.", "pos": "v.", "def_en": "to publicly support a product or person", "def_zh": "代言；支持", "quote_en": "Famous athletes often endorse sports brands.", "quote_zh": "著名运动员常常为运动品牌代言。", "ex_en": "Several doctors endorse this product.", "ex_zh": "几位医生为这款产品背书。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0989", "unit": "Unit 17"}, {"word": "invest", "pron": "ɪnˈvest", "part_of_speech": "v.", "pos": "v.", "def_en": "to put money into something to make a profit", "def_zh": "投资", "quote_en": "Many people invest in property for the future.", "quote_zh": "许多人为了未来而投资房地产。", "ex_en": "I invest a small amount each month.", "ex_zh": "我每月投资一小笔钱。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0990", "unit": "Unit 17"}, {"word": "persuade", "pron": "pəˈsweɪd", "part_of_speech": "v.", "pos": "v.", "def_en": "to make someone agree to do something", "def_zh": "说服", "quote_en": "Advertisements try to persuade people to buy things they don't need.", "quote_zh": "广告试图说服人们购买他们并不需要的东西。", "ex_en": "I want to persuade my parents to let me study abroad.", "ex_zh": "我想说服父母让我出国留学。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0991", "unit": "Unit 17"}, {"word": "request", "pron": "rɪˈkwest", "part_of_speech": "v.", "pos": "v.", "def_en": "to ask for something politely or formally", "def_zh": "请求；要求", "quote_en": "Employees may request a day off in advance.", "quote_zh": "员工可以提前请一天假。", "ex_en": "I'd like to request a table by the window.", "ex_zh": "我想要一张靠窗的桌子。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0992", "unit": "Unit 17"}, {"word": "retire", "pron": "rɪˈtaɪə", "part_of_speech": "v.", "pos": "v.", "def_en": "to stop working because of age", "def_zh": "退休", "quote_en": "Many people retire at the age of sixty-five.", "quote_zh": "许多人在六十五岁退休。", "ex_en": "My grandfather wants to retire next year.", "ex_zh": "我祖父想明年退休。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0993", "unit": "Unit 17"}, {"word": "to be promoted", "pron": "tə bi prəˈməʊtɪd", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to be given a higher position at work", "def_zh": "被提升；晋升", "quote_en": "Hard-working employees are more likely to be promoted.", "quote_zh": "勤奋的员工更有可能获得晋升。", "ex_en": "I hope to be promoted next year.", "ex_zh": "我希望明年能升职。", "chapter": "Unit 17 · Talking Business · 商业与工作", "id": "w0994", "unit": "Unit 17"}, {"word": "actions", "pron": "ˈækʃnz", "part_of_speech": "n.", "pos": "n.", "def_en": "things that a person does", "def_zh": "行为；行动", "quote_en": "People should be responsible for their own actions.", "quote_zh": "人应该为自己的行为负责。", "ex_en": "His actions surprised everyone.", "ex_zh": "他的行为让每个人都感到吃惊。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w0995", "unit": "Unit 18"}, {"word": "arson", "pron": "ˈɑːsn", "part_of_speech": "n.", "pos": "n.", "def_en": "the crime of deliberately setting fire to a building", "def_zh": "纵火罪", "quote_en": "Arson is a serious crime that endangers lives.", "quote_zh": "纵火是危害生命的严重罪行。", "ex_en": "The police are investigating a case of arson.", "ex_zh": "警方正在调查一起纵火案。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w0996", "unit": "Unit 18"}, {"word": "authority", "pron": "ɔːˈθɒrəti", "part_of_speech": "n.", "pos": "n.", "def_en": "the power to give orders; an official organisation", "def_zh": "权力；当局", "quote_en": "The local authority is responsible for public safety.", "quote_zh": "地方当局负责公共安全。", "ex_en": "Teachers have authority in the classroom.", "ex_zh": "教师在课堂上拥有权威。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w0997", "unit": "Unit 18"}, {"word": "burglary", "pron": "ˈbɜːɡləri", "part_of_speech": "n.", "pos": "n.", "def_en": "the crime of breaking into a building to steal", "def_zh": "入室盗窃", "quote_en": "Burglary rates fell after the new security system was installed.", "quote_zh": "安装新的安保系统后，入室盗窃率下降了。", "ex_en": "There was a burglary on our street last week.", "ex_zh": "上周我们街上发生了一起入室盗窃案。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w0998", "unit": "Unit 18"}, {"word": "consequences", "pron": "ˈkɒnsɪkwənsɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "results of an action", "def_zh": "后果", "quote_en": "Drivers must understand the consequences of speeding.", "quote_zh": "司机必须明白超速的后果。", "ex_en": "You must face the consequences of your actions.", "ex_zh": "你必须面对自己行为的后果。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w0999", "unit": "Unit 18"}, {"word": "convict", "pron": "ˈkɒnvɪkt", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who has been found guilty of a crime and sent to prison", "def_zh": "罪犯；囚犯", "quote_en": "A convict escaped from the prison last night.", "quote_zh": "一名囚犯昨晚越狱了。", "ex_en": "The convict was released after ten years.", "ex_zh": "这名罪犯十年后被释放。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1000", "unit": "Unit 18"}, {"word": "crime", "pron": "kraɪm", "part_of_speech": "n.", "pos": "n.", "def_en": "an illegal act", "def_zh": "犯罪；罪行", "quote_en": "Poverty is often linked to crime in cities.", "quote_zh": "贫困常常与城市犯罪有关。", "ex_en": "Crime has decreased in my neighbourhood.", "ex_zh": "我所在的社区犯罪率下降了。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1001", "unit": "Unit 18"}, {"word": "crime rate", "pron": "kraɪm reɪt", "part_of_speech": "n.", "pos": "n.", "def_en": "the number of crimes in a place over a period", "def_zh": "犯罪率", "quote_en": "The crime rate dropped after more police were hired.", "quote_zh": "雇用更多警察后，犯罪率下降了。", "ex_en": "The crime rate in this area is very low.", "ex_zh": "这个地区的犯罪率很低。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1002", "unit": "Unit 18"}, {"word": "criminal", "pron": "ˈkrɪmɪnl", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who commits a crime", "def_zh": "罪犯", "quote_en": "Police work hard to catch every criminal.", "quote_zh": "警察努力抓捕每一个罪犯。", "ex_en": "The criminal was caught on camera.", "ex_zh": "这名罪犯被摄像头拍到了。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1003", "unit": "Unit 18"}, {"word": "deterrent", "pron": "dɪˈterənt", "part_of_speech": "n.", "pos": "n.", "def_en": "something that makes people less likely to do something", "def_zh": "威慑；阻止因素", "quote_en": "Severe punishment is seen as a deterrent to crime.", "quote_zh": "严厉的惩罚被视为对犯罪的威慑。", "ex_en": "A security camera is a good deterrent for thieves.", "ex_zh": "监控摄像头对小偷是很好的威慑。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1004", "unit": "Unit 18"}, {"word": "fine", "pron": "faɪn", "part_of_speech": "n.", "pos": "n.", "def_en": "money you must pay as a punishment", "def_zh": "罚款", "quote_en": "The company had to pay a heavy fine for polluting the river.", "quote_zh": "这家公司因污染河流不得不缴纳巨额罚款。", "ex_en": "I got a fine for parking in the wrong place.", "ex_zh": "我因乱停车被罚了款。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1005", "unit": "Unit 18"}, {"word": "fraud", "pron": "frɔːd", "part_of_speech": "n.", "pos": "n.", "def_en": "the crime of cheating someone to get money", "def_zh": "欺诈", "quote_en": "Online fraud is increasing as more people shop online.", "quote_zh": "随着越来越多的人网购，网络欺诈正在增加。", "ex_en": "He was arrested for fraud.", "ex_zh": "他因欺诈被捕。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1006", "unit": "Unit 18"}, {"word": "imprisonment", "pron": "ɪmˈprɪznmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "the state of being in prison", "def_zh": "监禁", "quote_en": "The judge gave him five years' imprisonment.", "quote_zh": "法官判处他五年监禁。", "ex_en": "Imprisonment is not always the best punishment.", "ex_zh": "监禁并不总是最好的惩罚。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1007", "unit": "Unit 18"}, {"word": "inequality", "pron": "ˌɪnɪˈkwɒləti", "part_of_speech": "n.", "pos": "n.", "def_en": "an unfair difference between groups of people", "def_zh": "不平等", "quote_en": "Social inequality can increase crime.", "quote_zh": "社会不平等可能增加犯罪。", "ex_en": "The report highlights inequality in education.", "ex_zh": "这份报告强调了教育中的不平等。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1008", "unit": "Unit 18"}, {"word": "intent", "pron": "ɪnˈtent", "part_of_speech": "n.", "pos": "n.", "def_en": "the aim or purpose of doing something", "def_zh": "意图；故意", "quote_en": "The court must prove criminal intent.", "quote_zh": "法院必须证明犯罪意图。", "ex_en": "He had no intent to cause harm.", "ex_zh": "他没有伤害别人的意图。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1009", "unit": "Unit 18"}, {"word": "intrusion", "pron": "ɪnˈtruːʒn", "part_of_speech": "n.", "pos": "n.", "def_en": "an unwelcome entry into someone's space", "def_zh": "侵入；闯入", "quote_en": "Many people see surveillance cameras as an intrusion on privacy.", "quote_zh": "许多人认为监控摄像头侵犯了隐私。", "ex_en": "The noise was an intrusion on my quiet evening.", "ex_zh": "这噪音打扰了我安静的夜晚。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1010", "unit": "Unit 18"}, {"word": "judge", "pron": "dʒʌdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who decides cases in a court", "def_zh": "法官", "quote_en": "The judge must listen carefully to both sides.", "quote_zh": "法官必须认真听取双方意见。", "ex_en": "The judge gave him a warning.", "ex_zh": "法官给了他一次警告。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1011", "unit": "Unit 18"}, {"word": "jury", "pron": "ˈdʒʊəri", "part_of_speech": "n.", "pos": "n.", "def_en": "a group of people who decide if someone is guilty", "def_zh": "陪审团", "quote_en": "The jury found the defendant not guilty.", "quote_zh": "陪审团裁定被告无罪。", "ex_en": "I was called to serve on a jury.", "ex_zh": "我被召去担任陪审员。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1012", "unit": "Unit 18"}, {"word": "kidnapping", "pron": "ˈkɪdnæpɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the crime of taking someone away illegally and holding them", "def_zh": "绑架", "quote_en": "Kidnapping is punished severely in most countries.", "quote_zh": "在大多数国家，绑架罪会受到严厉惩处。", "ex_en": "The film is about the kidnapping of a rich man's son.", "ex_zh": "这部电影讲的是一个富人儿子被绑架的故事。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1013", "unit": "Unit 18"}, {"word": "lawyer", "pron": "ˈlɔɪə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who gives legal advice and represents people in court", "def_zh": "律师", "quote_en": "A lawyer helps clients understand their legal rights.", "quote_zh": "律师帮助客户了解自己的法律权利。", "ex_en": "I want to become a lawyer when I grow up.", "ex_zh": "我长大后想当一名律师。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1014", "unit": "Unit 18"}, {"word": "motive", "pron": "ˈməʊtɪv", "part_of_speech": "n.", "pos": "n.", "def_en": "a reason for doing something", "def_zh": "动机", "quote_en": "The police could not find a motive for the crime.", "quote_zh": "警方无法找到作案动机。", "ex_en": "What was his motive for lying?", "ex_zh": "他撒谎的动机是什么？", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1015", "unit": "Unit 18"}, {"word": "murder", "pron": "ˈmɜːdə", "part_of_speech": "n.", "pos": "n.", "def_en": "the crime of deliberately killing a person", "def_zh": "谋杀", "quote_en": "Murder is considered the most serious crime in most countries.", "quote_zh": "谋杀在大多数国家被视为最严重的罪行。", "ex_en": "The detective is investigating a murder case.", "ex_zh": "侦探正在调查一起谋杀案。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1016", "unit": "Unit 18"}, {"word": "offence", "pron": "əˈfens", "part_of_speech": "n.", "pos": "n.", "def_en": "a crime or illegal act", "def_zh": "罪行；违法行为", "quote_en": "Driving without a licence is a criminal offence.", "quote_zh": "无证驾驶是一种刑事犯罪。", "ex_en": "It was his first offence, so he received a warning.", "ex_zh": "这是他的初犯，所以只受到警告。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1017", "unit": "Unit 18"}, {"word": "pickpocketing", "pron": "ˈpɪkpɒkɪtɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the crime of stealing from people's pockets", "def_zh": "扒窃", "quote_en": "Pickpocketing is common in crowded tourist areas.", "quote_zh": "扒窃在拥挤的旅游区很常见。", "ex_en": "The tourist lost his wallet to pickpocketing.", "ex_zh": "这名游客的钱包被扒窃了。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1018", "unit": "Unit 18"}, {"word": "prevention", "pron": "prɪˈvenʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the act of stopping something from happening", "def_zh": "预防", "quote_en": "Crime prevention starts with education and opportunity.", "quote_zh": "预防犯罪从教育和机会开始。", "ex_en": "Prevention is better than cure.", "ex_zh": "预防胜于治疗。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1019", "unit": "Unit 18"}, {"word": "prison", "pron": "ˈprɪzn", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where criminals are kept", "def_zh": "监狱", "quote_en": "Overcrowded prison conditions are a worldwide problem.", "quote_zh": "监狱过度拥挤是一个全球性的问题。", "ex_en": "He spent three years in prison.", "ex_zh": "他在监狱里待了三年。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1020", "unit": "Unit 18"}, {"word": "prisoner", "pron": "ˈprɪznə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person kept in prison", "def_zh": "囚犯；犯人", "quote_en": "Every prisoner should have the chance to learn new skills.", "quote_zh": "每位囚犯都应该有机会学习新技能。", "ex_en": "The prisoner was released early for good behaviour.", "ex_zh": "这名囚犯因表现良好提前获释。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1021", "unit": "Unit 18"}, {"word": "property crime", "pron": "ˈprɒpəti kraɪm", "part_of_speech": "n.", "pos": "n.", "def_en": "a crime that involves stealing or damaging belongings", "def_zh": "财产犯罪", "quote_en": "Property crime, such as theft, is more common than violent crime.", "quote_zh": "盗窃等财产犯罪比暴力犯罪更常见。", "ex_en": "Property crime has fallen in our town.", "ex_zh": "我们镇上的财产犯罪减少了。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1022", "unit": "Unit 18"}, {"word": "prosecutor", "pron": "ˈprɒsɪkjuːtə", "part_of_speech": "n.", "pos": "n.", "def_en": "a lawyer who argues that someone is guilty", "def_zh": "检察官", "quote_en": "The prosecutor presented evidence to the court.", "quote_zh": "检察官向法庭出示了证据。", "ex_en": "The prosecutor asked the witness many questions.", "ex_zh": "检察官向证人提了许多问题。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1023", "unit": "Unit 18"}, {"word": "protection", "pron": "prəˈtekʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the act of keeping someone or something safe", "def_zh": "保护", "quote_en": "Witnesses need protection from the criminals they testify against.", "quote_zh": "证人需要保护，以免受他们作证指控的罪犯伤害。", "ex_en": "This jacket gives good protection against rain.", "ex_zh": "这件夹克能很好地防雨。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1024", "unit": "Unit 18"}, {"word": "punishment", "pron": "ˈpʌnɪʃmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a penalty for breaking a law or rule", "def_zh": "惩罚", "quote_en": "Some people believe that tough punishment reduces crime.", "quote_zh": "有些人认为严厉的惩罚可以减少犯罪。", "ex_en": "The punishment for cheating in the exam is serious.", "ex_zh": "考试作弊的惩罚很严厉。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1025", "unit": "Unit 18"}, {"word": "recklessness", "pron": "ˈrekləsnəs", "part_of_speech": "n.", "pos": "n.", "def_en": "dangerous and careless behaviour", "def_zh": "鲁莽；不顾后果", "quote_en": "His recklessness caused a serious accident.", "quote_zh": "他的鲁莽行为造成了一起严重事故。", "ex_en": "Recklessness behind the wheel can kill.", "ex_zh": "驾驶时的鲁莽行为会致命。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1026", "unit": "Unit 18"}, {"word": "smuggling", "pron": "ˈsmʌɡlɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "the crime of secretly taking goods across a border", "def_zh": "走私", "quote_en": "Smuggling is a major problem at many borders.", "quote_zh": "走私是许多边境面临的一个主要问题。", "ex_en": "He was arrested for smuggling cigarettes.", "ex_zh": "他因走私香烟被逮捕。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1027", "unit": "Unit 18"}, {"word": "social system", "pron": "ˈsəʊʃl ˈsɪstəm", "part_of_speech": "n.", "pos": "n.", "def_en": "the way a society is organised", "def_zh": "社会制度", "quote_en": "A fair social system helps to reduce crime.", "quote_zh": "公平的社会制度有助于减少犯罪。", "ex_en": "The social system in the country is changing quickly.", "ex_zh": "这个国家的社会制度正在快速变化。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1028", "unit": "Unit 18"}, {"word": "swearing", "pron": "ˈsweərɪŋ", "part_of_speech": "n.", "pos": "n.", "def_en": "using rude or offensive words", "def_zh": "说脏话", "quote_en": "Swearing in public places can be offensive to others.", "quote_zh": "在公共场所说脏话可能冒犯他人。", "ex_en": "Swearing is not allowed in our classroom.", "ex_zh": "我们教室里不许说脏话。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1029", "unit": "Unit 18"}, {"word": "the accused", "pron": "ði əˈkjuːzd", "part_of_speech": "n.", "pos": "n.", "def_en": "the person who is charged with a crime in court", "def_zh": "被告", "quote_en": "The accused has the right to remain silent.", "quote_zh": "被告有权保持沉默。", "ex_en": "The accused stood up to hear the verdict.", "ex_zh": "被告站起来听取判决。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1030", "unit": "Unit 18"}, {"word": "toxic waste", "pron": "ˈtɒksɪk weɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "poisonous rubbish from industry", "def_zh": "有毒废物", "quote_en": "Dumping toxic waste in rivers is a serious crime.", "quote_zh": "向河里倾倒有毒废物是一项严重的罪行。", "ex_en": "Toxic waste must be handled by trained workers.", "ex_zh": "有毒废物必须由受过培训的工人处理。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1031", "unit": "Unit 18"}, {"word": "vandalism", "pron": "ˈvændəlɪzəm", "part_of_speech": "n.", "pos": "n.", "def_en": "the crime of deliberately damaging public property", "def_zh": "故意破坏公物", "quote_en": "Vandalism costs the city thousands of dollars every year.", "quote_zh": "故意破坏公物每年让这座城市损失数千美元。", "ex_en": "The bus stop was damaged by vandalism.", "ex_zh": "公交车站被人故意破坏了。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1032", "unit": "Unit 18"}, {"word": "victim", "pron": "ˈvɪktɪm", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who is harmed by a crime or accident", "def_zh": "受害者", "quote_en": "Every victim of crime deserves support and respect.", "quote_zh": "每一位犯罪受害者都应得到支持和尊重。", "ex_en": "She was a victim of identity theft.", "ex_zh": "她是身份盗用的受害者。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1033", "unit": "Unit 18"}, {"word": "violation", "pron": "ˌvaɪəˈleɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "an act of breaking a law or rule", "def_zh": "违反；侵犯", "quote_en": "Dumping waste in the river is a violation of the law.", "quote_zh": "向河里倾倒废物是违法行为。", "ex_en": "This is a violation of my privacy.", "ex_zh": "这是对我隐私的侵犯。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1034", "unit": "Unit 18"}, {"word": "criminal", "pron": "ˈkrɪmɪnl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to crime", "def_zh": "犯罪的；刑事的", "quote_en": "A criminal record can make it hard to get a job.", "quote_zh": "犯罪记录会使找工作变得困难。", "ex_en": "He faces criminal charges for the theft.", "ex_zh": "他因盗窃面临刑事指控。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1035", "unit": "Unit 18"}, {"word": "drug-related", "pron": "ˈdrʌɡ rɪˌleɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "connected with illegal drugs", "def_zh": "与毒品有关的", "quote_en": "Drug-related crime is a major problem in some cities.", "quote_zh": "与毒品有关的犯罪是一些城市的重大问题。", "ex_en": "The police arrested five people for drug-related offences.", "ex_zh": "警方因毒品相关罪行逮捕了五个人。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1036", "unit": "Unit 18"}, {"word": "evil", "pron": "ˈiːvl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "morally bad and cruel", "def_zh": "邪恶的", "quote_en": "The film shows a battle between good and evil.", "quote_zh": "这部电影讲述善与恶的斗争。", "ex_en": "The story is about an evil king.", "ex_zh": "这个故事讲的是一个邪恶的国王。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1037", "unit": "Unit 18"}, {"word": "guilty", "pron": "ˈɡɪlti", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having committed a crime; feeling bad about something", "def_zh": "有罪的；内疚的", "quote_en": "The court found him guilty of fraud.", "quote_zh": "法院裁定他欺诈罪名成立。", "ex_en": "I felt guilty about forgetting her birthday.", "ex_zh": "我忘了她的生日，感到很内疚。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1038", "unit": "Unit 18"}, {"word": "harsh", "pron": "hɑːʃ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "severe and unkind", "def_zh": "严厉的；严酷的", "quote_en": "Some people think the punishment was too harsh.", "quote_zh": "有些人认为这个惩罚太严厉了。", "ex_en": "The teacher was harsh with the students.", "ex_zh": "老师对学生很严厉。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1039", "unit": "Unit 18"}, {"word": "innocent", "pron": "ˈɪnəsnt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not guilty of a crime", "def_zh": "无辜的；清白的", "quote_en": "Everyone is innocent until proven guilty.", "quote_zh": "在被证明有罪之前，每个人都是无罪的。", "ex_en": "He claimed that he was innocent.", "ex_zh": "他声称自己是无辜的。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1040", "unit": "Unit 18"}, {"word": "intentional", "pron": "ɪnˈtenʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "done on purpose", "def_zh": "故意的", "quote_en": "The fire was not accidental but intentional.", "quote_zh": "这场火不是意外，而是故意的。", "ex_en": "It was an intentional mistake to test the students.", "ex_zh": "这是为了测试学生而故意犯的错误。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1041", "unit": "Unit 18"}, {"word": "law-abiding", "pron": "ˈlɔː əˌbaɪdɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "always obeying the law", "def_zh": "守法的", "quote_en": "Most citizens are law-abiding and respect the police.", "quote_zh": "大多数公民遵纪守法，尊重警察。", "ex_en": "My neighbours are quiet, law-abiding people.", "ex_zh": "我的邻居们是安静守法的人。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1042", "unit": "Unit 18"}, {"word": "non-violent", "pron": "ˌnɒn ˈvaɪələnt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not using physical force", "def_zh": "非暴力的", "quote_en": "Non-violent protest can be a powerful way to bring about change.", "quote_zh": "非暴力抗议可以成为带来变革的有力方式。", "ex_en": "He was jailed for a non-violent offence.", "ex_zh": "他因一项非暴力罪行入狱。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1043", "unit": "Unit 18"}, {"word": "offensive", "pron": "əˈfensɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "rude and likely to upset people", "def_zh": "冒犯的；令人不快的", "quote_en": "The advertisement was removed because it was offensive.", "quote_zh": "这则广告因具有冒犯性而被撤下。", "ex_en": "I found his comments offensive.", "ex_zh": "我觉得他的言论具有冒犯性。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1044", "unit": "Unit 18"}, {"word": "on trial", "pron": "ɒn ˈtraɪəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "being judged in a court of law", "def_zh": "受审", "quote_en": "The man is on trial for stealing a car.", "quote_zh": "这名男子因偷车而受审。", "ex_en": "Three people are on trial for fraud.", "ex_zh": "三个人因欺诈罪正在受审。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1045", "unit": "Unit 18"}, {"word": "petty", "pron": "ˈpeti", "part_of_speech": "adj.", "pos": "adj.", "def_en": "small and unimportant", "def_zh": "轻微的；琐碎的", "quote_en": "Petty crime such as shoplifting is common in city centres.", "quote_zh": "商店盗窃等轻微犯罪在市中心很常见。", "ex_en": "It was only a petty argument.", "ex_zh": "那只是一次琐碎的争吵。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1046", "unit": "Unit 18"}, {"word": "punishable", "pron": "ˈpʌnɪʃəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to be punished by law", "def_zh": "应受惩罚的", "quote_en": "Dangerous driving is punishable by a heavy fine.", "quote_zh": "危险驾驶会被处以重罚。", "ex_en": "Cheating in exams is punishable by suspension.", "ex_zh": "考试作弊会受到停学处分。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1047", "unit": "Unit 18"}, {"word": "random", "pron": "ˈrændəm", "part_of_speech": "adj.", "pos": "adj.", "def_en": "done without a plan or reason", "def_zh": "随机的；随意的", "quote_en": "Random checks at airports help to detect smuggling.", "quote_zh": "机场的随机检查有助于发现走私。", "ex_en": "I chose a random number between one and ten.", "ex_zh": "我随机选了一个一到十之间的数。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1048", "unit": "Unit 18"}, {"word": "strict", "pron": "strɪkt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "demanding that rules are obeyed", "def_zh": "严格的", "quote_en": "Strict laws can help to reduce dangerous driving.", "quote_zh": "严格的法律有助于减少危险驾驶。", "ex_en": "My parents are quite strict about homework.", "ex_zh": "我父母对作业要求很严格。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1049", "unit": "Unit 18"}, {"word": "unintentional", "pron": "ˌʌnɪnˈtenʃənl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not done on purpose", "def_zh": "无意的", "quote_en": "The damage was unintentional, so he was not punished.", "quote_zh": "这次损坏是无意的，所以他没有受到惩罚。", "ex_en": "It was an unintentional mistake.", "ex_zh": "这是一个无意的错误。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1050", "unit": "Unit 18"}, {"word": "victimless", "pron": "ˈvɪktɪmləs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having no person who is directly harmed", "def_zh": "无受害者的", "quote_en": "Some people argue that certain offences are victimless.", "quote_zh": "有些人认为某些违法行为是没有受害者的。", "ex_en": "He said that it was a victimless crime.", "ex_zh": "他说这是一种没有受害者的犯罪。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1051", "unit": "Unit 18"}, {"word": "abide by", "pron": "əˈbaɪd baɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to accept and follow a rule or decision", "def_zh": "遵守；服从", "quote_en": "All drivers must abide by the speed limit.", "quote_zh": "所有司机都必须遵守限速。", "ex_en": "You must abide by the rules of the school.", "ex_zh": "你必须遵守学校的规定。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1052", "unit": "Unit 18"}, {"word": "abolish", "pron": "əˈbɒlɪʃ", "part_of_speech": "v.", "pos": "v.", "def_en": "to officially end a system or law", "def_zh": "废除", "quote_en": "Many countries have abolished the death penalty.", "quote_zh": "许多国家已经废除了死刑。", "ex_en": "The school decided to abolish the old uniform rule.", "ex_zh": "学校决定废除旧的校服规定。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1053", "unit": "Unit 18"}, {"word": "deter", "pron": "dɪˈtɜː", "part_of_speech": "v.", "pos": "v.", "def_en": "to stop someone from doing something by making them afraid", "def_zh": "阻止；威慑", "quote_en": "Heavy fines may deter people from dropping litter.", "quote_zh": "重罚可能阻止人们乱扔垃圾。", "ex_en": "The high price may deter me from buying it.", "ex_zh": "高昂的价格可能会让我打消购买的念头。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1054", "unit": "Unit 18"}, {"word": "enforce", "pron": "ɪnˈfɔːs", "part_of_speech": "v.", "pos": "v.", "def_en": "to make sure a law is obeyed", "def_zh": "执行；强制实施", "quote_en": "The police enforce the law and keep the public safe.", "quote_zh": "警察执行法律，保障公众安全。", "ex_en": "The school will enforce a strict dress code.", "ex_zh": "学校将严格执行着装规定。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1055", "unit": "Unit 18"}, {"word": "imprison", "pron": "ɪmˈprɪzn", "part_of_speech": "v.", "pos": "v.", "def_en": "to put someone in prison", "def_zh": "监禁；关押", "quote_en": "Judges may imprison offenders who commit serious crimes.", "quote_zh": "法官可以对犯严重罪行的罪犯判处监禁。", "ex_en": "Judges may imprison him for ten years.", "ex_zh": "法官可能判处他十年监禁。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1056", "unit": "Unit 18"}, {"word": "obey", "pron": "əˈbeɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to do what a law or person tells you to do", "def_zh": "服从；遵守", "quote_en": "Citizens are expected to obey the law.", "quote_zh": "公民应当遵守法律。", "ex_en": "Dogs should obey their owners.", "ex_zh": "狗应该听主人的话。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1057", "unit": "Unit 18"}, {"word": "offend", "pron": "əˈfend", "part_of_speech": "v.", "pos": "v.", "def_en": "to upset someone; to commit a crime", "def_zh": "冒犯；犯罪", "quote_en": "Some jokes can offend people from other cultures.", "quote_zh": "有些玩笑可能冒犯来自其他文化的人。", "ex_en": "I didn't mean to offend you.", "ex_zh": "我不是有意冒犯你。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1058", "unit": "Unit 18"}, {"word": "perpetrate", "pron": "ˈpɜːpətreɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to commit a crime or harmful act", "def_zh": "犯（罪）；做（坏事）", "quote_en": "Most people who perpetrate fraud do so for money.", "quote_zh": "大多数犯欺诈罪的人是为了钱。", "ex_en": "A small group could perpetrate such a crime.", "ex_zh": "一个小团伙可能会犯下这样的罪行。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1059", "unit": "Unit 18"}, {"word": "protect", "pron": "prəˈtekt", "part_of_speech": "v.", "pos": "v.", "def_en": "to keep someone or something safe", "def_zh": "保护", "quote_en": "Laws are made to protect citizens from harm.", "quote_zh": "法律的制定是为了保护公民免受伤害。", "ex_en": "I wear a helmet to protect my head.", "ex_zh": "我戴头盔来保护头部。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1060", "unit": "Unit 18"}, {"word": "prove", "pron": "pruːv", "part_of_speech": "v.", "pos": "v.", "def_en": "to show that something is true", "def_zh": "证明", "quote_en": "The prosecutor must prove that the accused is guilty.", "quote_zh": "检察官必须证明被告有罪。", "ex_en": "I can prove that I was at home that night.", "ex_zh": "我可以证明那晚我在家。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1061", "unit": "Unit 18"}, {"word": "punish", "pron": "ˈpʌnɪʃ", "part_of_speech": "v.", "pos": "v.", "def_en": "to give someone a penalty for doing wrong", "def_zh": "惩罚", "quote_en": "Parents should punish children fairly and consistently.", "quote_zh": "父母应该公平且一致地惩罚孩子。", "ex_en": "The teacher might punish the class for being noisy.", "ex_zh": "老师可能会因为班里吵闹而惩罚全班。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1062", "unit": "Unit 18"}, {"word": "resent", "pron": "rɪˈzent", "part_of_speech": "v.", "pos": "v.", "def_en": "to feel angry about something unfair", "def_zh": "怨恨；愤恨", "quote_en": "Some citizens resent paying high taxes.", "quote_zh": "有些公民对缴纳高额税款感到愤愤不平。", "ex_en": "I resent being treated like a child.", "ex_zh": "我对被当成小孩对待感到不满。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1063", "unit": "Unit 18"}, {"word": "respect", "pron": "rɪˈspekt", "part_of_speech": "v.", "pos": "v.", "def_en": "to admire someone; to accept the rules or rights of others", "def_zh": "尊重", "quote_en": "Citizens should respect the law and the rights of others.", "quote_zh": "公民应该尊重法律和他人的权利。", "ex_en": "I respect my teacher a lot.", "ex_zh": "我非常尊敬我的老师。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1064", "unit": "Unit 18"}, {"word": "violate", "pron": "ˈvaɪəleɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to break a law, rule or agreement", "def_zh": "违反；侵犯", "quote_en": "Companies that violate safety rules can be fined.", "quote_zh": "违反安全规定的公司可能被罚款。", "ex_en": "The company must not violate the agreement.", "ex_zh": "这家公司不得违反协议。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1065", "unit": "Unit 18"}, {"word": "accept the consequences", "pron": "əkˈsept ðə ˈkɒnsɪkwənsɪz", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to be willing to deal with the results of what you did", "def_zh": "承担后果", "quote_en": "People who break the law must accept the consequences.", "quote_zh": "违法的人必须承担后果。", "ex_en": "If you cheat, you must accept the consequences.", "ex_zh": "如果你作弊，就必须承担后果。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1066", "unit": "Unit 18"}, {"word": "commit a crime", "pron": "kəˈmɪt ə kraɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to do something illegal", "def_zh": "犯罪", "quote_en": "Poverty can push some people to commit a crime.", "quote_zh": "贫困可能促使一些人犯罪。", "ex_en": "Few people plan to commit a crime when they are young.", "ex_zh": "很少有人在年轻时就打算犯罪。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1067", "unit": "Unit 18"}, {"word": "convict a criminal", "pron": "kənˈvɪkt ə ˈkrɪmɪnl", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to find someone guilty of a crime in court", "def_zh": "判罪犯有罪", "quote_en": "It can be hard to convict a criminal without clear evidence.", "quote_zh": "没有明确的证据，很难判罪犯有罪。", "ex_en": "The jury voted to convict a criminal in the fraud case.", "ex_zh": "陪审团投票判定欺诈案中的罪犯有罪。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1068", "unit": "Unit 18"}, {"word": "impose a fine", "pron": "ɪmˈpəʊz ə faɪn", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to order someone to pay money as a punishment", "def_zh": "处以罚款", "quote_en": "The council will impose a fine on anyone who drops litter.", "quote_zh": "市议会将对任何乱扔垃圾的人处以罚款。", "ex_en": "The court decided to impose a fine of five hundred dollars.", "ex_zh": "法院决定处以五百美元的罚款。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1069", "unit": "Unit 18"}, {"word": "pass a law", "pron": "pɑːs ə lɔː", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to officially make a new law", "def_zh": "通过法律", "quote_en": "Parliament voted to pass a law banning smoking in public places.", "quote_zh": "议会投票通过了一项禁止在公共场所吸烟的法律。", "ex_en": "The government plans to pass a law on plastic bags.", "ex_zh": "政府计划通过一项关于塑料袋的法律。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1070", "unit": "Unit 18"}, {"word": "solve a crime", "pron": "sɒlv ə kraɪm", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to find out who committed a crime", "def_zh": "破案", "quote_en": "Detectives used DNA to solve a crime from twenty years ago.", "quote_zh": "侦探利用DNA破获了一桩二十年前的案件。", "ex_en": "It takes patience to solve a crime.", "ex_zh": "破案需要耐心。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1071", "unit": "Unit 18"}, {"word": "act", "pron": "ækt", "part_of_speech": "n.", "pos": "n.", "def_en": "A law made by a parliament or government.", "def_zh": "法案；法令", "quote_en": "A new act on data protection came into force last year.", "quote_zh": "一项关于数据保护的新法案去年开始生效。", "ex_en": "The act makes it illegal to sell tobacco to children.", "ex_zh": "这项法令规定向儿童出售烟草是违法的。", "chapter": "Unit 18 · The Law · 法律与犯罪", "id": "w1072", "unit": "Unit 18"}, {"word": "author", "pron": "ˈɔːθə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who writes books or articles", "def_zh": "作者", "quote_en": "The author of the article is a well-known journalist.", "quote_zh": "这篇文章的作者是一位知名记者。", "ex_en": "My favourite author writes mystery novels.", "ex_zh": "我最喜欢的作者写悬疑小说。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1073", "unit": "Unit 19"}, {"word": "bias", "pron": "ˈbaɪəs", "part_of_speech": "n.", "pos": "n.", "def_en": "an unfair preference for one side", "def_zh": "偏见；偏向", "quote_en": "Readers should look for bias in news reports.", "quote_zh": "读者应该留意新闻报道中的偏见。", "ex_en": "The judge showed no bias towards either side.", "ex_zh": "法官对双方都没有偏袒。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1074", "unit": "Unit 19"}, {"word": "censorship", "pron": "ˈsensəʃɪp", "part_of_speech": "n.", "pos": "n.", "def_en": "the control of what people can see, read or hear", "def_zh": "审查制度", "quote_en": "Censorship of the media limits the public's right to information.", "quote_zh": "媒体审查限制了公众获取信息的权利。", "ex_en": "Some countries have strong internet censorship.", "ex_zh": "一些国家有严格的网络审查制度。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1075", "unit": "Unit 19"}, {"word": "current affairs", "pron": "ˌkʌrənt əˈfeəz", "part_of_speech": "n.", "pos": "n.", "def_en": "important political and social events happening now", "def_zh": "时事", "quote_en": "Many people follow current affairs on social media.", "quote_zh": "许多人在社交媒体上关注时事。", "ex_en": "I watch a current affairs programme every evening.", "ex_zh": "我每天晚上看一档时事节目。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1076", "unit": "Unit 19"}, {"word": "editor", "pron": "ˈedɪtə", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who checks and prepares articles for publication", "def_zh": "编辑", "quote_en": "The editor decides which stories appear on the front page.", "quote_zh": "编辑决定哪些报道登上头版。", "ex_en": "My editor wants the article by Friday.", "ex_zh": "我的编辑要求周五前交稿。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1077", "unit": "Unit 19"}, {"word": "exposé", "pron": "ekˈspəʊzeɪ", "part_of_speech": "n.", "pos": "n.", "def_en": "a news report that reveals something shocking", "def_zh": "揭露性报道", "quote_en": "The newspaper published an exposé on corruption in the council.", "quote_zh": "报纸发表了一篇揭露市议会腐败的报道。", "ex_en": "The exposé shocked the whole country.", "ex_zh": "这篇揭露性报道震惊了全国。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1078", "unit": "Unit 19"}, {"word": "exposure", "pron": "ɪkˈspəʊʒə", "part_of_speech": "n.", "pos": "n.", "def_en": "the state of being seen or known by many people", "def_zh": "曝光；接触", "quote_en": "Excessive exposure to violent content may affect young viewers.", "quote_zh": "过度接触暴力内容可能影响年轻观众。", "ex_en": "The actress has had a lot of media exposure recently.", "ex_zh": "这位女演员最近有很多媒体曝光。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1079", "unit": "Unit 19"}, {"word": "fame", "pron": "feɪm", "part_of_speech": "n.", "pos": "n.", "def_en": "the state of being known by many people", "def_zh": "名声；名气", "quote_en": "Fame can bring both wealth and a loss of privacy.", "quote_zh": "名气可以带来财富，也会失去隐私。", "ex_en": "She achieved fame at the age of seventeen.", "ex_zh": "她十七岁就成名了。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1080", "unit": "Unit 19"}, {"word": "free press", "pron": "friː pres", "part_of_speech": "n.", "pos": "n.", "def_en": "newspapers and media that can publish without government control", "def_zh": "新闻自由", "quote_en": "A free press is essential for a healthy democracy.", "quote_zh": "新闻自由对健康的民主制度至关重要。", "ex_en": "The country is proud of its free press.", "ex_zh": "这个国家为其新闻自由而自豪。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1081", "unit": "Unit 19"}, {"word": "ideology", "pron": "ˌaɪdiˈɒlədʒi", "part_of_speech": "n.", "pos": "n.", "def_en": "a set of ideas that guide a group or political system", "def_zh": "意识形态", "quote_en": "Some media outlets reflect the ideology of their owners.", "quote_zh": "有些媒体反映了其所有者的意识形态。", "ex_en": "The party's ideology is based on equality.", "ex_zh": "这个政党的意识形态基于平等。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1082", "unit": "Unit 19"}, {"word": "investigation", "pron": "ɪnˌvestɪˈɡeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a careful examination to find the facts", "def_zh": "调查", "quote_en": "A long investigation revealed the truth about the scandal.", "quote_zh": "一场长期调查揭示了这起丑闻的真相。", "ex_en": "The police have opened an investigation into the theft.", "ex_zh": "警方已就这起盗窃案展开调查。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1083", "unit": "Unit 19"}, {"word": "journal", "pron": "ˈdʒɜːnl", "part_of_speech": "n.", "pos": "n.", "def_en": "a serious magazine; a daily record", "def_zh": "期刊；日志", "quote_en": "The research was published in a medical journal.", "quote_zh": "这项研究发表在一本医学期刊上。", "ex_en": "I keep a journal of my travels.", "ex_zh": "我写旅行日志。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1084", "unit": "Unit 19"}, {"word": "journalism", "pron": "ˈdʒɜːnəlɪzəm", "part_of_speech": "n.", "pos": "n.", "def_en": "the work of collecting and writing news", "def_zh": "新闻业；新闻工作", "quote_en": "Good journalism requires accurate and fair reporting.", "quote_zh": "优秀的新闻工作需要准确公正的报道。", "ex_en": "I'm studying journalism at university.", "ex_zh": "我在大学学新闻学。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1085", "unit": "Unit 19"}, {"word": "mainstream media", "pron": "ˈmeɪnstriːm ˈmiːdiə", "part_of_speech": "n.", "pos": "n.", "def_en": "the most widely used news sources", "def_zh": "主流媒体", "quote_en": "Some people no longer trust the mainstream media.", "quote_zh": "有些人不再信任主流媒体。", "ex_en": "The story was ignored by the mainstream media.", "ex_zh": "这个故事被主流媒体忽略了。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1086", "unit": "Unit 19"}, {"word": "mass media", "pron": "ˌmæs ˈmiːdiə", "part_of_speech": "n.", "pos": "n.", "def_en": "the main ways of communicating to large audiences", "def_zh": "大众传媒", "quote_en": "The mass media shape public opinion on many issues.", "quote_zh": "大众传媒在许多问题上塑造着公众舆论。", "ex_en": "Television is a powerful form of mass media.", "ex_zh": "电视是一种强大的大众传媒形式。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1087", "unit": "Unit 19"}, {"word": "media", "pron": "ˈmiːdiə", "part_of_speech": "n.", "pos": "n.", "def_en": "television, radio, newspapers and the internet", "def_zh": "媒体", "quote_en": "The media play an important role in informing the public.", "quote_zh": "媒体在向公众传播信息方面起着重要作用。", "ex_en": "The story attracted a lot of media attention.", "ex_zh": "这个故事引起了媒体的大量关注。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1088", "unit": "Unit 19"}, {"word": "network", "pron": "ˈnetwɜːk", "part_of_speech": "n.", "pos": "n.", "def_en": "a group of linked television or radio stations; a connected system", "def_zh": "电视网；网络", "quote_en": "The news network broadcast the speech live.", "quote_zh": "新闻电视网现场直播了这次演讲。", "ex_en": "I need to build a professional network.", "ex_zh": "我需要建立自己的职业人脉网络。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1089", "unit": "Unit 19"}, {"word": "the news", "pron": "ðə njuːz", "part_of_speech": "n.", "pos": "n.", "def_en": "reports of recent events", "def_zh": "新闻", "quote_en": "Many young people get the news from social media.", "quote_zh": "许多年轻人从社交媒体获取新闻。", "ex_en": "I watch the news every night.", "ex_zh": "我每天晚上看新闻。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1090", "unit": "Unit 19"}, {"word": "newspaper", "pron": "ˈnjuːzpeɪpə", "part_of_speech": "n.", "pos": "n.", "def_en": "a printed publication with news", "def_zh": "报纸", "quote_en": "Fewer people buy a newspaper now than in the past.", "quote_zh": "现在买报纸的人比过去少了。", "ex_en": "My grandfather reads the newspaper every morning.", "ex_zh": "我爷爷每天早上读报纸。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1091", "unit": "Unit 19"}, {"word": "newsstand", "pron": "ˈnjuːzstænd", "part_of_speech": "n.", "pos": "n.", "def_en": "a place where newspapers and magazines are sold", "def_zh": "报刊亭", "quote_en": "You can still buy international papers at the newsstand.", "quote_zh": "你仍然可以在报刊亭买到国际报纸。", "ex_en": "I bought a magazine at the newsstand.", "ex_zh": "我在报刊亭买了一本杂志。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1092", "unit": "Unit 19"}, {"word": "opinion", "pron": "əˈpɪnjən", "part_of_speech": "n.", "pos": "n.", "def_en": "what someone thinks about something", "def_zh": "意见；观点", "quote_en": "Newspapers often publish an opinion on political issues.", "quote_zh": "报纸常常就政治问题发表观点。", "ex_en": "In my opinion, the film was too long.", "ex_zh": "在我看来，这部电影太长了。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1093", "unit": "Unit 19"}, {"word": "paparazzi", "pron": "ˌpæpəˈrætsi", "part_of_speech": "n.", "pos": "n.", "def_en": "photographers who follow famous people", "def_zh": "狗仔队", "quote_en": "The paparazzi followed the singer everywhere.", "quote_zh": "狗仔队跟着这位歌手到处走。", "ex_en": "The actress was tired of the paparazzi.", "ex_zh": "这位女演员厌倦了狗仔队。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1094", "unit": "Unit 19"}, {"word": "press", "pron": "pres", "part_of_speech": "n.", "pos": "n.", "def_en": "newspapers and journalists in general", "def_zh": "新闻界；报刊", "quote_en": "The press has the duty to report the truth.", "quote_zh": "新闻界有义务报道真相。", "ex_en": "The minister spoke to the press after the meeting.", "ex_zh": "会议结束后，部长对新闻界发表了讲话。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1095", "unit": "Unit 19"}, {"word": "publication", "pron": "ˌpʌblɪˈkeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the act of printing a book or article; something published", "def_zh": "出版；出版物", "quote_en": "The publication of the report caused a public debate.", "quote_zh": "这份报告的发表引发了公众辩论。", "ex_en": "This magazine is a monthly publication.", "ex_zh": "这本杂志是月刊。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1096", "unit": "Unit 19"}, {"word": "publicity", "pron": "pʌbˈlɪsəti", "part_of_speech": "n.", "pos": "n.", "def_en": "public attention given to someone or something", "def_zh": "宣传；公众关注", "quote_en": "The film received a lot of publicity before its release.", "quote_zh": "这部电影在上映前获得了大量宣传。", "ex_en": "The company needs more publicity.", "ex_zh": "这家公司需要更多宣传。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1097", "unit": "Unit 19"}, {"word": "publisher", "pron": "ˈpʌblɪʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "a company that produces books and magazines", "def_zh": "出版商", "quote_en": "The publisher printed ten thousand copies of the book.", "quote_zh": "出版商印刷了一万册这本书。", "ex_en": "My novel was accepted by a small publisher.", "ex_zh": "我的小说被一家小出版社接受了。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1098", "unit": "Unit 19"}, {"word": "relevance", "pron": "ˈreləvəns", "part_of_speech": "n.", "pos": "n.", "def_en": "the quality of being connected to what is being discussed", "def_zh": "相关性", "quote_en": "Journalists should consider the relevance of a story to readers.", "quote_zh": "记者应该考虑一则报道与读者的相关性。", "ex_en": "I don't see the relevance of this question.", "ex_zh": "我看不出这个问题有什么相关性。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1099", "unit": "Unit 19"}, {"word": "safeguard", "pron": "ˈseɪfɡɑːd", "part_of_speech": "n.", "pos": "n.", "def_en": "something that protects against harm", "def_zh": "保障；保护措施", "quote_en": "Laws are a safeguard against unfair reporting.", "quote_zh": "法律是防止不公正报道的保障。", "ex_en": "A password is a safeguard for your account.", "ex_zh": "密码是账户的保护措施。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1100", "unit": "Unit 19"}, {"word": "source", "pron": "sɔːs", "part_of_speech": "n.", "pos": "n.", "def_en": "where information comes from", "def_zh": "来源", "quote_en": "A reliable source is essential for a good news story.", "quote_zh": "可靠的消息来源对一篇好的新闻报道至关重要。", "ex_en": "I got this information from a good source.", "ex_zh": "我从一个可靠的来源得到了这个信息。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1101", "unit": "Unit 19"}, {"word": "speculation", "pron": "ˌspekjuˈleɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "guessing without having all the facts", "def_zh": "猜测", "quote_en": "There is a lot of speculation about the singer's marriage.", "quote_zh": "有很多关于这位歌手婚姻的猜测。", "ex_en": "It's just speculation, not fact.", "ex_zh": "这只是猜测，不是事实。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1102", "unit": "Unit 19"}, {"word": "tabloid", "pron": "ˈtæblɔɪd", "part_of_speech": "n.", "pos": "n.", "def_en": "a newspaper with short stories about celebrities and scandal", "def_zh": "小报；通俗小报", "quote_en": "The tabloid printed a shocking story about the footballer.", "quote_zh": "这家小报刊登了一则关于足球运动员的爆炸性新闻。", "ex_en": "I don't trust the stories in a tabloid.", "ex_zh": "我不相信小报上的故事。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1103", "unit": "Unit 19"}, {"word": "artificial", "pron": "ˌɑːtɪˈfɪʃl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "made by people rather than occurring naturally", "def_zh": "人造的；人工的", "quote_en": "Some websites use artificial images to attract clicks.", "quote_zh": "一些网站用人工合成的图片吸引点击。", "ex_en": "The drink contains artificial sweeteners.", "ex_zh": "这种饮料含有人工甜味剂。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1104", "unit": "Unit 19"}, {"word": "attention-grabbing", "pron": "əˈtenʃn ˈɡræbɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "designed to attract people's interest", "def_zh": "引人注目的", "quote_en": "Attention-grabbing headlines can mislead readers.", "quote_zh": "吸引眼球的标题可能误导读者。", "ex_en": "It was an attention-grabbing advertisement.", "ex_zh": "这是一则引人注目的广告。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1105", "unit": "Unit 19"}, {"word": "biased", "pron": "ˈbaɪəst", "part_of_speech": "adj.", "pos": "adj.", "def_en": "unfairly favouring one side", "def_zh": "有偏见的；偏袒的", "quote_en": "A biased report presents only one point of view.", "quote_zh": "有偏见的报道只呈现一种观点。", "ex_en": "The referee seemed biased towards the home team.", "ex_zh": "裁判似乎偏袒主队。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1106", "unit": "Unit 19"}, {"word": "celebrity", "pron": "səˈlebrəti", "part_of_speech": "adj.", "pos": "adj.", "def_en": "a famous person", "def_zh": "名人", "quote_en": "Celebrity gossip fills many magazines.", "quote_zh": "名人八卦充斥着许多杂志。", "ex_en": "I follow a celebrity chef on social media.", "ex_zh": "我在社交媒体上关注一位名厨。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1107", "unit": "Unit 19"}, {"word": "controversial", "pron": "ˌkɒntrəˈvɜːʃl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "causing a lot of public disagreement", "def_zh": "有争议的", "quote_en": "The programme was controversial because of its violent scenes.", "quote_zh": "这个节目因暴力场面而引起争议。", "ex_en": "He made a controversial speech about education.", "ex_zh": "他发表了一次有争议的关于教育的演讲。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1108", "unit": "Unit 19"}, {"word": "distorted", "pron": "dɪˈstɔːtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "changed so that it is no longer true or accurate", "def_zh": "歪曲的；扭曲的", "quote_en": "Social media can give a distorted picture of other people's lives.", "quote_zh": "社交媒体可能让人对他人的生活产生扭曲的印象。", "ex_en": "The facts were distorted by the newspaper.", "ex_zh": "事实被报纸歪曲了。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1109", "unit": "Unit 19"}, {"word": "entertaining", "pron": "ˌentəˈteɪnɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "amusing and enjoyable", "def_zh": "有趣的；娱乐性的", "quote_en": "Many documentaries are both entertaining and informative.", "quote_zh": "许多纪录片既有趣又有信息量。", "ex_en": "The comedian was very entertaining.", "ex_zh": "这位喜剧演员非常有趣。", "chapter": "Unit 19 · The Media · 媒体", "id": "w1110", "unit": "Unit 19"}, {"word": "factual", "pron": "ˈfæktʃuəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "based on facts", "def_zh": "
