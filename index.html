 · 现代世界", "id": "w0721", "unit": "Unit 13"}, {"word": "multiculturalism", "pron": "ˌmʌltiˈkʌltʃərəlɪzəm", "part_of_speech": "n.", "pos": "n.", "def_en": "the existence of many different cultures in a society", "def_zh": "多元文化主义", "quote_en": "Multiculturalism has made New Zealand a diverse and tolerant society.", "quote_zh": "多元文化主义使新西兰成为一个多样而宽容的社会。", "ex_en": "My school promotes multiculturalism through events.", "ex_zh": "我们学校通过活动倡导多元文化。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0722", "unit": "Unit 13"}, {"word": "percentage", "pron": "pəˈsentɪdʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "a number or amount expressed as part of 100", "def_zh": "百分比；比例", "quote_en": "A large percentage of young people use social media daily.", "quote_zh": "很大比例的年轻人每天使用社交媒体。", "ex_en": "What percentage of the class passed the exam?", "ex_zh": "班里有百分之多少的人通过了考试？", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0723", "unit": "Unit 13"}, {"word": "population", "pron": "ˌpɒpjuˈleɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the number of people living in a place", "def_zh": "人口", "quote_en": "The world's population is expected to reach ten billion.", "quote_zh": "预计世界人口将达到一百亿。", "ex_en": "The population of my city is about two million.", "ex_zh": "我所在城市的人口约为两百万。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0724", "unit": "Unit 13"}, {"word": "prediction", "pron": "prɪˈdɪkʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a statement about what will happen in the future", "def_zh": "预测", "quote_en": "The prediction was based on years of economic data.", "quote_zh": "这一预测是基于多年的经济数据。", "ex_en": "My prediction is that it will rain tomorrow.", "ex_zh": "我的预测是明天会下雨。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0725", "unit": "Unit 13"}, {"word": "projection", "pron": "prəˈdʒekʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "an estimate of future numbers based on current trends", "def_zh": "预测；推算", "quote_en": "Projections show that the number of elderly people will double.", "quote_zh": "预测显示，老年人的数量将翻一番。", "ex_en": "The sales projection for next year looks good.", "ex_zh": "明年的销售预测看起来不错。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0726", "unit": "Unit 13"}, {"word": "proportion", "pron": "prəˈpɔːʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a part of a whole; the relationship between parts", "def_zh": "比例；部分", "quote_en": "A growing proportion of the population is over sixty-five.", "quote_zh": "人口中越来越大的比例是65岁以上的人。", "ex_en": "A large proportion of my class speaks Chinese.", "ex_zh": "我班上有很大比例的人说中文。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0727", "unit": "Unit 13"}, {"word": "statistics", "pron": "stəˈtɪstɪks", "part_of_speech": "n.", "pos": "n.", "def_en": "numbers collected to show facts about something", "def_zh": "统计数据", "quote_en": "Statistics show that more people are living alone.", "quote_zh": "统计数据显示独居的人越来越多。", "ex_en": "I studied statistics at university.", "ex_zh": "我在大学学过统计学。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0728", "unit": "Unit 13"}, {"word": "ageing", "pron": "ˈeɪdʒɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "becoming older", "def_zh": "老龄化的；变老的", "quote_en": "An ageing population puts pressure on health services.", "quote_zh": "人口老龄化给医疗服务带来压力。", "ex_en": "My grandfather is an ageing man but still active.", "ex_zh": "我爷爷年纪大了，但仍很活跃。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0729", "unit": "Unit 13"}, {"word": "current", "pron": "ˈkʌrənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "happening or existing now", "def_zh": "当前的；现行的", "quote_en": "The current trend is for people to work from home.", "quote_zh": "当前的趋势是人们在家办公。", "ex_en": "What's the current situation?", "ex_zh": "目前的情况如何？", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0730", "unit": "Unit 13"}, {"word": "demographic", "pron": "ˌdeməˈɡræfɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the structure of a population", "def_zh": "人口统计的", "quote_en": "Demographic changes will affect housing demand.", "quote_zh": "人口结构的变化将影响住房需求。", "ex_en": "The report shows demographic trends in Asia.", "ex_zh": "这份报告展示了亚洲的人口趋势。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0731", "unit": "Unit 13"}, {"word": "elderly", "pron": "ˈeldəli", "part_of_speech": "adj.", "pos": "adj.", "def_en": "old, especially in a polite way", "def_zh": "年长的；老年的", "quote_en": "Elderly people need good access to public transport.", "quote_zh": "老年人需要方便的公共交通。", "ex_en": "My elderly neighbour lives alone.", "ex_zh": "我年迈的邻居独自生活。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0732", "unit": "Unit 13"}, {"word": "ethnic", "pron": "ˈeθnɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to a particular cultural or national group", "def_zh": "种族的；民族的", "quote_en": "Auckland has many ethnic restaurants.", "quote_zh": "奥克兰有许多不同民族风味的餐馆。", "ex_en": "Our school has students from many ethnic backgrounds.", "ex_zh": "我们学校有来自许多不同民族背景的学生。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0733", "unit": "Unit 13"}, {"word": "exotic", "pron": "ɪɡˈzɒtɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "unusual and exciting because it comes from another country", "def_zh": "异国情调的", "quote_en": "Tourists enjoy exotic food and unusual traditions.", "quote_zh": "游客喜欢异国风味的食物和独特的传统。", "ex_en": "I wore an exotic scarf from India.", "ex_zh": "我戴了一条来自印度的异国风情围巾。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0734", "unit": "Unit 13"}, {"word": "global", "pron": "ˈɡləʊbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the whole world", "def_zh": "全球的", "quote_en": "Global warming is a major concern for governments.", "quote_zh": "全球变暖是各国政府关注的重大问题。", "ex_en": "The company has a global network of offices.", "ex_zh": "这家公司在全球设有办事处网络。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0735", "unit": "Unit 13"}, {"word": "long-term", "pron": "ˌlɒŋ ˈtɜːm", "part_of_speech": "adj.", "pos": "adj.", "def_en": "lasting for a long time into the future", "def_zh": "长期的", "quote_en": "Long-term planning is essential for sustainable development.", "quote_zh": "长期规划对可持续发展至关重要。", "ex_en": "I need a long-term solution to the problem.", "ex_zh": "我需要这个问题的长期解决办法。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0736", "unit": "Unit 13"}, {"word": "mid-term", "pron": "ˌmɪd ˈtɜːm", "part_of_speech": "adj.", "pos": "adj.", "def_en": "in the middle of a period of time", "def_zh": "中期的", "quote_en": "The mid-term goal is to reduce emissions by half.", "quote_zh": "中期目标是把排放量减少一半。", "ex_en": "We have mid-term exams next week.", "ex_zh": "我们下周有期中考试。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0737", "unit": "Unit 13"}, {"word": "multicultural", "pron": "ˌmʌltiˈkʌltʃərəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "including people from many different cultures", "def_zh": "多元文化的", "quote_en": "Multicultural societies benefit from many different ideas.", "quote_zh": "多元文化社会得益于许多不同的想法。", "ex_en": "I live in a multicultural neighbourhood.", "ex_zh": "我住在一个多元文化的社区。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0738", "unit": "Unit 13"}, {"word": "productive", "pron": "prəˈdʌktɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "doing or achieving a lot", "def_zh": "有成效的；多产的", "quote_en": "Productive workers help companies to grow.", "quote_zh": "高效的员工帮助公司成长。", "ex_en": "I had a very productive morning.", "ex_zh": "我上午效率很高。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0739", "unit": "Unit 13"}, {"word": "sceptical", "pron": "ˈskeptɪkl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having doubts about something", "def_zh": "怀疑的", "quote_en": "Many scientists are sceptical about the new theory.", "quote_zh": "许多科学家对这个新理论持怀疑态度。", "ex_en": "I'm sceptical about getting rich quickly.", "ex_zh": "我对一夜暴富持怀疑态度。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0740", "unit": "Unit 13"}, {"word": "short-term", "pron": "ˌʃɔːt ˈtɜːm", "part_of_speech": "adj.", "pos": "adj.", "def_en": "lasting for a short time", "def_zh": "短期的", "quote_en": "Short-term solutions rarely solve the underlying problem.", "quote_zh": "短期的解决办法很少能解决根本问题。", "ex_en": "I only have a short-term contract.", "ex_zh": "我只有短期合同。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0741", "unit": "Unit 13"}, {"word": "subsequent", "pron": "ˈsʌbsɪkwənt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "coming after something else", "def_zh": "随后的；后来的", "quote_en": "Subsequent studies confirmed the first results.", "quote_zh": "随后的研究证实了最初的结果。", "ex_en": "In subsequent years, prices continued to rise.", "ex_zh": "在随后的几年里，价格持续上涨。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0742", "unit": "Unit 13"}, {"word": "wealthy", "pron": "ˈwelθi", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having a lot of money", "def_zh": "富有的", "quote_en": "Wealthy countries should help poorer ones.", "quote_zh": "富裕国家应该帮助较贫穷的国家。", "ex_en": "She comes from a wealthy family.", "ex_zh": "她出身于一个富裕的家庭。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0743", "unit": "Unit 13"}, {"word": "worldwide", "pron": "ˌwɜːldˈwaɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "happening in all parts of the world", "def_zh": "全球的；遍及全世界的", "quote_en": "The company has worldwide customers.", "quote_zh": "这家公司的客户遍布全球。", "ex_en": "The film was a worldwide success.", "ex_zh": "这部电影在全球获得成功。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0744", "unit": "Unit 13"}, {"word": "compound", "pron": "kəmˈpaʊnd", "part_of_speech": "v.", "pos": "v.", "def_en": "to make a problem worse", "def_zh": "使恶化；加剧", "quote_en": "High prices compound the problem of poverty.", "quote_zh": "高物价加剧了贫困问题。", "ex_en": "The bad weather could compound our difficulties.", "ex_zh": "恶劣天气可能加剧我们的困难。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0745", "unit": "Unit 13"}, {"word": "contribute", "pron": "kənˈtrɪbjuːt", "part_of_speech": "v.", "pos": "v.", "def_en": "to give something to help achieve a result", "def_zh": "促成；贡献", "quote_en": "Several factors contribute to global warming.", "quote_zh": "有若干因素导致全球变暖。", "ex_en": "I contribute to a charity every month.", "ex_zh": "我每月向一个慈善机构捐款。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0746", "unit": "Unit 13"}, {"word": "decline", "pron": "dɪˈklaɪn", "part_of_speech": "v.", "pos": "v.", "def_en": "to become less in amount or quality", "def_zh": "下降；衰退", "quote_en": "The number of traditional shops continues to decline.", "quote_zh": "传统商店的数量持续减少。", "ex_en": "My interest in the game began to decline over time.", "ex_zh": "我对这个游戏的兴趣随时间开始减退。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0747", "unit": "Unit 13"}, {"word": "dominate", "pron": "ˈdɒmɪneɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to have the most influence or control", "def_zh": "支配；占主导地位", "quote_en": "A few large companies dominate the global market.", "quote_zh": "少数大公司主导着全球市场。", "ex_en": "English seems to dominate the internet.", "ex_zh": "英语似乎在互联网上占主导地位。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0748", "unit": "Unit 13"}, {"word": "dwindle", "pron": "ˈdwɪndl", "part_of_speech": "v.", "pos": "v.", "def_en": "to become gradually smaller or fewer", "def_zh": "逐渐减少", "quote_en": "Fish stocks have dwindled because of overfishing.", "quote_zh": "由于过度捕捞，鱼类资源逐渐减少。", "ex_en": "Our savings will dwindle if I lose my job.", "ex_zh": "如果我失业，我们的积蓄会逐渐减少。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0749", "unit": "Unit 13"}, {"word": "factor", "pron": "ˈfæktə", "part_of_speech": "v.", "pos": "v.", "def_en": "to include something as one of the things you consider", "def_zh": "把…计算在内；作为因素", "quote_en": "The company must factor rising costs into its budget.", "quote_zh": "公司必须把不断上升的成本计入预算。", "ex_en": "I always factor the travel time into my plans.", "ex_zh": "我总是把路上的时间计入我的计划。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0750", "unit": "Unit 13"}, {"word": "merge", "pron": "mɜːdʒ", "part_of_speech": "v.", "pos": "v.", "def_en": "to join together to form one thing", "def_zh": "合并", "quote_en": "The two banks decided to merge to compete globally.", "quote_zh": "这两家银行决定合并以在全球范围内竞争。", "ex_en": "The two roads merge near the bridge.", "ex_zh": "这两条路在桥附近汇合。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0751", "unit": "Unit 13"}, {"word": "migrate", "pron": "maɪˈɡreɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to move from one place to another to live or work", "def_zh": "迁移；移居", "quote_en": "Many workers migrate to cities to find better jobs.", "quote_zh": "许多工人迁往城市寻找更好的工作。", "ex_en": "Birds migrate south in winter.", "ex_zh": "鸟类冬天向南迁徙。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0752", "unit": "Unit 13"}, {"word": "sequential", "pron": "sɪˈkwenʃl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Following one after another in a fixed order.", "def_zh": "顺序的；连续的", "quote_en": "The report gives a sequential account of the events, from the first day to the last.", "quote_zh": "这份报告按顺序叙述了事件，从第一天到最后一天。", "ex_en": "The steps of the experiment must be sequential.", "ex_zh": "实验的步骤必须按先后顺序进行。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0753", "unit": "Unit 13"}, {"word": "national", "pron": "ˈnæʃnəl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Relating to a whole country rather than part of it.", "def_zh": "国家的；全国的", "quote_en": "The national average for rainfall was higher than usual this year.", "quote_zh": "今年全国平均降雨量比往常高。", "ex_en": "There will be a national holiday next Monday.", "ex_zh": "下周一是全国性的节日。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0754", "unit": "Unit 13"}, {"word": "unforeseen", "pron": "ˌʌnfɔːˈsiːn", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Not expected or predicted.", "def_zh": "未预见的；意外的", "quote_en": "An unforeseen delay made us miss the connecting flight.", "quote_zh": "一次意外的延误使我们错过了转机航班。", "ex_en": "We had to cancel the picnic because of unforeseen circumstances.", "ex_zh": "由于意外情况，我们不得不取消野餐。", "chapter": "Unit 13 · The Modern World · 现代世界", "id": "w0755", "unit": "Unit 13"}, {"word": "challenge", "pron": "ˈtʃælɪndʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "something difficult that tests your ability", "def_zh": "挑战", "quote_en": "Rapid urbanisation brings many challenges for city planners.", "quote_zh": "快速的城市化给城市规划者带来许多挑战。", "ex_en": "Learning a new language is a big challenge.", "ex_zh": "学习一门新语言是一项巨大的挑战。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0756", "unit": "Unit 14"}, {"word": "compromise", "pron": "ˈkɒmprəmaɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "an agreement in which each side gives up something", "def_zh": "妥协；折中", "quote_en": "The two groups reached a compromise on the new housing plan.", "quote_zh": "两个团体就新的住房计划达成了妥协。", "ex_en": "We made a compromise and chose a cheaper hotel.", "ex_zh": "我们做了折中，选了一家便宜些的酒店。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0757", "unit": "Unit 14"}, {"word": "difficulty", "pron": "ˈdɪfɪkəlti", "part_of_speech": "n.", "pos": "n.", "def_en": "a problem or something hard to do", "def_zh": "困难", "quote_en": "Many newcomers face difficulty in finding affordable housing.", "quote_zh": "许多新来的人在找经济适用房时遇到困难。", "ex_en": "I had difficulty understanding the lecture.", "ex_zh": "我听不懂这堂讲座，有困难。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0758", "unit": "Unit 14"}, {"word": "dilemma", "pron": "dɪˈlemə", "part_of_speech": "n.", "pos": "n.", "def_en": "a difficult choice between two options", "def_zh": "困境；两难", "quote_en": "Governments face a dilemma between economic growth and protecting the environment.", "quote_zh": "政府面临着经济增长与保护环境之间的两难。", "ex_en": "I'm in a dilemma about which job to take.", "ex_zh": "我在选哪份工作上左右为难。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0759", "unit": "Unit 14"}, {"word": "infrastructure", "pron": "ˈɪnfrəstrʌktʃə", "part_of_speech": "n.", "pos": "n.", "def_en": "the basic systems such as roads, power and water that a place needs", "def_zh": "基础设施", "quote_en": "Cities need good infrastructure to support a growing population.", "quote_zh": "城市需要良好的基础设施来支撑不断增长的人口。", "ex_en": "The country is investing heavily in infrastructure.", "ex_zh": "这个国家正在大力投资基础设施。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0760", "unit": "Unit 14"}, {"word": "issue", "pron": "ˈɪʃuː", "part_of_speech": "n.", "pos": "n.", "def_en": "an important topic or problem", "def_zh": "问题；议题", "quote_en": "Housing is a major issue in big cities.", "quote_zh": "住房是大城市的一个主要问题。", "ex_en": "Climate change is an issue that affects everyone.", "ex_zh": "气候变化是一个影响每个人的问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0761", "unit": "Unit 14"}, {"word": "megacity", "pron": "ˈmeɡəsɪti", "part_of_speech": "n.", "pos": "n.", "def_en": "a very large city with over ten million people", "def_zh": "特大城市", "quote_en": "Tokyo is the world's biggest megacity.", "quote_zh": "东京是世界上最大的特大城市。", "ex_en": "Living in a megacity can be both exciting and stressful.", "ex_zh": "生活在特大城市既令人兴奋，也让人有压力。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0762", "unit": "Unit 14"}, {"word": "migrant", "pron": "ˈmaɪɡrənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a person who moves to another place to find work", "def_zh": "移民；外来务工者", "quote_en": "Many migrants move to the city for better job opportunities.", "quote_zh": "许多外来务工人员为了更好的工作机会搬到城市。", "ex_en": "My neighbour is a migrant from the Philippines.", "ex_zh": "我的邻居是来自菲律宾的移民。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0763", "unit": "Unit 14"}, {"word": "obstacle", "pron": "ˈɒbstəkl", "part_of_speech": "n.", "pos": "n.", "def_en": "something that makes it difficult to achieve something", "def_zh": "障碍", "quote_en": "Lack of funding is the main obstacle to improving public transport.", "quote_zh": "缺乏资金是改善公共交通的主要障碍。", "ex_en": "The language barrier was my biggest obstacle.", "ex_zh": "语言障碍是我最大的障碍。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0764", "unit": "Unit 14"}, {"word": "overpopulation", "pron": "ˌəʊvəˌpɒpjuˈleɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a situation where there are too many people for the space available", "def_zh": "人口过剩", "quote_en": "Overpopulation puts pressure on housing and resources.", "quote_zh": "人口过剩给住房和资源带来压力。", "ex_en": "Overpopulation is a serious problem in some cities.", "ex_zh": "人口过剩在一些城市是一个严重的问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0765", "unit": "Unit 14"}, {"word": "poverty", "pron": "ˈpɒvəti", "part_of_speech": "n.", "pos": "n.", "def_en": "the state of being very poor", "def_zh": "贫困", "quote_en": "Rapid urban growth can increase poverty if there are not enough jobs.", "quote_zh": "如果没有足够的工作岗位，快速的城市增长可能加剧贫困。", "ex_en": "Many families in the slum live in poverty.", "ex_zh": "贫民窟里许多家庭生活在贫困之中。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0766", "unit": "Unit 14"}, {"word": "resolution", "pron": "ˌrezəˈluːʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a firm decision; a solution to a problem", "def_zh": "决议；解决", "quote_en": "The council passed a resolution to reduce traffic.", "quote_zh": "市议会通过了一项减少交通的决议。", "ex_en": "I made a New Year resolution to exercise more.", "ex_zh": "我立下了一个新年决心，要多运动。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0767", "unit": "Unit 14"}, {"word": "setback", "pron": "ˈsetbæk", "part_of_speech": "n.", "pos": "n.", "def_en": "a problem that delays progress", "def_zh": "挫折；阻碍", "quote_en": "The bad weather was a setback for the building project.", "quote_zh": "恶劣天气给这个建筑项目造成了挫折。", "ex_en": "Losing my job was a major setback.", "ex_zh": "失业对我是一个重大挫折。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0768", "unit": "Unit 14"}, {"word": "slum", "pron": "slʌm", "part_of_speech": "n.", "pos": "n.", "def_en": "a very poor and crowded area of a city", "def_zh": "贫民窟", "quote_en": "Millions of people in the developing world live in a slum.", "quote_zh": "发展中国家有数百万人生活在贫民窟里。", "ex_en": "The charity builds schools in the slum.", "ex_zh": "这个慈善机构在贫民窟里建学校。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0769", "unit": "Unit 14"}, {"word": "solution", "pron": "səˈluːʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a way of solving a problem", "def_zh": "解决办法", "quote_en": "Building more homes is one solution to the housing shortage.", "quote_zh": "多盖房子是解决住房短缺的一个办法。", "ex_en": "We need a quick solution to the traffic problem.", "ex_zh": "我们需要尽快解决这个交通问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0770", "unit": "Unit 14"}, {"word": "tolerance", "pron": "ˈtɒlərəns", "part_of_speech": "n.", "pos": "n.", "def_en": "willingness to accept different opinions or behaviour", "def_zh": "容忍；宽容", "quote_en": "Tolerance is essential in a multicultural city.", "quote_zh": "在多元文化的城市里，宽容至关重要。", "ex_en": "My teacher taught us tolerance and respect.", "ex_zh": "我的老师教导我们宽容和尊重。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0771", "unit": "Unit 14"}, {"word": "traffic", "pron": "ˈtræfɪk", "part_of_speech": "n.", "pos": "n.", "def_en": "the vehicles moving along a road", "def_zh": "交通；车流", "quote_en": "Heavy traffic is a daily problem in many big cities.", "quote_zh": "交通拥堵是许多大城市每天都要面对的问题。", "ex_en": "I was late because of the traffic.", "ex_zh": "我因为交通堵塞迟到了。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0772", "unit": "Unit 14"}, {"word": "urbanisation", "pron": "ˌɜːbənaɪˈzeɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the growth of towns and cities", "def_zh": "城市化", "quote_en": "Rapid urbanisation has changed the lives of millions of people.", "quote_zh": "快速的城市化改变了数百万人的生活。", "ex_en": "Urbanisation has led to the loss of farmland.", "ex_zh": "城市化导致了农田的减少。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0773", "unit": "Unit 14"}, {"word": "booming", "pron": "ˈbuːmɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "growing very quickly and successfully", "def_zh": "蓬勃发展的", "quote_en": "Auckland has a booming property market.", "quote_zh": "奥克兰的房地产市场蓬勃发展。", "ex_en": "Tourism is a booming industry in the region.", "ex_zh": "旅游业是这个地区蓬勃发展的产业。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0774", "unit": "Unit 14"}, {"word": "crowded", "pron": "ˈkraʊdɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "full of people", "def_zh": "拥挤的", "quote_en": "Crowded buses make travelling uncomfortable in rush hour.", "quote_zh": "高峰时段拥挤的公交车使出行不舒服。", "ex_en": "The train was so crowded that I had to stand.", "ex_zh": "火车太拥挤，我只好站着。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0775", "unit": "Unit 14"}, {"word": "decent", "pron": "ˈdiːsnt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "of a good enough standard", "def_zh": "像样的；体面的", "quote_en": "Everyone deserves a decent home and a safe neighbourhood.", "quote_zh": "每个人都应该拥有像样的住所和安全的社区。", "ex_en": "I found a decent flat at a fair price.", "ex_zh": "我以合理的价格找到了一套像样的公寓。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0776", "unit": "Unit 14"}, {"word": "developing", "pron": "dɪˈveləpɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "(of a country) becoming more advanced economically", "def_zh": "发展中的", "quote_en": "Many developing countries are urbanising rapidly.", "quote_zh": "许多发展中国家正在快速城市化。", "ex_en": "My parents work with a developing nation.", "ex_zh": "我父母与一个发展中国家合作工作。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0777", "unit": "Unit 14"}, {"word": "double-edged", "pron": "ˌdʌbl ˈedʒd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having both good and bad effects", "def_zh": "双刃的；利弊兼有的", "quote_en": "Urban growth is a double-edged sword.", "quote_zh": "城市增长是一把双刃剑。", "ex_en": "Social media is a double-edged tool.", "ex_zh": "社交媒体是一把双刃剑。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0778", "unit": "Unit 14"}, {"word": "isolated", "pron": "ˈaɪsəleɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "far from other places or people", "def_zh": "孤立的；偏远的", "quote_en": "Isolated villages often lack basic services.", "quote_zh": "偏远的村庄往往缺乏基本服务。", "ex_en": "I felt isolated when I first moved here.", "ex_zh": "我刚搬到这里时感到很孤立。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0779", "unit": "Unit 14"}, {"word": "one-sided", "pron": "ˌwʌn ˈsaɪdɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "giving only one point of view", "def_zh": "片面的；单方面的", "quote_en": "A one-sided argument is not convincing.", "quote_zh": "片面的论点没有说服力。", "ex_en": "The report was too one-sided.", "ex_zh": "这份报告太片面了。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0780", "unit": "Unit 14"}, {"word": "long-sighted", "pron": "ˌlɒŋ ˈsaɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to see far ahead; planning for the future", "def_zh": "有远见的；远视的", "quote_en": "Long-sighted planning can prevent future traffic problems.", "quote_zh": "有远见的规划可以预防未来的交通问题。", "ex_en": "My uncle is long-sighted, so he wears glasses to read.", "ex_zh": "我叔叔远视，所以读书时戴眼镜。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0781", "unit": "Unit 14"}, {"word": "overpriced", "pron": "ˌəʊvəˈpraɪst", "part_of_speech": "adj.", "pos": "adj.", "def_en": "costing too much", "def_zh": "定价过高的", "quote_en": "Overpriced housing makes it hard for young people to buy a home.", "quote_zh": "价格过高的住房使年轻人很难买房。", "ex_en": "The coffee here is overpriced.", "ex_zh": "这里的咖啡价格太高了。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0782", "unit": "Unit 14"}, {"word": "overworked", "pron": "ˌəʊvəˈwɜːkt", "part_of_speech": "adj.", "pos": "adj.", "def_en": "working too hard", "def_zh": "工作过度的", "quote_en": "Overworked employees are more likely to make mistakes.", "quote_zh": "工作过度的员工更容易出错。", "ex_en": "I feel tired and overworked this week.", "ex_zh": "这周我感到又累又过度劳累。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0783", "unit": "Unit 14"}, {"word": "pressing", "pron": "ˈpresɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "urgent and needing attention", "def_zh": "紧迫的", "quote_en": "Housing shortage is a pressing problem in many cities.", "quote_zh": "住房短缺是许多城市的紧迫问题。", "ex_en": "I have a pressing matter to discuss with you.", "ex_zh": "我有一件紧急的事要和你谈。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0784", "unit": "Unit 14"}, {"word": "short-sighted", "pron": "ˌʃɔːt ˈsaɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not thinking about the future; unable to see far", "def_zh": "目光短浅的；近视的", "quote_en": "It is short-sighted to ignore long-term environmental costs.", "quote_zh": "忽视长期的环境成本是目光短浅的。", "ex_en": "I'm short-sighted, so I need glasses to see the board.", "ex_zh": "我近视，所以需要戴眼镜看黑板。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0785", "unit": "Unit 14"}, {"word": "staggering", "pron": "ˈstæɡərɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "so large that it is shocking", "def_zh": "惊人的", "quote_en": "The city is growing at a staggering rate.", "quote_zh": "这座城市以惊人的速度发展。", "ex_en": "The cost of the project was staggering.", "ex_zh": "这个项目的成本高得惊人。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0786", "unit": "Unit 14"}, {"word": "address", "pron": "əˈdres", "part_of_speech": "v.", "pos": "v.", "def_en": "to deal with a problem", "def_zh": "解决；处理", "quote_en": "Governments must address the housing shortage urgently.", "quote_zh": "政府必须紧急解决住房短缺问题。", "ex_en": "We need to address this issue immediately.", "ex_zh": "我们需要立即处理这个问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0787", "unit": "Unit 14"}, {"word": "adjust", "pron": "əˈdʒʌst", "part_of_speech": "v.", "pos": "v.", "def_en": "to change something slightly to make it fit", "def_zh": "调整；适应", "quote_en": "Newcomers need time to adjust to city life.", "quote_zh": "新来的人需要时间适应城市生活。", "ex_en": "I have to adjust my schedule to attend the meeting.", "ex_zh": "我必须调整日程才能参加会议。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0788", "unit": "Unit 14"}, {"word": "aggravate", "pron": "ˈæɡrəveɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to make a bad situation worse", "def_zh": "使恶化；加重", "quote_en": "Heavy traffic aggravates air pollution in the city.", "quote_zh": "交通拥堵加剧了城市的空气污染。", "ex_en": "Stress can aggravate health problems.", "ex_zh": "压力会加重健康问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0789", "unit": "Unit 14"}, {"word": "cause", "pron": "kɔːz", "part_of_speech": "v.", "pos": "v.", "def_en": "to make something happen", "def_zh": "引起；导致", "quote_en": "Overcrowding can cause serious health problems.", "quote_zh": "过度拥挤可能引起严重的健康问题。", "ex_en": "What could cause the delay?", "ex_zh": "什么原因会造成延误？", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0790", "unit": "Unit 14"}, {"word": "compete", "pron": "kəmˈpiːt", "part_of_speech": "v.", "pos": "v.", "def_en": "to try to win or be better than others", "def_zh": "竞争；比赛", "quote_en": "Small shops cannot compete with large supermarkets.", "quote_zh": "小商店无法与大型超市竞争。", "ex_en": "I want to compete in the swimming race.", "ex_zh": "我想参加游泳比赛。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0791", "unit": "Unit 14"}, {"word": "deal with", "pron": "diːl wɪð", "part_of_speech": "v.", "pos": "v.", "def_en": "to take action to solve a problem", "def_zh": "处理；应对", "quote_en": "City councils must deal with the problem of rubbish.", "quote_zh": "市议会必须处理垃圾问题。", "ex_en": "How do you deal with stress?", "ex_zh": "你如何应对压力？", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0792", "unit": "Unit 14"}, {"word": "deteriorate", "pron": "dɪˈtɪəriəreɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to become worse", "def_zh": "恶化；变坏", "quote_en": "Air quality has deteriorated rapidly in the city.", "quote_zh": "这座城市的空气质量迅速恶化。", "ex_en": "His health may deteriorate after the accident.", "ex_zh": "事故之后他的健康状况可能会恶化。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0793", "unit": "Unit 14"}, {"word": "enhance", "pron": "ɪnˈhɑːns", "part_of_speech": "v.", "pos": "v.", "def_en": "to improve the quality of something", "def_zh": "提高；增强", "quote_en": "Green spaces enhance the quality of life in cities.", "quote_zh": "绿地提高了城市的生活质量。", "ex_en": "Music can enhance your mood.", "ex_zh": "音乐可以改善你的心情。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0794", "unit": "Unit 14"}, {"word": "exacerbate", "pron": "ɪɡˈzæsəbeɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to make a problem more serious", "def_zh": "使恶化；加剧", "quote_en": "Lack of housing exacerbates the problem of homelessness.", "quote_zh": "住房不足加剧了无家可归的问题。", "ex_en": "Poor planning can exacerbate the traffic situation.", "ex_zh": "糟糕的规划会加剧交通状况。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0795", "unit": "Unit 14"}, {"word": "exclude", "pron": "ɪkˈskluːd", "part_of_speech": "v.", "pos": "v.", "def_en": "to deliberately not include someone or something", "def_zh": "排除；不包括", "quote_en": "Rising prices can exclude low-income families from the city centre.", "quote_zh": "不断上涨的价格可能使低收入家庭无法住在市中心。", "ex_en": "Please don't exclude anyone from the game.", "ex_zh": "请不要把任何人排除在游戏之外。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0796", "unit": "Unit 14"}, {"word": "face", "pron": "feɪs", "part_of_speech": "v.", "pos": "v.", "def_en": "to have to deal with a problem", "def_zh": "面对；面临", "quote_en": "Cities face serious challenges as populations grow.", "quote_zh": "随着人口增长，城市面临着严峻挑战。", "ex_en": "I had to face many difficulties when I moved abroad.", "ex_zh": "我搬到国外时不得不面对许多困难。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0797", "unit": "Unit 14"}, {"word": "flourish", "pron": "ˈflʌrɪʃ", "part_of_speech": "v.", "pos": "v.", "def_en": "to grow or develop well", "def_zh": "繁荣；茁壮成长", "quote_en": "Small businesses flourish in busy city centres.", "quote_zh": "小企业在繁华的市中心蓬勃发展。", "ex_en": "Plants flourish in the warm, wet climate.", "ex_zh": "植物在温暖潮湿的气候中茁壮生长。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0798", "unit": "Unit 14"}, {"word": "identify", "pron": "aɪˈdentɪfaɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to recognise or find out what something is", "def_zh": "识别；确定", "quote_en": "Researchers identified several causes of urban stress.", "quote_zh": "研究人员确定了城市压力的几个原因。", "ex_en": "Can you identify the man in the photo?", "ex_zh": "你能认出照片里的那个人吗？", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0799", "unit": "Unit 14"}, {"word": "include", "pron": "ɪnˈkluːd", "part_of_speech": "v.", "pos": "v.", "def_en": "to have something as a part", "def_zh": "包括；包含", "quote_en": "The report includes a list of recommendations for city planners.", "quote_zh": "这份报告包括给城市规划者的一系列建议。", "ex_en": "Does the price include breakfast?", "ex_zh": "价格包含早餐吗？", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0800", "unit": "Unit 14"}, {"word": "linger", "pron": "ˈlɪŋɡə", "part_of_speech": "v.", "pos": "v.", "def_en": "to stay for a long time", "def_zh": "逗留；挥之不去", "quote_en": "Pollution can linger in the air for days.", "quote_zh": "污染物可以在空气中停留数日。", "ex_en": "The smell of smoke can linger in the room.", "ex_zh": "烟味会在房间里久久不散。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0801", "unit": "Unit 14"}, {"word": "modify", "pron": "ˈmɒdɪfaɪ", "part_of_speech": "v.", "pos": "v.", "def_en": "to change something slightly", "def_zh": "修改；调整", "quote_en": "Planners had to modify the design to meet safety standards.", "quote_zh": "规划者不得不修改设计以符合安全标准。", "ex_en": "I want to modify my essay after the teacher's comments.", "ex_zh": "听了老师的意见后，我想修改我的文章。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0802", "unit": "Unit 14"}, {"word": "present", "pron": "prɪˈzent", "part_of_speech": "v.", "pos": "v.", "def_en": "to give or show something to an audience", "def_zh": "呈现；提出", "quote_en": "The mayor will present the new transport plan next week.", "quote_zh": "市长将在下周公布新的交通方案。", "ex_en": "I have to present my project to the class.", "ex_zh": "我必须向全班展示我的项目。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0803", "unit": "Unit 14"}, {"word": "raise", "pron": "reɪz", "part_of_speech": "v.", "pos": "v.", "def_en": "to increase something; to bring up an issue", "def_zh": "提高；提出", "quote_en": "The government plans to raise taxes on petrol.", "quote_zh": "政府计划提高汽油税。", "ex_en": "She wants to raise an important issue at the meeting.", "ex_zh": "她想在会上提出一个重要问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0804", "unit": "Unit 14"}, {"word": "reform", "pron": "rɪˈfɔːm", "part_of_speech": "v.", "pos": "v.", "def_en": "to improve a system by making changes", "def_zh": "改革", "quote_en": "The city needs to reform its public transport system.", "quote_zh": "这座城市需要改革其公共交通系统。", "ex_en": "The government plans to reform education.", "ex_zh": "政府计划改革教育。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0805", "unit": "Unit 14"}, {"word": "regulate", "pron": "ˈreɡjuleɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to control something using rules", "def_zh": "管理；调节", "quote_en": "Councils regulate the number of cars entering the city centre.", "quote_zh": "市政府管控进入市中心的汽车数量。", "ex_en": "The law will regulate how noisy a factory can be.", "ex_zh": "法律将规定工厂可以有多大的噪音。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0806", "unit": "Unit 14"}, {"word": "remedy", "pron": "ˈremədi", "part_of_speech": "v.", "pos": "v.", "def_en": "to correct a problem", "def_zh": "纠正；补救", "quote_en": "Governments should act quickly to remedy the housing shortage.", "quote_zh": "政府应迅速行动，纠正住房短缺的问题。", "ex_en": "We must remedy the mistake at once.", "ex_zh": "我们必须立即纠正这个错误。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0807", "unit": "Unit 14"}, {"word": "resolve", "pron": "rɪˈzɒlv", "part_of_speech": "v.", "pos": "v.", "def_en": "to find a solution to a problem", "def_zh": "解决；决心", "quote_en": "The two sides met to resolve the dispute.", "quote_zh": "双方会面以解决争端。", "ex_en": "We should resolve the problem by talking.", "ex_zh": "我们应该通过交谈解决问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0808", "unit": "Unit 14"}, {"word": "tackle", "pron": "ˈtækl", "part_of_speech": "v.", "pos": "v.", "def_en": "to try to deal with a difficult problem", "def_zh": "处理；应对", "quote_en": "The city has introduced measures to tackle air pollution.", "quote_zh": "这座城市出台措施来治理空气污染。", "ex_en": "We need to tackle this problem together.", "ex_zh": "我们需要一起解决这个问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0809", "unit": "Unit 14"}, {"word": "transform", "pron": "trænsˈfɔːm", "part_of_speech": "v.", "pos": "v.", "def_en": "to change something completely", "def_zh": "彻底改变；转变", "quote_en": "New metro lines have transformed the city.", "quote_zh": "新的地铁线路彻底改变了这座城市。", "ex_en": "Technology can transform how I study.", "ex_zh": "科技可以彻底改变我学习的方式。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0810", "unit": "Unit 14"}, {"word": "worsen", "pron": "ˈwɜːsn", "part_of_speech": "v.", "pos": "v.", "def_en": "to become worse", "def_zh": "恶化；变得更糟", "quote_en": "Traffic congestion will worsen if no action is taken.", "quote_zh": "如果不采取行动，交通拥堵将会恶化。", "ex_en": "My headache might worsen during the afternoon.", "ex_zh": "我的头痛下午可能会加重。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0811", "unit": "Unit 14"}, {"word": "find a solution", "pron": "faɪnd ə səˈluːʃn", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to discover a way to solve a problem", "def_zh": "找到解决办法", "quote_en": "Experts are working to find a solution to the traffic problem.", "quote_zh": "专家们正在努力找到交通问题的解决办法。", "ex_en": "We need to find a solution before Friday.", "ex_zh": "我们需要在周五之前找到解决办法。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0812", "unit": "Unit 14"}, {"word": "overcome a difficulty", "pron": "ˌəʊvəˈkʌm ə ˈdɪfɪkəlti", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to succeed in dealing with a problem", "def_zh": "克服困难", "quote_en": "Newcomers often work hard to overcome a difficulty with language.", "quote_zh": "新来的人常常努力克服语言方面的困难。", "ex_en": "It took time to overcome a difficulty like homesickness.", "ex_zh": "克服想家这样的困难需要时间。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0813", "unit": "Unit 14"}, {"word": "reach a compromise", "pron": "riːtʃ ə ˈkɒmprəmaɪz", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to agree on something after each side gives something up", "def_zh": "达成妥协", "quote_en": "After a long discussion, they managed to reach a compromise.", "quote_zh": "经过长时间讨论，他们设法达成了妥协。", "ex_en": "We hope to reach a compromise about the holiday.", "ex_zh": "我们希望在假期问题上达成妥协。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0814", "unit": "Unit 14"}, {"word": "find a compromise", "pron": "faɪnd ə ˈkɒmprəmaɪz", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to discover a solution that both sides accept", "def_zh": "找到折中办法", "quote_en": "It is not always easy to find a compromise in politics.", "quote_zh": "在政治中，找到折中办法并不总是容易的。", "ex_en": "I hope we can find a compromise.", "ex_zh": "我希望我们能找到折中的办法。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0815", "unit": "Unit 14"}, {"word": "remedy a situation", "pron": "ˈremədi ə ˌsɪtʃuˈeɪʃn", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to correct a bad situation", "def_zh": "补救局面", "quote_en": "The council took urgent steps to remedy a situation of overcrowding.", "quote_zh": "市议会采取紧急措施来补救过度拥挤的局面。", "ex_en": "It's hard to remedy a situation like this.", "ex_zh": "这样的局面很难补救。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0816", "unit": "Unit 14"}, {"word": "resolve an issue", "pron": "rɪˈzɒlv ən ˈɪʃuː", "part_of_speech": "phrase", "pos": "phrase", "def_en": "to solve a problem or question", "def_zh": "解决问题", "quote_en": "Communication helps to resolve an issue quickly.", "quote_zh": "沟通有助于快速解决问题。", "ex_en": "We met to resolve an issue about noise.", "ex_zh": "我们见面以解决噪音问题。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0817", "unit": "Unit 14"}, {"word": "disjointed", "pron": "dɪsˈdʒɔɪntɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "Lacking a clear connection between the parts; not well organised.", "def_zh": "支离破碎的；不连贯的", "quote_en": "The speech was disjointed and hard to follow.", "quote_zh": "这场演讲前后不连贯，很难听懂。", "ex_en": "His essay felt disjointed because the paragraphs did not link together.", "ex_zh": "他的文章读起来很零散，因为段落之间没有衔接。", "chapter": "Unit 14 · Urbanisation · 城市化", "id": "w0818", "unit": "Unit 14"}, {"word": "acid rain", "pron": "ˈæsɪd reɪn", "part_of_speech": "n.", "pos": "n.", "def_en": "rain containing harmful chemicals from pollution", "def_zh": "酸雨", "quote_en": "Acid rain damages forests and lakes in industrial regions.", "quote_zh": "酸雨损害工业地区的森林和湖泊。", "ex_en": "Acid rain has damaged many old buildings.", "ex_zh": "酸雨已经损坏了许多古老的建筑。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0819", "unit": "Unit 15"}, {"word": "biodiversity", "pron": "ˌbaɪəʊdaɪˈvɜːsəti", "part_of_speech": "n.", "pos": "n.", "def_en": "the variety of plant and animal life in a place", "def_zh": "生物多样性", "quote_en": "Deforestation threatens biodiversity in tropical regions.", "quote_zh": "森林砍伐威胁着热带地区的生物多样性。", "ex_en": "Protecting biodiversity is everyone's responsibility.", "ex_zh": "保护生物多样性是每个人的责任。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0820", "unit": "Unit 15"}, {"word": "climate change", "pron": "ˈklaɪmət tʃeɪndʒ", "part_of_speech": "n.", "pos": "n.", "def_en": "long-term changes in temperature and weather patterns", "def_zh": "气候变化", "quote_en": "Climate change is causing sea levels to rise.", "quote_zh": "气候变化正在导致海平面上升。", "ex_en": "Climate change worries many young people.", "ex_zh": "气候变化让许多年轻人感到担忧。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0821", "unit": "Unit 15"}, {"word": "contamination", "pron": "kənˌtæmɪˈneɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the process of making something dirty or poisonous", "def_zh": "污染；玷污", "quote_en": "Water contamination from factories is a serious health risk.", "quote_zh": "工厂造成的水污染是严重的健康风险。", "ex_en": "There was contamination in the river after the spill.", "ex_zh": "泄漏事故后，河水受到了污染。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0822", "unit": "Unit 15"}, {"word": "deforestation", "pron": "diːˌfɒrɪˈsteɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "the cutting down of large areas of forest", "def_zh": "森林砍伐", "quote_en": "Deforestation contributes to climate change and loss of habitat.", "quote_zh": "森林砍伐加剧了气候变化和栖息地的丧失。", "ex_en": "Deforestation in the Amazon is a global concern.", "ex_zh": "亚马孙地区的森林砍伐是全球关注的问题。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0823", "unit": "Unit 15"}, {"word": "disposal", "pron": "dɪˈspəʊzl", "part_of_speech": "n.", "pos": "n.", "def_en": "the act of getting rid of something", "def_zh": "处理；处置", "quote_en": "The safe disposal of plastic waste is a major challenge.", "quote_zh": "安全处理塑料垃圾是一项重大挑战。", "ex_en": "The disposal of old batteries must be done carefully.", "ex_zh": "旧电池必须谨慎处理。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0824", "unit": "Unit 15"}, {"word": "drought", "pron": "draʊt", "part_of_speech": "n.", "pos": "n.", "def_en": "a long period with very little rain", "def_zh": "干旱", "quote_en": "A severe drought has destroyed crops across the region.", "quote_zh": "严重的干旱毁掉了整个地区的农作物。", "ex_en": "The farmers suffered during the drought.", "ex_zh": "农民们在干旱期间受了苦。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0825", "unit": "Unit 15"}, {"word": "ecosystem", "pron": "ˈiːkəʊsɪstəm", "part_of_speech": "n.", "pos": "n.", "def_en": "a community of living things and their environment", "def_zh": "生态系统", "quote_en": "Pollution can destroy an entire ecosystem.", "quote_zh": "污染可以毁掉整个生态系统。", "ex_en": "Coral reefs are a fragile ecosystem.", "ex_zh": "珊瑚礁是一个脆弱的生态系统。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0826", "unit": "Unit 15"}, {"word": "emission", "pron": "ɪˈmɪʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "a gas or substance sent out into the air", "def_zh": "排放物；排放", "quote_en": "Each emission from a car adds to air pollution.", "quote_zh": "汽车的每一次排放都会加重空气污染。", "ex_en": "This factory has reduced its emission of smoke.", "ex_zh": "这家工厂减少了烟尘排放。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0827", "unit": "Unit 15"}, {"word": "the environment", "pron": "ði ɪnˈvaɪrənmənt", "part_of_speech": "n.", "pos": "n.", "def_en": "the natural world", "def_zh": "环境", "quote_en": "Plastic bags cause great harm to the environment.", "quote_zh": "塑料袋对环境造成极大危害。", "ex_en": "I try to do small things to protect the environment.", "ex_zh": "我努力做些小事来保护环境。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0828", "unit": "Unit 15"}, {"word": "erosion", "pron": "ɪˈrəʊʒn", "part_of_speech": "n.", "pos": "n.", "def_en": "the gradual wearing away of land by water or wind", "def_zh": "侵蚀；水土流失", "quote_en": "Soil erosion makes farmland less productive.", "quote_zh": "水土流失使农田的产量降低。", "ex_en": "Coastal erosion is a problem for seaside towns.", "ex_zh": "海岸侵蚀对海滨小镇是个问题。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0829", "unit": "Unit 15"}, {"word": "exhaust", "pron": "ɪɡˈzɔːst", "part_of_speech": "n.", "pos": "n.", "def_en": "gas that comes out of a vehicle", "def_zh": "废气；排气", "quote_en": "Exhaust from cars is a major source of air pollution.", "quote_zh": "汽车废气是空气污染的主要来源。", "ex_en": "I could smell exhaust fumes on the busy road.", "ex_zh": "在繁忙的路上，我闻到了汽车废气。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0830", "unit": "Unit 15"}, {"word": "fertiliser", "pron": "ˈfɜːtɪlaɪzə", "part_of_speech": "n.", "pos": "n.", "def_en": "a substance added to soil to help plants grow", "def_zh": "化肥；肥料", "quote_en": "Too much fertiliser can pollute rivers and lakes.", "quote_zh": "过量使用化肥会污染河流和湖泊。", "ex_en": "My dad puts fertiliser on the vegetable garden.", "ex_zh": "我爸爸给菜园施肥。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0831", "unit": "Unit 15"}, {"word": "flood", "pron": "flʌd", "part_of_speech": "n.", "pos": "n.", "def_en": "a large amount of water covering dry land", "def_zh": "洪水", "quote_en": "A flood destroyed homes and farmland along the river.", "quote_zh": "一场洪水毁坏了河沿岸的房屋和农田。", "ex_en": "The flood caused chaos in our town.", "ex_zh": "这场洪水给我们镇上造成了混乱。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0832", "unit": "Unit 15"}, {"word": "food chain", "pron": "fuːd tʃeɪn", "part_of_speech": "n.", "pos": "n.", "def_en": "a series of living things in which each eats the one below it", "def_zh": "食物链", "quote_en": "Pollution can damage the whole food chain.", "quote_zh": "污染可以破坏整个食物链。", "ex_en": "The shark is at the top of the ocean food chain.", "ex_zh": "鲨鱼处于海洋食物链的顶端。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0833", "unit": "Unit 15"}, {"word": "fumes", "pron": "fjuːmz", "part_of_speech": "n.", "pos": "n.", "def_en": "strong-smelling smoke or gas", "def_zh": "烟雾；废气", "quote_en": "Fumes from factories can harm people's lungs.", "quote_zh": "工厂排出的烟雾会伤害人们的肺部。", "ex_en": "The paint fumes gave me a headache.", "ex_zh": "油漆的气味让我头疼。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0834", "unit": "Unit 15"}, {"word": "greenhouse gases", "pron": "ˈɡriːnhaʊs ˈɡæsɪz", "part_of_speech": "n.", "pos": "n.", "def_en": "gases that trap heat in the atmosphere", "def_zh": "温室气体", "quote_en": "Burning fossil fuels releases greenhouse gases.", "quote_zh": "燃烧化石燃料会释放温室气体。", "ex_en": "Cutting greenhouse gases is a global goal.", "ex_zh": "减少温室气体是一个全球目标。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0835", "unit": "Unit 15"}, {"word": "pollutant", "pron": "pəˈluːtənt", "part_of_speech": "n.", "pos": "n.", "def_en": "a substance that makes air, water or soil dirty", "def_zh": "污染物", "quote_en": "Factories release pollutants into the rivers.", "quote_zh": "工厂向河流排放污染物。", "ex_en": "Car exhaust is a common pollutant.", "ex_zh": "汽车尾气是一种常见的污染物。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0836", "unit": "Unit 15"}, {"word": "pollution", "pron": "pəˈluːʃn", "part_of_speech": "n.", "pos": "n.", "def_en": "harmful substances in the air, water or soil", "def_zh": "污染", "quote_en": "Air pollution is a serious problem in many large cities.", "quote_zh": "空气污染是许多大城市的严重问题。", "ex_en": "I'm worried about the pollution in the river.", "ex_zh": "我担心这条河里的污染。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0837", "unit": "Unit 15"}, {"word": "process", "pron": "ˈprəʊses", "part_of_speech": "n.", "pos": "n.", "def_en": "a series of actions to achieve a result", "def_zh": "过程；工序", "quote_en": "Recycling is a long process involving many stages.", "quote_zh": "回收利用是一个涉及许多阶段的漫长过程。", "ex_en": "The process of making paper uses a lot of water.", "ex_zh": "造纸的过程需要用大量的水。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0838", "unit": "Unit 15"}, {"word": "refuse", "pron": "ˈrefjuːs", "part_of_speech": "n.", "pos": "n.", "def_en": "rubbish that people throw away", "def_zh": "垃圾；废物", "quote_en": "Refuse collection happens twice a week in our area.", "quote_zh": "我们地区每周收两次垃圾。", "ex_en": "The refuse is collected every Tuesday morning.", "ex_zh": "垃圾每周二早上收集。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0839", "unit": "Unit 15"}, {"word": "strain", "pron": "streɪn", "part_of_speech": "n.", "pos": "n.", "def_en": "pressure that makes something difficult to deal with", "def_zh": "压力；负担", "quote_en": "More tourists put a strain on local water supplies.", "quote_zh": "更多的游客给当地供水带来压力。", "ex_en": "The strain of studying made her ill.", "ex_zh": "学习的压力使她生病了。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0840", "unit": "Unit 15"}, {"word": "threat", "pron": "θret", "part_of_speech": "n.", "pos": "n.", "def_en": "something that may cause harm", "def_zh": "威胁", "quote_en": "Rising sea levels are a threat to coastal cities.", "quote_zh": "海平面上升对沿海城市构成威胁。", "ex_en": "Pollution is a threat to wildlife.", "ex_zh": "污染对野生动物是一种威胁。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0841", "unit": "Unit 15"}, {"word": "waste", "pron": "weɪst", "part_of_speech": "n.", "pos": "n.", "def_en": "things that are no longer needed and are thrown away", "def_zh": "废物；浪费", "quote_en": "Plastic waste is polluting our oceans.", "quote_zh": "塑料垃圾正在污染我们的海洋。", "ex_en": "It's a waste of time to argue about this.", "ex_zh": "为这件事争论是浪费时间。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0842", "unit": "Unit 15"}, {"word": "achievable", "pron": "əˈtʃiːvəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to be reached or done", "def_zh": "可实现的", "quote_en": "The target of reducing emissions by ten per cent is achievable.", "quote_zh": "把排放量减少百分之十的目标是可以实现的。", "ex_en": "Set goals that are realistic and achievable.", "ex_zh": "设定现实且可实现的目标。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0843", "unit": "Unit 15"}, {"word": "advantageous", "pron": "ˌædvənˈteɪdʒəs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "giving a better position or result", "def_zh": "有利的", "quote_en": "Using renewable energy is advantageous for the environment.", "quote_zh": "使用可再生能源对环境有利。", "ex_en": "Learning English is advantageous for your career.", "ex_zh": "学习英语对你的职业发展有利。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0844", "unit": "Unit 15"}, {"word": "at risk", "pron": "æt rɪsk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "in danger of harm or loss", "def_zh": "处于危险中", "quote_en": "Many species are at risk because of habitat loss.", "quote_zh": "许多物种因栖息地丧失而面临危险。", "ex_en": "Children are at risk from air pollution.", "ex_zh": "儿童面临空气污染的危害。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0845", "unit": "Unit 15"}, {"word": "beneficial", "pron": "ˌbenɪˈfɪʃl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having a good effect", "def_zh": "有益的", "quote_en": "Planting trees is beneficial for both people and wildlife.", "quote_zh": "植树对人类和野生动物都有益。", "ex_en": "Exercise is beneficial to your health.", "ex_zh": "锻炼对你的健康有益。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0846", "unit": "Unit 15"}, {"word": "conceivable", "pron": "kənˈsiːvəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to be imagined or believed", "def_zh": "可想象的；可能的", "quote_en": "It is conceivable that sea levels could rise by a metre.", "quote_zh": "海平面有可能上升一米。", "ex_en": "It's conceivable that I'll move abroad.", "ex_zh": "我有可能会搬到国外。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0847", "unit": "Unit 15"}, {"word": "contaminated", "pron": "kənˈtæmɪneɪtɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "made dirty or poisonous by a harmful substance", "def_zh": "被污染的", "quote_en": "Contaminated water causes illness in many developing countries.", "quote_zh": "受污染的水在许多发展中国家引起疾病。", "ex_en": "The river was contaminated with chemicals.", "ex_zh": "这条河被化学品污染了。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0848", "unit": "Unit 15"}, {"word": "devastating", "pron": "ˈdevəsteɪtɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "causing great damage or shock", "def_zh": "毁灭性的", "quote_en": "The oil spill had a devastating effect on the coast.", "quote_zh": "石油泄漏对海岸造成了毁灭性的影响。", "ex_en": "The news was devastating for the family.", "ex_zh": "这个消息对这家人来说是毁灭性的打击。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0849", "unit": "Unit 15"}, {"word": "doubtful", "pron": "ˈdaʊtfl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "unlikely or uncertain", "def_zh": "可疑的；不确定的", "quote_en": "It is doubtful that the target will be met on time.", "quote_zh": "这个目标能否按时实现还不确定。", "ex_en": "I'm doubtful about the plan.", "ex_zh": "我对这个计划有疑虑。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0850", "unit": "Unit 15"}, {"word": "environmental", "pron": "ɪnˌvaɪrənˈmentl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the natural world", "def_zh": "环境的", "quote_en": "Environmental education should start in primary school.", "quote_zh": "环境教育应该从小学开始。", "ex_en": "I'm studying environmental science at university.", "ex_zh": "我在大学学环境科学。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0851", "unit": "Unit 15"}, {"word": "environmentally friendly", "pron": "ɪnˌvaɪrənˈmentəli ˈfrendli", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not harmful to the environment", "def_zh": "环保的；对环境友好的", "quote_en": "Cycling is an environmentally friendly way to travel.", "quote_zh": "骑自行车是一种环保的出行方式。", "ex_en": "I try to buy environmentally friendly products.", "ex_zh": "我尽量购买环保产品。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0852", "unit": "Unit 15"}, {"word": "fruitless", "pron": "ˈfruːtləs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not producing good results", "def_zh": "徒劳的；没有结果的", "quote_en": "Our efforts to clean the river were fruitless.", "quote_zh": "我们清理河流的努力是徒劳的。", "ex_en": "It was a fruitless search for my keys.", "ex_zh": "找钥匙的努力白费了。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0853", "unit": "Unit 15"}, {"word": "futile", "pron": "ˈfjuːtaɪl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having no chance of success", "def_zh": "无效的；徒劳的", "quote_en": "It is futile to ban plastic bags if nothing replaces them.", "quote_zh": "如果没有替代品，禁止塑料袋是徒劳的。", "ex_en": "Arguing with him is futile.", "ex_zh": "和他争论是徒劳的。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0854", "unit": "Unit 15"}, {"word": "immune", "pron": "ɪˈmjuːn", "part_of_speech": "adj.", "pos": "adj.", "def_en": "protected from a disease or effect", "def_zh": "免疫的；不受影响的", "quote_en": "Some bacteria are immune to many antibiotics.", "quote_zh": "一些细菌对许多抗生素具有免疫力。", "ex_en": "No one is immune to the effects of pollution.", "ex_zh": "没有人能免受污染的影响。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0855", "unit": "Unit 15"}, {"word": "impracticable", "pron": "ɪmˈpræktɪkəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not possible to do in practice", "def_zh": "行不通的", "quote_en": "Banning all cars from the city is impracticable.", "quote_zh": "禁止所有汽车进入城市是行不通的。", "ex_en": "The plan was impracticable because of the cost.", "ex_zh": "由于成本问题，这个计划行不通。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0856", "unit": "Unit 15"}, {"word": "improbable", "pron": "ɪmˈprɒbəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not likely to happen", "def_zh": "不太可能的", "quote_en": "It is improbable that all countries will agree to the treaty.", "quote_zh": "所有国家都同意这项条约是不太可能的。", "ex_en": "An early end to the project seems improbable.", "ex_zh": "项目提前结束似乎不太可能。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0857", "unit": "Unit 15"}, {"word": "in danger", "pron": "ɪn ˈdeɪndʒə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "likely to be harmed or destroyed", "def_zh": "处于危险中", "quote_en": "Polar bears are in danger as the ice melts.", "quote_zh": "随着冰层融化，北极熊处于危险之中。", "ex_en": "The rare bird is in danger of extinction.", "ex_zh": "这种珍稀鸟类面临灭绝的危险。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0858", "unit": "Unit 15"}, {"word": "insoluble", "pron": "ɪnˈsɒljəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "impossible to solve; not able to dissolve", "def_zh": "无法解决的；不溶的", "quote_en": "Plastic is insoluble in water.", "quote_zh": "塑料不溶于水。", "ex_en": "Some think the problem of waste is insoluble.", "ex_zh": "有人认为垃圾问题无法解决。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0859", "unit": "Unit 15"}, {"word": "irreparable", "pron": "ɪˈrepərəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "too badly damaged to be repaired", "def_zh": "不可修复的", "quote_en": "Oil spills can cause irreparable damage to marine life.", "quote_zh": "石油泄漏可能对海洋生物造成不可修复的损害。", "ex_en": "The fire caused irreparable harm to the building.", "ex_zh": "大火对这座建筑造成了不可修复的损坏。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0860", "unit": "Unit 15"}, {"word": "irreplaceable", "pron": "ˌɪrɪˈpleɪsəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "impossible to replace", "def_zh": "不可替代的", "quote_en": "Rainforests are irreplaceable sources of biodiversity.", "quote_zh": "雨林是不可替代的生物多样性来源。", "ex_en": "This old photo is irreplaceable to me.", "ex_zh": "这张老照片对我来说是不可替代的。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0861", "unit": "Unit 15"}, {"word": "irreversible", "pron": "ˌɪrɪˈvɜːsəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "impossible to change back", "def_zh": "不可逆转的", "quote_en": "Some damage to the climate may be irreversible.", "quote_zh": "气候受到的一些损害可能是不可逆转的。", "ex_en": "It was an irreversible decision.", "ex_zh": "这是一个不可逆转的决定。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0862", "unit": "Unit 15"}, {"word": "liable", "pron": "ˈlaɪəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "likely to do something; legally responsible", "def_zh": "易于…的；有责任的", "quote_en": "Coastal areas are liable to flooding in storms.", "quote_zh": "沿海地区在风暴中容易发生洪水。", "ex_en": "Companies are liable for the pollution they cause.", "ex_zh": "公司对其造成的污染负有责任。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0863", "unit": "Unit 15"}, {"word": "life-threatening", "pron": "ˈlaɪf ˌθretnɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "likely to cause death", "def_zh": "危及生命的", "quote_en": "Air pollution can cause life-threatening illnesses.", "quote_zh": "空气污染可能导致危及生命的疾病。", "ex_en": "He had a life-threatening allergic reaction.", "ex_zh": "他出现了危及生命的过敏反应。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0864", "unit": "Unit 15"}, {"word": "pervasive", "pron": "pəˈveɪsɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "spreading widely and found everywhere", "def_zh": "普遍的；无处不在的", "quote_en": "Plastic pollution is now pervasive in the oceans.", "quote_zh": "塑料污染现在在海洋中无处不在。", "ex_en": "A pervasive smell of smoke filled the room.", "ex_zh": "房间里弥漫着一股烟味。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0865", "unit": "Unit 15"}, {"word": "pointless", "pron": "ˈpɔɪntləs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having no purpose or meaning", "def_zh": "无意义的", "quote_en": "It is pointless to recycle if we keep producing more waste.", "quote_zh": "如果我们继续产生更多垃圾，回收就没有意义。", "ex_en": "It's pointless to complain about the weather.", "ex_zh": "抱怨天气是没有意义的。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0866", "unit": "Unit 15"}, {"word": "pristine", "pron": "ˈprɪstiːn", "part_of_speech": "adj.", "pos": "adj.", "def_en": "in perfect, original condition", "def_zh": "原始的；一尘不染的", "quote_en": "The island has pristine beaches and clear water.", "quote_zh": "这座岛有原始的海滩和清澈的海水。", "ex_en": "The lake is still in pristine condition.", "ex_zh": "这个湖依然保持着原始状态。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0867", "unit": "Unit 15"}, {"word": "questionable", "pron": "ˈkwestʃənəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "doubtful; not certain to be good or true", "def_zh": "有疑问的", "quote_en": "The value of the new law is questionable.", "quote_zh": "这项新法律的价值值得怀疑。", "ex_en": "His excuse was questionable.", "ex_zh": "他的借口令人怀疑。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0868", "unit": "Unit 15"}, {"word": "recyclable", "pron": "ˌriːˈsaɪkləbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to be treated and used again", "def_zh": "可回收的", "quote_en": "Most glass and paper is recyclable.", "quote_zh": "大多数玻璃和纸张是可回收的。", "ex_en": "Is this plastic bottle recyclable?", "ex_zh": "这个塑料瓶可以回收吗？", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0869", "unit": "Unit 15"}, {"word": "sustainable", "pron": "səˈsteɪnəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to continue without damaging the environment", "def_zh": "可持续的", "quote_en": "Sustainable farming protects the soil for future generations.", "quote_zh": "可持续农业为子孙后代保护土壤。", "ex_en": "I'm trying to live a more sustainable lifestyle.", "ex_zh": "我正努力过更可持续的生活方式。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0870", "unit": "Unit 15"}, {"word": "taxing", "pron": "ˈtæksɪŋ", "part_of_speech": "adj.", "pos": "adj.", "def_en": "difficult and tiring", "def_zh": "繁重的；费力的", "quote_en": "Clearing up the oil spill was a taxing job for volunteers.", "quote_zh": "清理石油泄漏对志愿者来说是一项繁重的工作。", "ex_en": "It was a mentally taxing day.", "ex_zh": "那是一天让人精神疲惫的日子。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0871", "unit": "Unit 15"}, {"word": "unattainable", "pron": "ˌʌnəˈteɪnəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "impossible to achieve", "def_zh": "无法达到的", "quote_en": "Zero pollution may be an unattainable goal.", "quote_zh": "零污染可能是一个无法达到的目标。", "ex_en": "Perfection is unattainable.", "ex_zh": "完美是无法达到的。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0872", "unit": "Unit 15"}, {"word": "unlikely", "pron": "ʌnˈlaɪkli", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not probably going to happen", "def_zh": "不太可能的", "quote_en": "It is unlikely that the glaciers will recover soon.", "quote_zh": "冰川不太可能很快恢复。", "ex_en": "It's unlikely that I'll go out tonight.", "ex_zh": "我今晚不太可能出门。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0873", "unit": "Unit 15"}, {"word": "unprecedented", "pron": "ʌnˈpresɪdentɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "never having happened before", "def_zh": "前所未有的", "quote_en": "The region has experienced unprecedented floods this year.", "quote_zh": "该地区今年经历了前所未有的洪水。", "ex_en": "The company achieved unprecedented success.", "ex_zh": "这家公司取得了前所未有的成功。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0874", "unit": "Unit 15"}, {"word": "useless", "pron": "ˈjuːsləs", "part_of_speech": "adj.", "pos": "adj.", "def_en": "having no practical value", "def_zh": "无用的", "quote_en": "Old phones become useless if they cannot be recycled.", "quote_zh": "旧手机如果无法回收就变得毫无用处。", "ex_en": "This broken umbrella is useless.", "ex_zh": "这把坏了的伞没用了。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0875", "unit": "Unit 15"}, {"word": "viable", "pron": "ˈvaɪəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to work or succeed", "def_zh": "可行的；能存活的", "quote_en": "Solar power is a viable alternative to coal.", "quote_zh": "太阳能是煤炭的可行替代品。", "ex_en": "Is it a viable business idea?", "ex_zh": "这是一个可行的商业点子吗？", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0876", "unit": "Unit 15"}, {"word": "worthwhile", "pron": "ˌwɜːθˈwaɪl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "worth the time, money or effort", "def_zh": "值得的", "quote_en": "Planting trees is a worthwhile activity for the whole community.", "quote_zh": "植树对整个社区来说是值得做的活动。", "ex_en": "It was a worthwhile trip.", "ex_zh": "这是一次值得的旅行。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0877", "unit": "Unit 15"}, {"word": "confront", "pron": "kənˈfrʌnt", "part_of_speech": "v.", "pos": "v.", "def_en": "to face and deal with a problem", "def_zh": "面对；对抗", "quote_en": "World leaders must confront the problem of climate change.", "quote_zh": "世界各国领导人必须直面气候变化问题。", "ex_en": "I decided to confront my fear of flying.", "ex_zh": "我决定直面自己对飞行的恐惧。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0878", "unit": "Unit 15"}, {"word": "contaminate", "pron": "kənˈtæmɪneɪt", "part_of_speech": "v.", "pos": "v.", "def_en": "to make something dirty or poisonous", "def_zh": "污染；弄脏", "quote_en": "Chemicals from factories can contaminate drinking water.", "quote_zh": "工厂排出的化学品可能污染饮用水。", "ex_en": "Don't contaminate the food with dirty hands.", "ex_zh": "别用脏手弄脏食物。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0879", "unit": "Unit 15"}, {"word": "dispose of", "pron": "dɪˈspəʊz əv", "part_of_speech": "v.", "pos": "v.", "def_en": "to get rid of something", "def_zh": "处理；丢弃", "quote_en": "Factories must dispose of toxic waste safely.", "quote_zh": "工厂必须安全处理有毒废物。", "ex_en": "How do you dispose of old batteries?", "ex_zh": "你怎样处理旧电池？", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0880", "unit": "Unit 15"}, {"word": "dump", "pron": "dʌmp", "part_of_speech": "v.", "pos": "v.", "def_en": "to get rid of something carelessly or illegally", "def_zh": "倾倒；丢弃", "quote_en": "Some companies illegally dump chemicals into rivers.", "quote_zh": "一些公司非法向河流倾倒化学品。", "ex_en": "People shouldn't dump rubbish on the beach.", "ex_zh": "人们不应该把垃圾倒在海滩上。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0881", "unit": "Unit 15"}, {"word": "threaten", "pron": "ˈθretn", "part_of_speech": "v.", "pos": "v.", "def_en": "to be likely to cause harm", "def_zh": "威胁；危及", "quote_en": "Rising seas threaten many island nations.", "quote_zh": "海平面上升威胁着许多岛国。", "ex_en": "The storm may threaten to flood our street.", "ex_zh": "这场风暴可能会淹没我们的街道。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0882", "unit": "Unit 15"}, {"word": "inexorably", "pron": "ɪnˈeksərəbli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "in a way that cannot be stopped", "def_zh": "不可阻挡地", "quote_en": "Sea levels are rising inexorably as the planet warms.", "quote_zh": "随着地球变暖，海平面在不可阻挡地上升。", "ex_en": "Time moves inexorably forward.", "ex_zh": "时间不可阻挡地向前推进。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0883", "unit": "Unit 15"}, {"word": "inevitably", "pron": "ɪnˈevɪtəbli", "part_of_speech": "adv.", "pos": "adv.", "def_en": "in a way that cannot be avoided", "def_zh": "不可避免地", "quote_en": "Inevitably, population growth puts pressure on resources.", "quote_zh": "人口增长不可避免地给资源带来压力。", "ex_en": "Inevitably, I was late for the meeting.", "ex_zh": "我不可避免地开会迟到了。", "chapter": "Unit 15 · The Green Revolution · 绿色革命", "id": "w0884", "unit": "Unit 15"}, {"word": "biofuel", "pron": "ˈbaɪəʊfjuːəl", "part_of_speech": "n.", "pos": "n.", "def_en": "fuel made from plants or animal waste", "def_zh": "生物燃料", "quote_en": "Biofuel can reduce a country's dependence on oil.", "quote_zh": "生物燃料可以减少一个国家对石油的依赖。", "ex_en": "Some buses now run on biofuel.", "ex_zh": "有些公交车现在使用生物燃料。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0885", "unit": "Unit 16"}, {"word": "carbon", "pron": "ˈkɑːbən", "part_of_speech": "n.", "pos": "n.", "def_en": "a chemical element found in all living things and in fossil fuels", "def_zh": "碳", "quote_en": "Trees absorb carbon from the air as they grow.", "quote_zh": "树木在生长过程中吸收空气中的碳。", "ex_en": "The company wants to cut its carbon output.", "ex_zh": "这家公司想减少碳排放。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0886", "unit": "Unit 16"}, {"word": "carbon dioxide", "pron": "ˌkɑːbən daɪˈɒksaɪd", "part_of_speech": "n.", "pos": "n.", "def_en": "a gas produced when fossil fuels are burned", "def_zh": "二氧化碳", "quote_en": "Carbon dioxide is the main cause of global warming.", "quote_zh": "二氧化碳是全球变暖的主要原因。", "ex_en": "Plants take in carbon dioxide and give out oxygen.", "ex_zh": "植物吸收二氧化碳，释放氧气。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0887", "unit": "Unit 16"}, {"word": "crisis", "pron": "ˈkraɪsɪs", "part_of_speech": "n.", "pos": "n.", "def_en": "a time of great danger or difficulty", "def_zh": "危机", "quote_en": "The world faces an energy crisis as oil supplies fall.", "quote_zh": "随着石油供应减少，世界面临能源危机。", "ex_en": "The country is in the middle of a financial crisis.", "ex_zh": "这个国家正处于金融危机之中。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0888", "unit": "Unit 16"}, {"word": "electricity", "pron": "ɪˌlekˈtrɪsəti", "part_of_speech": "n.", "pos": "n.", "def_en": "power used for light, heat and machines", "def_zh": "电；电力", "quote_en": "Many countries now produce electricity from wind and sun.", "quote_zh": "许多国家现在用风能和太阳能发电。", "ex_en": "The electricity went off during the storm.", "ex_zh": "暴风雨期间停电了。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0889", "unit": "Unit 16"}, {"word": "emissions", "pron": "ɪˈmɪʃnz", "part_of_speech": "n.", "pos": "n.", "def_en": "gases sent into the air", "def_zh": "排放量", "quote_en": "Strict laws aim to reduce emissions from cars.", "quote_zh": "严格的法律旨在减少汽车的排放。", "ex_en": "Emissions from planes are increasing every year.", "ex_zh": "飞机的排放量逐年增加。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0890", "unit": "Unit 16"}, {"word": "fossil fuel", "pron": "ˈfɒsl ˈfjuːəl", "part_of_speech": "n.", "pos": "n.", "def_en": "a fuel such as coal, oil or gas formed from ancient plants and animals", "def_zh": "化石燃料", "quote_en": "Burning fossil fuel releases harmful gases into the atmosphere.", "quote_zh": "燃烧化石燃料会向大气中释放有害气体。", "ex_en": "Cars that use fossil fuel contribute to air pollution.", "ex_zh": "使用化石燃料的汽车加剧了空气污染。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0891", "unit": "Unit 16"}, {"word": "fuel", "pron": "ˈfjuːəl", "part_of_speech": "n.", "pos": "n.", "def_en": "a substance burned to produce heat or power", "def_zh": "燃料", "quote_en": "Petrol is the most common fuel for cars.", "quote_zh": "汽油是汽车最常用的燃料。", "ex_en": "I need to buy some fuel before the trip.", "ex_zh": "我出发前需要买些燃料。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0892", "unit": "Unit 16"}, {"word": "greenhouse gas", "pron": "ˈɡriːnhaʊs ɡæs", "part_of_speech": "n.", "pos": "n.", "def_en": "a gas that traps heat in the Earth's atmosphere", "def_zh": "温室气体", "quote_en": "Methane is a powerful greenhouse gas produced by farm animals.", "quote_zh": "甲烷是由农场动物产生的强效温室气体。", "ex_en": "Carbon dioxide is the most common greenhouse gas.", "ex_zh": "二氧化碳是最常见的温室气体。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0893", "unit": "Unit 16"}, {"word": "hybrid", "pron": "ˈhaɪbrɪd", "part_of_speech": "n.", "pos": "n.", "def_en": "a vehicle that uses both petrol and electricity", "def_zh": "混合动力车；杂交种", "quote_en": "A hybrid uses less fuel than a normal car.", "quote_zh": "混合动力车比普通汽车耗油少。", "ex_en": "My neighbour just bought a hybrid.", "ex_zh": "我的邻居刚买了一辆混合动力车。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0894", "unit": "Unit 16"}, {"word": "hydrogen", "pron": "ˈhaɪdrədʒən", "part_of_speech": "n.", "pos": "n.", "def_en": "a light gas that can be used as a clean fuel", "def_zh": "氢；氢气", "quote_en": "Hydrogen is considered a clean alternative to petrol.", "quote_zh": "氢被认为是汽油的清洁替代品。", "ex_en": "Hydrogen is the lightest element.", "ex_zh": "氢是最轻的元素。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0895", "unit": "Unit 16"}, {"word": "petrol", "pron": "ˈpetrəl", "part_of_speech": "n.", "pos": "n.", "def_en": "liquid fuel used in cars", "def_zh": "汽油", "quote_en": "The price of petrol has risen sharply this year.", "quote_zh": "今年汽油价格急剧上涨。", "ex_en": "I need to fill the car with petrol.", "ex_zh": "我需要给车加汽油。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0896", "unit": "Unit 16"}, {"word": "turbine", "pron": "ˈtɜːbaɪn", "part_of_speech": "n.", "pos": "n.", "def_en": "a machine that produces power from moving air, water or steam", "def_zh": "涡轮机", "quote_en": "A wind turbine can supply electricity to hundreds of homes.", "quote_zh": "一台风力涡轮机可以为数百户家庭供电。", "ex_en": "There is a wind turbine on the hill near the coast.", "ex_zh": "海岸附近的山上有一台风力涡轮机。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0897", "unit": "Unit 16"}, {"word": "vehicle", "pron": "ˈvɪəkl", "part_of_speech": "n.", "pos": "n.", "def_en": "a machine such as a car or bus used for transport", "def_zh": "车辆", "quote_en": "Every vehicle on the road adds to air pollution.", "quote_zh": "路上的每一辆车都会加重空气污染。", "ex_en": "The vehicle broke down on the motorway.", "ex_zh": "这辆车在高速公路上抛锚了。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0898", "unit": "Unit 16"}, {"word": "alternative", "pron": "ɔːlˈtɜːnətɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "different from the usual or traditional", "def_zh": "替代的；另类的", "quote_en": "Alternative energy sources include wind and solar power.", "quote_zh": "替代能源包括风能和太阳能。", "ex_en": "We need an alternative plan in case it rains.", "ex_zh": "我们需要一个以防下雨的备用计划。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0899", "unit": "Unit 16"}, {"word": "critical", "pron": "ˈkrɪtɪkl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "extremely important or serious", "def_zh": "至关重要的；危急的", "quote_en": "It is critical that we reduce energy use soon.", "quote_zh": "尽快减少能源使用至关重要。", "ex_en": "The patient is in critical condition.", "ex_zh": "病人情况危急。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0900", "unit": "Unit 16"}, {"word": "drastic", "pron": "ˈdræstɪk", "part_of_speech": "adj.", "pos": "adj.", "def_en": "very strong and extreme", "def_zh": "激烈的；极端的", "quote_en": "Drastic action is needed to reduce carbon emissions.", "quote_zh": "需要采取激烈的行动来减少碳排放。", "ex_en": "I had to make a drastic change to my diet.", "ex_zh": "我必须对饮食做出剧烈的改变。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0901", "unit": "Unit 16"}, {"word": "eco-friendly", "pron": "ˈiːkəʊ ˈfrendli", "part_of_speech": "adj.", "pos": "adj.", "def_en": "not harmful to the environment", "def_zh": "环保的", "quote_en": "Eco-friendly products are becoming more popular.", "quote_zh": "环保产品越来越受欢迎。", "ex_en": "I bought an eco-friendly bag made from cotton.", "ex_zh": "我买了一个用棉布做的环保袋。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0902", "unit": "Unit 16"}, {"word": "effective", "pron": "ɪˈfektɪv", "part_of_speech": "adj.", "pos": "adj.", "def_en": "working well and producing the result you want", "def_zh": "有效的", "quote_en": "Insulating your home is an effective way to save energy.", "quote_zh": "给房子保温是节约能源的有效方法。", "ex_en": "This medicine is very effective.", "ex_zh": "这种药很有效。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0903", "unit": "Unit 16"}, {"word": "nuclear", "pron": "ˈnjuːkliə", "part_of_speech": "adj.", "pos": "adj.", "def_en": "relating to the energy produced by splitting atoms", "def_zh": "核能的；核的", "quote_en": "Nuclear power produces electricity without carbon emissions.", "quote_zh": "核能发电不产生碳排放。", "ex_en": "Some countries have closed their nuclear power stations.", "ex_zh": "一些国家关闭了它们的核电站。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0904", "unit": "Unit 16"}, {"word": "rechargeable", "pron": "ˌriːˈtʃɑːdʒəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to be filled with electricity again", "def_zh": "可充电的", "quote_en": "Rechargeable batteries are better for the environment.", "quote_zh": "可充电电池对环境更好。", "ex_en": "My torch uses rechargeable batteries.", "ex_zh": "我的手电筒使用可充电电池。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0905", "unit": "Unit 16"}, {"word": "renewable", "pron": "rɪˈnjuːəbl", "part_of_speech": "adj.", "pos": "adj.", "def_en": "able to be replaced naturally and not used up", "def_zh": "可再生的", "quote_en": "Renewable energy such as wind and solar is becoming cheaper.", "quote_zh": "风能、太阳能等可再生能源正变得越来越便宜。", "ex_en": "Our house runs on renewable electricity.", "ex_zh": "我们家使用的是可再生电力。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0906", "unit": "Unit 16"}, {"word": "unleaded", "pron": "ʌnˈledɪd", "part_of_speech": "adj.", "pos": "adj.", "def_en": "(of petrol) without lead", "def_zh": "无铅的", "quote_en": "Most modern cars run on unleaded petrol.", "quote_zh": "大多数现代汽车使用无铅汽油。", "ex_en": "Please fill the tank with unleaded.", "ex_zh": "请给油箱加满无铅汽油。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0907", "unit": "Unit 16"}, {"word": "absorb", "pron": "əbˈzɔːb", "part_of_speech": "v.", "pos": "v.", "def_en": "to take in a liquid, gas or energy", "def_zh": "吸收", "quote_en": "Forests absorb large amounts of carbon dioxide.", "quote_zh": "森林吸收大量二氧化碳。", "ex_en": "Dark clothes absorb more heat from the sun.", "ex_zh": "深色衣服吸收更多太阳的热量。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0908", "unit": "Unit 16"}, {"word": "conserve", "pron": "kənˈsɜːv", "part_of_speech": "v.", "pos": "v.", "def_en": "to use something carefully to avoid wasting it", "def_zh": "节约；保护", "quote_en": "We must conserve water during the dry summer.", "quote_zh": "我们必须在干燥的夏季节约用水。", "ex_en": "I try to conserve energy at home.", "ex_zh": "我在家尽量节约能源。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0909", "unit": "Unit 16"}, {"word": "consume", "pron": "kənˈsjuːm", "part_of_speech": "v.", "pos": "v.", "def_en": "to use food, energy or resources", "def_zh": "消耗；消费", "quote_en": "Large cities consume huge amounts of electricity.", "quote_zh": "大城市消耗大量电力。", "ex_en": "My car can consume a lot of petrol.", "ex_zh": "我的车可能很耗油。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0910", "unit": "Unit 16"}, {"word": "convert", "pron": "kənˈvɜːt", "part_of_speech": "v.", "pos": "v.", "def_en": "to change something into a different form", "def_zh": "转换；转变", "quote_en": "Solar panels convert sunlight into electricity.", "quote_zh": "太阳能电池板把阳光转换成电能。", "ex_en": "We want to convert the old barn into a house.", "ex_zh": "我们想把旧谷仓改造成住宅。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0911", "unit": "Unit 16"}, {"word": "counter", "pron": "ˈkaʊntə", "part_of_speech": "v.", "pos": "v.", "def_en": "to reduce the effect of something", "def_zh": "抵消；反击", "quote_en": "Planting trees can counter the effects of pollution.", "quote_zh": "植树可以抵消污染的影响。", "ex_en": "The government acted to counter rising prices.", "ex_zh": "政府采取行动抑制物价上涨。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0912", "unit": "Unit 16"}, {"word": "deplete", "pron": "dɪˈpliːt", "part_of_speech": "v.", "pos": "v.", "def_en": "to greatly reduce the amount of something", "def_zh": "耗尽；大量消耗", "quote_en": "Burning fossil fuels will deplete the world's oil reserves.", "quote_zh": "燃烧化石燃料会耗尽世界石油储备。", "ex_en": "Too much fishing can deplete the fish stocks.", "ex_zh": "过度捕捞会耗尽鱼类资源。", "chapter": "Unit 16 · The Energy Crisis · 能源危机", "id": "w0913", "unit": "Unit 16"}, {"word": "discharge", "pron": "dɪsˈtʃɑːdʒ", "part_of_speech": "v.", "pos": "v.", "def_en": "to release a liquid or gas"
